{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\":{\"text\":\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\n\\n[ℹ️[Hide deprecated plugins]]\\n-[stability[STABILITY_0_DEPRECATED]]\",\"tags\":\"\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq\":{\"text\":\"\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\",\"list\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq/installing $:/plugins/theophile.dev/githubpluginlibrary/faq/library $:/plugins/theophile.dev/githubpluginlibrary/faq/plugin $:/plugins/theophile.dev/githubpluginlibrary/faq/pack $:/plugins/theophile.dev/githubpluginlibrary/faq/how\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/how\":{\"text\":\"# ''Injection'': A [[special tag|https://tiddlywiki.com/#SystemTag%3A%20%24%3A%2Ftags%2FRawMarkupWikified%2FTopHead]] is used to insert the necessary [[JavaScript|$:/plugins/theophile.dev/githubpluginlibrary/script]] into the `\u003Chead>` section of the TiddlyWiki file. You can view the source code at: `view-source:https://plugin-library.tiddlyhost.com` (\u003Ckbd>Ctrl + U\u003C/kbd>).\\n#  ''Request'': When you click “Open plugin library,” TiddlyWiki sends a `GET` request to the library’s URL (similar to how the official library works).\\n# ''Listing'': The library responds with a list of available plugins (defined in the [[assetList|$:/plugins/theophile.dev/githubpluginlibrary/assetList]] tiddler)\\n# ''Installation'': When you select a plugin, TiddlyWiki requests that specific plugin.\\n# ''Redirection'': Instead of fetching the file from a directory, TPL redirects the request to the [[JSON endpoint|https://github.com/tiddlyhost/tiddlyhost-com/wiki/Accessing-Tiddlyhost-data-as-JSON]] provided by Tiddlyhost.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How does TPL work under the hood?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/installing\":{\"text\":\"\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\">\\nSimply drag and drop \u003C$link>this link\u003C/$link> into your TiddlyWiki.\\n\u003C/$tiddler>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How do I install the TPL library in my wiki?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/library\":{\"text\":\"You have two options to set up your own library:\\n\\n# ''\u003Ca href=`https://tiddlyhost.com/sites/new?clone=plugin-library`>Clone this wiki\u003C/a>'' directly to create your own instance.\\n# ''Install the Plugin'': Drag and drop [[the TPL plugin|$:/plugins/theophile.dev/githubpluginlibrary]] into your existing wiki hosted on tiddlyhost. \\n\\n> ''Important'': You must allow the wiki to be loaded inside an `iframe` in your Tiddlyhost settings; otherwise, the library will not be able to communicate with other wikis.\\n> \\n> [img[allow-iframe.png]]\\n\\n\\n* ''Resetting'': If you cloned the TPL wiki, you can reset the library to remove existing plugins and start fresh: {{$:/plugins/theophile.dev/githubpluginlibrary/reset}}.\\n* ''Support'': For feedback or assistance, please visit the thread on [[Talk TiddlyWiki|https://talk.tiddlywiki.org/t/how-to-create-a-plugin-library-with-one-click/11245]].\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How can I create my own Tiddlyhost plugin library ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/pack\":{\"text\":\"If you frequently install the same set of plugins, you can bundle them. There are two approaches:\\n\\n# ''Dependency Method (Recommended)'': Create a plugin that will list other plugins as dependencies. This keeps your library lightweight. \u003Cem>Note: The dependent plugins must be installed in the same plugin library.\u003C/em>\\n# ''Monolith Method'': Create a single plugin containing the code of all other plugins. \u003Cem>This is not recommended as it duplicates code and increases file size.\u003C/em>\\n\\n\\n> See $:/plugins/theophile.dev/starterpack for a reference implementation of the //Dependency Method//.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary $:/plugins/theophile.dev/githubpluginlibrary/faq\",\"caption\":\"How to create a pack of plugins ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/plugin\":{\"text\":\"!! Method 1: Using the [ext[plugin-maker|https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker]] (Recommended)\\n\\n# Open the ''[[plugin-maker|$:/plugins/theophile.dev/plugin-maker]]''.\\n# Fill in the required form fields.\\n# Click on the button to ''package'' or ''update'' the plugin\\n\\n//Note: If you require more advanced features, consider using [ext[Gatha|https://kookma.github.io/TW-Gatha]].//\\n\\n!! Method 2: Creating a Plugin Manually\\n\\n\u003Col>\\n\u003Cli>\\n\\nCreate the tiddlers to be added to your plugin. A good practice is to use the same prefix (or namespace) for each tiddlers if possible, to avoid accidentally overriding another tiddler. For example: $:/plugins/theophile.dev/githubpluginlibrary\\n\\n\u003C/li>\\n\u003Cli>\\n\\nDrag and drop these tiddlers in a wiki open in a another tab (e.g., [ext[https://tiddlywiki.com/empty|https://tiddlywiki.com/empty]]).\\n\\n\u003C/li>\\n\u003Cli>This will open the `$:/Import` tiddler. \u003Cem>Do not click \u003Ckbd>Import\u003C/kbd>\u003C/em>. Instead, edit the tiddler:\\n\u003Cul>\\n\u003Cli>\\nChange the title to your chosen plugin prefix.\\n\u003C/li>\\n\u003Cli>\\nSet the `plugin-type` field to `plugin`\\n\u003C/li>\\n\u003Cli>\\nRemove the field `status`\\n\u003C/li>\\n\u003Cli>\\nAdd a `list` field containing the names of the tiddlers to be listed in the tabbed view for the plugin (e.g., listing `$:/plugins/theophile.dev/githubpluginlibrary/readme` will add a \\\"readme\\\" tab in the plugin view).\\n\u003C/li>\\n\u003Cli>\\nAdd a `version` field. You can follow the rules defined at https://semver.org\\n\u003C/li>\\n\u003C/ul>\\n\u003C/li>\\n\u003Cli>\\nSave your changes, then drag and drop the resulting plugin back into your plugin library wiki.\\n\u003C/li>\\n\u003C/ol>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How to create a plugin ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/why\":{\"text\":\"Creating a TiddlyHost plugin library centralizes your tools and content. You can:\\n\\n* Apply and automatically update custom tweaks across multiple wikis.\\n* Distribute your original plugins, books, blogs .. from a single source.\\n* Host an easily accessible collection of your favorite plugins.\\n* Collaborate with other people to push content to a single wiki.\\n* If you are a teacher, deliver lessons and assignments as plugins so students can safely update their materials without overwriting personal notes.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"Why would I need my own plugin library?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/icon\":{\"text\":\"{{$:/core/images/plugin-generic-theme}}\"},\"$:/plugins/theophile.dev/githubpluginlibrary/libraryserver.js\":{\"text\":\"/*\\\\ \\ntitle: $:/plugins/theophile.dev/githubpluginlibrary/libraryserver.js \\ntype: application/javascript \\nmodule-type: startup\\n\\nA lightning-fast HTTP-over-window.postMessage implementation. \\nFully optimized using native TiddlyWiki core utility methods.\\n\\\\*/\\n(function () {\\n  \\\"use strict\\\";\\n\\n  exports.name = \\\"plugin-library-server\\\";\\n  exports.platforms = [\\\"browser\\\"];\\n  exports.after = [\\\"startup\\\"];\\n  exports.synchronous = true;\\n\\n  exports.startup = function() {\\n    \\n    window.addEventListener(\\\"message\\\", function listener(event) {\\n      if (!event.data || typeof event.data !== \\\"object\\\" || event.data.verb !== \\\"GET\\\") {\\n        return; \\n      }\\n      handleGetRequest(event);\\n    }, false);\\n\\n    function sendResponse(event, status, type, body) {\\n      if (!event.source) return;\\n\\n      event.source.postMessage({\\n        verb: \\\"GET-RESPONSE\\\",\\n        status: status.toString(),\\n        cookies: event.data.cookies,\\n        url: event.data.url,\\n        type: type,\\n        body: body\\n      }, \\\"*\\\");\\n    }\\n\\n    function handleGetRequest(event) {\\n      var url = event.data.url || \\\"\\\";\\n\\n      // --- Route A: Main Asset List ---\\n      if (url === \\\"recipes/library/tiddlers.json\\\") {\\n        try {\\n          var filterTiddler = $tw.wiki.getTiddler(\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\");\\n          var filter = filterTiddler && filterTiddler.fields.text ? filterTiddler.fields.text : \\\"[plugin-type[plugin]]\\\";\\n\\n          var pluginTitles = $tw.wiki.filterTiddlers(filter);\\n          var assetList = [];\\n\\n          $tw.utils.each(pluginTitles, function(title) {\\n            var tiddler = $tw.wiki.getTiddler(title);\\n            if (tiddler) {\\n              \\n              var asset = tiddler.getFieldStrings();\\n              delete asset.text; \\n\\n              var readmeText = $tw.wiki.getTiddlerText(title + \\\"/readme\\\");\\n              if (readmeText) asset.readme = readmeText;\\n\\n              var iconTiddler = $tw.wiki.getTiddler(title + \\\"/icon\\\");\\n              // Using $tw.utils.hop for safe property lookup\\n              if (iconTiddler && $tw.utils.hop(iconTiddler.fields, \\\"text\\\")) {\\n                var iconType = iconTiddler.fields.type || \\\"text/vnd.tiddlywiki\\\";\\n                \\n                if (iconTiddler.fields._canonical_uri) {\\n                  asset.icon = iconTiddler.fields._canonical_uri;\\n                } else if (iconType === \\\"image/svg+xml\\\" || iconType === \\\"text/vnd.tiddlywiki\\\" || !iconTiddler.fields.type) {\\n                  \\n                  var renderedIcon = $tw.wiki.renderText(\\\"text/html\\\", \\\"text/vnd.tiddlywiki\\\", iconTiddler.fields.text, {\\n                    parseAsInline: true\\n                  }).trim();\\n                  \\n                  if (/\u003Csvg\\\\b/i.test(renderedIcon) && !/\\\\bxmlns\\\\s*=/i.test(renderedIcon)) {\\n                    renderedIcon = renderedIcon.replace(/\u003Csvg\\\\b/i, '\u003Csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" ');\\n                  }\\n\\n                  asset.icon = \\\"data:image/svg+xml;charset=utf-8,\\\" + encodeURIComponent(renderedIcon);\\n                } else {\\n                  asset.icon = \\\"data:\\\" + iconType + \\\";base64,\\\" + iconTiddler.fields.text;\\n                }\\n              }\\n\\n              assetList.push(asset);\\n            }\\n          });\\n\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(assetList, null, 4));\\n\\n        } catch (e) {\\n          console.error(\\\"Plugin Library: Failed to generate asset list\\\", e);\\n          sendResponse(event, 500, \\\"text/plain\\\", \\\"Internal Server Error\\\");\\n        }\\n      } \\n      // --- Route B: Specific Plugin Request ---\\n      else if ($tw.utils.startsWith(url, \\\"recipes/library/tiddlers/\\\")) {\\n        var pluginTitle = url.substring(\\\"recipes/library/tiddlers/\\\".length);\\n\\n        if (pluginTitle.endsWith(\\\".json\\\")) {\\n          pluginTitle = pluginTitle.slice(0, -5);\\n        }\\n        \\n        try {\\n          pluginTitle = decodeURIComponent(pluginTitle);\\n        } catch (e) {\\n          return sendResponse(event, 400, \\\"text/plain\\\", \\\"Bad Request: Malformed URI\\\");\\n        }\\n\\n        var tiddler = $tw.wiki.getTiddler(pluginTitle);\\n\\n        if (tiddler) {\\n          var formattedFields = tiddler.getFieldStrings();\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(formattedFields, null, 4));\\n        } else {\\n          sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n        }\\n      } \\n      // --- Route C: Unknown ---\\n      else {\\n        sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n      }\\n    }\\n  };\\n})();\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\",\"code-body\":\"yes\",\"type\":\"application/javascript\",\"module-type\":\"startup\"},\"$:/plugins/theophile.dev/githubpluginlibrary/packager\":{\"text\":\"{{$:/plugins/theophile.dev/plugin-maker/packager}}\"},\"$:/plugins/theophile.dev/githubpluginlibrary/PluginsIncluded\":{\"text\":\"\u003C$let qualified-state=\u003C\u003Cqualify \\\"$:/state/plugin-info\\\">> >\\n\u003C$list filter={{$:/plugins/theophile.dev/githubpluginlibrary/assetList}} emptyMessage=\u003C\u003Clingo \\\"Empty/Hint\\\">>  template=\\\"$:/core/ui/Components/plugin-info\\\"/>\\n\u003C/$let>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\"},\"$:/plugins/theophile.dev/githubpluginlibrary/readme\":{\"text\":\"{{$:/plugins/theophile.dev/githubpluginlibrary/faq/installing}}\\n\\n{{||$:/plugins/theophile.dev/Commons/templates/readme}}\",\"tags\":\"$:/tags/PluginLibrary $:/plugins/theophile.dev/githubpluginlibrary\",\"url\":\"https://plugins.theophile.dev/\",\"caption\":\"Github Plugin Library\",\"filter\":\"[plugin-type[plugin]] -$:/core\"},\"$:/plugins/theophile.dev/githubpluginlibrary/reset\":{\"text\":\"\\\\procedure action-reset-library()\\n\u003C$action-deletetiddler $filter=\\\"\\n[has[plugin-type]!author[JeremyRuston]]\\n-$:/plugins/theophile.dev/githubpluginlibrary\\n-$:/plugins/theophile.dev/plugin-maker\\n\\\"/>\\n\u003C$action-setfield $tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\" $field=\\\"filter\\\" $value=\\\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\\"/>\\n\\\\end\\n\\n\u003C$button actions=\u003C\u003Caction-reset-library>>>reset the library\u003C/$button>\",\"tags\":\"\"},\"$:/plugins/theophile.dev/githubpluginlibrary/settings\":{\"text\":\"Library name: \u003C$edit tag=\\\"input\\\" tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\" field=\\\"caption\\\"/>\\n\\n\\n[[Filter expression|https://tiddlywiki.com/static/Filters.html]] for listing the plugins to be included:\\n\u003C$edit tag=\\\"textarea\\\" tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\" class=\\\"tc-edit-texteditor tc-edit-texteditor-body\\\"/>\\n\\n{{$:/plugins/theophile.dev/githubpluginlibrary/PluginsIncluded}}\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\"},\"$:/plugins/theophile.dev/githubpluginlibrary/updatelibrary\":{\"text\":\"\u003C!--\\nThis tiddler update the url of the library tiddler to keep it in sync with the current url of the wiki.\\n-->\\n\u003C$action-setfield \\n$tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\" \\nurl={{$:/info/url/full}}\\n/>\",\"tags\":\"$:/tags/StartupAction $:/plugins/theophile.dev/githubpluginlibrary\",\"code-body\":\"yes\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme settings packager","version":"0.0.1","description":"Github Plugin Library","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","dependents":"$:/plugins/theophile.dev/plugin-maker","title":"$:/plugins/theophile.dev/githubpluginlibrary"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/plugin-maker/history\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/${[set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]]}$` >\\n\\n\u003Cp style=\\\"position:relative\\\">\u003C\u003CsetVersionFieldButtons>>\u003C/p>\\n\\n\u003C\u003CversionHistory>>\"},\"$:/plugins/theophile.dev/plugin-maker/license\":{\"text\":\"\u003Cp xmlns:cc=\\\"http://creativecommons.org/ns#\\\" xmlns:dct=\\\"http://purl.org/dc/terms/\\\">\u003Ca property=\\\"dct:title\\\" rel=\\\"cc:attributionURL\\\" href=\\\"https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker\\\">plugin-maker\u003C/a> by \u003Ca rel=\\\"cc:attributionURL dct:creator\\\" property=\\\"cc:attributionName\\\" href=\\\"https://theophile.dev\\\">Théophile Desmedt\u003C/a> is marked with \u003Ca href=\\\"https://creativecommons.org/publicdomain/zero/1.0/?ref=chooser-v1\\\" target=\\\"_blank\\\" rel=\\\"license noopener noreferrer\\\" style=\\\"display:inline-block;\\\">CC0 1.0\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/zero.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003C/a>\u003C/p>  \"},\"$:/plugins/theophile.dev/plugin-maker/macros\":{\"text\":\"\\\\procedure json-tiddler() \\\"{{!!title}}\\\":\u003C$jsontiddler tiddler={{!!title}} exclude=`created creator modified modifier title`/>\\n\\n\\\\procedure json-plugin() {\\\"tiddlers\\\":{\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>]\\\" join=\\\",\\\">\u003C\u003Cjson-tiddler>>\u003C/$list>}}\\n\\n\\\\procedure package-plugin-action()\\n\u003C$wikify name=\\\"json\\\" text=\u003C\u003Cjson-plugin>> >\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cplugin-title>>/>\\n\u003C$genesis \\n  $type=\\\"$action-createtiddler\\\"\\n  $names=\\\"\\n  =[[$overwrite]]\\n  =[[$timestamp]]\\n  =[[text]]\\n  =[[core-version]]\\n  =[[type]]\\n  =[\u003Cplugin-title>!is[blank]then[$basetitle]]\\n  =[\u003Cplugin-author>!is[blank]then[author]]\\n  =[\u003Cplugin-list>!is[blank]then[list]]\\n  =[\u003Cplugin-version>!is[blank]then[version]]\\n  =[\u003Cplugin-description>!is[blank]then[description]]\\n  =[\u003Cplugin-type>!is[blank]then[plugin-type]]\\n  =[\u003Cplugin-stability>!is[blank]then[stability]]\\n  =[\u003Cplugin-parent>!is[blank]then[parent-plugin]]\\n  =[\u003Cplugin-dependents>!is[blank]then[dependents]]\\n  \\\"\\n$values=\\\"\\n  =[[yes]]\\n  =[[no]]\\n  =[\u003Cjson>]\\n  =[\u003Cversion>]\\n  =[[application/json]]\\n  =[\u003Cplugin-title>!is[blank]]\\n  =[\u003Cplugin-author>!is[blank]]\\n  =[\u003Cplugin-list>!is[blank]]\\n  =[\u003Cplugin-version>!is[blank]]\\n  =[\u003Cplugin-description>!is[blank]]\\n  =[\u003Cplugin-type>!is[blank]]\\n  =[\u003Cplugin-stability>!is[blank]]\\n  =[\u003Cplugin-parent>!is[blank]]\\n  =[\u003Cplugin-dependents>!is[blank]]\\n\\\"/>\\n\u003C$action-deletetiddler $filter=\\\"[subfilter\u003Cplugin-filter>]\\\"/>\\n\u003C/$wikify>\\n\\\\end\\n\\n\\\\procedure export-plugin-action()\\n\u003C$let exporterTemplate=\\\"$:/core/templates/exporters/JsonFile\\\">\\n\u003C$tiddler tiddler=\u003C\u003CexporterTemplate>> >\\n\u003C$action-sendmessage $message=\\\"tm-download-file\\\" $param=\u003C\u003CexporterTemplate>> exportFilter=\u003C\u003Cplugin-title>> filename={{{\\n=[\u003Cplugin-title>]\\n=[\u003Cplugin-version>]\\n+[join[_]]\\n=[\u003CexporterTemplate>get[extension]]\\n+[join[]]\\n}}} type={{{ [\u003CexporterTemplate>get[file-type]] }}} />\\n\u003C/$tiddler>\\n\u003C/$let>\\n\\\\end\\n\\n\\\\procedure create-plugin-tiddler()\\n\u003C$action-createtiddler  $basetitle=`$(plugin-title)$/NewTiddler`>\\n\\t\u003C$action-navigate $to=\u003C\u003CcreateTiddler-title>>/>\\n\\t\u003C$action-sendmessage $message=\\\"tm-edit-tiddler\\\" $param=\u003C\u003CcreateTiddler-title>>/>\\n\u003C/$action-createtiddler>\\n\\\\end\\n\\n\\\\procedure edit-info(info,placeholder,options,default,tag:input,hint,hint-link)\\n\u003C$parameters tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003Clabel>\\n\u003Cspan>\\n\u003C$genesis $type={{{ [\u003Chint-link>!is[blank]then[a]else[i]]:filter[\u003Chint>!is[blank]] }}} href=\u003C\u003Chint-link>> title=\u003C\u003Chint>> class=\\\"hint\\\"/>\\n\u003C%if [\u003Cinfo>match[name]]:filter[all[tiddlers+shadows]has[plugin-type]] %>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\\n\u003C$select field=\\\"set-plugin-name\\\" default={{!!set-plugin-name}} >\\n\u003Coption disabled value={{!!set-plugin-name}} style=\\\"display:none\\\">Name\u003C/option>\\n\u003Coptgroup label='Plugins'>\\n\u003C$list filter=\\\"[has[plugin-type]author{$:/status/UserName}]:map[trim[$:/plugins/]trim[$:/themes/]trim[$:/languages/]split[/]last[]]\\\" variable=\\\"name\\\">\\n\u003C$genesis $type=\\\"option\\\" value={{{ [\u003Cname>match{!!set-plugin-name}then[]else\u003Cname>] }}} $names=\\\"[\u003Cname>match{!!set-plugin-name}then[disabled title]enlist-input[]]\\\" $values=\\\"=true =[[Plugin selected]]\\\">\\n\u003C\u003Cname>>\\n\u003C/$genesis>\\n\u003C/$list>\\n\u003C/optgroup>\\n\u003C/$select>\\n\u003C/$tiddler>\\n\u003C%else%>\\n\u003C$text text={{{ [\u003Cinfo>sentencecase[]] }}}/>\\n\u003C%endif%>\\n\u003C/span>\\n\u003C%if [\u003Coptions>!is[blank]] %>\\n\u003C$select tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` default=\u003C\u003Cdefault>> >\u003C$list filter=\u003C\u003Coptions>> >\u003Coption value={{{ [{!!title}split[:]first[]] }}}>{{{ [{!!title}split[:]last[]] }}}\u003C/option>\u003C/$list>\u003C/$select>\\n\u003C%elseif  [\u003Cinfo>match[version]] %>\\n\u003Cspan>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\u003C\u003CsetVersionFieldButtons>>\u003C/$tiddler>\\n\u003C/span>\\n\u003C%else%>\\n\u003C$edit tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` placeholder=\u003C\u003Cplaceholder>> default=\u003C\u003Cdefault>> tag=\u003C\u003Ctag>> />\\n\u003C%endif%>\\n\u003C/label>\\n\u003C/$parameters>\\n\\\\end\\n\\n\\\\function set.value(value,default:\\\"\\\") [\u003Cvalue>!is[blank]]:else[\u003Cdefault>] :filter[!is[blank]]\\n\\n\\\\procedure setVersionField()\\n\u003C$let increment={{{ [\u003Cmodifier>match[ctrl]then[-1]else[1]] }}} >\\n\u003C$action-setfield set-plugin-version={{{ [\u003Cdom-data-version>split[.]] :map[\u003Cdom-data-nth>subtract[1]match\u003Cindex>then\u003Cincrement>else[0]add{!!title}compare:number:gteq[0]else[0]]+[join[.]] }}}/>\\n\u003C/$let>\\n\\\\end setVersionField\\n\\n\\\\procedure setVersionFieldButton()\\n\u003C$genesis \\n$type=\\\"button\\\" \\ntype=\\\"button\\\"\\ndata-version=\u003C\u003Cversion>>\\ndata-nth=\u003C\u003Cnth>>\\ntitle={{{ \\\"Breaking changes\\\" \\\"Backward compatible changes\\\" \\\"Bug fixes\\\" +[nth\u003Cnth>] }}}\\n>\u003C\u003CversionPart>>\u003C/$genesis>\\n\\\\end setVersionFieldButton\\n\\n\\\\procedure setVersionFieldButtons()\\n\u003C$let version={{{ [{!!set-plugin-version}!is[blank]else[0.0.0]] }}} >\\n\u003C$eventcatcher selector=\\\"button\\\" $click=\u003C\u003CsetVersionField>> tag=\\\"div\\\">\\n\u003C$list filter=\\\"[\u003Cversion>split[.]]\\\" variable=\\\"versionPart\\\" counter=\\\"nth\\\">\u003C\u003CsetVersionFieldButton>>\u003C/$list>\\n\u003C/$eventcatcher>\\n\u003C$edit class=\\\"tc-edit-texteditor\\\" tag=\\\"textarea\\\" field=`set-plugin-version-$(version)$` placeholder=`$(version)$ release notes`/>\\n\u003C/$let>\\n\\\\end setVersionFieldButtons\\n\\n\\\\procedure editVersionFieldButton(field)\\n\\\\procedure editVersionField()\\n\u003C%if [\u003Cmodifier>match[ctrl]] %>\\n\u003C$action-deletefield $field=\u003C\u003Cfield>> />\\n\u003C%else%>\\n\u003C$action-setfield set-plugin-version=\u003C\u003Cversion>> />\\n\u003C%endif%>\\n\\\\end editVersionField\\n\u003C$let version={{{ [\u003Cfield>removeprefix[set-plugin-version-]] }}} >\\n\u003C$button tag=\\\"span\\\" tooltip=\\\"click to edit, ctrl+click to delete\\\" actions=\u003C\u003CeditVersionField>> >\u003Cem>\u003C\u003Cversion>>\u003C/em> - \u003C$text text={{{ [{!!title}get\u003Cfield>] }}}/> \u003C/$button>\\n\u003C/$let>\\n\\\\end editVersionFieldButton\\n\\n\\\\procedure versionHistory()\\n\u003Cul>\\n\u003C$list filter=\\\"[{!!title}fields[]prefix[set-plugin-version-]reverse[]]\\\" variable=\\\"field\\\">\u003Cli>\u003C$transclude $variable=\\\"editVersionFieldButton\\\" field=\u003C\u003Cfield>> />\u003C/li>\u003C/$list>\\n\u003C/ul>\\n\\\\end\\n\\n\\\\function get.destField(subTiddler,field) [\u003CsubTiddler>get\u003Cfield>]\\n\\n\\\\function get.sourceField(subTiddler,field) [\u003CsubTiddler>shadowsource[]get[text]jsonget[tiddlers],\u003CsubTiddler>,\u003Cfield>]\\n\\n\\\\function get.sourceFields(subTiddler) [\u003CsubTiddler>shadowsource[]]:map:flat[\u003CsubTiddler>subtiddlerfields{!!title}]\\n\\n\\\\function has.diff(subTiddler,field) [get.destField\u003CsubTiddler>,\u003Cfield>else[]]:filter[get.sourceField\u003CsubTiddler>,\u003Cfield>else[]!match{!!title}]\\n\\n\\\\function diff.fields(subTiddler) [get.sourceFields\u003CsubTiddler>] [\u003CsubTiddler>fields:exclude[created creator modified modifier title]] :filter[has.diff\u003CsubTiddler>,{!!title}]\\n\\n\\\\procedure subTiddler-list-item()\\n\\\\procedure subTiddler-link()\\n\u003C$link to=\u003C\u003CsubTiddler>> >\\n\u003C%if [\u003CsubTiddler>prefix\u003Cplugin-title>]%>\\n\u003Cspan class=\\\"tc-system-title-prefix\\\">../\u003C/span>\u003C$text text={{{ [\u003CsubTiddler>removeprefix\u003Cplugin-title>trim[/]] }}}/>\\n\u003C%else%>\\n\u003C$text text=\u003C\u003CsubTiddler>> />\\n\u003C%endif%>\\n\u003C/$link>\\n\\\\end subTiddler-link\\n\u003C$let state=`$:/state/peek-tiddler/open/$(subTiddler)$$(qualify)$`>\\n\u003Cli>\\n\u003C\u003CsubTiddler-link>>\\n\u003C%if [diff.fields\u003CsubTiddler>] %>\\n\u003C$checkbox tiddler=\u003C\u003Cstate>> field=\\\"text\\\" checked=\\\"show\\\" class=\\\"tc-btn-invisible\\\">\\n\u003C%if [\u003Cstate>get[text]]%>{{$:/core/images/cancel-button}}\u003C%else%>{{$:/core/images/info-button}}\u003C%endif%>\\n\u003C/$checkbox>\\n\u003C%endif%>\\n\u003C%if [\u003Cstate>get[text]]%>\\n\u003C$list filter=\\\"[diff.fields\u003CsubTiddler>]\\\" variable=field>\\n\u003C$diff-text source={{{ [get.sourceField\u003CsubTiddler>,\u003Cfield>] }}} dest={{{ [get.destField\u003CsubTiddler>,\u003Cfield>] }}} >\\n\u003Ccode>\u003C\u003Cfield>>\u003C/code>: \u003C\u003Cdiff-count>> difference\u003C%if [\u003Cdiff-count>!match[1]]%>s\u003C%endif%>\\n\u003C/$diff-text>\\n\u003C/$list>\\n\u003C%endif%>\\n\u003C/li>\\n\u003C/$let>\\n\\\\end subTiddler-list-item\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/plugin-maker/packager\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003Cform class=\\\"edit-info\\\">\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"name\\\" tiddler=\\\"$:/state/plugin-maker/infos\\\" placeholder=\\\"Plugin name\\\" hint=\\\"Brief name for the plugin. Select a plugin installed to edit it or write the name of the new plugin to create it\\\"/>\\n\u003C$let plugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}} >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"author\\\" placeholder=\\\"Author\\\" default={{$:/status/UserName}} hint=\\\"(optional) Author of plugin\\\"/>\\n\u003C$let plugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}} plugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$` >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"description\\\" placeholder=\\\"Plugin description\\\" hint=\\\"Description of plugin\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"version\\\" placeholder=\\\"0.0.1\\\" hint=\\\"(optional) Version string (should conform to SemanticVersioning convention)\\\" hint-link=\\\"https://semver.org/\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"stability\\\" default=\\\"STABILITY_1_EXPERIMENTAL\\\" options=\\\"[[STABILITY_0_DEPRECATED:deprecated]] [[STABILITY_1_EXPERIMENTAL:experimental]] [[STABILITY_2_STABLE:stable]] [[STABILITY_3_LEGACY:legacy]]\\\" hint=\\\"Communicates the state of development of the plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"type\\\" options=\\\"plugin theme language\\\" default=\\\"plugin\\\" hint=\\\"Determines how the plugin is treated\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"list\\\" default=\\\"readme\\\" placeholder=\\\"Plugin list\\\" hint=\\\"Names of exposed plugin information tiddlers\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"parent\\\" placeholder=\\\"Plugin parent\\\" hint=\\\"Sub-plugins are displayed in the control panel plugin chooser within the expandable area of their parent plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"dependents\\\" placeholder=\\\"Plugin dependents\\\" hint=\\\"List the titles of any other plugins that should also be installed\\\"  hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\" tag=\\\"textarea\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"filter\\\" default=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" placeholder=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" tag=\\\"textarea\\\"  hint=\\\"Filter the tiddlers to package in the plugin. The name of the plugin is stored in the \u003Cplugin-title> variable.\\\"/>\\n\u003C/$let>\\n\u003C/$let>\\n\u003C/form>\\n\\n\u003C$let \\nplugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}}>\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003C$let\\nplugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}}\\nplugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$`\\nplugin-type={{{ [set.value{!!set-plugin-type},[plugin]] }}}\\nplugin-version={{{ [set.value{!!set-plugin-version},[0.0.1]] }}}\\nplugin-list={{{ [set.value{!!set-plugin-list},[readme]] }}}\\nplugin-description={{{ [set.value{!!set-plugin-description},[Plugin packaged with plugin-maker]] }}}\\nplugin-parent={{{ [set.value{!!set-plugin-parent}] }}}\\nplugin-dependents={{{ [set.value{!!set-plugin-dependents}] }}}\\nplugin-stability={{{ [set.value{!!set-plugin-stability},[STABILITY_1_EXPERIMENTAL]] }}}\\nplugin-filter=`[\u003Cplugin-title>plugintiddlers[]] [all[tiddlers+shadows]prefix\u003Cplugin-title>!\u003Cplugin-title>] ${[set.value{!!set-plugin-filter}]}$ +[sort[title]]`\\nplugin-tiddler-list-pages-max=\\\"20\\\"\\nplugin-tiddler-list-pages={{{ [subfilter\u003Cplugin-filter>is[tiddler]count[]divide\u003Cplugin-tiddler-list-pages-max>add[.5]round[]] }}}\\n>\\n\\n\u003Cp>\u003C$link to=\u003C\u003Cplugin-title>>/>\u003C/p>\\n\\n\u003Cp>\\n//Modified/New tiddlers to be packaged://\\n\u003C/p>\\n\\n\u003C$let skip={{{ [\u003CthisTiddler>get[page]else[0]multiply\u003Cplugin-tiddler-list-pages-max>] }}}>\\n\u003Cul>\\n\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>is[tiddler]butfirst\u003Cskip>limit\u003Cplugin-tiddler-list-pages-max>]\\\" variable=\\\"subTiddler\\\" counter=\\\"counter\\\">\\n\u003Cdiv style=\\\"display:flex;gap:2ch;\\\">\u003C$text text={{{ [{!!page}multiply\u003Cplugin-tiddler-list-pages-max>add\u003Ccounter>] }}} />\u003C$transclude $variable=\\\"subTiddler-list-item\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/ul>\\n\u003C/$let>\\n\\n\u003C%if [\u003Cplugin-tiddler-list-pages>compare:number:gt[1]] %>\\n\u003Cspan>\\n\u003C$button disabled={{{  [{!!page}compare:number:gt[0]then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[-1]compare:number:gt[0]else[0]] }}}>{{$:/core/images/left-arrow}}\u003C/$button>\\n\u003Cspan>\u003C$text text={{{ [{!!page}add[1]] }}} /> / \u003C\u003Cplugin-tiddler-list-pages>>\u003C/span>\\n\u003C$button disabled={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>else{!!page}] }}}>{{$:/core/images/right-arrow}}\u003C/$button>\\n\u003C/span>\\n\u003C%endif%>\\n\\n\u003C$button actions=\u003C\u003Ccreate-plugin-tiddler>> >\\n{{$:/core/images/new-button}} \u003C$text text={{$:/language/Buttons/NewTiddler/Caption}}/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cpackage-plugin-action>> >\\n{{$:/core/images/stamp}} \u003C$text text=`${[\u003Cplugin-title>get[title]then[Update]else[Package]]}$ $(plugin-name)$`/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cexport-plugin-action>> >\\n{{$:/core/images/input-button}} \u003C$text text=`Export $(plugin-name)$ v$(plugin-version)$`/>\\n\u003C/$button>\\n\\n\u003C/$let>\\n\u003C/$tiddler>\\n\u003C/$let>\",\"code-body\":\"\"},\"$:/plugins/theophile.dev/plugin-maker/readme\":{\"text\":\"! Minimal Plugin Creator for TiddlyWiki\\n\\nA lightweight tool designed to simplify the process of creating [[TiddlyWiki plugins|https://tiddlywiki.com/#PluginMechanism]]. The goal is to keep it as small and efficient as possible.\\n\\n\\n\u003C\u003C\u003CNote\\nThis plugin is currently in beta. Significant changes are expected before the first official release, and the content may change without prior notice. While it is functional for creating standard plugins, support for themes or language packs has not been tested yet.\\n\u003C\u003C\u003C\\n\\n\\n!! How to Provide Feedback\\n\\nYour feedback is invaluable! If you have suggestions or encounter any issues, please join the discussion on the [[TiddlyWiki Talk forum|https://talk.tiddlywiki.org/t/how-to-create-a-plugin-library-with-one-click-tiddlyhost/11245/3]].\"},\"$:/plugins/theophile.dev/plugin-maker/style\":{\"text\":\".tc-btn-invisible {\\n  input {\\n    appearance: none;\\n  }\\n\\n  .tc-image-button {\\n    height: 1em;\\n    width: 1em;\\n  }\\n}\\n\\n.edit-info {\\n  --_border: solid 1px;\\n  display: grid;\\n  grid-template-columns: min-content 1fr;\\n  border: var(--_border);\\n\\n  label {\\n    grid-column: 1/-1;\\n    display: grid;\\n    grid-template-columns: subgrid;\\n    position: relative;\\n\\n    &:not(:last-child) {\\n      border-bottom: var(--_border);\\n    }\\n\\n    >span {\\n      gap: .5ch;\\n      padding: 2px;\\n      border-right: var(--_border);\\n      align-content: center;\\n\\n      &:first-of-type {\\n        display: inline-flex;\\n        flex-direction: row-reverse;\\n      }\\n    }\\n\\n    input,\\n    textarea {\\n      resize: vertical;\\n\\n      &.tc-edit-texteditor {\\n        margin: 0;\\n      }\\n    }\\n  }\\n\\n  .hint {\\n    font-style: normal;\\n    text-decoration: none;\\n\\n    &:after {\\n      content: \\\"ⓘ\\\";\\n    }\\n  }\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme packager history license","version":"2.0.17","description":"lightweight plugin packager","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/plugin-maker"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/rss-feed/auto-upload\":{\"text\":\"\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/rss-feed/settings\\\">\\n\u003C%if [{!!auto-upload}match[true]] %>\\n\u003C$importvariables filter=\\\"[\u003CcurrentTiddler>]\\\">\\n\u003C\u003Cupdate-feed>>\\n\",\"tags\":\"$:/tags/BackgroundAction\",\"track-filter\":\"[subfilter{$:/plugins/theophile.dev/rss-feed/settings!!feed-filter}haschanged[]!is[draft]]\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/rss-feed/feed-button\":{\"text\":\"\\\\whitespace trim\\n\u003C$importvariables filter=\\\"[[$:/plugins/theophile.dev/rss-feed/settings]]\\\">\\n\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/rss-feed/settings\\\">\\n\u003C$button actions=\u003C\u003Cupdate-feed>>  tooltip=\\\"Click to Send feed to GitHub\\\" class=\u003C\u003Ctv-config-toolbar-class>>>\\n\u003C%if [\u003Ctv-config-toolbar-icons>match[yes]] %>\\n{{$:/plugins/theophile.dev/rss-feed/icon}}\\n\u003C%endif%>\\n\u003C%if [\u003Ctv-config-toolbar-text>match[yes]] %>\\n\u003Cspan class=\\\"tc-btn-text\\\">\\n\u003C$text text=\\\"Send feed to GitHub\\\"/>\\n\u003C/span>\\n\u003C%endif%>\\n\u003C/$button>\\n\u003C/$tiddler>\\n\u003C/$importvariables>\",\"tags\":\"$:/tags/PageControls\"},\"$:/plugins/theophile.dev/rss-feed/icon\":{\"text\":\"\\\\parameters (size:\\\"22pt\\\")\\n\u003Csvg width=\u003C\u003Csize>> height=\u003C\u003Csize>> class=\\\"tc-image-feed-button tc-image-button\\\" viewBox=\\\"0 0 8 8\\\" >\u003Cpath d=\\\"M1 2A5 5 0 016 7H7A6 6 0 001 1ZM1 4A3 3 0 014 7H5A4 4 0 001 3ZM3 6A1 1 0 012 7A1 1 0 011 6A1 1 0 012 5A1 1 0 013 6Z\\\"/>\u003C/svg>\",\"tags\":\"$:/tags/Image\"},\"$:/plugins/theophile.dev/rss-feed/readme\":{\"text\":\"This plugin is a pure wikitext solution to upload a TiddlyWiki-generated RSS feed to GitHub. This is a refactor of a [[previous experiment|https://rss.tiddlyhost.com/]] using the file upload widget.\\n\\n\\n!!! About the RSS format\\n\\n[[RSS|https://en.wikipedia.org/wiki/RSS]] stands for ''r''eally ''s''imple ''s''yndication. They are XML files, most of the time automatically generated, that contain the latest news from a website. A feed reader is able to read these files and notify a user when new content is available.\\n\\nRecommended feed reader: https://nodetics.com/feedbro\\n\\nIt's also possible to [[convert an RSS feed to a newsletter|https://www.google.com/search?q=rss+feed+to+email]].\\n\\n!!! Comparison with the previous approach\\n\\n\u003Ctable>\\n\u003Cthead>\\n\u003Ctr>\u003Cth>\u003C/th>\u003Cth>Pure Wikitext RSS Plugin\u003C/th>\u003Cth>GitHub File Uploads Plugin Approach\u003C/th>\u003C/tr>\\n\u003C/thead>\\n\u003Ctbody>\\n\u003Ctr>\\n\u003Ctd>Implementation\u003C/td>\\n\u003Ctd>Built natively using TiddlyWiki wikitext macros and core action widgets, completely avoiding custom JavaScript.\u003C/td>\\n\u003Ctd>Uses a custom JavaScript module (`module-type: uploader`) and embeds a third-party REST client library, `Octokat.js`.\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>API\u003C/td>\\n\u003Ctd>Leverages the high-level GitHub Repository Contents API to manage a single file.\u003C/td>\\n\u003Ctd>Uses the lower-level Git Data API to manipulate references, blobs, trees, and commits directly.\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd> Data Processing \u003C/td>\\n\u003Ctd> \\n\\nTwo-step HTTP process:\\n\\n# GET Request (Fetch SHA): It first queries the target repository's file path via a `GET` request to retrieve the file's current SHA hash.\\n# PUT Request (Update/Create): Upon completion, a callback macro (`handle-sha`) inspects the status code. If the file exists (status code 200), it passes the retrieved SHA into the JSON payload of a subsequent `PUT` request to safely update the file. If the file does not exist, it proceeds with a standard `PUT` request without the SHA string to create it.\\n\\n\u003C/td>\\n\u003Ctd>Designed to queue multiple binary files in an array and bundle them into a single, cohesive commit during its `deinitialize` phase. \u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Credential Management\u003C/td>\\n\u003Ctd>Isolates its configuration entirely, requiring the user to re-input their repository details and create a specific password store entry (`gh`) in its own settings panel.\u003C/td>\\n\u003Ctd>Natively integrates with TiddlyWiki's core GitHub Saver, extracting necessary data from `$:/GitHub/Repo` and `$tw.utils.getPassword(\\\"github\\\")`.\u003C/td>\\n\u003C/tr>\\n\u003C/tbody>\\n\u003C/table>\\n\\n!!! Limitations\\n\\nThe pure wikitext approach avoids bloating the wiki with the heavy `Octokat.js` JavaScript library, at the cost of vulnerability to race conditions (`409 Conflict` if the SHA changes between the GET and PUT requests), whereas building a Git commit tree (like the uploader plugin does) ensures atomic updates. As pure wikitext does not support Promises, it handles asynchronous operations sequentially using the `oncompletion` attribute of the `$action-sendmessage` widget, routing the response data into nested callback macros (like `\u003C\u003Chandle-sha>>`) to complete the HTTP request chain.\"},\"$:/plugins/theophile.dev/rss-feed/settings\":{\"text\":\"\u003C!-- RSS guidelines: https://www.rssboard.org/rss-profile -->\\n\\\\define dateTemplate() [UTC]ddd, 0DD mmm YYYY 0hh:0mm:0ss GMT\\n\\n\\\\procedure item()\\n\u003C$text text=`\u003Citem>\\n      \u003Ctitle>$(currentTiddler)$\u003C/title>\\n      \u003Ccategory>${[all[current]tags[]sortan[]join[/]]}$\u003C/category>\\n      \u003Cdescription>${[{!!description}]}$\u003C/description>\\n      \u003Ccontent:encoded>\u003C![CDATA[`/>\u003C$wikify name=\\\"content\\\" output=\\\"html\\\" mode=\\\"inline\\\" text=\\\"\\\"\\\"\u003C$transclude mode=\\\"block\\\"/>\\\"\\\"\\\">\u003C$text text=\u003C\u003Ccontent>> />\u003C/$wikify>\u003C$text text=`]]>\u003C/content:encoded>\\n\\t  \u003CpubDate>${ [{!!modified}else{!!created}format:date\u003CdateTemplate>]}$\u003C/pubDate>\\n      \u003Clink>${[{$:/info/url/full}]}$#${[{!!title}encodeuricomponent[]]}$\u003C/link>\\n      \u003Cguid isPermaLink='true'>${[{$:/info/url/full}]}$#:%5Bcreated%5B${[{!!created}]}$%5D%5D\u003C/guid>\\n\u003C/item>`/>\\n\\\\end\\n\\n\\\\procedure rss()\\n\u003C?xml version=\\\"1.0\\\" encoding=\\\"UTF-8\\\" ?>\\n\u003Crss version=\\\"2.0\\\" xmlns:atom=\\\"http://www.w3.org/2005/Atom\\\" xmlns:content=\\\"http://purl.org/rss/1.0/modules/content/\\\">\\n\u003Cchannel>\\n  \u003Catom:link href=\\\"$(base)$$(path)$\\\" rel=\\\"self\\\" type=\\\"application/rss+xml\\\" />\\n  \u003Ctitle>\u003C![CDATA[$(title)$]]>\u003C/title>\\n  \u003Clink>${[{$:/info/url/full}]}$\u003C/link>\\n  \u003Cdescription>a non-linear personal web notebook\u003C/description>\\n  \u003Clanguage>$(language)$\u003C/language>\\n  \u003ClastBuildDate>${[\u003Cnow [UTC]YYYY0MM0DD0hh0mm0ss0XXX>format:date\u003CdateTemplate>]}$\u003C/lastBuildDate>\\n  $(feedItems)$\\n\u003C/channel>\\n\u003C/rss>\\n\\\\end\\n\\n\\\\function feed()\\n[{!!username}]=>username\\n[{!!repo}]=>repo\\n[{!!file-path}]=>path\\n\\n\\\"https://$(username)$.github.io/$(repo)$/\\\"+[substitute[]]=>base\\n[{$:/SiteTitle}]=>title\\n[{$:/language}trim[$:/languages/]]=>language\\n\\n[\u003Crss>substitute[]] \\n\\\\end\\n\\n\\\\function repo-url()\\n[{!!username}]=>username\\n[{!!repo}]=>repo\\n\\\"https://github.com/$(username)$/$(repo)$\\\"+[substitute[]]\\n\\\\end\\n\\n\\\\function feed-link()\\n[{!!username}]=>username\\n[{!!repo}]=>repo\\n[{!!file-path}]=>path\\n\\\"https://$(username)$.github.io/$(repo)$/$(path)$\\\"+[substitute[]]\\n\\\\end\\n\\n\u003C!-- send to github logic -->\\n\\\\procedure update-feed()\\n\\\\procedure notify()\\n\u003C$parameters message>\\n\u003C$action-sendmessage $message=\\\"tm-notify\\\" $param=\\\"$:/plugins/theophile.dev/rss-feed/templates/toast\\\" message=\u003C\u003Cmessage>> />\\n\u003C/$parameters>\\n\\\\end notify\\n\\\\procedure handle-sha()\\n\\\\procedure finally()\\n    \u003C!-- https://docs.github.com/en/rest/repos/contents?apiVersion=2026-03-10#create-or-update-file-contents -->\\n    \u003C%if [\u003Cstatus>match[200]] [\u003Cstatus>match[201]] %>\\n    \u003C\u003Cnotify message=`Saved \u003Ca href=\\\"${[\u003Cdata>jsonget[content],[html_url]]}$\\\">feed\u003C/a>`>>\\n    \u003C%elseif [\u003Cstatus>match[404]] %>\\n    \u003C\u003Cnotify message=\\\"Error: Resource not found.\\\" >>\\n    \u003C%elseif [\u003Cstatus>match[409]] %>\\n    \u003C\u003Cnotify message=\\\"Error: Conflict. Try again after a bit\\\" >>\\n    \u003C%elseif [\u003Cstatus>match[422]] %>\\n    \u003C\u003Cnotify message=\\\"Error: Validation failed, or the endpoint has been spammed.\\\" >>\\n    \u003C%else%>\\n    \u003C\u003Cnotify message=`Error: $(status)$`  >>\\n    \u003C%endif%>\\n\\\\end finally\\n\u003C%if [\u003Cstatus>match[200]] %>\\n\u003C$action-sendmessage\\n    $message=\\\"tm-http-request\\\"\\n    url=\u003C\u003Curl>>\\n    method=\\\"PUT\\\"\\n    basic-auth-username=\u003C\u003Cusername>>\\n    basic-auth-password-from-store=\\\"gh\\\"\\n    header-Content-Type=\\\"application/json\\\"\\n    body=`{\\\"message\\\": \\\"$(commitMessage)$\\\", \\\"content\\\": \\\"$(content)$\\\", \\\"sha\\\": \\\"${ [\u003Cdata>jsonget[sha]] }$\\\", \\\"branch\\\":\\\"$(branch)$\\\"}`\\n    var-notify=\u003C\u003Cnotify>>\\n    oncompletion=\u003C\u003Cfinally>>\\n/>\\n\u003C%else%>\\n\u003C$action-sendmessage\\n    $message=\\\"tm-http-request\\\"\\n    url=\u003C\u003Curl>>\\n    method=\\\"PUT\\\"\\n    basic-auth-username=\u003C\u003Cusername>>\\n    basic-auth-password-from-store=\\\"gh\\\"\\n    header-Content-Type=\\\"application/json\\\"\\n    body=`{\\\"message\\\": \\\"$(commitMessage)$\\\", \\\"content\\\": \\\"$(content)$\\\", \\\"branch\\\":\\\"$(branch)$\\\"}`\\n    var-notify=\u003C\u003Cnotify>>\\n    oncompletion=\u003C\u003Cfinally>>\\n/>\\n\u003C%endif%>\\n\\\\end handle-sha\\n\\n\u003C!-- Step 0: make sure the feed is discoverable -->\\n\u003C$action-setfield $tiddler=\\\"$:/discoverfeed\\\" text=`\u003Clink rel='alternate' type='application/rss+xml' title='RSS' href='$(feed-link)$'/>` tags=\\\"$:/tags/RawMarkup\\\"/>\\n\\n\u003C!-- Step 1: fetch the SHA of the RSS file -->\\n\u003C\u003Cnotify \\\"Starting to upload feed\\\">>\\n\u003C$wikify name=\\\"feedItems\\\" output=\\\"text\\\" text=\\\"\\\"\\\"\u003C$let tv-wikilink-template=`${[{$:/info/url/full}]}$#$uri_encoded$`>\u003C$list filter={{!!feed-filter}}>\u003C$wikify name=\\\"feedItem\\\" output=\\\"text\\\" text=\u003C\u003Citem>> >\u003C$text text=\u003C\u003CfeedItem>> />\u003C/$wikify>\u003C/$list>\u003C/$let>\\\"\\\"\\\">\\n\u003C$let \\n    username={{!!username}}\\n    repo={{!!repo}}\\n    filePath={{!!file-path}}\\n    branch={{!!branch}}\\n    url=`https://api.github.com/repos/$(username)$/$(repo)$/contents/$(filePath)$?ref=$(branch)$`\\n    content={{{ [\u003Cfeed>encodebase64[]]  }}}\\n    commitMessage=`Updated $(now)$`\\n>\\n\u003C$action-sendmessage\\n    $message=\\\"tm-http-request\\\"\\n    url=\u003C\u003Curl>>\\n    method=\\\"GET\\\"\\n    oncompletion=\u003C\u003Chandle-sha>>\\n    var-notify=\u003C\u003Cnotify>>\\n    var-username=\u003C\u003Cusername>>\\n    var-repo=\u003C\u003Crepo>>\\n    var-filePath=\u003C\u003CfilePath>>\\n    var-url=\u003C\u003Curl>>\\n    var-content=\u003C\u003Ccontent>>\\n    var-commitMessage=\u003C\u003CcommitMessage>>\\n    var-branch=\u003C\u003Cbranch>>\\n/>\\n\u003C/$let>\\n\u003C/$wikify>\\n\\\\end update-feed\\n\\n\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/rss-feed/settings\\\">\\n\\n[[Create a github account|https://github.com/signup]] and a [[repo|https://github.com/new]] if you dont have one, then enable [[github page|https://docs.github.com/en/pages/quickstart]] in the \u003Ca href=`https://github.com/${[{!!username}]}$/${[{!!repo}]}$/settings/pages`>settings\u003C/a> of your repo. \\n\\n\\n\u003Ctable class=\\\"tc-max-width tc-edit-max-width two-equal-column\\\">\\n\u003Ctr>\\n\u003Ctd>Access Token (\u003Ca title=`* Scroll to Repository access.\\n* Click \\\"Only select repositories\\\".\\n* Select the ${[{!!repo}]}$ repository.` href=`https://github.com/settings/personal-access-tokens/new?name=${[{!!repo}]}$-${[\u003Cnow TIMESTAMP>]}$&description=TiddlyWiki&target_name=${[{!!username}]}$&contents=write`>Create a Personal Access Token here\u003C/a>)\u003C/td>\u003Ctd>\u003C$password  name=\\\"gh\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Github Username\u003C/td>\u003Ctd>\u003C$edit field=\\\"username\\\" tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>\u003Ca href=\u003C\u003Crepo-url>> >Target repository\u003C/a> (e.g. `Jermolene/TiddlyWiki5`)\u003C/td>\u003Ctd>\u003C$edit field=\\\"repo\\\" tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Target branch for saving (e.g. `main`)\u003C/td>\u003Ctd>\u003C$edit field=\\\"branch\\\" tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Path to \u003Ca href=`https://github.com/${[{!!username}]}$/${[{!!repo}]}$/blob/${[{!!branch}]}$/${[{!!file-path}]}$`>target file\u003C/a> (e.g. `/wiki/`)\u003C/td>\u003Ctd>\u003C$edit field=\\\"file-path\\\" tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003Ctr>\\n\u003Ctd>Feed filter\u003C/td>\u003Ctd>\u003C$edit field=\\\"feed-filter\\\" tag=\\\"input\\\" class=\\\"tc-edit-texteditor\\\"/>\u003C/td>\\n\u003C/tr>\\n\u003C/table>\\n\\n\u003C$count filter={{!!feed-filter}}/> tiddlers included in the feed:\\n\\n\u003C\u003Clist-links \\\"[subfilter{!!feed-filter}]\\\" >>\\n\\nPreview:\\n\\n\u003C$wikify name=\\\"feedItems\\\" output=\\\"text\\\" text=\\\"\\\"\\\"\u003C$let tv-wikilink-template=`${[{$:/info/url/full}]}$#$uri_encoded$`>\u003C$list filter={{!!feed-filter}}>\u003C$wikify name=\\\"feedItem\\\" output=\\\"text\\\" text=\u003C\u003Citem>> >\u003C$text text=\u003C\u003CfeedItem>> />\u003C/$wikify>\u003C/$list>\u003C/$let>\\\"\\\"\\\">\\n\u003Cdiv style=\\\"height:10lh;overflow:scroll\\\">\\n\u003C$codeblock code=\u003C\u003Cfeed>> />\\n\u003C/div>\\n\u003C/$wikify>\\n\\n\u003C$let tv-config-toolbar-icons=\\\"yes\\\"\\n\\ttv-config-toolbar-text=\\\"yes\\\"\\n\\ttv-config-toolbar-class=\\\"\\\"\\n>\\n{{$:/plugins/theophile.dev/rss-feed/feed-button}} \u003C$checkbox field=\\\"auto-upload\\\" checked=\\\"true\\\"> auto upload\u003C/$checkbox>\\n\u003C/$let>\\n\\nValidate feed : [[by input|https://validator.w3.org/feed/#validate_by_input]] or check the \u003Ca href=`https://validator.w3.org/feed/check.cgi?url=${[\u003Cfeed-link>lowercase[]encodeuricomponent[]]}$`>uploaded feed\u003C/a>.\\n\\n\u003C/$tiddler>\",\"tags\":\"$:/tags/ControlPanel/Settings\",\"file-path\":\"xml.rss\",\"username\":\"DesignThinkerer\",\"repo\":\"plugin-library\",\"tiddler-content\":\"content tiddler\",\"feed-filter\":\"[tag[feed]!sort[modified]limit[10]]\",\"branch\":\"main\",\"caption\":\"Rss Feed\",\"auto-upload\":\"true\"},\"$:/plugins/theophile.dev/rss-feed/templates/toast\":{\"text\":\"\u003C\u003Cmessage>>\",\"code-body\":\"yes\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme settings","version":"0.0.5","description":"RSS Feed for your wiki","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/rss-feed"},
{"created":"20260823210108864","creator":"theophile.dev","text":"\u003C!-- RSS guidelines: https://www.rssboard.org/rss-profile -->\n\\define dateTemplate() [UTC]ddd, 0DD mmm YYYY 0hh:0mm:0ss GMT\n\n\\procedure item()\n\u003C$text text=`\u003Citem>\n      \u003Ctitle>$(currentTiddler)$\u003C/title>\n      \u003Ccategory>${[all[current]tags[]sortan[]join[/]]}$\u003C/category>\n      \u003Cdescription>${[{!!description}]}$\u003C/description>\n      \u003Ccontent:encoded>\u003C![CDATA[`/>\u003C$wikify name=\"content\" output=\"html\" mode=\"inline\" text=\"\"\"\u003C$transclude mode=\"block\"/>\"\"\">\u003C$text text=\u003C\u003Ccontent>> />\u003C/$wikify>\u003C$text text=`]]>\u003C/content:encoded>\n\t  \u003CpubDate>${ [{!!modified}else{!!created}format:date\u003CdateTemplate>]}$\u003C/pubDate>\n      \u003Clink>${[{$:/info/url/full}]}$#${[{!!title}encodeuricomponent[]]}$\u003C/link>\n      \u003Cguid isPermaLink='true'>${[{$:/info/url/full}]}$#:%5Bcreated%5B${[{!!created}]}$%5D%5D\u003C/guid>\n\u003C/item>`/>\n\\end\n\n\\procedure rss()\n\u003C?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n\u003Crss version=\"2.0\" xmlns:atom=\"http://www.w3.org/2005/Atom\" xmlns:content=\"http://purl.org/rss/1.0/modules/content/\">\n\u003Cchannel>\n  \u003Catom:link href=\"$(base)$$(path)$\" rel=\"self\" type=\"application/rss+xml\" />\n  \u003Ctitle>\u003C![CDATA[$(title)$]]>\u003C/title>\n  \u003Clink>${[{$:/info/url/full}]}$\u003C/link>\n  \u003Cdescription>a non-linear personal web notebook\u003C/description>\n  \u003Clanguage>$(language)$\u003C/language>\n  \u003ClastBuildDate>${[\u003Cnow [UTC]YYYY0MM0DD0hh0mm0ss0XXX>format:date\u003CdateTemplate>]}$\u003C/lastBuildDate>\n  $(feedItems)$\n\u003C/channel>\n\u003C/rss>\n\\end\n\n\\function feed()\n[{!!username}]=>username\n[{!!repo}]=>repo\n[{!!file-path}]=>path\n\n\"https://$(username)$.github.io/$(repo)$/\"+[substitute[]]=>base\n[{$:/SiteTitle}]=>title\n[{$:/language}trim[$:/languages/]]=>language\n\n[\u003Crss>substitute[]] \n\\end\n\n\\function repo-url()\n[{!!username}]=>username\n[{!!repo}]=>repo\n\"https://github.com/$(username)$/$(repo)$\"+[substitute[]]\n\\end\n\n\\function feed-link()\n[{!!username}]=>username\n[{!!repo}]=>repo\n[{!!file-path}]=>path\n\"https://$(username)$.github.io/$(repo)$/$(path)$\"+[substitute[]]\n\\end\n\n\u003C!-- send to github logic -->\n\\procedure update-feed()\n\\procedure notify()\n\u003C$parameters message>\n\u003C$action-sendmessage $message=\"tm-notify\" $param=\"$:/plugins/theophile.dev/rss-feed/templates/toast\" message=\u003C\u003Cmessage>> />\n\u003C/$parameters>\n\\end notify\n\\procedure handle-sha()\n\\procedure finally()\n    \u003C!-- https://docs.github.com/en/rest/repos/contents?apiVersion=2026-03-10#create-or-update-file-contents -->\n    \u003C%if [\u003Cstatus>match[200]] [\u003Cstatus>match[201]] %>\n    \u003C\u003Cnotify message=`Saved \u003Ca href=\"${[\u003Cdata>jsonget[content],[html_url]]}$\">feed\u003C/a>`>>\n    \u003C%elseif [\u003Cstatus>match[404]] %>\n    \u003C\u003Cnotify message=\"Error: Resource not found.\" >>\n    \u003C%elseif [\u003Cstatus>match[409]] %>\n    \u003C\u003Cnotify message=\"Error: Conflict. Try again after a bit\" >>\n    \u003C%elseif [\u003Cstatus>match[422]] %>\n    \u003C\u003Cnotify message=\"Error: Validation failed, or the endpoint has been spammed.\" >>\n    \u003C%else%>\n    \u003C\u003Cnotify message=`Error: $(status)$`  >>\n    \u003C%endif%>\n\\end finally\n\u003C%if [\u003Cstatus>match[200]] %>\n\u003C$action-sendmessage\n    $message=\"tm-http-request\"\n    url=\u003C\u003Curl>>\n    method=\"PUT\"\n    basic-auth-username=\u003C\u003Cusername>>\n    basic-auth-password-from-store=\"gh\"\n    header-Content-Type=\"application/json\"\n    body=`{\"message\": \"$(commitMessage)$\", \"content\": \"$(content)$\", \"sha\": \"${ [\u003Cdata>jsonget[sha]] }$\", \"branch\":\"$(branch)$\"}`\n    var-notify=\u003C\u003Cnotify>>\n    oncompletion=\u003C\u003Cfinally>>\n/>\n\u003C%else%>\n\u003C$action-sendmessage\n    $message=\"tm-http-request\"\n    url=\u003C\u003Curl>>\n    method=\"PUT\"\n    basic-auth-username=\u003C\u003Cusername>>\n    basic-auth-password-from-store=\"gh\"\n    header-Content-Type=\"application/json\"\n    body=`{\"message\": \"$(commitMessage)$\", \"content\": \"$(content)$\", \"branch\":\"$(branch)$\"}`\n    var-notify=\u003C\u003Cnotify>>\n    oncompletion=\u003C\u003Cfinally>>\n/>\n\u003C%endif%>\n\\end handle-sha\n\n\u003C!-- Step 0: make sure the feed is discoverable -->\n\u003C$action-setfield $tiddler=\"$:/discoverfeed\" text=`\u003Clink rel='alternate' type='application/rss+xml' title='RSS' href='$(feed-link)$'/>` tags=\"$:/tags/RawMarkup\"/>\n\n\u003C!-- Step 1: fetch the SHA of the RSS file -->\n\u003C\u003Cnotify \"Starting to upload feed\">>\n\u003C$wikify name=\"feedItems\" output=\"text\" text=\"\"\"\u003C$let tv-wikilink-template=`${[{$:/info/url/full}]}$#$uri_encoded$`>\u003C$list filter={{!!feed-filter}}>\u003C$wikify name=\"feedItem\" output=\"text\" text=\u003C\u003Citem>> >\u003C$text text=\u003C\u003CfeedItem>> />\u003C/$wikify>\u003C/$list>\u003C/$let>\"\"\">\n\u003C$let \n    username={{!!username}}\n    repo={{!!repo}}\n    filePath={{!!file-path}}\n    branch={{!!branch}}\n    url=`https://api.github.com/repos/$(username)$/$(repo)$/contents/$(filePath)$?ref=$(branch)$`\n    content={{{ [\u003Cfeed>encodebase64[]]  }}}\n    commitMessage=`Updated $(now)$`\n>\n\u003C$action-sendmessage\n    $message=\"tm-http-request\"\n    url=\u003C\u003Curl>>\n    method=\"GET\"\n    oncompletion=\u003C\u003Chandle-sha>>\n    var-notify=\u003C\u003Cnotify>>\n    var-username=\u003C\u003Cusername>>\n    var-repo=\u003C\u003Crepo>>\n    var-filePath=\u003C\u003CfilePath>>\n    var-url=\u003C\u003Curl>>\n    var-content=\u003C\u003Ccontent>>\n    var-commitMessage=\u003C\u003CcommitMessage>>\n    var-branch=\u003C\u003Cbranch>>\n/>\n\u003C/$let>\n\u003C/$wikify>\n\\end update-feed\n\n\u003C$tiddler tiddler=\"$:/plugins/theophile.dev/rss-feed/settings\">\n\n[[Create a github account|https://github.com/signup]] and a [[repo|https://github.com/new]] if you dont have one, then enable [[github page|https://docs.github.com/en/pages/quickstart]] in the \u003Ca href=`https://github.com/${[{!!username}]}$/${[{!!repo}]}$/settings/pages`>settings\u003C/a> of your repo. \n\n\n\u003Ctable class=\"tc-max-width tc-edit-max-width two-equal-column\">\n\u003Ctr>\n\u003Ctd>Access Token (\u003Ca title=`* Scroll to Repository access.\n* Click \"Only select repositories\".\n* Select the ${[{!!repo}]}$ repository.` href=`https://github.com/settings/personal-access-tokens/new?name=${[{!!repo}]}$-${[\u003Cnow TIMESTAMP>]}$&description=TiddlyWiki&target_name=${[{!!username}]}$&contents=write`>Create a Personal Access Token here\u003C/a>)\u003C/td>\u003Ctd>\u003C$password  name=\"gh\"/>\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Ctd>Github Username\u003C/td>\u003Ctd>\u003C$edit field=\"username\" tag=\"input\" class=\"tc-edit-texteditor\"/>\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Ctd>\u003Ca href=\u003C\u003Crepo-url>> >Target repository\u003C/a> (e.g. `Jermolene/TiddlyWiki5`)\u003C/td>\u003Ctd>\u003C$edit field=\"repo\" tag=\"input\" class=\"tc-edit-texteditor\"/>\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Ctd>Target branch for saving (e.g. `main`)\u003C/td>\u003Ctd>\u003C$edit field=\"branch\" tag=\"input\" class=\"tc-edit-texteditor\"/>\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Ctd>Path to \u003Ca href=`https://github.com/${[{!!username}]}$/${[{!!repo}]}$/blob/${[{!!branch}]}$/${[{!!file-path}]}$`>target file\u003C/a> (e.g. `docs/xml.rss`)\u003C/td>\u003Ctd>\u003C$edit field=\"file-path\" tag=\"input\" class=\"tc-edit-texteditor\"/>\u003C/td>\n\u003C/tr>\n\u003Ctr>\n\u003Ctd>Feed filter\u003C/td>\u003Ctd>\u003C$edit field=\"feed-filter\" tag=\"input\" class=\"tc-edit-texteditor\"/>\u003C/td>\n\u003C/tr>\n\u003C/table>\n\n\u003C$count filter={{!!feed-filter}}/> tiddlers included in the feed:\n\n\u003C\u003Clist-links \"[subfilter{!!feed-filter}]\" >>\n\nPreview:\n\n\u003C$wikify name=\"feedItems\" output=\"text\" text=\"\"\"\u003C$let tv-wikilink-template=`${[{$:/info/url/full}]}$#$uri_encoded$`>\u003C$list filter={{!!feed-filter}}>\u003C$wikify name=\"feedItem\" output=\"text\" text=\u003C\u003Citem>> >\u003C$text text=\u003C\u003CfeedItem>> />\u003C/$wikify>\u003C/$list>\u003C/$let>\"\"\">\n\u003Cdiv style=\"height:10lh;overflow:scroll\">\n\u003C$codeblock code=\u003C\u003Cfeed>> />\n\u003C/div>\n\u003C/$wikify>\n\n\u003C$let tv-config-toolbar-icons=\"yes\"\n\ttv-config-toolbar-text=\"yes\"\n\ttv-config-toolbar-class=\"\"\n>\n{{$:/plugins/theophile.dev/rss-feed/feed-button}} \u003C$checkbox field=\"auto-upload\" checked=\"true\"> auto upload\u003C/$checkbox>\n\u003C/$let>\n\nValidate feed : [[by input|https://validator.w3.org/feed/#validate_by_input]] or check the \u003Ca href=`https://validator.w3.org/feed/check.cgi?url=${[\u003Cfeed-link>lowercase[]encodeuricomponent[]]}$`>uploaded feed\u003C/a>.\n\n\u003C/$tiddler>","tags":"$:/tags/ControlPanel/Settings","file-path":"docs/xml.rss","username":"DesignThinkerer","repo":"plugin-library","tiddler-content":"content tiddler","feed-filter":"[tag[feed]!sort[modified]limit[10]]","branch":"main","caption":"Rss Feed","auto-upload":"true","title":"$:/plugins/theophile.dev/rss-feed/settings","modified":"20260823210409110","modifier":"theophile.dev"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/tiddlywiki-upgrader/readme\":{\"text\":\"Tool to quickly upgrade a tiddlywiki with external core. If used with a tiddlywiki with internal core, the wiki will become converted to a tiddlywiki with external core. \\n\\nThe upgrader can be accessed from the `More` tab in the sidebar.\"},\"$:/plugins/theophile.dev/tiddlywiki-upgrader/upgrader\":{\"text\":\"\\\\procedure store-tw-versions-data()\\n  \u003C$action-setfield $tiddler=\\\"$:/temp/store-tw-versions-data\\\" status=\u003C\u003Cstatus>> data=\u003C\u003Cdata>>/>\\n\\\\end\\n\\n\\\\procedure get-tw-versions()\\n  \u003C$action-sendmessage\\n    $message=\\\"tm-http-request\\\"\\n    url=\\\"https://api.github.com/repos/TiddlyWiki/tiddlywiki.com-gh-pages/contents/prerelease\\\"\\n    bind-status=\\\"$:/temp/store-tw-versions-data/status\\\"\\n    oncompletion=\u003C\u003Cstore-tw-versions-data>>\\n  />\\n\\\\end\\n\\n\\\\function is.pending()\\n[{$:/temp/store-tw-versions-data/status}match[pending]]\\n\\\\end\\n\\n\\\\function tw.versions()\\n  [[$:/temp/store-tw-versions-data]get[data]jsonindexes[]] \\n  :map[[$:/temp/store-tw-versions-data]get[data]jsonget\u003CcurrentTiddler>,[name]removeprefix[tiddlywikicore-]removesuffix[.js]]\\n  :filter[!is[blank]]\\n\\\\end\\n\\n\\\\function tw.latest.prerelease()\\n  [tw.versions[]suffix[-prerelease]last[]]\\n\\\\end\\n\\n\\\\function tw.latest.stable()\\n  [tw.versions[]!suffix[-prerelease]last[]]\\n\\\\end\\n\\n\\\\function target.version()\\n  [tw.latest.prerelease[]]\\n  :filter[[$:/temp/store-tw-versions-data]get[enable-prerelease]match[true]]\\n  :else[tw.latest.stable[]]\\n  :filter[compare:version:gt\u003Cversion>]\\n  :else[\u003Cversion>]\\n\\\\end\\n\\n\\\\define defaultBasePath()\\n./\\n\\\\end\\n\\n\\\\function base.path()\\n  [[$:/config/coreURL]get[base-path]else\u003CdefaultBasePath>]\\n\\\\end\\n\\n\\\\function coreURL()\\n  [[$(base.path)$tiddlywikicore-$(target.version)$.js]substitute[]]\\n\\\\end\\n\\n\\\\function is.backup.enabled()\\n  [[$:/temp/store-tw-versions-data]get[enable-backup]else[true]match[true]]\\n\\\\end\\n\\n\\\\procedure update-version()\\n  \u003C!-- trigger the save to apply the new version -->\\n  \u003C$wikify name=\\\"site-title\\\" text={{$:/config/SaveWikiButton/Filename}}>\\n    \u003C$action-sendmessage\\n      $message=\\\"tm-save-wiki\\\"\\n      $param=\\\"$:/core/save/offline-external-js\\\"\\n      filename=\u003C\u003Csite-title>>\\n      version=\u003C\u003Ctarget.version>>\\n      coreURL=\u003C\u003CcoreURL>>\\n    />\\n  \u003C/$wikify>\\n\\\\end\\n\\n\\\\procedure confirm-version-change()\\n    \u003C%if [is.backup.enabled[]] %>\\n      \u003C!-- backup first to avoid data loss -->\\n      \u003C$let \\n        publishFilter=\\\"-[[$:/config/SaveWikiButton/Template]] -[[$:/plugins/tiddlywiki/filesystem]] -[[$:/plugins/tiddlywiki/tiddlyweb]]\\\"\\n        filename=`${ [\u003Csite-title>] }$⏱${[get[modified]!sort[]first[]]}$`\\n      >\\n        \u003C!-- Download wiki including the core -->\\n        \u003C$action-sendmessage\\n            $message=\\\"tm-download-file\\\"\\n            $param=\\\"$:/core/save/all\\\"\\n            publishFilter=\u003C\u003CpublishFilter>>\\n            filename=`$(filename)$-all`\\n        />\\n        \u003C!-- Download wiki + core separately -->\\n        \u003C$action-sendmessage\\n            $message=\\\"tm-download-file\\\"\\n            $param=\\\"$:/core/save/offline-external-js\\\"\\n            publishFilter=\u003C\u003CpublishFilter>>\\n            filename=`$(filename)$-external`\\n        />\\n        \u003C$action-sendmessage\\n            $message=\\\"tm-download-file\\\"\\n            $param=\\\"$:/core/templates/tiddlywiki5.js\\\"\\n            filename=`tiddlywikicore-$(version)$.js`\\n            type=\\\"application/javascript\\\"\\n          />\\n      \u003C/$let>\\n      \u003C%endif%>\\n      \u003C\u003Cupdate-version>>\\n\\\\end\\n\\n\\\\procedure refresh-page()\\n  \u003C$action-sendmessage $message=\\\"tm-browser-refresh\\\"/>\\n\\\\end\\n\\n\u003C$tiddler tiddler=\\\"$:/temp/store-tw-versions-data\\\">\\n\u003C$button actions=\u003C\u003Cget-tw-versions>> >{{$:/core/images/refresh-button}} Check for updates\u003C/$button>\\n\\n\u003Cp>\u003C$checkbox field=\\\"enable-prerelease\\\" checked=\\\"true\\\"> enable prerelease\u003C/$checkbox>\u003C/p>\\n\\n\u003C%if [is.pending[]] %>\\n\u003Cp>Loading..\u003C/p>\\n\u003C%elseif [\u003Ctw.versions>is[blank]] %>\\n\u003C%elseif [\u003Ctarget.version>match\u003Cversion>] %>\\n\\n\u003Cp>Tiddlywiki  v\u003C\u003Cversion>> is the latest version\u003C/p>\\n\\n\u003C%else%>\\n\\n\u003C$checkbox field=\\\"enable-backup\\\" default=\\\"true\\\" checked=\\\"true\\\" unchecked=\\\"false\\\"> Perform a backup before upgrading\u003C/$checkbox>\\n\\n\u003C$button actions=\u003C\u003Cconfirm-version-change>> class=\\\"tc-btn-invisible tc-install-plugin tc-reinstall-upgrade\\\">\\n    {{$:/core/images/download-button}} Upgrade from v\u003C\u003Cversion>> → v\u003C\u003Ctarget.version>>\\n\u003C/$button>\\n\\n\u003Cp>\\nPlease \u003C$button actions=\u003C\u003Crefresh-page>> >reload the page\u003C/$button> once the upgrade is complete.\\n\u003C/p>\\n\u003C%endif%>\\n\\n\u003Chr>\\n\\nBase path for the \u003Ca href=\u003C\u003CcoreURL>> >core\u003C/a>: \u003C$edit tiddler=\\\"$:/config/coreURL\\\" field=\\\"base-path\\\" default=\u003C\u003CdefaultBasePath>> placeholder=\u003C\u003CdefaultBasePath>>/>\\n\\n\u003C$button actions=\u003C\u003Cupdate-version>>>update\u003C/$button>\\n\\n\u003Caside>Official base path: `https://tiddlywiki.com/prerelease/`\u003C/aside>\\n\\n\u003C/$tiddler>\",\"tags\":\"$:/tags/MoreSideBar $:/tags/Global\",\"caption\":\"Upgrader\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme upgrader","version":"0.0.11","description":"quickly upgrade a tiddlyhost wiki with external core","plugin-type":"plugin","stability":"STAB {"title":"$:/themes/tiddlywiki/snowwhite","name":"Snow White","author":"JeremyRuston","core-version":">=5.0.0","plugin-type":"theme","description":"Emphasises individual tiddlers","dependents":"$:/themes/tiddlywiki/vanilla","plugin-priority":"0","version":"5.5.0-prerelease","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/tiddlywiki/snowwhite/base\":{\"title\":\"$:/themes/tiddlywiki/snowwhite/base\",\"tags\":\"[[$:/tags/Stylesheet]]\",\"text\":\"\\\\define sidebarbreakpoint-minus-one()\\n\u003C$text text={{{ [{$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint}removesuffix[px]subtract[1]addsuffix[px]] ~[{$:/themes/tiddlywiki/vanilla/metrics/sidebarbreakpoint}] }}}/>\\n\\\\end\\n\\n\\\\rules only filteredtranscludeinline transcludeinline macrodef macrocallinline\\n\\n.tc-sidebar-header {\\n\\ttext-shadow: 0 1px 0 \u003C\u003Ccolour sidebar-foreground-shadow>>;\\n}\\n\\n.tc-tiddler-info {\\n\\tbox-shadow: inset 1px 2px 3px rgba(0,0,0,0.1);\\n}\\n\\n@media screen {\\n\\t.tc-tiddler-frame {\\n\\t\\tbox-shadow: 1px 1px 5px rgba(0, 0, 0, 0.3);\\n\\t}\\n}\\n\\n@media (max-width: \u003C\u003Csidebarbreakpoint-minus-one>>) {\\n\\t.tc-tiddler-frame {\\n\\t\\tbox-shadow: none;\\n\\t}\\n}\\n\\n.tc-page-controls button svg, .tc-tiddler-controls button svg, .tc-topbar button svg {\\n\\ttransition: fill 150ms ease-in-out;\\n}\\n\\n.tc-tiddler-controls button.tc-selected,\\n.tc-page-controls button.tc-selected {\\n\\tfilter: drop-shadow(0px -1px 2px rgba(0,0,0,0.25));\\n}\\n\\n.tc-tiddler-frame input.tc-edit-texteditor,\\n.tc-tiddler-frame select.tc-edit-texteditor {\\n\\tbox-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.15);\\n}\\n\\n.tc-edit-tags {\\n\\tbox-shadow: inset 0 1px 8px rgba(0, 0, 0, 0.15);\\n}\\n\\n.tc-tiddler-frame .tc-edit-tags input.tc-edit-texteditor {\\n\\tbox-shadow: none;\\n\\tborder: none;\\n\\toutline: none;\\n}\\n\\ntextarea.tc-edit-texteditor {\\n\\tfont-family: {{$:/themes/tiddlywiki/vanilla/settings/editorfontfamily}};\\n}\\n\\ncanvas.tc-edit-bitmapeditor  {\\n\\tbox-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-drop-down {\\n\\tborder-radius: 4px;\\n\\tbox-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-block-dropdown {\\n\\tborder-radius: 4px;\\n\\tbox-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);\\n}\\n\\n.tc-modal {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.3);\\n}\\n\\n.tc-modal-footer {\\n\\tborder-radius: 0 0 6px 6px;\\n\\tbox-shadow: inset 0 1px 0 #fff;\\n}\\n\\n\\n.tc-alert {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.6);\\n}\\n\\n.tc-notification {\\n\\tborder-radius: 6px;\\n\\tbox-shadow: 0 3px 7px rgba(0,0,0,0.3);\\n\\ttext-shadow: 0 1px 0 rgba(255,255,255, 0.8);\\n}\\n\\n.tc-sidebar-lists .tc-tab-set .tc-tab-divider {\\n\\tborder-top: none;\\n\\theight: 1px;\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 100%); \\n}\\n\\n/* HACK: :dir should be used here. html[dir=\\\"rtl\\\"] rules are used to support browsers released before 2023 */\\n\\nhtml[dir=\\\"rtl\\\"] .tc-sidebar-lists .tc-tab-set .tc-tab-divider {\\n\\tbackground-image: linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.0) 100%);\\n}\\n\\n.tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button {\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.01) 0%, rgba(0,0,0,0.1) 100%);\\n}\\n\\n.tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button.tc-tab-selected {\\n\\tbackground-image: linear-gradient(to right, rgba(0,0,0,0.05) 0%, rgba(255,255,255,0.05) 100%);\\n}\\n\\nhtml[dir=\\\"rtl\\\"] .tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button {\\n    background-image: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.01) 100%);\\n}\\n\\nhtml[dir=\\\"rtl\\\"] .tc-more-sidebar > .tc-tab-set > .tc-tab-buttons > button.tc-tab-selected {\\n    background-image: linear-gradient(to right, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.05) 100%)\\n}\\n\\n.tc-message-box img {\\n\\tbox-shadow: 1px 1px 3px rgba(0,0,0,0.5);\\n}\\n\\n.tc-plugin-info {\\n\\tbox-shadow: 1px 1px 3px rgba(0,0,0,0.5)\\n}\\n\"}}}"},
{"title":"$:/themes/tiddlywiki/vanilla","name":"Vanilla","author":"JeremyRuston","core-version":">=5.0.0","plugin-type":"theme","description":"Basic theme","plugin-priority":"0","version":"5.5.0-prerelease","dependents":"","type":"application/json","text":"{\"tiddlers\":{\"$:/themes/tiddlywiki/vanilla/themetweaks\":{\"title\":\"$:/themes/tiddlywiki/vanilla/themetweaks\",\"tags\":\"$:/tags/ControlPanel/Appearance\",\"caption\":\"{{$:/language/ThemeTweaks/ThemeTweaks}}\",\"text\":\"\\\\define lingo-base() $:/language/ThemeTweaks/\\n\\n\\\\define replacement-text()\\n[img[$(imageTitle)$]]\\n\\\\end\\n\\n\\\\define backgroundimage-dropdown()\\n\u003Cdiv class=\\\"tc-drop-down-wrapper\\\">\\n\u003C$set name=\\\"state\\\" value=\u003C\u003Cqualify \\\"$:/state/popup/themetweaks/backgroundimage\\\">>>\\n\u003C$button popup=\u003C\u003Cstate>> class=\\\"tc-btn-invisible tc-btn-dropdown\\\">{{$:/core/images/down-arrow}}\u003C/$button>\\n\u003C$reveal state=\u003C\u003Cstate>> type=\\\"popup\\\" position=\\\"belowleft\\\" text=\\\"\\\" default=\\\"\\\" class=\\\"tc-popup-keep\\\">\\n\u003Cdiv class=\\\"tc-drop-down\\\" style=\\\"text-align:center;\\\">\\n\u003C$macrocall $name=\\\"image-picker\\\" actions=\\\"\\\"\\\"\\n\\n\u003C$action-setfield\\n\\t$tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\"\\n\\t$value=\u003C\u003CimageTitle>>\\n/>\\n\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cstate>>/>\\n\\n\\\"\\\"\\\"/>\\n\u003C/div>\\n\u003C/$reveal>\\n\u003C/$set>\\n\u003C/div>\\n\\\\end\\n\\n\\\\define backgroundimageattachment-dropdown()\\n\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\\\" default=\\\"scroll\\\">\\n\u003Coption value=\\\"scroll\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Scroll>>\u003C/option>\\n\u003Coption value=\\\"fixed\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment/Fixed>>\u003C/option>\\n\u003C/$select>\\n\\\\end\\n\\n\\\\define backgroundimagesize-dropdown()\\n\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\\\" default=\\\"scroll\\\">\\n\u003Coption value=\\\"auto\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Auto>>\u003C/option>\\n\u003Coption value=\\\"cover\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Cover>>\u003C/option>\\n\u003Coption value=\\\"contain\\\">\u003C\u003Clingo Settings/BackgroundImageSize/Contain>>\u003C/option>\\n\u003C/$select>\\n\\\\end\\n\\n\u003C\u003Clingo ThemeTweaks/Hint>>\\n\\n! \u003C\u003Clingo Options>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/sidebarlayout\\\">\u003C\u003Clingo Options/SidebarLayout>>\u003C/$link> |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/sidebarlayout\\\">\u003Coption value=\\\"fixed-fluid\\\">\u003C\u003Clingo Options/SidebarLayout/Fixed-Fluid>>\u003C/option>\u003Coption value=\\\"fluid-fixed\\\">\u003C\u003Clingo Options/SidebarLayout/Fluid-Fixed>>\u003C/option>\u003C/$select> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/stickytitles\\\">\u003C\u003Clingo Options/StickyTitles>>\u003C/$link>\u003Cbr>//\u003C\u003Clingo Options/StickyTitles/Hint>>// |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/stickytitles\\\">\u003Coption value=\\\"no\\\">{{$:/language/No}}\u003C/option>\u003Coption value=\\\"yes\\\">{{$:/language/Yes}}\u003C/option>\u003C/$select> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/options/codewrapping\\\">\u003C\u003Clingo Options/CodeWrapping>>\u003C/$link> |\u003C$select tiddler=\\\"$:/themes/tiddlywiki/vanilla/options/codewrapping\\\">\u003Coption value=\\\"pre\\\">{{$:/language/No}}\u003C/option>\u003Coption value=\\\"pre-wrap\\\">{{$:/language/Yes}}\u003C/option>\u003C/$select> |\\n\\n! \u003C\u003Clingo Settings>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\\\">\u003C\u003Clingo Settings/FontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/fontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\\\">\u003C\u003Clingo Settings/CodeFontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/codefontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/editorfontfamily\\\">\u003C\u003Clingo Settings/EditorFontFamily>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/editorfontfamily\\\" default=\\\"\\\" tag=\\\"input\\\"/> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\">\u003C\u003Clingo Settings/BackgroundImage>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimage\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\u003C\u003Cbackgroundimage-dropdown>> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimageattachment\\\">\u003C\u003Clingo Settings/BackgroundImageAttachment>>\u003C/$link> |\u003C\u003Cbackgroundimageattachment-dropdown>> | |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/settings/backgroundimagesize\\\">\u003C\u003Clingo Settings/BackgroundImageSize>>\u003C/$link> |\u003C\u003Cbackgroundimagesize-dropdown>> | |\\n\\n! \u003C\u003Clingo Metrics>>\\n\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/fontsize\\\">\u003C\u003Clingo Metrics/FontSize>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/fontsize\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/lineheight\\\">\u003C\u003Clingo Metrics/LineHeight>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vanilla/metrics/lineheight\\\" default=\\\"\\\" tag=\\\"input\\\"/> |\\n|\u003C$link to=\\\"$:/themes/tiddlywiki/vanilla/metrics/bodyfontsize\\\">\u003C\u003Clingo Metrics/BodyFontSize>>\u003C/$link> |\u003C$edit-text tiddler=\\\"$:/themes/tiddlywiki/vani

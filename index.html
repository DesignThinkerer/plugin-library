r, fromTitle, toTitle, options) {\\n\\tvar changed = undefined, impossible = undefined;\\n\\tfor (var attributeName in element.attributes) {\\n\\t\\tvar attr = element.attributes[attributeName];\\n\\t\\tvar nextEql = parser.source.indexOf('=', attr.start);\\n\\t\\t// This is the rare case of changing tiddler\\n\\t\\t// \\\"true\\\" to something else when \\\"true\\\" is\\n\\t\\t// implicit, like \u003C$link to /> We ignore those.\\n\\t\\tif (nextEql \u003C 0 || nextEql > attr.end) {\\n\\t\\t\\tattr.valueless = true;\\n\\t\\t\\tcontinue;\\n\\t\\t}\\n\\t\\tvar entry = undefined;\\n\\t\\tvar typeHandler = attrTypeOperators[attr.type];\\n\\t\\tif (typeHandler) {\\n\\t\\t\\tentry = typeHandler.relink(element, attr, attributeOperators, parser.source, fromTitle, toTitle, options);\\n\\t\\t\\tif (entry && entry.output) {\\n\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t}\\n\\t\\t\\tif (entry && entry.impossible) {\\n\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\tif (changed || impossible) {\\n\\t\\treturn {output: changed, impossible: impossible};\\n\\t}\\n};\\n\",\"module-type\":\"relinkhtml\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/importvariables.js\":{\"text\":\"/*\\\\\\n\\nHandles state updating required for $importvariables widgets\\n\\n\\\\*/\\n\\nvar relinkUtils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar ImportContext = relinkUtils.getContext('import');\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\n\\nexports.name = \\\"importvariables\\\";\\n\\nexports.report = function(element, parser, callback, options) {\\n\\tif (element.tag === \\\"$importvariables\\\") {\\n\\t\\tprocessImport(element, parser, options);\\n\\t}\\n};\\n\\nexports.relink = function(element, parser, fromTitle, toTitle, options) {\\n\\tif (element.tag === \\\"$importvariables\\\") {\\n\\t\\tprocessImport(element, parser, options);\\n\\t}\\n};\\n\\nfunction processImport(element, parser, options) {\\n\\tvar importFilterAttr = element.attributes.filter;\\n\\tif (importFilterAttr) {\\n\\t\\tprocessImportFilter(parser, importFilterAttr, options);\\n\\t}\\n};\\n\\n// This processes a \u003C$importvariables> filter attribute and adds any new\\n// variables to our parser.\\nfunction processImportFilter(parser, importAttribute, options) {\\n\\tif (typeof importAttribute === \\\"string\\\") {\\n\\t\\t// It was changed. Reparse it. It'll be a quoted\\n\\t\\t// attribute value. Add a dummy attribute name.\\n\\t\\timportAttribute = $tw.utils.parseAttribute(\\\"p=\\\"+importAttribute, 0)\\n\\t}\\n\\tvar context = parser.context;\\n\\tvar importFilter = computeAttribute(context, importAttribute, options);\\n\\tparser.context = new ImportContext(options.wiki, context, importFilter);\\n};\\n\\nfunction computeAttribute(context, attribute, options) {\\n\\tvar typeHandler = attrTypeOperators[attribute.type];\\n\\tif (typeHandler) {\\n\\t\\treturn typeHandler.compute(attribute, context, options);\\n\\t}\\n\\treturn undefined;\\n};\\n\",\"module-type\":\"relinkhtml\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/importvariables.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/parameters.js\":{\"text\":\"/*\\\\\\n\\nHandles replacement in $macrocall widgets\\n\\n\\\\*/\\n\\nexports.name = \\\"parameters\\\";\\n\\nexports.report = function(element, parser, callback, options) {\\n\\tif (element.tag === \\\"$parameters\\\") {\\n\\t\\tprocessParameters(element, parser, options);\\n\\t}\\n};\\n\\nexports.relink = function(element, parser, fromTitle, toTitle, options) {\\n\\tif (element.tag === \\\"$parameters\\\") {\\n\\t\\tprocessParameters(element, parser, options);\\n\\t}\\n};\\n\\nfunction processParameters(element, parser, options) {\\n\\tvar attributes = element.orderedAttributes;\\n\\tvar index = 0;\\n\\tfor (var i = 0; i \u003C attributes.length; i++) {\\n\\t\\tvar attribute = attributes[i].name;\\n\\t\\tif (attribute[0] == '$') {\\n\\t\\t\\tif (attribute[1] == '$') {\\n\\t\\t\\t\\tattribute = attribute.substr(1);\\n\\t\\t\\t} else {\\n\\t\\t\\t\\tcontinue;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tparser.context.addParameter(attribute);\\n\\t\\t++index;\\n\\t}\\n};\\n\",\"module-type\":\"relinkhtml\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/parameters.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/fields.js\":{\"text\":\"/*\\\\ \\nHandles replacement in widgets which allow arbitrary attributes that\\ncorrespond to tiddler fields.\\n\\n\\\\*/\\n\\nexports.name = \\\"fields\\\";\\n\\nexports.getHandler = function(element, attribute, options) {\\n\\tvar regexp = options.settings.getConfig(\\\"fieldattributes\\\")[element.tag];\\n\\tif (regexp) {\\n\\t\\tvar results = regexp.exec(attribute.name);\\n\\t\\tif (results && results[0] === attribute.name) {\\n\\t\\t\\treturn options.settings.getFields()[results[1]];\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkhtmlattributes\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/fields.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/macrocall.js\":{\"text\":\"/*\\\\\\n\\nHandles replacement in $macrocall widgets\\n\\n\\\\*/\\n\\nexports.name = \\\"macrocall\\\";\\n\\nexports.getHandler = function(element, attribute, options) {\\n\\tif (element.tag === \\\"$macrocall\\\") {\\n\\t\\tvar nameAttr = element.attributes[\\\"$name\\\"];\\n\\t\\tif (nameAttr) {\\n\\t\\t\\tvar setting = options.settings.getMacro(nameAttr.value);\\n\\t\\t\\treturn setting && setting[attribute.name];\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.formBlurb = function(element, attribute, blurb, options) {\\n\\tvar nameAttr = element.attributes[\\\"$name\\\"];\\n\\tvar newBlurb = '\u003C' + nameAttr.value + ' ' + attribute.name;\\n\\tif (blurb) {\\n\\t\\tnewBlurb += '=' + blurb;\\n\\t}\\n\\treturn newBlurb;\\n};\\n\",\"module-type\":\"relinkhtmlattributes\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/macrocall.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/sendmessage.js\":{\"text\":\"/*\\\\ \\nHandles replacement in $action-sendmessage widgets\\n\\n\\\\*/\\n\\nexports.name = \\\"sendmessage\\\";\\n\\nexports.getHandler = function(element, attribute, options) {\\n\\tif (element.tag === \\\"$action-sendmessage\\\"\\n\\t&& attribute.name[0] !== \\\"$\\\") {\\n\\t\\tvar messageAttr = element.attributes['$message'];\\n\\t\\tif (messageAttr) {\\n\\t\\t\\tvar regexp = options.settings.getConfig(\\\"messages\\\")[messageAttr.value];\\n\\t\\t\\tif (regexp) {\\n\\t\\t\\t\\tvar results = regexp.exec(attribute.name);\\n\\t\\t\\t\\tif (results && results[0] === attribute.name) {\\n\\t\\t\\t\\t\\treturn options.settings.getFields()[results[1]];\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.formBlurb = function(element, attribute, blurb, options) {\\n\\tvar messageAttr = element.attributes['$message'];\\n\\tvar newBlurb = '$action-sendmessage ' + messageAttr.value + ' ' + attribute.name;\\n\\tif (blurb) {\\n\\t\\tnewBlurb += '=' + blurb;\\n\\t}\\n\\treturn newBlurb;\\n};\\n\",\"module-type\":\"relinkhtmlattributes\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/sendmessage.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/transclude.js\":{\"text\":\"/*\\\\\\n\\nHandles replacement in $transclude widgets\\n\\n\\\\*/\\n\\nexports.name = \\\"transclude\\\";\\n\\nexports.getHandler = function(element, attribute, options) {\\n\\tif (element.tag === \\\"$transclude\\\") {\\n\\t\\tvar name = attribute.name;\\n\\t\\tif (name[0] === '$') {\\n\\t\\t\\tif (name[1] === '$') {\\n\\t\\t\\t\\tname = name.substr(1);\\n\\t\\t\\t} else {\\n\\t\\t\\t\\t// This is a reserved attribute\\n\\t\\t\\t\\treturn;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tvar nameAttr = element.attributes[\\\"$variable\\\"];\\n\\t\\tif (nameAttr) {\\n\\t\\t\\tvar setting = options.settings.getMacro(nameAttr.oldValue || nameAttr.value);\\n\\t\\t\\treturn setting && setting[name];\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.formBlurb = function(element, attribute, blurb, options) {\\n\\tvar nameAttr = element.attributes[\\\"$variable\\\"];\\n\\tvar name = attribute.name;\\n\\tif (name[0] === '$') {\\n\\t\\tname = name.substr(1);\\n\\t}\\n\\tvar newBlurb = '\u003C' + nameAttr.value + ' ' + name;\\n\\tif (blurb) {\\n\\t\\tnewBlurb += '=' + blurb;\\n\\t}\\n\\treturn newBlurb;\\n};\\n\",\"module-type\":\"relinkhtmlattributes\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/transclude.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/whitelist.js\":{\"text\":\"/*\\\\ \\n\\nHandles replacement of widget attributes that are specified in the whitelist.\\n\\n\\\\*/\\n\\nexports.name = \\\"whitelist\\\";\\n\\nexports.getHandler = function(element, attribute, options) {\\n\\tvar setting = options.settings.getAttribute(element.tag);\\n\\treturn setting && setting[attribute.name];\\n};\\n\",\"module-type\":\"relinkhtmlattributes\",\"title\":\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/html/attributes/whitelist.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/context.js\":{\"text\":\"/*\\\\\\n\\nBase class for relink contexts.\\n\\n\\\\*/\\n\\nfunction Context() {\\n};\\n\\nexports.context = Context;\\n\\n// This class does no special handling of fields, operators, or attributes.\\n// we pass it along to the parent.\\nContext.prototype.getFields = function() {\\n\\treturn this.parent.getFields();\\n};\\n\\nContext.prototype.getOperator = function(name, index) {\\n\\treturn this.parent.getOperator(name, index);\\n};\\n\\nContext.prototype.getOperators = function() {\\n\\treturn this.parent.getOperators();\\n};\\n\\nContext.prototype.getAttribute = function(elementName) {\\n\\treturn this.parent.getAttribute(elementName);\\n};\\n\\nContext.prototype.getAttributes = function() {\\n\\treturn this.parent.getAttributes();\\n};\\n\\nContext.prototype.getConfig = function(category) {\\n\\treturn this.parent.getConfig(category);\\n};\\n\\nContext.prototype.getMacro = function(macroName) {\\n\\treturn this.parent.getMacro(macroName);\\n};\\n\\nContext.prototype.getMacros = function() {\\n\\treturn this.parent.getMacros();\\n};\\n\\n/* Exceptions are tiddlers that have text/vnd.tiddlywiki type, but should\\n * not be treated as such.\\n */\\nContext.prototype.getException = function(tiddlerTitle) {\\n\\treturn this.parent.getException(tiddlerTitle);\\n};\\n\\nContext.prototype.allowPrettylinks = function() {\\n\\treturn this.parent.allowPrettylinks();\\n};\\n\\nContext.prototype.allowWidgets = function() {\\n\\treturn this.parent.allowWidgets();\\n};\\n\\nContext.prototype.hasImports = function(value) {\\n\\treturn this.parent.hasImports(value);\\n};\\n\\nContext.prototype.getFocus = function() {\\n\\tif (this.parent) {\\n\\t\\treturn this.parent.getFocus();\\n\\t}\\n};\\n\\nContext.prototype.getPlaceholderList = function() {\\n\\tif (this.parent) {\\n\\t\\treturn this.parent.getPlaceholderList();\\n\\t}\\n\\treturn null;\\n};\\n\\nContext.prototype.addParameter = function(parameter) {\\n\\tif(this.parent) {\\n\\t\\treturn this.parent.addParameter(parameter);\\n\\t}\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/context.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/import.js\":{\"text\":\"/*\\\\\\n\\nThis handles the fetching and distribution of relink settings.\\n\\n\\\\*/\\n\\nvar WidgetContext = require('./widget').widget;\\n\\nfunction ImportContext(wiki, parent, filter) {\\n\\tthis.parent = parent;\\n\\tthis.wiki = wiki;\\n\\tvar importWidget = createImportWidget(filter, this.wiki, this.parent.widget);\\n\\tthis._compileList(importWidget.tiddlerList, importWidget.variables);\\n\\t// this.widget is where we ask for macro definitions.\\n\\t// This only works if only one filter is imported\\n\\tthis.widget = this.getBottom(importWidget);\\n\\t// We keep this one because it's where we need to test for changes from.\\n\\tthis.importWidget = importWidget\\n\\t// Trickle this up, so that any containing tiddlercontext knows that this\\n\\t// tiddler does some importing, and must be checked regularly.\\n\\tparent.hasImports(true);\\n};\\n\\nexports.import = ImportContext;\\n\\nImportContext.prototype = new WidgetContext();\\n\\nImportContext.prototype.changed = function(changes) {\\n\\treturn this.importWidget && this.importWidget.refresh(changes)\\n};\\n\\nfunction createImportWidget(filter, wiki, parent) {\\n\\tvar widget = wiki.makeWidget( { tree: [{\\n\\t\\ttype: \\\"importvariables\\\",\\n\\t\\tattributes: {\\n\\t\\t\\t\\\"filter\\\": {\\n\\t\\t\\t\\ttype: \\\"string\\\",\\n\\t\\t\\t\\tvalue: filter\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}] }, { parentWidget: parent} );\\n\\tif (parent) {\\n\\t\\tparent.children.push(widget);\\n\\t}\\n\\twidget.execute();\\n\\twidget.renderChildren();\\n\\tvar importWidget = widget.children[0];\\n\\treturn importWidget;\\n};\\n\\nImportContext.prototype._compileList = function(titleList, variables) {\\n\\tfor (var i = 0; i \u003C titleList.length; i++) {\\n\\t\\tvar parser = this.wiki.parseTiddler(titleList[i]);\\n\\t\\tif (parser) {\\n\\t\\t\\tvar parseTreeNode = parser.tree[0];\\n\\t\\t\\twhile (parseTreeNode && parseTreeNode.type === \\\"set\\\") {\\n\\t\\t\\t\\tvar variable = variables[parseTreeNode.attributes.name.value];\\n\\t\\t\\t\\tif(variable) {\\n\\t\\t\\t\\t\\tvariable.tiddler = titleList[i];\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (parseTreeNode.relink) {\\n\\t\\t\\t\\t\\tfor (var macroName in parseTreeNode.relink) {\\n\\t\\t\\t\\t\\t\\tvar parameters = parseTreeNode.relink[macroName];\\n\\t\\t\\t\\t\\t\\tfor (var paramName in parameters) {\\n\\t\\t\\t\\t\\t\\t\\tthis.addSetting(this.wiki, macroName, paramName, parameters[paramName], titleList[i]);\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tparseTreeNode = parseTreeNode.children && parseTreeNode.children[0];\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/import.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/tiddler.js\":{\"text\":\"/*\\\\\\n\\nContext for a tiddler. Defines nothing but makes an entry point to test if\\na tiddler must be refreshed.\\n\\n\\\\*/\\n\\nvar WidgetContext = require('./widget.js').widget;\\n\\nfunction TiddlerContext(wiki, parentContext, title) {\\n\\tthis.title = title;\\n\\tthis.parent = parentContext;\\n\\tvar globalWidget = parentContext && parentContext.widget;\\n\\tvar parentWidget = wiki.makeWidget(null, {parentWidget: globalWidget});\\n\\tparentWidget.setVariable('currentTiddler', title);\\n\\tthis.widget = wiki.makeWidget(null, {parentWidget: parentWidget});\\n};\\n\\nexports.tiddler = TiddlerContext;\\n\\nTiddlerContext.prototype = new WidgetContext();\\n\\nTiddlerContext.prototype.getFocus = function() {\\n\\t// Tiddler Contexts are the last possible focus when not embedded in contexts.\\n\\treturn this;\\n};\\n\\nTiddlerContext.prototype.changed = function(changes) {\\n\\treturn this.widget && this.widget.refresh(changes);\\n};\\n\\n// By default, a tiddler context does not use imports, unless an import\\n// statement is later discovered somewhere in the fields.\\nTiddlerContext.prototype.hasImports = function(value) {\\n\\treturn this._hasImports || (this._hasImports = value);\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/tiddler.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/variable.js\":{\"text\":\"/*\\\\\\n\\nThis handles the context for variables. Either from $set, $vars, or \\\\define\\n\\n\\\\*/\\n\\nvar WidgetContext = require('./widget').widget;\\n\\nfunction VariableContext(parent, setParseTreeNode) {\\n\\tvar name = setParseTreeNode.attributes.name.value;\\n\\tthis.parent = parent;\\n\\t// Now create a new widget and attach it.\\n\\tvar attachPoint = parent.widget;\\n\\tthis.setWidget = attachPoint.makeChildWidget(setParseTreeNode);\\n\\tattachPoint.children.push(this.setWidget);\\n\\tthis.setWidget.computeAttributes();\\n\\tthis.setWidget.execute();\\n\\t// We get the title of our current parameter focus\\n\\t// (i.e. what \\\\param would affect)\\n\\t// If it's another definition, then title will be null.\\n\\tthis.setWidget.variables[name].tiddler = parent.getFocus().title;\\n\\t// point our widget to bottom, where any other contexts would attach to\\n\\tthis.widget = this.getBottom(this.setWidget);\\n\\tthis.parameterFocus = true;\\n\\tif (setParseTreeNode.isMacroDefinition) {\\n\\t\\tthis.placeholderList = Object.create(parent.getPlaceholderList());\\n\\t\\tfor (var i = 0; i \u003C setParseTreeNode.params.length; i++) {\\n\\t\\t\\tthis.placeholderList[setParseTreeNode.params[i].name] = true;\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.variable = VariableContext;\\n\\nVariableContext.prototype = new WidgetContext();\\n\\nVariableContext.prototype.getFocus = function() {\\n\\tif(this.parameterFocus) {\\n\\t\\treturn this;\\n\\t} else {\\n\\t\\treturn this.parent.getFocus();\\n\\t}\\n};\\n\\nVariableContext.prototype.getPlaceholderList = function() {\\n\\tif (this.placeholderList !== undefined) {\\n\\t\\treturn this.placeholderList;\\n\\t} else {\\n\\t\\treturn this.parent.getPlaceholderList();\\n\\t}\\n};\\n\\nVariableContext.prototype.addParameter = function(parameter) {\\n\\tif(this.parameterFocus) {\\n\\t\\tvar name = this.setWidget.setName;\\n\\t\\tvar data = this.setWidget.variables[name];\\n\\t\\tdata.params.push({name: parameter});\\n\\t} else if (this.parent) {\\n\\t\\tthis.parent.addParameter(parameter);\\n\\t}\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/variable.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/whitelist.js\":{\"text\":\"/*\\\\\\n\\nThis top-level context manages settings inside the whitelist. It never has\\na parent.\\n\\n\\\\*/\\n\\nvar utils = require('../utils');\\nvar Context = require('./context').context;\\n\\nvar prefix = \\\"$:/config/flibbles/relink/\\\";\\n\\n/**Factories define methods that create settings given config tiddlers.\\n * for factory method 'example', it will be called once for each:\\n * \\\"$:/config/flibbles/relink/example/...\\\" tiddler that exists.\\n * the argument \\\"key\\\" will be set to the contents of \\\"...\\\"\\n *\\n * The reason I build relink settings in this convoluted way is to minimize\\n * the number of times tiddlywiki has to run through EVERY tiddler looking\\n * for relink config tiddlers.\\n */\\nvar settingsGenerators = utils.getModulesByTypeAsHashmap('relinksetting', 'name');\\n\\nfunction WhitelistContext(wiki) {\\n\\tbuild(this, wiki);\\n};\\n\\nexports.whitelist = WhitelistContext;\\n\\nWhitelistContext.prototype = new Context();\\n\\n/**Hot directories are directories for which if anything changes inside them,\\n * then Relink must completely rebuild its index.\\n * By default, this includes the whitelist settings, but relink-titles also\\n * includes its rules disabling directory.\\n * This is the FIRST solution I came up with to this problem. If you're\\n * looking at this, please make a github issue so I have a chance to understand\\n * your needs. This is currently a HACK solution.\\n */\\nWhitelistContext.hotDirectories = [prefix];\\n\\nWhitelistContext.prototype.getAttribute = function(elementName) {\\n\\treturn this.attributes[elementName];\\n};\\n\\nWhitelistContext.prototype.getAttributes = function() {\\n\\treturn flatten(this.attributes);\\n};\\n\\nWhitelistContext.prototype.getFields = function() {\\n\\treturn this.fields;\\n};\\n\\nWhitelistContext.prototype.getConfig = function(category) {\\n\\treturn this[category];\\n};\\n\\nWhitelistContext.prototype.getOperator = function(operatorName, operandIndex) {\\n\\tvar op = this.operators[operatorName];\\n\\treturn op && op[operandIndex || 1];\\n};\\n\\nWhitelistContext.prototype.getOperators = function() {\\n\\tvar signatures = Object.create(null);\\n\\tfor (var op in this.operators) {\\n\\t\\tvar operandSet = this.operators[op];\\n\\t\\tfor (var index in operandSet) {\\n\\t\\t\\tvar entry = operandSet[index];\\n\\t\\t\\tsignatures[entry.key] = entry;\\n\\t\\t}\\n\\t}\\n\\treturn signatures;\\n};\\n\\nWhitelistContext.prototype.getMacro = function(macroName) {\\n\\treturn this.macros[macroName];\\n};\\n\\nWhitelistContext.prototype.getMacros = function() {\\n\\treturn flatten(this.macros);\\n};\\n\\nWhitelistContext.prototype.getException = function(tiddlerTitle) {\\n\\treturn this.exceptions[tiddlerTitle];\\n};\\n\\nWhitelistContext.prototype.changed = function(changedTiddlers) {\\n\\tfor (var i = 0; i \u003C WhitelistContext.hotDirectories.length; i++) {\\n\\t\\tvar dir = WhitelistContext.hotDirectories[i];\\n\\t\\tfor (var title in changedTiddlers) {\\n\\t\\t\\tif (utils.startsWith(title, dir)) {\\n\\t\\t\\t\\treturn true;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn false;\\n};\\n\\nWhitelistContext.prototype.hasImports = function(value) {\\n\\t// We don't care if imports are used. This is the global level.\\n\\treturn false;\\n};\\n\\nfunction build(settings, wiki) {\\n\\tfor (var name in settingsGenerators) {\\n\\t\\tsettings[name] = Object.create(null);\\n\\t}\\n\\twiki.eachShadowPlusTiddlers(function(tiddler, title) {\\n\\t\\tif (utils.startsWith(title, prefix)) {\\n\\t\\t\\tvar remainder = title.substr(prefix.length);\\n\\t\\t\\tvar category = root(remainder);\\n\\t\\t\\tvar factory = settingsGenerators[category];\\n\\t\\t\\tif (factory) {\\n\\t\\t\\t\\tvar name = remainder.substr(category.length+1);\\n\\t\\t\\t\\tfactory.generate(settings[category], tiddler, name, wiki);\\n\\t\\t\\t}\\n\\t\\t}\\n\\t});\\n};\\n\\n/* Returns first bit of a path. path/to/tiddler -> path\\n */\\nfunction root(string) {\\n\\tvar index = string.indexOf('/');\\n\\tif (index >= 0) {\\n\\t\\treturn string.substr(0, index);\\n\\t}\\n};\\n\\n/* Turns {dir: {file1: 'value1', file2: 'value2'}}\\n * into {dir/file1: 'value1', dir/file2: 'value2'}\\n */\\nfunction flatten(set) {\\n\\tvar signatures = Object.create(null);\\n\\tfor (var outerName in set) {\\n\\t\\tvar setItem = set[outerName];\\n\\t\\tfor (var innerName in setItem) {\\n\\t\\t\\tsignatures[outerName + \\\"/\\\" + innerName] = setItem[innerName];\\n\\t\\t}\\n\\t}\\n\\treturn signatures;\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/whitelist.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/widget.js\":{\"text\":\"/*\\\\\\n\\nThis is a virtual subclass of context for contexts that exist within widgets\\nof a specific tiddler.\\n\\nAll widget contexts must have a widget member.\\n\\n\\\\*/\\n\\nvar Context = require('./context.js').context;\\nvar utils = require('$:/plugins/flibbles/relink/js/utils.js');\\n\\nfunction WidgetContext() {};\\n\\nexports.widget = WidgetContext;\\n\\nWidgetContext.prototype = new Context();\\n\\nWidgetContext.prototype.getMacroDefinition = function(variableName) {\\n\\t// widget.variables is prototyped, so it looks up into all its parents too\\n\\tvar def = this.widget.variables[variableName];\\n\\tif (!def) {\\n\\t\\t// It might be a javascript macro\\n\\t\\tdef = $tw.macros[variableName];\\n\\t\\tif (def && !def.tiddler) {\\n\\t\\t\\t// We haven't assigned associated tiddlers to these macros yet.\\n\\t\\t\\t// That may be important for some installed supplemental plugins.\\n\\t\\t\\t$tw.modules.forEachModuleOfType('macro', function(title, module) {\\n\\t\\t\\t\\tif (module.name) {\\n\\t\\t\\t\\t\\t// For now, we just attach it directly to the definition\\n\\t\\t\\t\\t\\t// It's easier, albeit a little sloppy.\\n\\t\\t\\t\\t\\t$tw.macros[module.name].tiddler = title;\\n\\t\\t\\t\\t}\\n\\t\\t\\t});\\n\\t\\t}\\n\\t}\\n\\treturn def;\\n};\\n\\nWidgetContext.prototype.addSetting = function(wiki, macroName, parameter, type, sourceTitle) {\\n\\tthis.macros = this.macros || Object.create(null);\\n\\tvar macro = this.macros[macroName];\\n\\ttype = type || utils.getDefaultType(wiki);\\n\\tif (macro === undefined) {\\n\\t\\tmacro = this.macros[macroName] = Object.create(null);\\n\\t}\\n\\tvar handler = utils.getType(type);\\n\\tif (handler) {\\n\\t\\thandler.source = sourceTitle;\\n\\t\\tmacro[parameter] = handler;\\n\\t}\\n};\\n\\nWidgetContext.prototype.getMacros = function() {\\n\\tvar signatures = this.parent.getMacros();\\n\\tif (this.macros) {\\n\\t\\tfor (var macroName in this.macros) {\\n\\t\\t\\tvar macro = this.macros[macroName];\\n\\t\\t\\tfor (var param in macro) {\\n\\t\\t\\t\\tsignatures[macroName + \\\"/\\\" + param] = macro[param];\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn signatures;\\n};\\n\\n/**This does strange handling because it's possible for a macro to have\\n * its individual parameters whitelisted in separate places.\\n * Don't know WHY someone would do this, but it can happen.\\n */\\nWidgetContext.prototype.getMacro = function(macroName) {\\n\\tvar theseSettings = this.macros && this.macros[macroName];\\n\\tvar parentSettings;\\n\\tif (this.parent) {\\n\\t\\tparentSettings = this.parent.getMacro(macroName);\\n\\t}\\n\\tif (theseSettings && parentSettings) {\\n\\t\\t// gotta merge them without changing either. This is expensive,\\n\\t\\t// but it'll happen rarely.\\n\\t\\tvar rtnSettings = $tw.utils.extend(Object.create(null), theseSettings, parentSettings);\\n\\t\\treturn rtnSettings;\\n\\t}\\n\\treturn theseSettings || parentSettings;\\n};\\n\\nWidgetContext.prototype.getAttribute = function(elementName) {\\n\\tif (elementName.charAt(0) == '$' && elementName.indexOf('.') >= 0) {\\n\\t\\t// This is potentially a \\\\widget, look in macros for it.\\n\\t\\tvar macroSettings = this.getMacro(elementName);\\n\\t\\tif (macroSettings) {\\n\\t\\t\\t// Make sure that it's actually a widget definition\\n\\t\\t\\tvar def = this.getMacroDefinition(elementName);\\n\\t\\t\\tif (def) {\\n\\t\\t\\t\\t// We found a definition, but if it's not a widget, abort all.\\n\\t\\t\\t\\treturn (def.isWidgetDefinition)? macroSettings: undefined;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn this.parent.getAttribute(elementName);\\n};\\n\\nWidgetContext.prototype.getOperator = function(name, index) {\\n\\tif (name.indexOf('.') >= 0) {\\n\\t\\t// This is potentially a \\\\function, look in macros for it.\\n\\t\\tvar macroSettings = this.getMacro(name);\\n\\t\\tif (macroSettings) {\\n\\t\\t\\t//Make sure that it's actually a macro definition\\n\\t\\t\\tvar def = this.getMacroDefinition(name);\\n\\t\\t\\tif (def) {\\n\\t\\t\\t\\tif (def.isFunctionDefinition) {\\n\\t\\t\\t\\t\\t// Minus one because operator indices are 1 indexed,\\n\\t\\t\\t\\t\\t// but parameters as we store them are not.\\n\\t\\t\\t\\t\\tvar param = def.params[index - 1];\\n\\t\\t\\t\\t\\treturn param && macroSettings[param.name];\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\t// If it's not a filter, abort all.\\n\\t\\t\\t\\treturn undefined;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn this.parent.getOperator(name, index);\\n};\\n\\n/**Returns the deepest descendant of the given widget.\\n */\\nWidgetContext.prototype.getBottom = function(widget) {\\n\\twhile (widget.children.length > 0) {\\n\\t\\twidget = widget.children[0];\\n\\t}\\n\\treturn widget;\\n};\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/widget.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/contexts/wikitext.js\":{\"text\":\"/*\\\\\\n\\nContext for wikitext. It can contain rules about what's allowed in this\\ncurrent layer of wikitext.\\n\\n\\\\*/\\n\\nvar WidgetContext = require('./widget.js').widget;\\n\\nfunction WikitextContext(parentContext) {\\n\\tthis.parent = parentContext;\\n\\tthis.widget = parentContext.widget;\\n};\\n\\nexports.wikitext = WikitextContext;\\n\\nWikitextContext.prototype = new WidgetContext();\\n\\n// Unless this specific context has rules about it, widgets and prettyLInks are allowed.\\nWikitextContext.prototype.allowWidgets = enabled;\\nWikitextContext.prototype.allowPrettylinks = enabled;\\n\\nfunction enabled() { return true; };\\n\",\"module-type\":\"relinkcontext\",\"title\":\"$:/plugins/flibbles/relink/js/contexts/wikitext.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/backupIndexer.js\":{\"text\":\"/*\\\\\\nmodule-type: library\\n\\nThis is a backup indexer Relink uses if the real one is disabled, or we're\\n\u003CV5.1.23. It's not nearly as good, but it caches some.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar TiddlerContext = utils.getContext('tiddler');\\n\\n// This is the indexer we use if the current wiki doesn't support indexers.\\nfunction BackupIndexer(wiki) {\\n\\tthis.wiki = wiki;\\n};\\n\\nmodule.exports = BackupIndexer;\\n\\nBackupIndexer.prototype.lookup = function(title) {\\n\\treturn getCache(this.wiki).lookup[title];\\n};\\n\\nBackupIndexer.prototype.reverseLookup = function(title) {\\n\\tvar index = getCache(this.wiki);\\n\\tif (!index.reverse[title]) {\\n\\t\\tvar record = Object.create(null);\\n\\t\\tfor (var other in index.lookup) {\\n\\t\\t\\tif (index.lookup[other][title]) {\\n\\t\\t\\t\\trecord[other] = index.lookup[other][title];\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tindex.reverse[title] = record;\\n\\t}\\n\\treturn index.reverse[title];\\n};\\n\\n/* The backup indexer doesn't bother caching relink reports. It would always\\n * be called after a draft tiddler had changed, which would defeat the point.\\n */\\nBackupIndexer.prototype.relinkLookup = function(fromTitle, toTitle, options) {\\n\\tvar cache = getCache(this.wiki);\\n\\tif (cache.lastRelinkFrom === fromTitle && cache.lastRelinkTo === toTitle) {\\n\\t\\toptions.cache = cache.lastRelinkCache;\\n\\t\\treturn cache.lastRelink;\\n\\t}\\n\\tcache.lastRelink = utils.getRelinkResults(this.wiki, fromTitle, toTitle, cache.context, undefined, options);\\n\\tcache.lastRelinkFrom = fromTitle;\\n\\tcache.lastRelinkTo = toTitle;\\n\\tcache.lastRelinkCache = options.cache;\\n\\treturn cache.lastRelink;\\n};\\n\\nBackupIndexer.prototype.orphans = function() {\\n\\tvar index = getCache(this.wiki).lookup;\\n\\tvar results = [];\\n\\tfor (var title in index) {\\n\\t\\tvar found = false;\\n\\t\\tfor (var anything in this.reverseLookup(title)) {\\n\\t\\t\\tfound = true;\\n\\t\\t\\tbreak;\\n\\t\\t}\\n\\t\\tif (!found) {\\n\\t\\t\\tresults.push(title);\\n\\t\\t}\\n\\t}\\n\\treturn results;\\n};\\n\\nfunction getCache(wiki) {\\n\\treturn wiki.getGlobalCache('relink', function() {\\n\\t\\tvar tiddlerList = wiki.getRelinkableTitles();\\n\\t\\tvar index = Object.create(null);\\n\\t\\tvar wikiContext = utils.getWikiContext(wiki);\\n\\t\\tfor (var i = 0; i \u003C tiddlerList.length; i++) {\\n\\t\\t\\tvar title = tiddlerList[i];\\n\\t\\t\\tvar tiddler = wiki.getTiddler(title);\\n\\t\\t\\tif (tiddler && !tiddler.fields[\\\"plugin-type\\\"]) {\\n\\t\\t\\t\\tvar context = new TiddlerContext(wiki, wikiContext, title);\\n\\t\\t\\t\\tindex[title] = utils.getTiddlerRelinkReferences(wiki, title, context);\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\treturn {\\n\\t\\t\\tlookup: index,\\n\\t\\t\\treverse: Object.create(null),\\n\\t\\t\\tcontext: wikiContext};\\n\\t});\\n};\\n\",\"module-type\":\"library\",\"title\":\"$:/plugins/flibbles/relink/js/utils/backupIndexer.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/entry.js\":{\"text\":\"/*\\\\\\n\\nEntries are deprecated. Don't use them. These classes are here just so that\\nany 3rd party modules built for Relink V1 don't break.\\n\\nJust return an object like, {output: \\\"string\\\", impossible: true|undefined}\\n\\n\\\\*/\\n\\nfunction EntryNode() {\\n\\tthis.children = [];\\n};\\n\\nmodule.exports = EntryNode;\\n\\n/**  PURE VIRTUAL\\n * EntryNode.prototype.report = function() -> [\\\"string\\\", ...]\\n */\\n\\nEntryNode.newType = function() {\\n\\treturn EntryNode;\\n};\\n\\nEntryNode.prototype.add = function(entry) {\\n\\tthis.children.push(entry);\\n};\\n\\nfunction EntryCollection() {\\n\\tthis.children = Object.create(null);\\n\\tthis.types = Object.create(null);\\n};\\n\\nEntryNode.newCollection = function(name) {\\n\\treturn EntryCollection;\\n};\\n\\n// Again. I reiterate. Don't use this. All this is just legacy support.\\nObject.defineProperty(EntryCollection, 'impossible', {\\n\\tget: function() {\\n\\t\\tvar imp = this._impossible;\\n\\t\\tthis.eachChild(function(child) { imp = imp || child.impossible; });\\n\\t\\treturn imp;\\n\\t},\\n\\tset: function(impossible) {\\n\\t\\tthis._impossible = true;\\n\\t}\\n});\\n\\nEntryCollection.prototype.eachChild = function(method) {\\n\\tfor (var child in this.children) {\\n\\t\\tmethod(this.children[child]);\\n\\t}\\n};\\n\\nEntryCollection.prototype.addChild = function(child, name, type) {\\n\\tthis.children[name] = child;\\n\\tthis.types[name] = type;\\n};\\n\\nEntryCollection.prototype.hasChildren = function() {\\n\\treturn Object.keys(this.children).length > 0;\\n};\\n\",\"module-type\":\"library\",\"title\":\"$:/plugins/flibbles/relink/js/utils/entry.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/macrocall.js\":{\"text\":\"/*\\\\\\n\\nMethods for reporting and relinking macros. Behaves much like a fieldtype, except that it's not.\\n\\n\\\\*/\\n\\nvar utils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar Rebuilder = require(\\\"$:/plugins/flibbles/relink/js/utils/rebuilder\\\");\\nvar macrocallOperators = utils.getModulesByTypeAsHashmap('relinkmacrocall', 'name');\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\n\\n/** As in, report a macrocall invocation that is an html attribute.\\n * macro: must be a macro object.*/\\nexports.report = function(context, macro, callback, options) {\\n\\tfor (var operator in macrocallOperators) {\\n\\t\\tmacrocallOperators[operator].report(context, macro, callback, options);\\n\\t}\\n};\\n\\n/**Processes the given macro,\\n * macro: {name:, params:, start:, end:}\\n * each parameters: {name:, end:, value:}\\n * Macro invocation returned is the same, but relinked, and may have new keys:\\n * parameters: {type: macro, start:, newValue: (quoted replacement value)}\\n * Output of the returned entry isn't a string, but a macro object. It needs\\n * to be converted.\\n */\\nexports.relink = function(context, macro, text, fromTitle, toTitle, options) {\\n\\tvar entry;\\n\\tfor (var operator in macrocallOperators) {\\n\\t\\tvar results = macrocallOperators[operator].relink(context, macro, text, fromTitle, toTitle, options);\\n\\t\\tif (results) {\\n\\t\\t\\tentry = entry || {};\\n\\t\\t\\tif (results.impossible) {\\n\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t}\\n\\t\\t\\tif (results.output) {\\n\\t\\t\\t\\tmacro = results.output;\\n\\t\\t\\t\\tentry.output = macro;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn entry;\\n};\\n\\n/**Converts the macro object into a string, includes the \u003C\u003C..>>.\\n * The text is the old text the macro was formed from. It's used to preserve\\n * whitespace.\\n */\\nexports.reassemble = function(entry, text, options) {\\n\\tvar macro = entry.output;\\n\\tvar builder = new Rebuilder(text, macro.start);\\n\\tvar varAttribute = macro.attributes && macro.attributes['$variable'];\\n\\tif (varAttribute && varAttribute.value !== macro.name) {\\n\\t\\t// The name of the macro changed. Update it.\\n\\t\\tbuilder.add(varAttribute.value, macro.start + 2, macro.start + 2 + macro.name.length);\\n\\t}\\n\\tfor (var i = 0; i \u003C macro.params.length; i++) {\\n\\t\\tvar param = macro.params[i];\\n\\t\\tif (param.modified) {\\n\\t\\t\\tvar quotedValue = undefined;\\n\\t\\t\\tvar impossible = false;\\n\\t\\t\\tvar typeHandler = attrTypeOperators[param.type];\\n\\t\\t\\tif (typeHandler) {\\n\\t\\t\\t\\tquotedValue = typeHandler.reassemble(param, options);\\n\\t\\t\\t}\\n\\t\\t\\tif (quotedValue && !impossible) {\\n\\t\\t\\t\\tvar ptr = param.start;\\n\\t\\t\\t\\tptr = $tw.utils.skipWhiteSpace(text, ptr);\\n\\t\\t\\t\\t// param.start points to different places\\n\\t\\t\\t\\tif (param.name && !param.isPositional) {\\n\\t\\t\\t\\t\\tptr = utils.skipAttributeName(text, ptr, param);\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tbuilder.add(quotedValue, ptr, param.end);\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn builder.results(macro.end);\\n};\\n\\n\\n/**Like wrapAttribute value, except for macro parameters, not attributes.\\n *\\n * These are more permissive. Allows brackets,\\n * and slashes and '\u003C' in unquoted values.\\n */\\nexports.wrapParameterValue = function(value, preference) {\\n\\tvar whitelist = [\\\"\\\", \\\"'\\\", '\\\"', '[[', '\\\"\\\"\\\"'];\\n\\tvar choices = {\\n\\t\\t\\\"\\\": function(v) {return !/([\\\\s>\\\"':])/.test(v); },\\n\\t\\t\\\"'\\\": function(v) {return v.indexOf(\\\"'\\\") \u003C 0; },\\n\\t\\t'\\\"': function(v) {return v.indexOf('\\\"') \u003C 0; },\\n\\t\\t\\\"[[\\\": canBePrettyOperand,\\n\\t\\t'\\\"\\\"\\\"': function(v) {return v.indexOf('\\\"\\\"\\\"') \u003C 0 && v[v.length-1] != '\\\"';}\\n\\t};\\n\\tif (choices[preference] && choices[preference](value)) {\\n\\t\\treturn wrap(value, preference);\\n\\t}\\n\\tfor (var i = 0; i \u003C whitelist.length; i++) {\\n\\t\\tvar quote = whitelist[i];\\n\\t\\tif (choices[quote](value)) {\\n\\t\\t\\treturn wrap(value, quote);\\n\\t\\t}\\n\\t}\\n\\t// No quotes will work on this\\n\\treturn undefined;\\n};\\n\\nfunction canBePrettyOperand(value) {\\n\\treturn value.indexOf(']') \u003C 0;\\n};\\n\\n\\nfunction wrap(value, wrapper) {\\n\\tvar wrappers = {\\n\\t\\t\\\"\\\": function(v) {return v; },\\n\\t\\t\\\"'\\\": function(v) {return \\\"'\\\"+v+\\\"'\\\"; },\\n\\t\\t'\\\"': function(v) {return '\\\"'+v+'\\\"'; },\\n\\t\\t'\\\"\\\"\\\"': function(v) {return '\\\"\\\"\\\"'+v+'\\\"\\\"\\\"'; },\\n\\t\\t\\\"[[\\\": function(v) {return \\\"[[\\\"+v+\\\"]]\\\"; }\\n\\t};\\n\\tvar chosen = wrappers[wrapper];\\n\\tif (chosen) {\\n\\t\\treturn chosen(value);\\n\\t} else {\\n\\t\\treturn undefined;\\n\\t}\\n};\\n\",\"module-type\":\"library\",\"title\":\"$:/plugins/flibbles/relink/js/utils/macrocall.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/rebuilder.js\":{\"text\":\"/*\\\\\\n\\nThis helper class aids in reconstructing an existing string with new parts.\\n\\n\\\\*/\\n\\nfunction Rebuilder(text, start) {\\n\\tthis.text = text;\\n\\tthis.index = start || 0;\\n\\tthis.pieces = [];\\n};\\n\\nmodule.exports = Rebuilder;\\n\\n/**Pieces must be added consecutively.\\n * Start and end are the indices in the old string specifying where to graft\\n * in the new piece.\\n */\\nRebuilder.prototype.add = function(value, start, end) {\\n\\tthis.pieces.push(this.text.substring(this.index, start), value);\\n\\tthis.index = end;\\n};\\n\\nRebuilder.prototype.changed = function() {\\n\\treturn this.pieces.length > 0;\\n};\\n\\nRebuilder.prototype.results = function(end) {\\n\\tif (this.changed()) {\\n\\t\\tthis.pieces.push(this.text.substring(this.index, end));\\n\\t\\treturn this.pieces.join('');\\n\\t}\\n\\treturn undefined;\\n};\\n\",\"module-type\":\"library\",\"title\":\"$:/plugins/flibbles/relink/js/utils/rebuilder.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/substitution.js\":{\"text\":\"/*\\\\\\n\\nHandles relinking substitution text, like strings containing $(this)$.\\n\\n\\\\*/\\n\\nvar utils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar filterHandler = utils.getType('filter');\\nvar macrocallHandler = require(\\\"./macrocall.js\\\");\\n\\nexports.report = function(string, callback, options) {\\n\\tif (!options.noFilterSubstitution) {\\n\\t\\tvar filterRegex = /\\\\$\\\\{([\\\\S\\\\s]+?)\\\\}\\\\$/g, filter;\\n\\t\\twhile (filter = filterRegex.exec(string)) {\\n\\t\\t\\tfilterHandler.report(filter[1], function(title, blurb, style) {\\n\\t\\t\\t\\tcallback(title, '${' + blurb + '}$', style);\\n\\t\\t\\t}, options);\\n\\t\\t}\\n\\t}\\n\\tvar varRegex = /\\\\$\\\\(([^\\\\)\\\\$]+)\\\\)\\\\$/g, varMatch;\\n\\twhile (varMatch = varRegex.exec(string)) {\\n\\t\\tmacrocallHandler.report(options.settings, {name: varMatch[1], params: []}, function(title, blurb, style) {\\n\\t\\t\\tcallback(title, '$(' + blurb + ')$', style);\\n\\t\\t}, options);\\n\\t}\\n};\\n\\nexports.relink = function(string, fromTitle, toTitle, options) {\\n\\tvar entry;\\n\\tvar changed = false;\\n\\tvar newValue = string;\\n\\tif (!options.noFilterSubstitution) {\\n\\t\\tnewValue = newValue.replace(/\\\\$\\\\{([\\\\S\\\\s]+?)\\\\}\\\\$/g, function(match, filter) {\\n\\t\\t\\tvar filterEntry = filterHandler.relink(filter, fromTitle, toTitle, options);\\n\\t\\t\\tif (filterEntry) {\\n\\t\\t\\t\\tentry = entry || {};\\n\\t\\t\\t\\tif (filterEntry.output) {\\n\\t\\t\\t\\t\\t// The only }$ should be the one at the very end\\n\\t\\t\\t\\t\\tif (filterEntry.output.indexOf(\\\"}$\\\") \u003C 0) {\\n\\t\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t\\t\\tmatch = '${' + filterEntry.output + '}$';\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (filterEntry.impossible) {\\n\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t\\treturn match;\\n\\t\\t});\\n\\t}\\n\\tnewValue = newValue.replace(/\\\\$\\\\(([^\\\\)\\\\$]+)\\\\)\\\\$/g, function(match, varname) {\\n\\t\\tvar macroEntry = macrocallHandler.relink(options.settings, {name: varname, params: []}, string, fromTitle, toTitle, options);\\n\\t\\tif (macroEntry) {\\n\\t\\t\\tentry = entry || {};\\n\\t\\t\\tif (macroEntry.output) {\\n\\t\\t\\t\\tvar newTitle = macroEntry.output.attributes.$variable.value;\\n\\t\\t\\t\\tif (newTitle.indexOf('$') >= 0 || newTitle.indexOf(')') >= 0) {\\n\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t\\tmatch = '$(' + newTitle + ')$';\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t\\tif (macroEntry.impossible) {\\n\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\treturn match;\\n\\t});\\n\\tif (changed) {\\n\\t\\tentry.output = newValue;\\n\\t}\\n\\treturn entry;\\n};\\n\",\"module-type\":\"library\",\"title\":\"$:/plugins/flibbles/relink/js/utils/substitution.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/macrocall/parameters.js\":{\"text\":\"var utils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\nvar stringParameterOperators = $tw.modules.getModulesByTypeAsHashmap('relinkstringparameters');\\n\\nexports.name = \\\"parameters\\\";\\n\\nexports.report = function(context, macro, callback, options) {\\n\\tvar nestedOptions = Object.create(options);\\n\\tnestedOptions.settings = context;\\n\\tif (macro.resolved === undefined) {\\n\\t\\tassignNamesToNameless(macro, nestedOptions);\\n\\t}\\n\\tfor (var index in macro.params) {\\n\\t\\tvar param = macro.params[index];\\n\\t\\tvar typeHandler = attrTypeOperators[param.type];\\n\\t\\tif (typeHandler) {\\n\\t\\t\\ttry {\\n\\t\\t\\t\\ttypeHandler.report(macro, param, stringParameterOperators, function(title, blurb, style) {\\n\\t\\t\\t\\t\\tvar newBlurb = macro.name + ' ' + param.resolvedName;\\n\\t\\t\\t\\t\\tif (blurb) {\\n\\t\\t\\t\\t\\t\\tvar assign = param.assignmentOperator === '='? '=': ': ';\\n\\t\\t\\t\\t\\t\\tnewBlurb += assign + blurb;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tcallback(title, newBlurb, style);\\n\\t\\t\\t\\t}, nestedOptions);\\n\\t\\t\\t} catch (e) {\\n\\t\\t\\t\\t// Let's not RSoD, just ignore the parameter\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(context, macro, text, fromTitle, toTitle, options) {\\n\\tvar changed = undefined, impossible = undefined;\\n\\tvar nestedOptions = Object.create(options);\\n\\tnestedOptions.settings = context;\\n\\tif (macro.resolved === undefined) {\\n\\t\\tassignNamesToNameless(macro, nestedOptions);\\n\\t}\\n\\tfor (var index in macro.params) {\\n\\t\\tvar param = macro.params[index];\\n\\t\\tvar entry;\\n\\t\\tvar typeHandler = attrTypeOperators[param.type];\\n\\t\\tif (typeHandler) {\\n\\t\\t\\ttry {\\n\\t\\t\\t\\tentry = typeHandler.relink(macro, param, stringParameterOperators, text, fromTitle, toTitle, options);\\n\\t\\t\\t\\tif (entry && entry.output) {\\n\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t\\tparam.modified = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (entry && entry.impossible) {\\n\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t} catch (e) {\\n\\t\\t\\t\\tif (e instanceof utils.CannotFindMacroDef) {\\n\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tthrow e;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\tif (changed || impossible) {\\n\\t\\treturn {output: macro, impossible: impossible};\\n\\t}\\n};\\n\\nfunction assignNamesToNameless(macro, options) {\\n\\tvar i,\\n\\t\\tanonsExist = false,\\n\\t\\tparams = macro.params,\\n\\t\\tassignedParams = {};\\n\\tfor (i = 0; i \u003C params.length; i++) {\\n\\t\\tvar name = params[i].name;\\n\\t\\tif (name === undefined || params[i].isPositional) {\\n\\t\\t\\tanonsExist = true;\\n\\t\\t} else if (name) {\\n\\t\\t\\tparams[i].resolvedName = name;\\n\\t\\t\\tassignedParams[name] = true;\\n\\t\\t}\\n\\t}\\n\\tmacro.resolved = true;\\n\\tif (anonsExist) {\\n\\t\\tvar macroDef = options.settings.getMacroDefinition(macro.name);\\n\\t\\tif (macroDef !== undefined) {\\n\\t\\t\\tvar paramDefs = macroDef.params || [];\\n\\t\\t\\tvar index = 0;\\n\\t\\t\\twhile (macro.params[index].resolvedName) {\\n\\t\\t\\t\\t// Find that first anonymous parameter\\n\\t\\t\\t\\t++index;\\n\\t\\t\\t}\\n\\t\\t\\tvar length = macro.params.length;\\n\\t\\t\\tfor (i = 0; i \u003C paramDefs.length && index \u003C length; i++) {\\n\\t\\t\\t\\tvar paramDef = paramDefs[i];\\n\\t\\t\\t\\tif (!assignedParams[paramDef.name]) {\\n\\t\\t\\t\\t\\t// This def hasn't been assigned yet, find next anon param\\n\\t\\t\\t\\t\\tmacro.params[index].resolvedName = paramDef.name;\\n\\t\\t\\t\\t\\t// Find next anyonymous parameter\\n\\t\\t\\t\\t\\tdo {\\n\\t\\t\\t\\t\\t\\t++index;\\n\\t\\t\\t\\t\\t} while (index \u003C length\\n\\t\\t\\t\\t\\t\\t&& macro.params[index].resolvedName);\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t} else {\\n\\t\\t\\tmacro.resolved = false;\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkmacrocall\",\"title\":\"$:/plugins/flibbles/relink/js/utils/macrocall/parameters.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/macrocall/parameters/whitelist.js\":{\"text\":\"var utils = require('$:/plugins/flibbles/relink/js/utils.js');\\n\\nexports.name = \\\"whitelist\\\";\\n\\nexports.getHandler = function(macro, parameter, options) {\\n\\tvar managedMacro = options.settings.getMacro(macro.name);\\n\\tif (managedMacro) {\\n\\t\\tif (parameter.resolvedName) {\\n\\t\\t\\treturn managedMacro[parameter.resolvedName];\\n\\t\\t} else if (!macro.resolved) {\\n\\t\\t\\t// We may have an unresolved macro, and this parameter\\n\\t\\t\\t// could potentially tie to it, so we can't be sure\\n\\t\\t\\t// we're right.\\n\\t\\t\\tfor (var name in managedMacro) {\\n\\t\\t\\t\\tif (!accountedFor(name, macro)) {\\n\\t\\t\\t\\t\\tthrow new utils.CannotFindMacroDef();\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\n/* This checks if a given parameter name is accounted for among a macro's\\n * resolved parameters.\\n */\\nfunction accountedFor(paramName, macro) {\\n\\t// We use macro params here instead of attributes because\\n\\t// earlier versions of TW don't have attributes here.\\n\\tfor (var i = 0; i \u003C macro.params.length; ++i) {\\n\\t\\tif (macro.params[i].resolvedName === paramName) {\\n\\t\\t\\treturn true;\\n\\t\\t}\\n\\t}\\n\\treturn false;\\n};\\n\",\"module-type\":\"relinkstringparameters\",\"title\":\"$:/plugins/flibbles/relink/js/utils/macrocall/parameters/whitelist.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/filtered.js\":{\"text\":\"/*\\\\\\n\\nManages filtered attribute.\\n\\n\\\\*/\\n\\nvar relinkUtils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar filterHandler = relinkUtils.getType('filter');\\n\\nexports.name = 'filtered';\\n\\nexports.wrap = function(attribute, filter) {\\n\\treturn \\\"{{{\\\" + filter + \\\"}}}\\\";\\n};\\n\\nexports.rawString = function(attribute, options) {\\n\\treturn attribute.filter;\\n};\\n\\nexports.reassemble = function(attribute, options) {\\n\\treturn \\\"{{{\\\" + attribute.filter + \\\"}}}\\\";\\n};\\n\\nexports.compute = function(attribute, context, options) {\\n\\tvar parentWidget = context.widget;\\n\\treturn options.wiki.filterTiddlers(attribute.filter,parentWidget)[0] || \\\"\\\";\\n};\\n\\nexports.report = function(element, attribute, valueModules, callback, options) {\\n\\tfilterHandler.report(attribute.filter, function(title, blurb, style) {\\n\\t\\tcallback(title, '{{{' + blurb + '}}}', style);\\n\\t}, options);\\n};\\n\\nexports.relink = function(element, attribute, valueModules, text, fromTitle, toTitle, options) {\\n\\tvar entry = filterHandler.relinkInBraces(attribute.filter, fromTitle, toTitle, options);\\n\\tif (entry && entry.output) {\\n\\t\\tattribute.filter = entry.output;\\n\\t}\\n\\treturn entry;\\n};\\n\",\"module-type\":\"relinkattributetype\",\"title\":\"$:/plugins/flibbles/relink/js/utils/attributetype/filtered.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/indirect.js\":{\"text\":\"/*\\\\\\n\\nManages indirect attribute.\\n\\n\\\\*/\\n\\nvar relinkUtils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar refHandler = relinkUtils.getType('reference');\\n\\nexports.name = 'indirect';\\n\\nexports.wrap = function(attribute, textReference) {\\n\\treturn \\\"{{\\\" + textReference + \\\"}}\\\";\\n};\\n\\nexports.rawString = function(attribute, options) {\\n\\treturn attribute.textReference;\\n};\\n\\nexports.reassemble = function(attribute, options) {\\n\\treturn \\\"{{\\\" + attribute.textReference + \\\"}}\\\";\\n};\\n\\nexports.compute = function(attribute, context, options) {\\n\\tvar parentWidget = context.widget;\\n\\treturn options.wiki.getTextReference(attribute.textReference, \\\"\\\", parentWidget.variables.currentTiddler.value);\\n};\\n\\nexports.report = function(element, attribute, valueModules, callback, options) {\\n\\trefHandler.report(attribute.textReference, function(title, blurb, style) {\\n\\t\\tcallback(title, '{{' + (blurb || '') + '}}', style);\\n\\t}, options);\\n};\\n\\nexports.relink = function(element, attribute, valueModules, text, fromTitle, toTitle, options) {\\n\\tvar entry = refHandler.relinkInBraces(attribute.textReference, fromTitle, toTitle, options);\\n\\tif (entry && entry.output) {\\n\\t\\tattribute.textReference = entry.output;\\n\\t}\\n\\treturn entry;\\n};\\n\",\"module-type\":\"relinkattributetype\",\"title\":\"$:/plugins/flibbles/relink/js/utils/attributetype/indirect.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/macro-parameter.js\":{\"text\":\"/*\\\\\\n\\nMacro-parameter attribute types are a legacy attribute type that are present\\nonly in legacy versions of TW, when macros are used as attributes.\\n\\nThey behave exactly like strings.\\n\\n\\\\*/\\n\\nmodule.exports = Object.create(require(\\\"./string.js\\\"));\\n\\nmodule.exports.name = 'macro-parameter';\\n\",\"module-type\":\"relinkattributetype\",\"title\":\"$:/plugins/flibbles/relink/js/utils/attributetype/macro-parameter.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/macro.js\":{\"text\":\"/*\\\\\\n\\nManages filtered attribute.\\n\\n\\\\*/\\n\\nvar macrocall = require(\\\"$:/plugins/flibbles/relink/js/utils/macrocall.js\\\");\\n\\nexports.name = 'macro';\\n\\nexports.wrap = function(attribute, macroString) {\\n\\tif (attribute.isMVV) {\\n\\t\\treturn \\\"((\\\" + macroString + \\\"))\\\";\\n\\t} else {\\n\\t\\treturn \\\"\u003C\u003C\\\" + macroString + \\\">>\\\";\\n\\t}\\n};\\n\\nexports.rawString = function(attribute, options) {\\n\\treturn attribute.value.name;\\n};\\n\\nexports.reassemble = function(attribute, options) {\\n\\treturn attribute.output;\\n};\\n\\nexports.compute = function(attribute, context, options) {\\n\\tvar parentWidget = context.widget;\\n\\tvar params = makeSuitableParams(parentWidget, attribute.value);\\n\\treturn parentWidget.getVariable(attribute.value.name,{params: params});\\n};\\n\\nexports.report = function(element, attribute, valueModules, callback, options) {\\n\\tvar macro = attribute.value;\\n\\tmacro.name = macro.name || macro.attributes[\\\"$variable\\\"].value;\\n\\tmacro.params = macro.params || macro.orderedAttributes;\\n\\tmacrocall.report(options.settings, macro, function(title, blurb, style) {\\n\\t\\tif (attribute.isMVV) {\\n\\t\\t\\tcallback(title, '((' + blurb + '))', style);\\n\\t\\t} else {\\n\\t\\t\\tcallback(title, '\u003C\u003C' + blurb + '>>', style);\\n\\t\\t}\\n\\t}, options);\\n};\\n\\nexports.relink = function(element, attribute, valueModules, text, fromTitle, toTitle, options) {\\n\\tvar macro = attribute.value;\\n\\tmacro.name = macro.name || macro.attributes[\\\"$variable\\\"].value;\\n\\tmacro.params = macro.params || macro.orderedAttributes;\\n\\tvar entry = macrocall.relink(options.settings, macro, text, fromTitle, toTitle, options);\\n\\tif (entry && entry.output) {\\n\\t\\tattribute.output = macrocall.reassemble(entry, text, options);\\n\\t\\tif (!attribute.output) {\\n\\t\\t\\t// Nope. Nothing got changed after all.\\n\\t\\t\\tentry.output = undefined;\\n\\t\\t} else {\\n\\t\\t\\tattribute.value = entry.output;\\n\\t\\t}\\n\\t}\\n\\treturn entry;\\n};\\n\\nfunction makeSuitableParams(widget, macro) {\\n\\tif (macro.params) {\\n\\t\\tvar params = [];\\n\\t\\tfor (var i = 0; i \u003C macro.params.length; i++) {\\n\\t\\t\\tvar attr = macro.params[i];\\n\\t\\t\\tvar param = {\\n\\t\\t\\t\\tvalue: widget.computeAttribute(attr)\\n\\t\\t\\t};\\n\\t\\t\\tif (attr.name && !attr.isPositional) {\\n\\t\\t\\t\\tparam.name = attr.name;\\n\\t\\t\\t}\\n\\t\\t\\tparams.push(param);\\n\\t\\t}\\n\\t\\treturn params;\\n\\t}\\n\\treturn macro.params;\\n};\\n\",\"module-type\":\"relinkattributetype\",\"title\":\"$:/plugins/flibbles/relink/js/utils/attributetype/macro.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/string.js\":{\"text\":\"/*\\\\\\n\\nManages string attribute.\\n\\n\\\\*/\\n\\nvar utils = require('$:/plugins/flibbles/relink/js/utils.js');\\nvar wikitextUtils = require(\\\"$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/utils.js\\\");\\n\\nexports.name = 'string';\\n\\nexports.wrap = function(attribute, value) {\\n\\tif (!/([\\\\s>\\\"':])/.test(value) && value.length > 0) {\\n\\t\\treturn value;\\n\\t} else if (value.indexOf('\\\"') \u003C 0) {\\n\\t\\treturn '\\\"' + value + '\\\"';\\n\\t} else if (value.indexOf('\\\\'') \u003C 0) {\\n\\t\\treturn '\\\\'' + value + '\\\\'';\\n\\t} else if (value.indexOf(']]') \u003C 0) {\\n\\t\\treturn '[[' + value + ']]';\\n\\t}\\n\\t// I guess just go with the quotes then\\n\\treturn '\\\"' + value + '\\\"';\\n};\\n\\nexports.rawString = function(attribute, options) {\\n\\treturn attribute.value;\\n};\\n\\nexports.reassemble = function(attribute, options) {\\n\\treturn attribute.quotedValue;\\n};\\n\\nexports.compute = function(attribute, context, options) {\\n\\treturn attribute.value;\\n};\\n\\nexports.report = function(element, attribute, valueModules, callback, options) {\\n\\tfor (var operatorName in valueModules) {\\n\\t\\tvar operator = valueModules[operatorName];\\n\\t\\tvar handler = operator.getHandler(element, attribute, options);\\n\\t\\tif (handler) {\\n\\t\\t\\thandler.report(attribute.value, function(title, blurb, style) {\\n\\t\\t\\t\\tif (operator.formBlurb) {\\n\\t\\t\\t\\t\\tif (blurb) {\\n\\t\\t\\t\\t\\t\\tblurb = '\\\"' + blurb + '\\\"';\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tblurb  = operator.formBlurb(element, attribute, blurb, options);\\n\\t\\t\\t\\t\\tstyle = style || {};\\n\\t\\t\\t\\t\\tstyle.customBlurb = true;\\n\\t\\t\\t\\t} else if (blurb) {\\n\\t\\t\\t\\t\\tblurb = '\\\"' + blurb + '\\\"';\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tcallback(title, blurb, style);\\n\\t\\t\\t}, options);\\n\\t\\t\\tbreak;\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(element, attribute, valueModules, text, fromTitle, toTitle, options) {\\n\\tvar changed = false, impossible = false;\\n\\tfor (var operatorName in valueModules) {\\n\\t\\tvar operator = valueModules[operatorName];\\n\\t\\tvar handler = operator.getHandler(element, attribute, options);\\n\\t\\tif (handler) {\\n\\t\\t\\tvar entry = handler.relink(attribute.value, fromTitle, toTitle, options);\\n\\t\\t\\tif (entry) {\\n\\t\\t\\t\\tif (entry.output) {\\n\\t\\t\\t\\t\\tvar oldQuote = utils.determineQuote(text, attribute);\\n\\t\\t\\t\\t\\tvar quotedValue = wikitextUtils.wrapAttributeValue(entry.output, oldQuote)\\n\\t\\t\\t\\t\\tif (quotedValue === undefined) {\\n\\t\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\tattribute.quotedValue = quotedValue;\\n\\t\\t\\t\\t\\t\\tattribute.quote = oldQuote;\\n\\t\\t\\t\\t\\t\\tattribute.oldValue = attribute.value;\\n\\t\\t\\t\\t\\t\\tattribute.value = entry.output;\\n\\t\\t\\t\\t\\t\\tattribute.handler = handler.name;\\n\\t\\t\\t\\t\\t\\t// Change it into a string if this was a\\n\\t\\t\\t\\t\\t\\t// substitution that had no substitutions\\n\\t\\t\\t\\t\\t\\tattribute.type = 'string';\\n\\t\\t\\t\\t\\t\\tchanged = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (entry.impossible) {\\n\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\tif (changed) {\\n\\t\\treturn {output: attribute.value, impossible: impossible};\\n\\t}\\n\\tif (impossible) {\\n\\t\\treturn {impossible: true};\\n\\t}\\n};\\n\",\"module-type\":\"relinkattributetype\",\"title\":\"$:/plugins/flibbles/relink/js/utils/attributetype/string.js\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink/js/utils/attributetype/substituted.js\":{\"text\":\"/*\\\\\\n\\nManages substituted attribute.\\n\\n\\\\*/\\n\\nvar substitution = require(\\\"$:/plugins/flibbles/relink/js/utils/substitution.js\\\");\\nvar utils = require('$:/plugins/flibbles/relink/js/relinkoperations/text/wikitext/utils.js');\\n\\nexports.name = 'substituted';\\n\\nexports.wrap = function(attribute, rawValue) {\\n\\treturn \\\"`\\\" + rawValue + \\\"`\\\";\\n};\\n\\nexports.rawString = function(attribute, options) {\\n\\treturn attribute.rawValue;\\n};\\n\\nexports.reassemble = function(attribute, options) {\\n\\treturn attribute.quotedValue;\\n};\\n\\nexports.compute = function(attribute, context, options) {\\n\\treturn options.wiki.getSubstitutedText(attribute.rawValue, context.widget);\\n};\\n\\nexports.report = function(element, attribute, valueModules, callback, options) {\\n\\tsubstitution.report(attribute.rawValue, function(title, blurb, style) {\\n\\t\\tcallback(title, '`' + blurb + '`', style);\\n\\t}, options);\\n\\tfor (var operatorName in valueModules) {\\n\\t\\tvar operator = valueModules[operatorName];\\n\\t\\tvar handler = operator.getHandler(element, attribute, options);\\n\\t\\tif (handler) {\\n\\t\\t\\thandler.report(attribute.rawValue, function(title, blurb, style) {\\n\\t\\t\\t\\t// Only consider titles without substitutions.\\n\\t\\t\\t\\tif (!utils.containsPlaceholders(title)) {\\n\\t\\t\\t\\t\\tblurb = (utils.containsPlaceholders(attribute.rawValue) || blurb)? '`' + blurb + '`': '';\\n\\t\\t\\t\\t\\tif (operator.formBlurb) {\\n\\t\\t\\t\\t\\t\\tblurb = operator.formBlurb(element, attribute, blurb, options);\\n\\t\\t\\t\\t\\t\\tstyle = style || {};\\n\\t\\t\\t\\t\\t\\tstyle.customBlurb = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tcallback(title, blurb, style);\\n\\t\\t\\t\\t}\\n\\t\\t\\t}, options);\\n\\t\\t\\tbreak;\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(element, attribute, valueModules, text, fromTitle, toTitle, options) {\\n\\tvar changed = false, impossible = false;\\n\\tvar subEntry = substitution.relink(attribute.rawValue, fromTitle, toTitle, options);\\n\\tif (subEntry) {\\n\\t\\tif (subEntry.output) {\\n\\t\\t\\tattribute.rawValue = subEntry.output;\\n\\t\\t\\tchanged = true;\\n\\t\\t}\\n\\t\\tif (subEntry.impossible) {\\n\\t\\t\\timpossible = true;\\n\\t\\t}\\n\\t}\\n\\tif (!utils.containsPlaceholders(fromTitle)) {\\n\\t\\tfor (var operatorName in valueModules) {\\n\\t\\t\\tvar operator = valueModules[operatorName];\\n\\t\\t\\tvar handler = operator.getHandler(element, attribute, options);\\n\\t\\t\\tif (handler) {\\n\\t\\t\\t\\tvar entry = handler.relink(attribute.rawValue, fromTitle, toTitle, options);\\n\\t\\t\\t\\tif (entry) {\\n\\t\\t\\t\\t\\tif (entry.impossible) {\\n\\t\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tif (entry.output) {\\n\\t\\t\\t\\t\\t\\tif (utils.containsPlaceholders(toTitle)) {\\n\\t\\t\\t\\t\\t\\t\\t// If we relinked, but the toTitle can't be in\\n\\t\\t\\t\\t\\t\\t\\t// a substitution, then we must fail instead.\\n\\t\\t\\t\\t\\t\\t\\timpossible = true;\\n\\t\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\t\\tattribute.rawValue = entry.output;\\n\\t\\t\\t\\t\\t\\t\\tattribute.handler = handler.name;\\n\\t\\t\\t\\t\\t\\t\ /relink!!demo}addsuffix[#Macros]]}}} class=\\\"tc-tiddlylink-external\\\">Macros documentation page\u003C/a> for details.\"},\"$:/plugins/flibbles/relink/language/Help/Operators\":{\"title\":\"$:/plugins/flibbles/relink/language/Help/Operators\",\"text\":\"See the \u003Ca href={{{[{$:/plugins/flibbles/relink!!demo}addsuffix[#Operators]]}}} class=\\\"tc-tiddlylink-external\\\">Operators documentation page\u003C/a> for details.\"},\"$:/plugins/flibbles/relink/language/SideBar/Missing/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/SideBar/Missing/Caption\",\"text\":\"//Relink//\u003Cbr>Missing\"},\"$:/plugins/flibbles/relink/language/SideBar/Orphans/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/SideBar/Orphans/Caption\",\"text\":\"//Relink//\u003Cbr>Orphans\"},\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Empty\":{\"title\":\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Empty\",\"text\":\"No tiddlers contain any fields, links, macros, transclusions, or widgets referencing this one\"},\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Description\":{\"title\":\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Description\",\"text\":\"The following tiddlers contain fields, links, macros, transclusions, or widgets referencing this one:\"},\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/TiddlerInfo/References/Caption\",\"text\":\"//Relink// References\"},\"$:/plugins/flibbles/relink/language/ui/Attributes/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/ui/Attributes/Caption\",\"text\":\"Attributes\"},\"$:/plugins/flibbles/relink/language/ui/Fields/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/ui/Fields/Caption\",\"text\":\"Fields\"},\"$:/plugins/flibbles/relink/language/ui/Macros/Caption\":{\"title\":\"$:/plugins/flibbles/relink/language/ui/Macros/Caption\",\"text\":\"Macros\"},\"$:/plugins/flibbles/relink tag\":{\"title\":\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/tag\",\"text\":\"title\"},\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/selectedTiddler\":{\"title\":\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/selectedTiddler\",\"text\":\"title\"},\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/unselectedText\":{\"title\":\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/unselectedText\",\"text\":\"wikitext\"},\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/missingText\":{\"title\":\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/missingText\",\"text\":\"wikitext\"},\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/template\":{\"title\":\"$:/config/flibbles/relink/macros/toc-tabbed-internal-nav/template\",\"text\":\"title\"},\"$:/config/flibbles/relink/macros/translink/title\":{\"title\":\"$:/config/flibbles/relink/macros/translink/title\",\"text\":\"title\"},\"$:/config/flibbles/relink/messages/tm-new-tiddler\":{\"title\":\"$:/config/flibbles/relink/messages/tm-new-tiddler\",\"text\":\"(.*)\"},\"$:/config/flibbles/relink/operators/filter\":{\"title\":\"$:/config/flibbles/relink/operators/filter\",\"text\":\"filter\"},\"$:/config/flibbles/relink/operators/list\":{\"title\":\"$:/config/flibbles/relink/operators/list\",\"text\":\"reference\"},\"$:/config/flibbles/relink/operators/subfilter\":{\"title\":\"$:/config/flibbles/relink/operators/subfilter\",\"text\":\"filter\"},\"$:/config/flibbles/relink/operators/tag\":{\"title\":\"$:/config/flibbles/relink/operators/tag\",\"text\":\"title\"},\"$:/config/flibbles/relink/operators/title\":{\"title\":\"$:/config/flibbles/relink/operators/title\",\"text\":\"title\"},\"$:/config/flibbles/relink/operators/field:title\":{\"title\":\"$:/config/flibbles/relink/operators/field:title\",\"text\":\"title\"},\"$:/config/flibbles/relink/operators/relink:report\":{\"title\":\"$:/config/flibbles/relink/operators/relink:report\",\"text\":\"title\"},\"$:/language/EditTemplate/Title/Impossibles/Prompt\":{\"title\":\"$:/language/EditTemplate/Title/Impossibles/Prompt\",\"text\":\"''Warning:'' Not all references in the following tiddlers can be updated by //Relink// due to the complexity of the new title:\"},\"$:/language/EditTemplate/Title/References/Prompt\":{\"title\":\"$:/language/EditTemplate/Title/References/Prompt\",\"text\":\"The following tiddlers will be updated if relinking:\"},\"$:/language/EditTemplate/Title/Relink/Prompt\":{\"title\":\"$:/language/EditTemplate/Title/Relink/Prompt\",\"text\":\"Use //Relink// to update ''\u003C$text text=\u003C\u003CfromTitle>>/>'' to ''\u003C$text text=\u003C\u003CtoTitle>>/>'' across all other tiddlers\"},\"$:/core/ui/EditTemplate/title\":{\"title\":\"$:/core/ui/EditTemplate/title\",\"tags\":\"$:/tags/EditTemplate\",\"text\":\"\\\\whitespace trim\\n\u003C$edit-text field=\\\"draft.title\\\" class=\\\"tc-titlebar tc-edit-texteditor\\\" focus={{{ [{$:/config/AutoFocus}match[title]then[true]] ~[[false]] }}} tabindex={{$:/config/EditTabIndex}} cancelPopups=\\\"yes\\\" dir={{$:/config/DefaultTextDirection}}/>\\n\\n\u003C$vars pattern=\\\"\\\"\\\"[\\\\|\\\\[\\\\]{}]\\\"\\\"\\\" bad-chars=\\\"\\\"\\\"`| [ ] { }`\\\"\\\"\\\">\\n\\n\u003C$list filter=\\\"[all[current]regexp:draft.title\u003Cpattern>]\\\" variable=\\\"listItem\\\">\\n\\n\u003Cdiv class=\\\"tc-message-box\\\" dir={{$:/config/DefaultTextDirection}}>\\n\\n{{$:/core/images/warning}}&#32;{{$:/language/EditTemplate/Title/BadCharacterWarning}}\\n\\n\u003C/div>\\n\\n\u003C/$list>\\n\\n\u003C/$vars>\\n\\n\u003C$reveal state=\\\"!!draft.title\\\" type=\\\"nomatch\\\" text={{!!draft.of}} tag=\\\"div\\\" dir={{$:/config/DefaultTextDirection}}>\\n\\n\u003C$list filter=\\\"[{!!draft.title}!is[missing]]\\\" variable=\\\"listItem\\\">\\n\\n\u003Cdiv class=\\\"tc-message-box\\\">\\n\\n{{$:/core/images/warning}}&#32;{{$:/language/EditTemplate/Title/Exists/Prompt}}:&#32;\u003C$link to={{!!draft.title}} />\\n\\n\u003C/div>\\n\\n\u003C/$list>\\n\\n\u003C$list filter=\\\"[{!!draft.of}!is[missing]]\\\" variable=\\\"listItem\\\">\\n\\n\u003C$vars fromTitle={{!!draft.of}} toTitle={{!!draft.title}}>\\n\\n\u003C$checkbox tiddler=\\\"$:/config/RelinkOnRename\\\" field=\\\"text\\\" checked=\\\"yes\\\" unchecked=\\\"no\\\" default=\\\"no\\\">&#32;{{$:/language/EditTemplate/Title/Relink/Prompt}}\u003C/$checkbox>\\n\\n\u003C$tiddler tiddler=\u003C\u003CfromTitle>> >\\n\\n\u003C$list filter=\\\"[relink:wouldchange\u003CtoTitle>limit[1]]\\\" variable=\\\"listItem\\\">\\n\\n\u003C$vars stateTiddler=\u003C\u003Cqualify \\\"$:/state/edit/references\\\">> >\\n\\n\u003C$set\\n\\tname=\\\"prompt\\\"\\n\\tfilter=\\\"[relink:wouldchange\u003CtoTitle>relink:impossible\u003CtoTitle>]\\\"\\n\\tvalue=\\\"EditTemplate/Title/Impossibles/Prompt\\\"\\n\\temptyValue=\\\"EditTemplate/Title/References/Prompt\\\" >\\n\u003C$reveal type=\\\"nomatch\\\" state=\u003C\u003CstateTiddler>> text=\\\"show\\\">\\n\u003C$button set=\u003C\u003CstateTiddler>> setTo=\\\"show\\\" class=\\\"tc-btn-invisible\\\">\\n{{$:/core/images/right-arrow}}\\n&#32;\\n\u003C$macrocall $name=lingo title=\u003C\u003Cprompt>> />\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" state=\u003C\u003CstateTiddler>> text=\\\"show\\\">\\n\u003C$button set=\u003C\u003CstateTiddler>> setTo=\\\"hide\\\" class=\\\"tc-btn-invisible\\\">\\n{{$:/core/images/down-arrow}}\\n&#32;\\n\u003C$macrocall $name=lingo title=\u003C\u003Cprompt>> />\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C/$set>\\n\\n\u003C$reveal type=\\\"match\\\" state=\u003C\u003CstateTiddler>> text=\\\"show\\\">\\n\u003C$list variable=\\\"listItem\\\" filter=\\\"[relink:wouldchange\u003CtoTitle>!title[$:/StoryList]sort[title]]\\\" template=\\\"$:/plugins/flibbles/relink/ui/ListItemTemplate\\\">\\n\u003C/$list>\\n\u003C/$reveal>\\n\\n\u003C/$vars>\\n\\n\u003C/$list>\\n\\n\u003C/$tiddler>\\n\\n\u003C/$vars>\\n\\n\u003C/$list>\\n\\n\u003C/$reveal>\\n\"},\"$:/config/flibbles/relink/PluginLibrary\":{\"title\":\"$:/config/flibbles/relink/PluginLibrary\",\"caption\":\"//Relink// Library\",\"url\":\"https://flibbles.github.io/tw5-relink/library/index.html\",\"tags\":\"$:/tags/PluginLibrary\",\"text\":\"The //Relink// library contains //Relink// as well as its supplemental plugins. It is maintained by Flibbles. See the [[github page|https://github.com/flibbles/tw5-relink]] for more information.\\n\"},\"$:/plugins/flibbles/relink/readme\":{\"title\":\"$:/plugins/flibbles/relink/readme\",\"type\":\"text/vnd.tiddlywiki\",\"text\":\"When renaming a tiddler, Relink can update the fields, filters, and widgets\\nof all other tiddlers. However, it works through whitelisting.\\n\\nIt's already configured to update tiddler titles for all core widgets, filters,\\nand fields, but the whitelists can be customized for each of this in the\\nconfiguration panel.\\n\\nSee \u003Ca href={{$:/plugins/flibbles/relink!!source}} class=\\\"tc-tiddlylink-external\\\">the tw5-relink website\u003C/a> for more details and examples.\\n\"},\"$:/config/flibbles/relink/settings/default-type\":{\"title\":\"$:/config/flibbles/relink/settings/default-type\",\"text\":\"title\"},\"$:/config/flibbles/relink/touch-modify\":{\"title\":\"$:/config/flibbles/relink/touch-modify\",\"text\":\"yes\"},\"$:/config/DefaultColourMappings/relink-impossible\":{\"title\":\"$:/config/DefaultColourMappings/relink-impossible\",\"text\":\"\u003C\u003Ccolour dirty-indicator>>\"},\"$:/language/Docs/PaletteColours/relink-impossible\":{\"title\":\"$:/language/Docs/PaletteColours/relink-impossible\",\"text\":\"Relink link impossible\"},\"$:/plugins/flibbles/relink/ui/ListItemTemplate\":{\"title\":\"$:/plugins/flibbles/relink/ui/ListItemTemplate\",\"text\":\"\\\\whitespace trim\\n\u003C$set\\n\\tname=\\\"classes\\\"\\n\\tfilter=\\\"[\u003ClistItem>relink:impossible\u003CtoTitle>]\\\"\\n\\tvalue=\\\"tc-menu-list-item tc-relink-impossible\\\"\\n\\temptyValue=\\\"tc-menu-list-item\\\">\\n\u003Cdiv class=\u003C\u003Cclasses>>>\\n\u003C$link to=\u003C\u003ClistItem>>>\u003C$text text=\u003C\u003ClistItem>> />\u003C/$link>\\n\u003C/div>\\n\u003C/$set>\\n\"},\"$:/plugins/flibbles/relink/ui/ListItemWithBlurbTemplate\":{\"title\":\"$:/plugins/flibbles/relink/ui/ListItemWithBlurbTemplate\",\"text\":\"\u003Cdiv class=\\\"tc-menu-list-item\\\">\u003C$link />\u003C/div>\\n\u003C$list variable=blurb filter=\\\"[\u003CcurrentTiddler>relink:report\u003CmissingTiddler>]\\\">\u003Cdiv class=\\\"tc-relink-menu-missing-blurb\\\">\u003C$text text=\u003C\u003Cblurb>> />\u003C/div>\\n\"},\"$:/plugins/flibbles/relink/ui/MissingTemplate\":{\"title\":\"$:/plugins/flibbles/relink/ui/MissingTemplate\",\"text\":\"\\\\whitespace trim\\n\u003C$set name=\\\"missingTiddler\\\" value=\u003C\u003CcurrentTiddler>> >\\n\u003Cdiv class=\\\"tc-tiddler-missing\\\">\\n\u003C$button popup=\u003C\u003Cqualify \\\"$:/state/relink/popup/missing\\\">> class=\\\"tc-btn-invisible tc-missing-tiddler-label\\\">\\n\u003C$view field=\\\"title\\\" format=\\\"text\\\" />\\n\u003C/$button>\\n\u003C$reveal state=\u003C\u003Cqualify \\\"$:/state/relink/popup/missing\\\">> type=\\\"popup\\\" position=\\\"below\\\" animate=\\\"yes\\\">\\n\u003Cdiv class=\\\"tc-drop-down\\\">\\n\u003C$transclude tiddler=\\\"$:/core/ui/ListItemTemplate\\\"/>\\n\u003Chr>\\n\u003C$list filter=\\\"[all[current]relink:backreferences[]sort[title]]\\\" template=\\\"$:/plugins/flibbles/relink/ui/ListItemWithBlurbTemplate\\\"/>\\n\u003C/div>\\n\u003C/$reveal>\\n\u003C/div>\\n\u003C/$set>\\n\"},\"$:/plugins/flibbles/relink/ui/MoreSideBar/Missing\":{\"title\":\"$:/plugins/flibbles/relink/ui/MoreSideBar/Missing\",\"caption\":\"{{$:/plugins/flibbles/relink/language/SideBar/Missing/Caption}}\",\"tags\":\"$:/tags/MoreSideBar\",\"text\":\"\u003C$list filter={{$:/plugins/flibbles/relink/Filters/Missing!!filter}} template=\\\"$:/plugins/flibbles/relink/ui/MissingTemplate\\\" />\\n\"},\"$:/plugins/flibbles/relink/ui/MoreSideBar/Orphans\":{\"title\":\"$:/plugins/flibbles/relink/ui/MoreSideBar/Orphans\",\"caption\":\"{{$:/plugins/flibbles/relink/language/SideBar/Orphans/Caption}}\",\"tags\":\"$:/tags/MoreSideBar\",\"text\":\"\u003C$list filter={{$:/plugins/flibbles/relink/Filters/Orphans!!filter}} template=\\\"$:/core/ui/ListItemTemplate\\\" />\\n\"},\"$:/plugins/flibbles/relink/ui/TiddlerInfo/References\":{\"title\":\"$:/plugins/flibbles/relink/ui/TiddlerInfo/References\",\"caption\":\"{{$:/plugins/flibbles/relink/language/TiddlerInfo/References/Caption}}\",\"tags\":\"$:/tags/TiddlerInfo\",\"text\":\"\\\\define lingo-base() $:/plugins/flibbles/relink/language/TiddlerInfo/\\n\\\\define filter() [all[current]relink:backreferences[]!title[$:/StoryList]!prefix[$:/temp/]sort[title]]\\n\\\\whitespace trim\\n\u003C$list filter=\\\"[subfilter\u003Cfilter>first[]]\\\">\\n\u003C\u003Clingo References/Description>>\\n\u003C/$list>\\n\u003Ctable class=\\\"tc-relink-references-table\\\">\\n\u003Ctbody>\\n\u003C$vars toTitle='' >\\n\u003C$list filter=\u003C\u003Cfilter>> emptyMessage=\u003C\u003Clingo References/Empty>> variable=\\\"listItem\\\" template=\\\"$:/plugins/flibbles/relink/ui/TiddlerInfo/ReferencesTemplate\\\" />\\n\u003C/$vars>\\n\u003C/tbody>\\n\u003C/table>\\n\"},\"$:/plugins/flibbles/relink/ui/TiddlerInfo/ReferencesTemplate\":{\"title\":\"$:/plugins/flibbles/relink/ui/TiddlerInfo/ReferencesTemplate\",\"text\":\"\\\\whitespace trim\\n\u003Ctr class=\\\"tc-relink-references\\\">\\n\u003Ctd class={{{ tc-relink-references-title [\u003CtoTitle>!match[]then\u003ClistItem>relink:impossible\u003CtoTitle>then[tc-relink-impossible]] +[join[ ]] }}} >\\n\\t\u003C$list\\n\\t\\tvariable=whitelist\\n\\t\\tfilter=\\\"[\u003ClistItem>removeprefix[$:/config/flibbles/relink/]split[/]first[]titlecase[]addprefix[$:/plugins/flibbles/relink/ui/configuration/]]\\\"\\n\\t\\temptyMessage=\\\"\u003C$link to=\u003C\u003ClistItem>>/>\\\" >\\n\\t\\t\u003C$link to=\u003C\u003Cwhitelist>>>\\n\\t\\t\\t''//Relink//&#32;whitelist''\\n\\t\\t\u003C/$link>\\n\\t\u003C/$list>\\n\u003C/td>\\n\u003Ctd class=\\\"tc-relink-references-report\\\">\\n\\t\u003C$list filter=\\\"[\u003ClistItem>relink:report\u003CcurrentTiddler>]\\\">\\n\\n\\t\\t\u003C$text text=\u003C\u003CcurrentTiddler>> />\\n\\t\u003C/$list>\\n\u003C/td>\u003C/tr>\\n\"},\"$:/plugins/flibbles/relink/ui/components/button-delete\":{\"title\":\"$:/plugins/flibbles/relink/ui/components/button-delete\",\"text\":\"\\\\define lingo-base() $:/plugins/flibbles/relink/language/Buttons/\\n\\\\define prefix() $:/config/flibbles/relink/\\n\\\\whitespace trim\\n\\n\u003C$list\\n\\tfilter=\\\"[all[current]prefix\u003Cprefix>]\\\"\\n\\temptyMessage=\\\"\u003C$link>\u003C$button class='tc-btn-invisible' tooltip={{$:/plugins/flibbles/relink/language/Buttons/LinkToInline/Hint}}>{{$:/core/images/link}}\u003C/$button>\u003C/$link>\\\">\\n\u003C$button class=\\\"tc-btn-invisible\\\" tooltip={{$:/plugins/flibbles/relink/language/Buttons/Delete/Hint}}>\u003C$list filter=\\\"[all[current]is[tiddler]]\\\">\\n\u003C$action-deletetiddler $tiddler=\u003C\u003CcurrentTiddler>> />\\n\u003C/$list>\u003C$list filter=\\\"[all[current]is[shadow]]\\\">\\n\u003C$action-setfield $tiddler=\u003C\u003CtiddlerName>> text=\\\"\\\" />\\n\u003C/$list>\\n{{$:/core/images/delete-button}}\\n\u003C/$button>\\n\u003C/$list>\\n\"},\"$:/plugins/flibbles/relink/ui/components/select-fieldtype\":{\"title\":\"$:/plugins/flibbles/relink/ui/components/select-fieldtype\",\"text\":\"\\\\define prefix() $:/config/flibbles/relink/\\n\\\\whitespace trim\\n\\n\u003C$vars type={{{ [\u003Csignature>relink:type[]] }}} >\\n\u003C$list filter=\\\"[all[current]prefix\u003Cprefix>]\\\" >\\n\u003C$select tiddler=\u003C\u003CcurrentTiddler>> >\\n\u003C$list variable=\\\"option\\\" filter=\\\"[relink:types[]]\\\">\\n\u003Coption>\u003C$text text=\u003C\u003Coption>> />\u003C/option>\\n\u003C/$list>\\n\u003C/$select>\\n\u003C/$list>\u003C$list filter=\\\"[all[current]!prefix\u003Cprefix>]\\\">\\n\u003C$text text=\u003C\u003Ctype>> />\\n\u003C/$list>\\n\u003C/$vars>\\n\"},\"$:/plugins/flibbles/relink/ui/components/tables\":{\"title\":\"$:/plugins/flibbles/relink/ui/components/tables\",\"text\":\"\\\\define .make-table(title, plugin, default-table-state:yes)\\n\\\\whitespace trim\\n\\n\u003C$list variable=\\\"render\\\" filter=\\\"[relink:signatures\u003C__plugin__>prefix\u003C__category__>first[]]\\\">\\n\u003C$vars table-state=\u003C\u003Cqualify \\\"\\\"\\\"$:/state/flibbles/relink/tables/$plugin$\\\"\\\"\\\">>>\\n\u003Ctr>\u003Cth class=\\\"tc-relink-header-plugin\\\" colspan=\u003C\u003Ccolumn-count>> >\\n\u003C$reveal type=\\\"nomatch\\\" state=\u003C\u003Ctable-state>> text=\\\"yes\\\" default=\\\"\\\"\\\"$default-table-state$\\\"\\\"\\\">\\n\u003C$button class=\\\"tc-btn-invisible tc-btn-dropdown\\\" set=\u003C\u003Ctable-state>> setTo=\\\"yes\\\">\\n{{$:/core/images/right-arrow}}&#32;$title$\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" state=\u003C\u003Ctable-state>> text=\\\"yes\\\" default=\\\"\\\"\\\"$default-table-state$\\\"\\\"\\\">\\n\u003C$button class=\\\"tc-btn-invisible tc-btn-dropdown\\\" set=\u003C\u003Ctable-state>> setTo=\\\"no\\\">\\n{{$:/core/images/down-arrow}}&#32;$title$\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C/th>\u003C/tr>\\n\u003C$list\\n\\tvariable=\\\"signature\\\"\\n\\tfilter=\\\"[relink:signatures\u003C__plugin__>prefix\u003C__category__>sort[]]\\\">\\n\u003C$vars key={{{ [\u003Csignature>removeprefix\u003C__category__>removeprefix[/]] }}} >\\n\u003C$tiddler tiddler={{{[\u003Csignature>relink:source[]]}}} >\\n\u003C$reveal tag=\\\"tr\\\" type=\\\"match\\\" state=\u003C\u003Ctable-state>> text=\\\"yes\\\" default=\\\"\\\"\\\"$default-table-state$\\\"\\\"\\\">\\n\u003C$macrocall $name=\u003C\u003C__list-row-macro__>> signature=\u003C\u003Csignature>> />\\n\u003Ctd class=\\\"tc-relink-column-type\\\">{{||$:/plugins/flibbles/relink/ui/components/select-fieldtype}}\u003C/td>\\n\u003Ctd class=\\\"tc-relink-column-delete\\\">{{||$:/plugins/flibbles/r

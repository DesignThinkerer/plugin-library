{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/customwidgets/link\":{\"text\":\"\\\\widget $link()\\n\\\\function link.icon()\\n\\t[\u003Cparams-var>jsonget[to]else\u003CcurrentTiddler>get[icon]]\\n\\\\end link.icon\\n\\\\function link.text()\\n\\t[\u003Cparams-var>jsonget[to]else\u003CcurrentTiddler>]\\n\\\\end link.text\\n\\\\whitespace trim\\n\u003C$parameters $params=\\\"params-var\\\">\\n\\t\u003C$genesis\\n\\t\\t$type=\\\"$link\\\"\\n\\t\\t$remappable=\\\"no\\\"\\n\\t\\t$names=\\\"[\u003Cparams-var>jsonindexes[]]\\\"\\n\\t\\t$values=\\\"[\u003Cparams-var>jsonindexes[]] :map[\u003Cparams-var>jsonget\u003CcurrentTiddler>]\\\"\\n\\t>\\n\\t\\t\u003C%if [\u003Clink.icon>]%>\\n\\t\\t\\t\u003Cspan class=\\\"tc-titlebar tc-tiddler-title-icon\\\" style=\\\"fill:var(--tpc-tiddler-link-foreground);font-size:1em\\\">\\n\\t\\t\\t\\t\u003C$transclude $tiddler=\u003C\u003Clink.icon>> />\\n\\t\\t\\t\u003C/span>\\n\\t\\t\u003C%endif%>\\n\\t\\t\u003C$slot $name=\\\"ts-raw\\\">\\n\\t\\t\\t\u003C$text text=\u003C\u003Clink.text>> />\\n\\t\\t\u003C/$slot>\\n\\t\u003C/$genesis>\\n\u003C/$parameters>\\n\\\\end\\n\\n\u003C\u003Clist-links \\\"$:/plugins/theophile.dev/shortcuts/backtick\\\">>\",\"tags\":\"$:/plugins/theophile.dev/bettercode $:/tags/Global/View/Body\"},\"$:/plugins/theophile.dev/customwidgets/readme\":{\"text\":\"\u003C\u003Clist-links \\\"[all[tiddlers+shadows]has[icon]!prefix[$:/temp/]]\\\">>\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.2","description":"Plugin packaged with plugin-maker","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/customwidgets"},
{"text":"{\"tiddlers\":{\"$:/macros/editor\":{\"text\":\"\\\\define editor(field:\\\"text\\\",placeholder,tiddler,tag:\\\"input\\\",class)\\n\\\\define editor-buttons(filter,style)\\n\u003Cdiv style=\u003C\u003C__style__>> class=\\\"editor-buttons\\\">\\n\u003C$list filter=\\\"\\n[[$:/tags/EditorToolbar]tagging[]!is[draft]]\\n:filter[\u003Cconfig-visibility-title>get[text]else[]!match[hide]]\\n:filter[$filter$]\\\">\\n\u003Cdiv style=\\\"position:absolute;top:0;left:0;visibility:hidden\\\">\u003C$transclude tiddler=\\\"$:/core/ui/EditTemplate/body/toolbar/button\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/div>\\n\\\\end editor-buttons\\n\u003C$tiddler tiddler={{{ [\u003C__tiddler__>!is[blank]else\u003CcurrentTiddler>] }}}>\\n@@position:relative;\\n\u003C$edit\\nclass=\\\"tc-edit-texteditor tc-edit-texteditor-body $class$\\\"\\ntabindex={{$:/config/EditTabIndex}}\\nfocus={{{ [{$:/config/AutoFocus}match[text]then[yes]] }}}\\ncancelPopups=\\\"yes\\\"\\nfield=\u003C\u003C__field__>>\\ntag=\u003C\u003C__tag__>>\\nplaceholder=\u003C\u003C__placeholder__>>\\n>\\n\u003C\u003Ceditor-buttons \\\"has[dropdown]\\\" \\\"position:absolute;left:0;top:0;\\\">> \u003C\u003Ceditor-buttons \\\"!has[dropdown]\\\" \\\"display:none\\\">>\\n\u003C/$edit>\\n\u003Cstyle>\\n.editor-buttons .tc-drop-down.tc-popup-keep{visibility: initial}\\niframe.tc-edit-texteditor.tc-edit-texteditor-body.editor.full-width{width:100%;}\\n\u003C/style>\\n@@\\n\u003C/$tiddler>\\n\\\\end editor\",\"tags\":\"$:/tags/Global\",\"code-body\":\"yes\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Macro to create a textarea with keyboard support","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/editor"},
{"text":"{\"tiddlers\":{\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-indent\":{\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"indent\\\"\\n/>\\n\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]] [\u003CtargetTiddler>type[text/markdown]] :filter[[$:/plugins/sq/editor-autolist]is[tiddler]]\",\"icon\":\"$:/plugins/sq/editor-autolist/indent.svg\",\"shortcuts\":\"((autolist-indent))\",\"tags\":\"$:/tags/EditorToolbar\",\"list-after\":\"$:/core/ui/EditorToolbar/list-number\",\"caption\":\"Indent list items\",\"description\":\"Indent list items\",\"type\":\"\"},\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-newline\":{\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"newline\\\"\\n/>\\n\",\"button-classes\":\"sq-text-editor-btn-hidden\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]]  [\u003CtargetTiddler>type[text/markdown]] :filter[[$:/plugins/sq/editor-autolist]is[tiddler]]\",\"icon\":\"$:/core/images/list-bullet\",\"shortcuts\":\"((autolist-newline))\",\"tags\":\"$:/tags/EditorToolbar\"},\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-unindent\":{\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"unindent\\\"\\n/>\\n\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]]  [\u003CtargetTiddler>type[text/markdown]] :filter[[$:/plugins/sq/editor-autolist]is[tiddler]]\",\"icon\":\"$:/plugins/sq/editor-autolist/unindent.svg\",\"shortcuts\":\"((autolist-unindent))\",\"tags\":\"$:/tags/EditorToolbar\",\"list-after\":\"$:/core/ui/EditorToolbar/list-number\",\"caption\":\"Unindent list items\",\"description\":\"Unindent list items\"},\"$:/plugins/theophile.dev/editor-autolist-tweak/readme\":{\"text\":\"Very small tweak for saq's editor-autolist plugin, enabling the plugin on markdown tiddlers.\"}}}","core-version":"5.3.6","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Tweak for saq's editor-autolist plugin enabling the plugin on markdown tiddlers","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","parent-plugin":"$:/plugins/sq/editor-autolist","title":"$:/plugins/theophile.dev/editor-autolist-tweak"},
{"created":"20241216212250243","creator":"theophile.dev","text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/feedback/readme\":{\"text\":\"This plugin allow user to leave a feedback.\"},\"$:/plugins/theophile.dev/feedback/roadmap\":{\"text\":\"Re-use code from https://send-form.tiddlyhost.com/\"},\"$:/plugins/theophile.dev/feedback/ui\":{\"text\":\"\\\\define prompts()\\nSo.. what do you think?\\nWe're always looking for ways to improve!\\nWe're all ears 🐰\\nTell us what is missing !\\nSpill the beans 💣\\nWhat do you think?\\nLeave some feedback for us!\\nWe need your help 👋\\nYour feedback is valuable and helps us make {{$:/SiteTitle}} better.\\nYour thoughts matter to us 💡\\nWe appreciate your support 🙏\\nMake it count!\\nYour feedback is valuable 💯\\n\\\\end\\n\\n\\\\define choices()\\n💡 I have a suggestion\\n🐛 I want to report a bug\\n👍 I appreciate the work\\n📂 Something else\\n\\\\end\\n\\n\\\\procedure submitActions()\\n\u003C$action-setfield prompt=\\\"\\\" answer=\\\"\\\" choice=\\\"\\\"/>\\n\\\\end\\n\\n\\\\procedure pickPromptAction()\\n\u003C% if [{!!prompt}is[blank]] %>\\n\u003C$list filter=\\\"[\u003Cprompts>splitregexp[\\\\n]count[]subtract[1]multiply\u003Cr>round[]]:reduce[\u003Cprompts>splitregexp[\\\\n]zth\u003CcurrentTiddler>]\\\" variable=\\\"prompt\\\">\\n\u003C$action-setfield prompt=\u003C\u003Cprompt>> />\\n\u003C/$list>\\n\u003C% else %>\\n\u003C$action-setfield prompt=\\\"\\\" answer=\\\"\\\" choice=\\\"\\\"/>\\n\u003C% endif %>\\n\\\\end\\n\\n\u003C$tiddler tiddler=\\\"$:/temp/feedback\\\">\\n\\n\u003C$button actions=\u003C\u003CpickPromptAction>> tooltip=\\\"Feedback\\\">\\n\u003C% if [{!!prompt}is[blank]] %>\\n{{$:/core/images/plugin-generic-language}}\\n\u003C% else %>\\n{{$:/core/images/cancel-button}}\\n\u003C% endif %>\\n\u003C/$button>\\n\\n\u003C% if [{!!prompt}!is[blank]] %>\\n\\n\u003Csmall>{{!!prompt}}\u003C/small>\\n\\n\u003C% if [{!!choice}!is[blank]] %>\\n\\n!! {{!!choice}} \u003C$button set=\\\"!!choice\\\" setTo=\\\"\\\">{{$:/core/images/left-arrow}}\u003C/$button>\\n\\n\u003C$edit tag=\\\"textarea\\\" field=\\\"answer\\\" class=\\\"tc-edit-texteditor\\\" placeholder=\\\"What a lovely wiki!\\\"/>\\n\\n\u003C$button disabled=\\\"yes\\\" tooltip=\\\"work in progress\\\" actions=\u003C\u003CsubmitActions>> >Send Feedback {{$:/core/images/mail}}\u003C/$button>\\n\\n\u003C% else %>\\n\\n!! What do you think about this?\\n\\n\u003Cdiv class=\\\"choices\\\">\\n\u003C$list filter=\\\"[\u003Cchoices>splitregexp[\\\\n]]\\\" variable=\\\"choice\\\">\\n\u003C$radio field=\\\"choice\\\" value=\u003C\u003Cchoice>> >\u003C\u003Cchoice>>\u003C/$radio>\\n\u003C/$list>\\n\u003C/div>\\n\\n\u003C% endif %>\\n\u003C% endif %>\\n\u003C/$tiddler>\"},\"$:/plugins/theophile.dev/feedback/ui/style\":{\"text\":\".choices{\\ndisplay:flex;\\ngap:1ch;\\nflex-wrap:wrap;\\ninput{\\nappearance:none;\\n}\\nlabel{\\noutline:solid 1px;\\npadding:1ch;\\nborder-radius:3px;\\ntransition:outline-color .1s ease;\\n&:hover{\\noutline-color:highlight;\\n}\\n}\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"},\"$:/tags/macro/random.js\":{\"text\":\"exports.name = \\\"r\\\";\\n\\nexports.params = [];\\n\\nexports.run = function() {\\n return Math.random();\\n};\",\"module-type\":\"macro\",\"tags\":\"$:/tags/Macro\",\"type\":\"application/javascript\",\"revision\":\"0\",\"bag\":\"default\"}}}","core-version":"5.3.6","type":"application/json","author":"theophile.dev","list":"readme roadmap","version":"0.0.1","description":"Allow users to leave a feedback","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/feedback","name":"feedback","modified":"20241216212428106","modifier":"theophile.dev","source":"https://plugin-library.tiddlyhost.com"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\":{\"text\":\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\n\\n[ℹ️[Hide deprecated plugins]]\\n-[stability[STABILITY_0_DEPRECATED]]\",\"tags\":\"\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq\":{\"text\":\"\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\",\"list\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq/installing $:/plugins/theophile.dev/githubpluginlibrary/faq/library $:/plugins/theophile.dev/githubpluginlibrary/faq/plugin $:/plugins/theophile.dev/githubpluginlibrary/faq/pack $:/plugins/theophile.dev/githubpluginlibrary/faq/how\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/how\":{\"text\":\"# ''Startup Module'': A [[startup JavaScript module|$:/plugins/theophile.dev/githubpluginlibrary/libraryserver.js]] (`module-type: startup`) initializes automatically when the wiki boots, setting up a secure `window.postMessage` listener. \\n# ''Communication'': When you open the plugin library, your wiki loads the library inside a hidden `iframe` and sends a `GET` request using `window.postMessage`.\\n# ''Dynamic Indexing'': The startup script intercepts the message, evaluates the filter defined in the [[assetList|$:/plugins/theophile.dev/githubpluginlibrary/assetList]] tiddler at runtime, compiles the metadata, icons, and readmes, and replies with a clean JSON array.\\n# ''Plugin Request'': When you select a plugin to install, TiddlyWiki requests that specific plugin title via `postMessage`.\\n# ''In-Memory Extraction'': The library instantly fetches the tiddler directly from the local in-memory store using `$tw.wiki.getTiddler()`, serializes its fields, and returns it to your wiki.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How does this work?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/installing\":{\"text\":\"\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\">\\nSimply drag and drop \u003C$link>this link\u003C/$link> into your TiddlyWiki.\\n\u003C/$tiddler>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How do I install the TPL library in my wiki?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/library\":{\"text\":\"Drag and drop the [[githubpluginlibrary plugin|$:/plugins/theophile.dev/githubpluginlibrary]] into your existing wiki hosted on github page. \",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How can I create my own plugin library ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/pack\":{\"text\":\"If you frequently install the same set of plugins, you can bundle them. There are two approaches:\\n\\n# ''Dependency Method (Recommended)'': Create a plugin that will list other plugins as dependencies. This keeps your library lightweight. \u003Cem>Note: The dependent plugins must be installed in the same plugin library.\u003C/em>\\n# ''Monolith Method'': Create a single plugin containing the code of all other plugins. \u003Cem>This is not recommended as it duplicates code and increases file size.\u003C/em>\\n\\n\\n> See $:/plugins/theophile.dev/starterpack for a reference implementation of the //Dependency Method//.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary $:/plugins/theophile.dev/githubpluginlibrary/faq\",\"caption\":\"How to create a pack of plugins ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/plugin\":{\"text\":\"!! Method 1: Using the [ext[plugin-maker|https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker]] (Recommended)\\n\\n# Open the ''[[plugin-maker|$:/plugins/theophile.dev/plugin-maker]]''.\\n# Fill in the required form fields.\\n# Click on the button to ''package'' or ''update'' the plugin\\n\\n//Note: If you require more advanced features, consider using [ext[Gatha|https://kookma.github.io/TW-Gatha]].//\\n\\n!! Method 2: Creating a Plugin Manually\\n\\n\u003Col>\\n\u003Cli>\\n\\nCreate the tiddlers to be added to your plugin. A good practice is to use the same prefix (or namespace) for each tiddlers if possible, to avoid accidentally overriding another tiddler. For example: $:/plugins/theophile.dev/githubpluginlibrary\\n\\n\u003C/li>\\n\u003Cli>\\n\\nDrag and drop these tiddlers in a wiki open in a another tab (e.g., [ext[https://tiddlywiki.com/empty|https://tiddlywiki.com/empty]]).\\n\\n\u003C/li>\\n\u003Cli>This will open the `$:/Import` tiddler. \u003Cem>Do not click \u003Ckbd>Import\u003C/kbd>\u003C/em>. Instead, edit the tiddler:\\n\u003Cul>\\n\u003Cli>\\nChange the title to your chosen plugin prefix.\\n\u003C/li>\\n\u003Cli>\\nSet the `plugin-type` field to `plugin`\\n\u003C/li>\\n\u003Cli>\\nRemove the field `status`\\n\u003C/li>\\n\u003Cli>\\nAdd a `list` field containing the names of the tiddlers to be listed in the tabbed view for the plugin (e.g., listing `$:/plugins/theophile.dev/githubpluginlibrary/readme` will add a \\\"readme\\\" tab in the plugin view).\\n\u003C/li>\\n\u003Cli>\\nAdd a `version` field. You can follow the rules defined at https://semver.org\\n\u003C/li>\\n\u003C/ul>\\n\u003C/li>\\n\u003Cli>\\nSave your changes, then drag and drop the resulting plugin back into your plugin library wiki.\\n\u003C/li>\\n\u003C/ol>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"How to create a plugin ?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/faq/why\":{\"text\":\"Creating a plugin library centralizes your tools and content. You can:\\n\\n* Apply and automatically update custom tweaks across multiple wikis.\\n* Distribute your original plugins, books, blogs .. from a single source.\\n* Host an easily accessible collection of your favorite plugins.\\n* Collaborate with other people to push content to a single wiki.\\n* If you are a teacher, deliver lessons and assignments as plugins so students can safely update their materials without overwriting personal notes.\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary/faq $:/plugins/theophile.dev/githubpluginlibrary\",\"caption\":\"Why would I need my own plugin library?\"},\"$:/plugins/theophile.dev/githubpluginlibrary/icon\":{\"text\":\"{{$:/core/images/plugin-generic-theme}}\"},\"$:/plugins/theophile.dev/githubpluginlibrary/libraryserver.js\":{\"text\":\"/*\\\\ \\ntitle: $:/plugins/theophile.dev/githubpluginlibrary/libraryserver.js \\ntype: application/javascript \\nmodule-type: startup\\n\\nA lightning-fast HTTP-over-window.postMessage implementation. \\nFully optimized using native TiddlyWiki core utility methods.\\n\\\\*/\\n(function () {\\n  \\\"use strict\\\";\\n\\n  exports.name = \\\"plugin-library-server\\\";\\n  exports.platforms = [\\\"browser\\\"];\\n  exports.after = [\\\"startup\\\"];\\n  exports.synchronous = true;\\n\\n  exports.startup = function() {\\n    \\n    window.addEventListener(\\\"message\\\", function listener(event) {\\n      if (!event.data || typeof event.data !== \\\"object\\\" || event.data.verb !== \\\"GET\\\") {\\n        return; \\n      }\\n      handleGetRequest(event);\\n    }, false);\\n\\n    function sendResponse(event, status, type, body) {\\n      if (!event.source) return;\\n\\n      event.source.postMessage({\\n        verb: \\\"GET-RESPONSE\\\",\\n        status: status.toString(),\\n        cookies: event.data.cookies,\\n        url: event.data.url,\\n        type: type,\\n        body: body\\n      }, \\\"*\\\");\\n    }\\n\\n    function handleGetRequest(event) {\\n      var url = event.data.url || \\\"\\\";\\n\\n      // --- Route A: Main Asset List ---\\n      if (url === \\\"recipes/library/tiddlers.json\\\") {\\n        try {\\n          var filterTiddler = $tw.wiki.getTiddler(\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\");\\n          var filter = filterTiddler && filterTiddler.fields.text ? filterTiddler.fields.text : \\\"[plugin-type[plugin]]\\\";\\n\\n          var pluginTitles = $tw.wiki.filterTiddlers(filter);\\n          var assetList = [];\\n\\n          $tw.utils.each(pluginTitles, function(title) {\\n            var tiddler = $tw.wiki.getTiddler(title);\\n            if (tiddler) {\\n              \\n              var asset = tiddler.getFieldStrings();\\n              delete asset.text; \\n\\n              var readmeText = $tw.wiki.getTiddlerText(title + \\\"/readme\\\");\\n              if (readmeText) asset.readme = readmeText;\\n\\n              var iconTiddler = $tw.wiki.getTiddler(title + \\\"/icon\\\");\\n              // Using $tw.utils.hop for safe property lookup\\n              if (iconTiddler && $tw.utils.hop(iconTiddler.fields, \\\"text\\\")) {\\n                var iconType = iconTiddler.fields.type || \\\"text/vnd.tiddlywiki\\\";\\n                \\n                if (iconTiddler.fields._canonical_uri) {\\n                  asset.icon = iconTiddler.fields._canonical_uri;\\n                } else if (iconType === \\\"image/svg+xml\\\" || iconType === \\\"text/vnd.tiddlywiki\\\" || !iconTiddler.fields.type) {\\n                  \\n                  var renderedIcon = $tw.wiki.renderText(\\\"text/html\\\", \\\"text/vnd.tiddlywiki\\\", iconTiddler.fields.text, {\\n                    parseAsInline: true\\n                  }).trim();\\n                  \\n                  if (/\u003Csvg\\\\b/i.test(renderedIcon) && !/\\\\bxmlns\\\\s*=/i.test(renderedIcon)) {\\n                    renderedIcon = renderedIcon.replace(/\u003Csvg\\\\b/i, '\u003Csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" ');\\n                  }\\n\\n                  asset.icon = \\\"data:image/svg+xml;charset=utf-8,\\\" + encodeURIComponent(renderedIcon);\\n                } else {\\n                  asset.icon = \\\"data:\\\" + iconType + \\\";base64,\\\" + iconTiddler.fields.text;\\n                }\\n              }\\n\\n              assetList.push(asset);\\n            }\\n          });\\n\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(assetList, null, 4));\\n\\n        } catch (e) {\\n          console.error(\\\"Plugin Library: Failed to generate asset list\\\", e);\\n          sendResponse(event, 500, \\\"text/plain\\\", \\\"Internal Server Error\\\");\\n        }\\n      } \\n      // --- Route B: Specific Plugin Request ---\\n      else if ($tw.utils.startsWith(url, \\\"recipes/library/tiddlers/\\\")) {\\n        var pluginTitle = url.substring(\\\"recipes/library/tiddlers/\\\".length);\\n\\n        if (pluginTitle.endsWith(\\\".json\\\")) {\\n          pluginTitle = pluginTitle.slice(0, -5);\\n        }\\n        \\n        try {\\n          pluginTitle = decodeURIComponent(pluginTitle);\\n        } catch (e) {\\n          return sendResponse(event, 400, \\\"text/plain\\\", \\\"Bad Request: Malformed URI\\\");\\n        }\\n\\n        var tiddler = $tw.wiki.getTiddler(pluginTitle);\\n\\n        if (tiddler) {\\n          var formattedFields = tiddler.getFieldStrings();\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(formattedFields, null, 4));\\n        } else {\\n          sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n        }\\n      } \\n      // --- Route C: Unknown ---\\n      else {\\n        sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n      }\\n    }\\n  };\\n})();\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\",\"code-body\":\"yes\",\"type\":\"application/javascript\",\"module-type\":\"startup\"},\"$:/plugins/theophile.dev/githubpluginlibrary/packager\":{\"text\":\"{{$:/plugins/theophile.dev/plugin-maker/packager}}\"},\"$:/plugins/theophile.dev/githubpluginlibrary/PluginsIncluded\":{\"text\":\"\u003C$let qualified-state=\u003C\u003Cqualify \\\"$:/state/plugin-info\\\">> >\\n\u003C$list filter={{$:/plugins/theophile.dev/githubpluginlibrary/assetList}} emptyMessage=\u003C\u003Clingo \\\"Empty/Hint\\\">>  template=\\\"$:/core/ui/Components/plugin-info\\\"/>\\n\u003C/$let>\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\"},\"$:/plugins/theophile.dev/githubpluginlibrary/readme\":{\"text\":\"{{$:/plugins/theophile.dev/githubpluginlibrary/faq/installing}}\\n\\n{{||$:/plugins/theophile.dev/Commons/templates/readme}}\",\"tags\":\"$:/tags/PluginLibrary $:/plugins/theophile.dev/githubpluginlibrary\",\"url\":\"https://plugins.theophile.dev/\",\"caption\":\"Github Plugin Library\",\"filter\":\"[plugin-type[plugin]] -$:/core\"},\"$:/plugins/theophile.dev/githubpluginlibrary/reset\":{\"text\":\"\\\\procedure action-reset-library()\\n\u003C$action-deletetiddler $filter=\\\"\\n[has[plugin-type]!author[JeremyRuston]]\\n-$:/plugins/theophile.dev/githubpluginlibrary\\n-$:/plugins/theophile.dev/plugin-maker\\n\\\"/>\\n\u003C$action-setfield $tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\" $field=\\\"filter\\\" $value=\\\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\\"/>\\n\\\\end\\n\\n\u003C$button actions=\u003C\u003Caction-reset-library>>>reset the library\u003C/$button>\",\"tags\":\"\"},\"$:/plugins/theophile.dev/githubpluginlibrary/settings\":{\"text\":\"Library name: \u003C$edit tag=\\\"input\\\" tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\" field=\\\"caption\\\"/>\\n\\n\\n[[Filter expression|https://tiddlywiki.com/static/Filters.html]] for listing the plugins to be included:\\n\u003C$edit tag=\\\"textarea\\\" tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/assetList\\\" class=\\\"tc-edit-texteditor tc-edit-texteditor-body\\\"/>\\n\\n{{$:/plugins/theophile.dev/githubpluginlibrary/PluginsIncluded}}\",\"tags\":\"$:/plugins/theophile.dev/githubpluginlibrary\"},\"$:/plugins/theophile.dev/githubpluginlibrary/updatelibrary\":{\"text\":\"\u003C!--\\nThis tiddler update the url of the library tiddler to keep it in sync with the current url of the wiki.\\n-->\\n\u003C$action-setfield \\n$tiddler=\\\"$:/plugins/theophile.dev/githubpluginlibrary/readme\\\" \\nurl={{$:/info/url/full}}\\n/>\",\"tags\":\"$:/tags/StartupAction $:/plugins/theophile.dev/githubpluginlibrary\",\"code-body\":\"yes\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme settings packager","version":"0.0.2","description":"Github Plugin Library","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","dependents":"$:/plugins/theophile.dev/plugin-maker","title":"$:/plugins/theophile.dev/githubpluginlibrary"},

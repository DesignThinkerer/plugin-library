{"created":"20230404085047156","creator":"Télumire","text":"\\whitespace trim\n\\define actions()\n\u003C$action-sendmessage \n  $message=\"tm-open-window\" \n  template=\"$:/ui/template/edit-in-new-window\"\n  width=\"640\"\n  height=\"480\"\n  windowTitle=`Edit $(currentTiddler)$`\n/>\n\\end\n\n\u003C$button \nactions=\u003C\u003Cactions>> \ntooltip=\"Open a new window to edit the tiddler\"\naria-label=\"edit tiddler in new window\"\nclass=\u003C\u003Ctv-config-toolbar-class>> \n>\n\u003C$list filter=\"[\u003Ctv-config-toolbar-icons>match[yes]]\">\n{{$:/images/open-edit-window}}\n\u003C/$list>\n\u003C$list filter=\"[\u003Ctv-config-toolbar-text>match[yes]]\">\n\u003Cspan class=\"tc-btn-text\">Edit in a new window\u003C/span>\n\u003C/$list>\n\u003C/$button>","tags":"$:/tags/ViewToolbar","title":"$:/ui/Buttons/edit-in-new-window","modified":"20260214003747126","modifier":"theophile.dev"},
{"created":"20230404123746647","creator":"Télumire","text":"\\import $:/macros/editor\n\u003Cstyle>\nhtml:has(.tc-single-tiddler-window) .tc-edit-texteditor-body{\nposition:fixed;\ninset:0;\nwidth:100vw;\nheight:100vh!important;\nborder: 0 !important;\nresize: none!important;\n}\n\u003C/style>\n\u003C\u003Ceditor tag:textarea>>","tags":"","title":"$:/ui/template/edit-in-new-window","modified":"20260214003713472","modifier":"theophile.dev","code-body":"yes"},
{"created":"20241218163101474","creator":"theophile.dev","text":"!! Using emojis in variable name\n\n* [[Pragma: \\define|https://tiddlywiki.com/#Pragma%3A%20%5Cdefine]] : 📖 (definition)\n* [[Pragma: \\function|https://tiddlywiki.com/#Pragma%3A%20%5Cfunction]] : 🔧 (perform work)\n* [[Pragma: \\import|https://tiddlywiki.com/#Pragma%3A%20%5Cimport]] : 📥 (for variables to be imported)\n* [[Pragma: \\parameters|https://tiddlywiki.com/#Pragma%3A%20%5Cparameters]] : 🔢 (variable data)\n* [[Pragma: \\procedure|https://tiddlywiki.com/#Pragma%3A%20%5Cprocedure]] : 📜(steps or instructions)\n* [[Pragma: \\widget|https://tiddlywiki.com/#Pragma%3A%20%5Cwidget]] : 🧩 (modular component)\n\n!! Emojis used to denote sections\n\n  * 🧮 for logic\n  * 🧱 for markup\n  * 🎨 for styling\n  * 📃 for assembling all parts together\n\n!! Comments\n\n```\n\\function .ℹ️() [all[]]\n\u003C$list filter=\"\n [.ℹ️[This is a comment]]\n[[HelloThere]]\n\" />\n ```","tags":"","title":"$:/wip/Coding guide","modified":"20250407082723650","modifier":"theophile.dev"},
{"created":"20241215103819801","creator":"theophile.dev","text":"\\function .get() [\u003Ctiddler>get{!!title}]\n\n\\function json.fields(tiddler,exclude)\n[\u003Ctiddler>fields:exclude:\u003Cexclude>]:filter[.get[]]\n:reduce[\u003Caccumulator>jsonset{!!title},\u003C.get>]~{}\n\\end\n\n\\function json.tiddler(tiddler,exclude)\n[json.fields\u003Ctiddler>,\u003Cexclude>filter\u003Ctiddler>]\n:map[[\"$(tiddler)$\":$(currentTiddler)$]substitute[]]\n\\end\n\n\\function plugin.filter(plugin,filter) \"\"\"[\u003Cplugin>plugintiddlers[]] [prefix\u003Cplugin>!\u003Cplugin>] $(filter)$\"\"\" +[substitute[]]:map:flat[subfilter{!!title}]\n\n\\function json.tiddlers(plugin,filter)\n[plugin.filter\u003Cplugin>,\u003Cfilter>]\n:map[json.tiddler{!!title},[created creator modified modifier title]]\n+[join[,]]\n:map[[{\"tiddlers\": {$(currentTiddler)$}}]substitute[]]\n\\end\n\n\\function to.plugin(plugin,filter)\n[json.tiddlers\u003Cplugin>,\u003Cfilter>]:map[json.fields\u003Cplugin>,[created creator modified modifier text]jsonset[text],{!!title}]\n\\end\n\n\\function get.destField(subTiddler,field) [\u003CsubTiddler>get\u003Cfield>]\n\n\\function get.sourceField(subTiddler,field) [\u003CsubTiddler>shadowsource[]get[text]jsonget[tiddlers],\u003CsubTiddler>,\u003Cfield>]\n\n\\function get.sourceFields(subTiddler) [\u003CsubTiddler>shadowsource[]]:map:flat[\u003CsubTiddler>subtiddlerfields{!!title}]\n\n\\function has.diff(subTiddler,field) [get.destField\u003CsubTiddler>,\u003Cfield>else[]]:filter[get.sourceField\u003CsubTiddler>,\u003Cfield>else[]!match{!!title}]\n\n\\function diff.fields(subTiddler) [get.sourceFields\u003CsubTiddler>] [\u003CsubTiddler>fields:exclude[created creator modified modifier title]] :filter[has.diff\u003CsubTiddler>,{!!title}]\n\n\\procedure subTiddler-list-item(subTiddler,plugin)\n\\procedure subTiddler-link()\n\u003C$link to=\u003C\u003CsubTiddler>> >\n\u003C%if [\u003CsubTiddler>prefix\u003Cplugin>]%>\n\u003C$link to={{!!plugin}} overrideClass=\"tc-system-title-prefix\">../\u003C/$link>\u003C$text text={{{ [\u003CsubTiddler>removeprefix\u003Cplugin>trim[/]] }}}/>\n\u003C%else%>\n\u003C$text text=\u003C\u003CsubTiddler>> />\n\u003C%endif%>\n\u003C/$link>\n\\end subTiddler-link\n\u003C$let state=`$:/state/peek-tiddler/open/$(subTiddler)$$(qualify)$`>\n\u003Cli>\n\u003C\u003CsubTiddler-link>>\n\u003C%if [diff.fields\u003CsubTiddler>] %>\n\u003C$checkbox tiddler=\u003C\u003Cstate>> field=\"text\" checked=\"show\" class=\"tc-btn-invisible\">\n\u003C%if [\u003Cstate>get[text]]%>{{$:/core/images/cancel-button}}\u003C%else%>{{$:/core/images/info-button}}\u003C%endif%>\n\u003C/$checkbox>\n\u003C%endif%>\n\u003C%if [\u003Cstate>get[text]]%>\n\u003C$list filter=\"[diff.fields\u003CsubTiddler>]\" variable=\"field\">\n\u003C$diff-text source={{{ [get.sourceField\u003CsubTiddler>,\u003Cfield>] }}} dest={{{ [get.destField\u003CsubTiddler>,\u003Cfield>] }}} >\n\u003Ccode>\u003C\u003Cfield>>\u003C/code>: \u003C\u003Cdiff-count>> difference\u003C%if [\u003Cdiff-count>!match[1]]%>s\u003C%endif%>\n\u003C/$diff-text>\n\u003C/$list>\n\u003C%endif%>\n\u003C/li>\n\u003C/$let>\n\\end subTiddler-list-item\n\n\\procedure list-plugin-tiddlers()\n\u003C$link to={{!!plugin}}/>\n\n\u003Col>\n\u003C$list filter=\"[plugin.filter{!!plugin},{!!filter}]\" variable=\"subTiddler\">\n\u003C$transclude $variable=\"subTiddler-list-item\" subTiddler=\u003C\u003CsubTiddler>> plugin={{!!plugin}}/>\n\u003C/$list>\n\u003C/ol>\n\\end\n\n\\procedure select-plugin()\n\u003C$select field=\"plugin\">\u003C$list filter=\"[plugin-type[plugin]] -$:/core\">\u003Coption value={{!!title}}>\u003C$text text={{{ [{!!title}split[/]nth[4]] }}}/>\u003C/option>\u003C/$list>\u003C/$select>\n\\end\n\n\\procedure package-btn()\n\\define package-action()\n\u003C$action-setfield $tiddler={{!!plugin}} text={{{ [json.tiddlers{!!plugin},{!!filter}] }}}/>\n\\end package-action\n\u003C$button actions=\u003C\u003Cpackage-action>>>Update/Create\u003C/$button>\n\\end package-btn\n\n\u003Cform class=\"edit-info\">\n\u003Clabel>\u003Cspan>\u003C\u003Cselect-plugin>>\u003C/span>\u003C$edit field=\"plugin\"/>\u003C/label>\n\u003C$tiddler tiddler={{!!plugin}}>\n\u003C$list filter=\"author dependents description list name plugin-priority plugin-type parent-plugin source type version\" variable=\"field\">\n\u003Clabel>\u003Cspan>\u003C\u003Cfield>>\u003C/span>\u003C$edit field=\u003C\u003Cfield>> />\u003C/label>\n\u003C/$list>\n\u003C/$tiddler>\n\u003Clabel>\u003Cspan>Filter\u003C/span>\u003C$edit field=\"filter\" tag=\"textarea\"/>\u003C/label>\n\u003Clabel>\u003Cspan>Tiddlers\u003C/span>\u003Cspan>\u003C\u003Clist-plugin-tiddlers>>\u003C/span>\u003C/label>\n\u003C/form>\n\n\u003C\u003Cpackage-btn>>","tags":"","title":"$:/wip/Plugin maker v2","modified":"20250407082657243","modifier":"theophile.dev","filter":"$:/plugins/theophile.dev/new-plugin/readme","plugin":"$:/plugins/theophile.dev/nav"},
{"created":"20250208224918609","creator":"theophile.dev","text":"This wiki is a setup for creating, editing and publishing TiddlyWiki plugins in a single click, from tiddlywiki, without any extra tools.\n\n!! Getting Started\n\n{{$:/plugins/theophile.dev/plugin-library/faq||$:/plugins/theophile.dev/Commons/templates/faq}}","tags":"","title":"About","modified":"20260824063722378","modifier":"theophile.dev"},
{"created":"20260821223324326","creator":"theophile.dev","text":"I am excited to announce the release of a [[new plugin|$:/plugins/theophile.dev/rss-feed]] designed to allow your audience to follow your wiki. This new tool automatically generates a valid RSS 2.0 feed directly from your specified tiddlers and pushes the file from your wiki, straight to GitHub.","tags":"feed","title":"Announcing the RSS Feed Plugin","modified":"20260821230838997","modifier":"theophile.dev"},
{"created":"20260824004856482","creator":"theophile.dev","text":"I have updated the architecture of my TiddlyWiki plugin library to support fully static hosting platforms like GitHub Pages, removing the dependency on server-specific backend endpoints.\n\nUp until now, the plugin library typically relied on Tiddlyhost's JSON endpoints to serve plugin data. This new approach allows a plugin library to run anywhere (GitHub Pages, Tiddlyhost, etc) while maintaining full compatibility with any parent TiddlyWiki instance.\n\n!!! Key Technical Changes\n\n* Host-Agnostic via `postMessage`: Communication between the parent wiki and the library iframe uses a secure `window.postMessage` bridge, allowing the library to be hosted statically without server-side routing.\n* Startup Modules (`module-type: startup`): The library now uses a native TiddlyWiki startup module instead of manual script injection in the HTML head, ensuring clean execution timing during the boot sequence.\n* In-Memory Retrieval: When a user requests a plugin, the library extracts the tiddler directly from the local in-memory store using `$tw.wiki.getTiddler()`, avoiding secondary network roundtrips.\n* Native JavaScript Compilation: Metadata, readmes, and icons are processed and serialized in JavaScript. This replaces the previous wikitext macro approach, preventing parsing errors from unescaped quotes or missing SVG namespaces.\n\n!!! Links\n\nYou can view the updated implementation and live library at: 👉 https://plugins.theophile.dev\n\nThis approach will soon replace the current method used in this plugin library.","tags":"feed","title":"Host-Agnostic Static TiddlyWiki Plugin Library","modified":"20260824005400301","modifier":"theophile.dev"},
{"created":"20260822130618133","creator":"theophile.dev","text":"[[The RSS Feed plugin|$:/plugins/theophile.dev/rss-feed]] now has a [[Background Actions|https://tiddlywiki.com/#Background%20Actions]] that check when a tiddler is added or removed from the feed and automatically send the update to github. Note that modifications done to a tiddler are not detected, so if you want to update the feed after editing a tiddler, remember to manually send the feed to github using the button, or let the plugin update the feed when a new tiddler is added or removed from the feed. This feature can be disabled in the plugin settings.","tags":"feed","title":"RSS Feed Plugin 0.0.4: Added auto upload feature","modified":"20260823210037120","modifier":"theophile.dev"},

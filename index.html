t\\tif (!param.isPositional && param.name) {\\n\\t\\t\\t\\t\\tblurb += param.name;\\n\\t\\t\\t\\t\\tblurb += (param.assignmentOperator === '=')? '=': ': ';\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tblurb += value;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn blurb;\\n};\\n\",\"module-type\":\"relinkmacrocall\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/operator.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/operator.js\",\"text\":\"/*\\\\\\nmodule-type: relinkfilteroperator\\ntitle: $:/plugins/flibbles/relink-variables/operator.js\\ntype: application/javascript\\n\\nThis filter operator returns the names of all variables which are exportable by this tiddler. It does not remove duplicates.\\n\\n[[myTiddler]relink:variables[]] -> variables in order of appearance\\n\\n\\\\*/\\n\\nexports.variables = function(source, operator, options) {\\n\\tvar results = [];\\n\\tsource(function(tiddler, title) {\\n\\t\\tif (tiddler && tiddler.fields['module-type'] === \\\"macro\\\") {\\n\\t\\t\\t// This is a javascript module, probably\\n\\t\\t\\tvar module = require(title);\\n\\t\\t\\tif (module && module.name) {\\n\\t\\t\\t\\tresults.push(module.name);\\n\\t\\t\\t}\\n\\t\\t} else {\\n\\t\\t\\tvar parser = options.wiki.parseTiddler(title);\\n\\t\\t\\tif (parser) {\\n\\t\\t\\t\\t// ptn stands for parseTreeNode\\n\\t\\t\\t\\tvar ptn = parser.tree[0];\\n\\t\\t\\t\\twhile (ptn && (\\n\\t\\t\\t\\tptn.type === \\\"set\\\"\\n\\t\\t\\t\\t|| ptn.type === \\\"parameters\\\"\\n\\t\\t\\t\\t|| ptn.type === \\\"setvariable\\\")) {\\n\\t\\t\\t\\t\\tif (!ptn.isRelinkDefinition\\n\\t\\t\\t\\t\\t&& (ptn.isMacroDefinition\\n\\t\\t\\t\\t\\t || ptn.isFunctionDefinition\\n\\t\\t\\t\\t\\t || ptn.isProcedureDefinition\\n\\t\\t\\t\\t\\t || ptn.isWidgetDefinition)) {\\n\\t\\t\\t\\t\\t\\tvar name = ptn.attributes.name.value;\\n\\t\\t\\t\\t\\t\\tresults.push(name);\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tptn = ptn.children && ptn.children[0];\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t});\\n\\treturn results;\\n};\\n\",\"module-type\":\"relinkfilteroperator\",\"type\":\"application/javascript\"},\"$:/config/flibbles/relink/operators/function\":{\"title\":\"$:/config/flibbles/relink/operators/function\",\"text\":\"variable\"},\"$:/plugins/flibbles/relink-variables/readme\":{\"title\":\"$:/plugins/flibbles/relink-variables/readme\",\"text\":\"\\\\rules except wikilink\\n\\nSuplemental //Relink// plugins that allows for renaming of both globally defined and local variables through its own TiddlerInfo panel.\\n\"},\"$:/plugins/flibbles/relink-variables/relink.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/relink.js\",\"text\":\"/*\\\\\\nmodule-type: relinkpragma\\ntitle: $:/plugins/flibbles/relink-variables/relink.js\\ntype: application/javascript\\n\\nTakes care of relinking the \\\\relink pragma itself.\\n\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\nvar Rebuilder = require(\\\"$:/plugins/flibbles/relink/js/utils/rebuilder\\\");\\n\\nexports.name = 'variables';\\n\\nexports.report = function(rule, callback, options) {\\n\\tvar defTiddler = resolveDefiningTiddler(rule, rule.match[1], options);\\n\\tvarRelinker.reportForTitle(rule.match[1], function(title, blurb, style) {\\n\\t\\tcallback(title, \\\"\\\\\\\\relink \\\" + rule.match[2].trim(), style);\\n\\t}, defTiddler);\\n};\\n\\nexports.relink = function(rule, fromTitle, toTitle, options) {\\n\\tvar defTiddler = resolveDefiningTiddler(rule, rule.match[1], options);\\n\\tvar entry = varRelinker.relinkForTitle(rule.match[1], fromTitle, toTitle, defTiddler);\\n\\tif (entry && entry.output) {\\n\\t\\tvar signature =rule.match[0];\\n\\t\\tvar builder = new Rebuilder(signature);\\n\\t\\tvar startOfName = signature.indexOf(rule.match[1], 7);\\n\\t\\tbuilder.add(entry.output, startOfName, startOfName + rule.match[1].length);\\n\\t\\tentry.output = builder.results();\\n\\t}\\n\\treturn entry;\\n};\\n\\nfunction resolveDefiningTiddler(rule, macroName, options) {\\n\\tvar current = options.settings.widget.getVariable('currentTiddler');\\n\\tvar def = options.settings.getMacroDefinition(macroName);\\n\\tif (def && def.tiddler === current) {\\n\\t\\t// The definition for this \\\\relink is in this file, and it's in scope.\\n\\t\\t// This is obviously it.\\n\\t\\treturn current;\\n\\t}\\n\\tvar nextDefRegExp = new RegExp(\\\"\\\\\\\\s*\\\\\\\\\\\\\\\\(?:define|procedure|function|widget)\\\\\\\\s+\\\" + $tw.utils.escapeRegExp(macroName) + \\\"\\\\\\\\(\\\", \\\"mg\\\");\\n\\tnextDefRegExp.lastIndex = rule.parser.pos;\\n\\tvar match = nextDefRegExp.exec(rule.parser.source);\\n\\tif (match && match.index === rule.parser.pos) {\\n\\t\\t// The definition for this pragma comes immediately after this.\\n\\t\\t// That's almost certainly the one.\\n\\t\\treturn current;\\n\\t}\\n\\tif (def && def.tiddler) {\\n\\t\\t// There's a global definition elsewhere.\\n\\t\\t// That may be the one.\\n\\t\\treturn def.tiddler;\\n\\t}\\n\\t// We can't find the definition. It's probably later in this file.\\n\\treturn current;\\n};\\n\",\"module-type\":\"relinkpragma\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/style.css\":{\"title\":\"$:/plugins/flibbles/relink-variables/style.css\",\"tags\":\"$:/tags/Stylesheet\",\"text\":\".tc-relink-variables {\\n\\ttext-align: left;\\n}\\n\\n.tc-relink-variables > button {\\n\\twidth: 100%;\\n}\\n\\n.tc-relink-variables button:disabled > svg {\\n\\tfill: \u003C\u003Ccolour very-muted-foreground>>;\\n}\\n\\n.tc-relink-variables button:hover > svg {\\n\\tfill: \u003C\u003Ccolour tiddler-controls-foreground-hover>>;\\n}\\n\\n.tc-relink-variables button:selected > svg {\\n\\tfill: \u003C\u003Ccolour tiddler-controls-foreground-selected>>;\\n}\\n\\n.tc-relink-variables-count {\\n\\tcolor: \u003C\u003Ccolor muted-foreground>>;\\n}\\n\"},\"$:/plugins/flibbles/relink-variables/whitelist.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/whitelist.js\",\"text\":\"/*\\\\\\nmodule-type: relinkprefix\\ntitle: $:/plugins/flibbles/relink-variables/whitelist.js\\ntype: application/javascript\\n\\nUpdate the Relink whitelist for macro parameters.\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\n\\nexports.prefix = '$:/config/flibbles/relink/macros/';\\n\\nexports.report = function(tiddler, callback, options) {\\n\\tvar key = tiddler.fields.title.substr(exports.prefix.length);\\n\\tvar name = dir(key);\\n\\tvar macroParam = key.substr(name.length+1);\\n\\tvarRelinker.report(name, function(title, blurb, style) {\\n\\t\\tvar type = tiddler.fields.text;\\n\\t\\tcallback(title, \\\"#relink \\\" + macroParam + ':' + type, style);\\n\\t}, options);\\n};\\n\\nexports.relink = function(tiddler, fromTitle, toTitle, changes, options) {\\n\\tvar key = tiddler.fields.title.substr(exports.prefix.length);\\n\\tvar name = dir(key);\\n\\tvar entry = varRelinker.relink(name, fromTitle, toTitle, options);\\n\\tif (entry) {\\n\\t\\tif (entry.output) {\\n\\t\\t\\tentry.output = exports.prefix + entry.output + key.substr(name.length);\\n\\t\\t}\\n\\t\\tchanges.title = entry;\\n\\t}\\n};\\n\\n/* Returns all but the last bit of a path. path/to/tiddler -> path/to\\n */\\nfunction dir(string) {\\n    var index = string.lastIndexOf('/');\\n    if (index >= 0) {\\n        return string.substr(0, index);\\n    }\\n};\\n\",\"module-type\":\"relinkprefix\",\"type\":\"application/javascript\"}}}"},
{"name":"Editor AutoList","description":"Editor extension to automatically continue lists","author":"Saq Imtiaz","core-version":">=5.2.0","plugin-priority":"0","list":"readme","version":"0.1.14","plugin-type":"plugin","dependents":"","type":"application/json","text":"{\"tiddlers\":{\"$:/plugins/sq/editor-autolist/editor-operation-autolist.js\":{\"title\":\"$:/plugins/sq/editor-autolist/editor-operation-autolist.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/sq/editor-autolist/editor-operation-autolist.js\\ntype: application/javascript\\nmodule-type: texteditoroperation\\nText editor operation to automate syntax for lists\\n\\\\*/\\n(function(){\\n\\n\\nfunction getListLevelInfoForLine(state,index,lineContent) {\\n\\tif(index && !state.allLines[index]) {\\n\\t\\treturn null;\\n\\t}\\n\\tconst listPrefixRegex = /^((\\\\*|#)+)(.*)$/;\\n\\tconst match = (index!= null ? state.allLines[index] : lineContent).match(listPrefixRegex);\\n\\treturn match && match[1] ? {listPrefix: match[1], level: match[1].length, listType: match[2], content: match[3]} : null;\\n}\\n\\nexports[\\\"autolist\\\"] = function(event,operation) {\\n\\t\\n\\tlet state = Object.create(null),\\n\\t\\tmode = event.paramObject? event.paramObject.mode : undefined,\\n\\t\\tlistPrefixRegex = /^(?:(?:\\\\*|#)+).*/\\n\\t\\n\\tif(mode === \\\"newline\\\") {\\n\\t\\tlet firstLineStart = $tw.utils.findPrecedingLineBreak(operation.text,operation.selStart),\\n\\t\\t\\tfirstLineEnd = $tw.utils.findFollowingLineBreak(operation.text,operation.selStart),\\n\\t\\t\\tfirstLine = operation.text.substring(firstLineStart,firstLineEnd),\\n\\t\\t\\temptyListItemRegex = /^((\\\\*|#)+)$/;\\n\\n\\t\\tif(listPrefixRegex.test(firstLine)) {\\n\\t\\t\\t// we are on a list line\\n\\t\\t\\tif(emptyListItemRegex.test(firstLine.trimEnd())){\\n\\t\\t\\t\\t// we have an empty list line with no content so terminate the list\\n\\t\\t\\t\\toperation.replacement = \\\"\\\\n\\\";\\n\\t\\t\\t\\toperation.cutStart = firstLineStart;\\n\\t\\t\\t\\toperation.cutEnd = operation.selEnd;\\n\\t\\t\\t\\toperation.newSelStart = firstLineStart + 1;\\n\\t\\t\\t\\toperation.newSelEnd = operation.newSelStart;\\n\\t\\t\\t} else {\\n\\t\\t\\t\\t//list line with content, continue list on next line\\n\\t\\t\\t\\tlet listItemInfo = getListLevelInfoForLine(state,null,firstLine);\\n\\t\\t\\t\\tif(operation.selStart === firstLineStart && operation.selStart === operation.selEnd) {\\n\\t\\t\\t\\t\\t//cursor is at the beginning of the line, add a new list item before this one at the same level and prefix\\n\\t\\t\\t\\t\\toperation.replacement = `${listItemInfo.listPrefix} \\\\n`;\\n\\t\\t\\t\\t\\toperation.newSelStart = operation.selStart = operation.selStart + listItemInfo.listPrefix.length + 1;\\n\\t\\t\\t\\t\\toperation.newSelEnd = operation.newSelStart;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\toperation.replacement = `\\\\n${listItemInfo.listPrefix} `;\\n\\t\\t\\t\\t\\toperation.newSelStart = operation.selStart + listItemInfo.listPrefix.length + 2;\\n\\t\\t\\t\\t\\toperation.newSelEnd = operation.newSelStart;\\t\\t\\t\\t\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\toperation.cutStart = operation.selStart;\\n\\t\\t\\t\\toperation.cutEnd = operation.selEnd;\\n\\t\\t\\t\\t// check for trailing whitespace after selEnd that we want to remove\\n\\t\\t\\t\\tif(!operation.text.substring(operation.selEnd,firstLineEnd).trim().length) {\\n\\t\\t\\t\\t\\toperation.cutEnd = firstLineEnd;\\n\\t\\t\\t\\t}\\n\\n\\t\\t\\t}\\n\\t\\t} else {\\n\\t\\t\\t// selection does not start on a list line, so we need to manually add a linebreak for lines not starting with list markup\\n\\t\\t\\toperation.replacement = \\\"\\\\n\\\";\\n\\t\\t\\toperation.cutStart = operation.selStart;\\n\\t\\t\\toperation.cutEnd = operation.selEnd;\\n\\t\\t\\toperation.newSelStart = operation.selStart + 1;\\n\\t\\t\\toperation.newSelEnd = operation.newSelStart;\\n\\t\\t}\\n\\t} else if(mode === \\\"indent\\\" || mode === \\\"unindent\\\") {\\n\\t\\tlet selModifier;\\n\\t\\tstate.startSelectedLines = $tw.utils.findPrecedingLineBreak(operation.text,operation.selStart);\\n\\t\\t// if there is a selection move the marker back by one to make sure we don't include a trailing line break\\n\\t\\tlet endMarker = (operation.selStart !== operation.selEnd) ? operation.selEnd - 1 : operation.selEnd;\\n\\t\\tstate.endSelectedLines = $tw.utils.findFollowingLineBreak(operation.text,endMarker);\\n\\t\\tstate.selectedText = operation.text.substring(state.startSelectedLines,state.endSelectedLines);\\t\\t\\n\\t\\tstate.selectedLines = state.selectedText.split(\\\"\\\\n\\\");\\n\\t\\tstate.selectedLinesCount = state.selectedLines.length;\\n\\t\\tstate.allLines = operation.text.split(\\\"\\\\n\\\");\\n\\t\\tstate.allLinesCount = state.allLines.length;\\n\\t\\tstate.prefixText = operation.text.substring(0,state.startSelectedLines-1);\\n\\t\\tstate.suffixText = operation.text.substring(state.endSelectedLines+1);\\n\\t\\tstate.prefixLinesCount = state.prefixText.length ? state.prefixText.split(\\\"\\\\n\\\").length : 0;\\n\\t\\tstate.suffixLinesCount = state.suffixText.length ? state.suffixText.split(\\\"\\\\n\\\").length : 0;\\n\\t\\tstate.selectedLinesInfo = state.selectedLines.map((line,index,selLines) => {\\n\\t\\t\\treturn getListLevelInfoForLine(state,index + state.prefixLinesCount);\\n\\t\\t});\\n\\t\\t//non list items will have null value for info in selectedLinesInfo\\n\\t\\tstate.modifiedLines = Array(state.selectedLines.length).fill(\\\"\\\");\\n\\t\\tif(mode === \\\"indent\\\"){\\n\\t\\t\\tlet prevListItemInfo,\\n\\t\\t\\t\\tlistItemInfo,\\n\\t\\t\\t\\tprevNewListType;\\n\\t\\t\\tselModifier = 1;\\n\\t\\t\\tstate.selectedLines.forEach(function(element,index,array) {\\n\\t\\t\\t\\t/// exclude lines that dont start with a list prefix, they will have listItemInfo as null\\n\\t\\t\\t\\tlistItemInfo = listItemInfo || getListLevelInfoForLine(state,index + state.prefixLinesCount); // use from selectedLinesInfo XXX\\n\\t\\t\\t\\tif(!listItemInfo) {\\n\\t\\t\\t\\t\\t// not a list item so put the original text in modifiedLines\\n\\t\\t\\t\\t\\tstate.modifiedLines[index] = element;\\n\\t\\t\\t\\t\\treturn;\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tlet\\tnewlistType,\\n\\t\\t\\t\\t\\tnextListItemInfo;\\n\\t\\t\\t\\t//better if we were changing the new levels and prefixes for selected lines somewhere and I could check against that\\n\\t\\t\\t\\tif(prevListItemInfo && prevListItemInfo.level === listItemInfo.level && prevListItemInfo.listPrefix === listItemInfo.listPrefix) {\\n\\t\\t\\t\\t\\tnewlistType = prevNewListType;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\tprevListItemInfo = prevListItemInfo || getListLevelInfoForLine(state, index -1 + state.prefixLinesCount);\\n\\t\\t\\t\\t\\tif(prevListItemInfo && prevListItemInfo.level >= listItemInfo.level + 1) {\\n\\t\\t\\t\\t\\t\\tnewlistType = prevListItemInfo.listPrefix[listItemInfo.level];\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\tnextListItemInfo = getListLevelInfoForLine(state,index + 1 + state.prefixLinesCount);\\n\\t\\t\\t\\t\\t\\tif(nextListItemInfo && nextListItemInfo.level >= listItemInfo.level + 1) {\\n\\t\\t\\t\\t\\t\\t\\tnewlistType = nextListItemInfo.listPrefix[listItemInfo.level];\\n\\t\\t\\t\\t\\t\\t} else if(nextListItemInfo) {\\n\\t\\t\\t\\t\\t\\t\\t// as long as there is a next list item in the SELECTION that is the same level and prefix, keep going further\\n\\t\\t\\t\\t\\t\\t\\tlet selIndex = index + 1,\\n\\t\\t\\t\\t\\t\\t\\t\\tnextInfo = state.selectedLinesInfo[selIndex];\\n\\t\\t\\t\\t\\t\\t\\twhile(nextInfo && nextInfo.level === listItemInfo.level && nextInfo.listType === listItemInfo.listType) {\\n\\t\\t\\t\\t\\t\\t\\t\\tselIndex++;\\n\\t\\t\\t\\t\\t\\t\\t\\tnextInfo = state.selectedLinesInfo[selIndex];\\n\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t\\tnextInfo = getListLevelInfoForLine(state,selIndex + state.prefixLinesCount);\\n\\t\\t\\t\\t\\t\\t\\tif(nextInfo && nextInfo.level >= listItemInfo.level + 1) {\\n\\t\\t\\t\\t\\t\\t\\t\\tnewlistType = nextInfo.listPrefix[listItemInfo.level];\\n\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\t\\t\\t\\t\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif(!newlistType) {\\n\\t\\t\\t\\t\\tnewlistType = listItemInfo.listType;\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tstate.modifiedLines[index] = `${listItemInfo.listPrefix}${newlistType}${listItemInfo.content}`;\\n\\t\\t\\t\\t//console.log(`${listItemInfo.content} => ${newlistType} | `,state.modifiedLines[index]);\\n\\t\\t\\t\\tprevListItemInfo = listItemInfo;\\n\\t\\t\\t\\tlistItemInfo = nextListItemInfo;\\n\\t\\t\\t\\tprevNewListType = newlistType;\\n\\t\\t\\t},this);\\t\\t\\t\\n\\t\\t} else if(mode === \\\"unindent\\\") {\\n\\t\\t\\tselModifier = -1;\\n\\t\\t\\tstate.selectedLines.forEach(function(element,index,array) {\\n\\t\\t\\t\\tlet listItemInfo = state.selectedLinesInfo[index];\\n\\t\\t\\t\\tif(listItemInfo) {\\n\\t\\t\\t\\t\\t//remove the last character of the listPrefix if its a list item\\n\\t\\t\\t\\t\\tstate.modifiedLines[index] = `${listItemInfo.listPrefix.slice(0,-1)}${listItemInfo.content}`;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t// if its not a list item then use the original text\\n\\t\\t\\t\\t\\tstate.modifiedLines[index] = element;\\n\\t\\t\\t\\t}\\n\\t\\t\\t});\\n\\t\\t}\\n\\t\\tlet replacement = state.modifiedLines.join(\\\"\\\\n\\\");\\n\\t\\tif(replacement) {\\n\\t\\t\\toperation.replacement = state.modifiedLines.join(\\\"\\\\n\\\");\\n\\t\\t\\toperation.cutStart = state.startSelectedLines;\\n\\t\\t\\toperation.cutEnd = state.endSelectedLines;\\n\\t\\t\\tif(operation.selStart !== operation.selEnd) {\\n\\t\\t\\t\\toperation.newSelStart = state.startSelectedLines;\\n\\t\\t\\t\\toperation.newSelEnd = state.startSelectedLines + operation.replacement.length;\\n\\t\\t\\t} else {\\n\\t\\t\\t\\t// we did not have a selection to start so just modify the selection start and end to accomodate the change in indentation\\n\\t\\t\\t\\toperation.newSelEnd = operation.selEnd + selModifier;\\n\\t\\t\\t\\toperation.newSelStart = operation.newSelEnd;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t} \\n};\\n\\n})();\\n\",\"type\":\"application/javascript\",\"module-type\":\"texteditoroperation\"},\"$:/plugins/sq/editor-autolist/icon\":{\"title\":\"$:/plugins/sq/editor-autolist/icon\",\"text\":\"\u003Csvg viewBox=\\\"31.626 273.967 117.45 122.86\\\" height=\\\"22pt\\\" width=\\\"22pt\\\">\\n\u003Cpath d=\\\"M39.846 273.967h101.02a8.2 8.2 0 0 1 5.81 2.4 8.2 8.2 0 0 1 2.4 5.81v106.44a8.2 8.2 0 0 1-2.4 5.81 8.2 8.2 0 0 1-5.81 2.4H39.846a8.2 8.2 0 0 1-5.81-2.4 8.109 8.109 0 0 1-2.41-5.8v-106.44c0-2.27.92-4.34 2.4-5.82a8.224 8.224 0 0 1 5.82-2.4Zm101.02 7.08H39.846c-.32 0-.61.13-.82.34-.21.21-.34.5-.34.82v106.44c0 .32.13.61.34.82.21.21.5.34.82.34h101.02c.32 0 .61-.13.82-.34.21-.21.34-.5.34-.82v-106.44c0-.32-.13-.61-.34-.82-.22-.21-.51-.34-.82-.34Z\\\"/>\\n\u003Cpath d=\\\"m107.502 333.58 3.045 14.498 14.495 3.168-12.87 7.372 1.458 14.74-11-9.942-13.59 5.944 6.073-13.518-9.864-11.068 14.755 1.588 7.498-12.783Zm8.267 36.294 12.588 12.783a.789.789 0 0 0 1.11.005l4.891-4.84a.786.786 0 0 0 .005-1.109l-17.206-17.416c-.302-.307-1.1-.434-1.11-.005l-.278 10.582ZM67.605 301.084c-3.678-.637-5.255-4.833-2.837-7.555a4.91 4.91 0 0 1 2.837-1.56h53.098c3.675.636 5.249 4.832 2.834 7.553a4.902 4.902 0 0 1-2.834 1.562H67.605ZM53.025 291.364c3.973 0 6.457 4.05 4.47 7.29-1.986 3.241-6.954 3.241-8.94 0a4.642 4.642 0 0 1-.692-2.43c0-2.684 2.311-4.86 5.162-4.86ZM67.605 317.255c-3.678-.638-5.255-4.834-2.837-7.556a4.91 4.91 0 0 1 2.837-1.56h53.098c3.675.636 5.249 4.832 2.834 7.553a4.909 4.909 0 0 1-2.834 1.563H67.605ZM53.025 307.534c3.973 0 6.457 4.05 4.47 7.29-1.986 3.241-6.954 3.241-8.94 0a4.642 4.642 0 0 1-.692-2.43c0-2.684 2.311-4.86 5.162-4.86ZM66.214 333.579c-2.434-.638-3.477-4.834-1.877-7.555.48-.818 1.145-1.371 1.877-1.561h35.141c2.432.636 3.474 4.833 1.876 7.553-.48.818-1.144 1.371-1.876 1.563H66.214ZM52.985 323.858c3.973 0 6.457 4.05 4.469 7.291-1.985 3.24-6.953 3.24-8.939 0a4.645 4.645 0 0 1-.692-2.43c0-2.684 2.311-4.861 5.162-4.861Z\\\"/>\\n\u003C/svg>\"},\"$:/plugins/sq/editor-autolist/indent.svg\":{\"title\":\"$:/plugins/sq/editor-autolist/indent.svg\",\"text\":\"\u003Csvg height=\\\"22pt\\\" width=\\\"22pt\\\" viewBox=\\\"0 0 122.88 95.07\\\">\u003Cpath d=\\\"M46.06 26.43h76.82v15.8H46.06v-15.8Zm76.82 52.85H.01L0 95.07h122.88V79.28Zm0-26.43H46.54v15.8h76.34v-15.8Zm0-52.85H.02v15.8h122.87L122.88 0Z\\\"/>\u003Cpath d=\\\"m7.497 47.851 23.24-22.35v44.7l-23.24-22.35Z\\\" transform=\\\"rotate(180 19.117 47.851)\\\"/>\u003C/svg>\"},\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-indent\":{\"title\":\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-indent\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]]\",\"icon\":\"$:/plugins/sq/editor-autolist/indent.svg\",\"shortcuts\":\"((autolist-indent))\",\"tags\":\"$:/tags/EditorToolbar\",\"list-after\":\"$:/core/ui/EditorToolbar/list-number\",\"caption\":\"Indent list items\",\"description\":\"Indent list items\",\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"indent\\\"\\n/>\\n\"},\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-newline\":{\"title\":\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-newline\",\"button-classes\":\"sq-text-editor-btn-hidden\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]]\",\"icon\":\"$:/core/images/list-bullet\",\"shortcuts\":\"((autolist-newline))\",\"tags\":\"$:/tags/EditorToolbar\",\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"newline\\\"\\n/>\\n\"},\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-unindent\":{\"title\":\"$:/plugins/sq/editor-autolist/EditorToolbar/autolist-unindent\",\"condition\":\"[\u003CtargetTiddler>!has[type]] [\u003CtargetTiddler>type[text/vnd.tiddlywiki]]\",\"icon\":\"$:/plugins/sq/editor-autolist/unindent.svg\",\"shortcuts\":\"((autolist-unindent))\",\"tags\":\"$:/tags/EditorToolbar\",\"list-after\":\"$:/core/ui/EditorToolbar/list-number\",\"caption\":\"Unindent list items\",\"description\":\"Unindent list items\",\"text\":\"\u003C$action-sendmessage\\n\\t$message=\\\"tm-edit-text-operation\\\"\\n\\t$param=\\\"autolist\\\"\\n\\tmode=\\\"unindent\\\"\\n/>\\n\"},\"$:/plugins/sq/editor-autolist/readme\":{\"title\":\"$:/plugins/sq/editor-autolist/readme\",\"text\":\"@@color:red;''Experimental plugin - no support available. Use at your own risk.''@@\\n\\nAutomatically continue lists when creating new lines. Indent and unindent line(s) with list markup.\\n\\n!!Known limitations:\\n* no support for mixing block quotes with numbered and unordered lists.\\n* no support for classname syntax in list markup, e.g.: `*.myclass hello there`\\n* treats list items separated by empty lines are separate lists\"},\"$:/config/ShortcutInfo/autolist-indent\":{\"title\":\"$:/config/ShortcutInfo/autolist-indent\",\"text\":\"Indent a line in a list\"},\"$:/config/ShortcutInfo/autolist-newline\":{\"title\":\"$:/config/ShortcutInfo/autolist-newline\",\"text\":\"Add a newline and list markup if in a list\"},\"$:/config/ShortcutInfo/autolist-unindent\":{\"title\":\"$:/config/ShortcutInfo/autolist-unindent\",\"text\":\"Unindent a line in a list\"},\"$:/config/shortcuts/autolist-indent\":{\"title\":\"$:/config/shortcuts/autolist-indent\",\"text\":\"Tab\"},\"$:/config/shortcuts/autolist-newline\":{\"title\":\"$:/config/shortcuts/autolist-newline\",\"text\":\"Enter\"},\"$:/config/shortcuts/autolist-unindent\":{\"title\":\"$:/config/shortcuts/autolist-unindent\",\"text\":\"shift-Tab\"},\"$:/plugins/sq/editor-autolist/styles\":{\"title\":\"$:/plugins/sq/editor-autolist/styles\",\"tags\":\"$:/tags/Stylesheet\",\"text\":\".sq-text-editor-btn-hidden {\\n\\tdisplay: none;\\n}\"},\"$:/plugins/sq/editor-autolist/unindent.svg\":{\"title\":\"$:/plugins/sq/editor-autolist/unindent.svg\",\"text\":\"\u003Csvg height=\\\"22pt\\\" width=\\\"22pt\\\" viewBox=\\\"0 0 122.88 95.07\\\">\u003Cpath d=\\\"M46.06 26.43h76.82v15.8H46.06v-15.8zM7.47 48.01l23.24 22.35v-44.7L7.47 48.01zm115.41 31.27H.01L0 95.07h122.88V79.28zm0-26.43H46.54v15.8h76.34v-15.8zm0-52.85H.02v15.8h122.87L122.88 0z\\\" />\u003C/svg>\"}}}","revision":"0","bag":"default","title":"$:/plugins/sq/editor-autolist"},
{"text":"{\"tiddlers\":{\"$:/macros/agenda\":{\"text\":\"\\\\procedure agenda()\\n\u003Cspan title=\\\"Click to modify the event\\\">\u003C$transclude\\n$variable=\\\"details\\\" \\nlabel=\\\"\\\"\\\"\\n\u003C$let\\nutc-time=\\\"[split[:]join[]addsuffix[00000]]\\\"\\nutc-date=\\\"[split[-]join[]]\\\"\\nstart-time={{!!start-time}}\\nstart-date={{!!start-date}}\\nend-time={{{[{!!end-time}!is[blank]else\u003Cstart-time>]}}}\\nend-date={{{[{!!end-date}!is[blank]else\u003Cstart-date>]}}}\\nstart={{{[\u003Cstart-date>subfilter\u003Cutc-date>][\u003Cstart-time>subfilter\u003Cutc-time>]+[join[T]]}}}\\nend={{{[\u003Cend-date>subfilter\u003Cutc-date>][\u003Cend-time>subfilter\u003Cutc-time>]+[join[T]]}}}\\nname={{!!name}}\\ndescription={{!!description}}\\nlocation={{!!location}}\\nsource={{{[{$:/info/url/full}] [{!!title}format:titlelist[]] +[join[#:]]}}}\\nhref={{{\\n=\\\"https://calendar.google.com/calendar/render?action=TEMPLATE\\\"\\n=\\\"&text=\\\"=[\u003Cname>encodeuricomponent[]]\\n=\\\"&dates=\\\"=[\u003Cstart>]=\\\"/\\\"=[\u003Cend>]\\n=\\\"&details=\\\"\\n=[\u003Cdescription>encodeuricomponent[]]\\n=[[\u003Chr>\u003Ca href=\\\"]encodeuricomponent[]]\\n=[\u003Csource>encodeuricomponent[]]\\n=[[\\\">🔗 Event Page\u003C/a>]encodeuricomponent[]]\\n=\\\"&location=\\\"=[\u003Clocation>encodeuricomponent[]]\\n=\\\"&sprop=website:\\\"=[\u003Csource>encodeuricomponent[]]\\n=\\\"&sprop=name:\\\"=[{$:/SiteTitle}encodeuricomponent[]]\\n+[join[]]\\n}}}\\ndisplay-date-format=\\\"[UTC]DD mmm YYYY at 0hh:0mm\\\"\\ndisplay-date={{{\\n[\u003Cstart-date>subfilter\u003Cutc-date>] \\n[\u003Cstart-time>subfilter\u003Cutc-time>]\\n+[join[]format:date\u003Cdisplay-date-format>lowercase[]] \\n}}}\\n>\\n\u003C$transclude \\n$tiddler=\\\"$:/core/images/new-journal-button\\\"\\nsize=\\\"10pt\\\"\\nday={{{ [{!!start-date}split[-]last[]] }}}\\n/>\\n\u003Ca href=\u003C\u003Chref>> title=\\\"Click the link to add to google agenda\\\" >{{!!name}} on \u003C\u003Cdisplay-date>>\u003C/a>\\n\u003C/$let>\\n\u003C$list filter=\\\"[{!!description}!is[blank]]\\\" variable=\\\"ignore\\\">: {{!!description}}\u003C/$list>\\n\\\"\\\"\\\"\\nsrc=\\\"\\\"\\\"\\n\u003Cp style=\\\"display:flex;justify-content:space-between;list-style:none;\\\">\\n\u003Cspan>Start:\\n\u003C$edit-text type=\\\"date\\\" field=\\\"start-date\\\"/>\\n\u003C$edit-text type=\\\"time\\\"  field=\\\"start-time\\\"/>\\n\u003C/span>\\n\u003Cspan>End:\\n\u003C$edit-text type=\\\"date\\\" field=\\\"end-date\\\" default={{!!start-date}}/>\\n\u003C$edit-text type=\\\"time\\\"  field=\\\"end-time\\\" default={{!!start-time}}/>\\n\u003C/span>\\n\u003C/p>\\n\u003C$edit field=\\\"name\\\" placeholder=\\\"Event name\\\" class=\\\"tc-edit-texteditor tc-edit-texteditor-body\\\"/>\\n\u003C$edit field=\\\"location\\\" placeholder=\\\"Location\\\" class=\\\"tc-edit-texteditor tc-edit-texteditor-body\\\"/>\\n\u003C\u003Ceditor field:\\\"description\\\"  placeholder:\\\"Description\\\" tag:\\\"textarea\\\">>\\n\\\"\\\"\\\"\\nsrcClass=\\\"alert border-secondary py-0\\\" labelClass=\\\"badge badge-light\\\"\\n/>\\n\\\\end\",\"tags\":\"$:/tags/Global\",\"code-body\":\"yes\"},\"$:/macros/details\":{\"text\":\"\\\\procedure details(label,src,srcClass)\\n\u003Cdetails>\\n\u003Csummary>\u003C\u003Clabel>>\u003C/summary>\\n\u003Cp class=\u003C\u003CsrcClass>>>\u003C\u003Csrc>>\u003C/p>\\n\u003C/details>\\n\\\\end\",\"tags\":\"$:/tags/Global\",\"code-body\":\"yes\"},\"$:/macros/editor\":{\"text\":\"\\\\define editor(field:\\\"text\\\",placeholder,tiddler,tag:\\\"input\\\",class)\\n\\\\define editor-buttons(filter,style)\\n\u003Cdiv style=\u003C\u003C__style__>> class=\\\"editor-buttons\\\">\\n\u003C$list filter=\\\"\\n[[$:/tags/EditorToolbar]tagging[]!is[draft]]\\n:filter[\u003Cconfig-visibility-title>get[text]else[]!match[hide]]\\n:filter[$filter$]\\\">\\n\u003Cdiv style=\\\"position:absolute;top:0;left:0;visibility:hidden\\\">\u003C$transclude tiddler=\\\"$:/core/ui/EditTemplate/body/toolbar/button\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/div>\\n\\\\end editor-buttons\\n\u003C$tiddler tiddler={{{ [\u003C__tiddler__>!is[blank]else\u003CcurrentTiddler>] }}}>\\n@@position:relative;\\n\u003C$edit\\nclass=\\\"tc-edit-texteditor tc-edit-texteditor-body $class$\\\"\\ntabindex={{$:/config/EditTabIndex}}\\nfocus={{{ [{$:/config/AutoFocus}match[text]then[yes]] }}}\\ncancelPopups=\\\"yes\\\"\\nfield=\u003C\u003C__field__>>\\ntag=\u003C\u003C__tag__>>\\nplaceholder=\u003C\u003C__placeholder__>>\\n>\\n\u003C\u003Ceditor-buttons \\\"has[dropdown]\\\" \\\"position:absolute;left:0;top:0;\\\">> \u003C\u003Ceditor-buttons \\\"!has[dropdown]\\\" \\\"display:none\\\">>\\n\u003C/$edit>\\n\u003Cstyle>\\n.editor-buttons .tc-drop-down.tc-popup-keep{visibility: initial}\\niframe.tc-edit-texteditor.tc-edit-texteditor-body.editor.full-width{width:100%;}\\n\u003C/style>\\n@@\\n\u003C/$tiddler>\\n\\\\end editor\",\"tags\":\"$:/tags/Global\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/agenda/readme\":{\"text\":\"\\\\procedure example()\\n\u003C\u003Cagenda>>\\n\\n\u003C$text text={{{ \\n    =[{!!start-date}split[-]] =[{!!start-time}split[:]]\\n    +[join[]format:date[TIMESTAMP]]\\n    +[subtract\u003Cnow TIMESTAMP>divide[86400000]floor[]]\\n }}}/> days left\\n\\\\end\\n\\n\u003C$testcase testOutput=\\\"Output\\\">\\n    \u003C$data title=\\\"Description\\\" text=\\\"Example of use\\\"/>\\n    \u003C$data \\n        title=\\\"Output\\\"\\n        text=\u003C\u003Cexample>> \\n        description=\\\"The day when everyone in the world should talk like a pirate 🦜\\\"\\n        location=\\\"World\\\"\\n        name=\\\"International Talk Like a Pirate Day\\\"\\n        start-date=\\\"2026-09-19\\\"\\n/>\\n\u003C/$testcase>\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Create google calendar events from your tiddlywiki","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/agenda"} {"created":"20241216212335091","creator":"theophile.dev","text":"{\"tiddlers\":{\"$:/core/ui/ViewTemplate/body/code\":{\"text\":\"\u003C%if [\u003CcurrentTiddler>is[missing]] :and[!is[shadow]] %>\\n\u003C$transclude tiddler=\\\"$:/language/MissingTiddler/Hint\\\"/>\\n\u003C%else%>\\n\u003C!-- \u003C$transclude $variable=\\\"copy-to-clipboard-above-right\\\" src={{{ [\u003CcurrentTiddler>get[text]] }}} /> -->\\n\u003C$codeblock code={{{ [\u003CcurrentTiddler>get[text]] }}} language={{{ [\u003CcurrentTiddler>get[type]else[text/vnd.tiddlywiki]] }}}/>\\n\u003C%endif%>\",\"tags\":\"$:/plugins/theophile.dev/bettercode\"},\"$:/plugins/theophile.dev/bettercode/readme\":{\"text\":\"This plugin improve the codeblock widget by adding a copy to clipboard button.\",\"tags\":\"$:/plugins/theophile.dev/bettercode\"},\"$:/plugins/theophile.dev/bettercode/style\":{\"text\":\"\\\\rules except list dash \\n\\n.copy-code {\\n    --_b-r: 3px;\\n    font-family: Consolas;\\n \\n    dt {\\n        background: \u003C\u003Ccolor pre-background>>;\\n        border-bottom: unset;\\n        border-radius: var(--_b-r) var(--_b-r) 0 0;\\n        border: solid 1px \u003C\u003Ccolor pre-border>>;\\n        font-size: 1.1em;\\n        padding: 0.5em;\\n        +dd>pre {\\n            border-radius: 0 0 var(--_b-r) var(--_b-r);\\n            margin-top: 0;\\n        }\\n    }\\n \\n    dd {\\n        display: block;\\n        margin: 0;\\n        position: relative;\\n        pre {\\n            background-color: \u003C\u003Ccolor tiddler-editor-background>>;\\n            border-radius: var(--_b-r);\\n            height: inherit;\\n            overflow-y: auto;\\n        }\\n        :is(button, small) {\\n            opacity: 0.3;\\n            padding: 5px;\\n            position: absolute;\\n        }\\n        button {\\n            font-size: 0;\\n            right: 0;\\n            &:hover {\\n                opacity: 1;\\n                transition: opacity 150ms ease-in-out;\\n            }\\n            svg {\\n                height: auto;\\n                width: 20px;\\n            }\\n        }\\n        small {\\n            font-weight: bold;\\n            inset: auto 0 0 auto;\\n            text-transform: uppercase;\\n        }\\n    }\\n}\",\"tags\":\"$:/tags/Stylesheet $:/plugins/theophile.dev/bettercode\"},\"$:/plugins/theophile.dev/widget\":{\"text\":\"\\\\widget $codeblock(code,title,language,display-language)\\n\u003Cdl class=\\\"copy-code\\\">\\n\\t\u003C% if [\u003Ctitle>!is[blank]] %>\\n\\t\u003Cdt>\u003C\u003Ctitle>>\u003C/dt>\\n\\t\u003C% endif %>\\n\\t\u003Cdd>\\n\\t\\t\u003C$macrocall $name=\\\"copy-to-clipboard\\\" src=\u003C\u003Ccode>>/> \\n\\t\\t\u003C$genesis $type=\\\"$codeblock\\\" $remappable=\\\"no\\\" code=\u003C\u003Ccode>> language=\u003C\u003Clanguage>> />\\n\\t\\t\u003C% if [\u003Cdisplay-language>match[no]]:or[\u003Ccode>splitregexp:m[\\\\n]count[]compare:number:lteq[2]] %>\\n\\t\\t\u003C% else %>\\n\\t\\t\\t\u003Csmall>\u003C\u003Clanguage>>\u003C/small>\\n\\t\\t\u003C% endif %>\\n\\t\u003C/dd>\\n\u003C/dl>\\n\\\\end\",\"tags\":\"$:/tags/Global $:/plugins/theophile.dev/bettercode\",\"code-body\":\"yes\"}}}","core-version":"5.3.6","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.2","description":"improved codeblock widget","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/bettercode","source":"https://plugin-library.tiddlyhost.com","modified":"20241216212412452","modifier":"theophile.dev","name":"bettercode"},
{"text":"{\"tiddlers\":{\"$:/config/EditorTypeMappings/text/x-python\":{\"text\":\"codemirror\"},\"$:/plugins/theophile.dev/codemirror-mode-python/readme\":{\"text\":\"This plugin adds Syntax Highlighting for Python tiddlers (text/x-python) to the CodeMirror text editor. It needs the latest [[CodeMirror plugin|$:/plugins/tiddlywiki/codemirror]] to be installed\"},\"$:/plugins/theophile.dev/codemirror/mode/python/python.js\":{\"text\":\"// CodeMirror, copyright (c) by Marijn Haverbeke and others\\n// Distributed under an MIT license: https://codemirror.net/5/LICENSE\\n\\n\\n(function(mod) {\\n  if (typeof exports == \\\"object\\\" && typeof module == \\\"object\\\") // CommonJS\\n    mod(require(\\\"$:/plugins/tiddlywiki/codemirror/lib/codemirror.js\\\"));\\n  else if (typeof define == \\\"function\\\" && define.amd) // AMD\\n    define([\\\"$:/plugins/tiddlywiki/codemirror/lib/codemirror.js\\\"], mod);\\n  else // Plain browser env\\n    mod(CodeMirror);\\n})(function(CodeMirror) {\\n  \\\"use strict\\\";\\n\\n  function wordRegexp(words) {\\n    return new RegExp(\\\"^((\\\" + words.join(\\\")|(\\\") + \\\"))\\\\\\\\b\\\");\\n  }\\n\\n  var wordOperators = wordRegexp([\\\"and\\\", \\\"or\\\", \\\"not\\\", \\\"is\\\"]);\\n  var commonKeywords = [\\\"as\\\", \\\"assert\\\", \\\"break\\\", \\\"class\\\", \\\"continue\\\",\\n                        \\\"def\\\", \\\"del\\\", \\\"elif\\\", \\\"else\\\", \\\"except\\\", \\\"finally\\\",\\n                        \\\"for\\\", \\\"from\\\", \\\"global\\\", \\\"if\\\", \\\"import\\\",\\n                        \\\"lambda\\\", \\\"pass\\\", \\\"raise\\\", \\\"return\\\",\\n                        \\\"try\\\", \\\"while\\\", \\\"with\\\", \\\"yield\\\", \\\"in\\\", \\\"False\\\", \\\"True\\\"];\\n  var commonBuiltins = [\\\"abs\\\", \\\"all\\\", \\\"any\\\", \\\"bin\\\", \\\"bool\\\", \\\"bytearray\\\", \\\"callable\\\", \\\"chr\\\",\\n                        \\\"classmethod\\\", \\\"compile\\\", \\\"complex\\\", \\\"delattr\\\", \\\"dict\\\", \\\"dir\\\", \\\"divmod\\\",\\n                        \\\"enumerate\\\", \\\"eval\\\", \\\"filter\\\", \\\"float\\\", \\\"format\\\", \\\"frozenset\\\",\\n                        \\\"getattr\\\", \\\"globals\\\", \\\"hasattr\\\", \\\"hash\\\", \\\"help\\\", \\\"hex\\\", \\\"id\\\",\\n                        \\\"input\\\", \\\"int\\\", \\\"isinstance\\\", \\\"issubclass\\\", \\\"iter\\\", \\\"len\\\",\\n                        \\\"list\\\", \\\"locals\\\", \\\"map\\\", \\\"max\\\", \\\"memoryview\\\", \\\"min\\\", \\\"next\\\",\\n                        \\\"object\\\", \\\"oct\\\", \\\"open\\\", \\\"ord\\\", \\\"pow\\\", \\\"property\\\", \\\"range\\\",\\n                        \\\"repr\\\", \\\"reversed\\\", \\\"round\\\", \\\"set\\\", \\\"setattr\\\", \\\"slice\\\",\\n                        \\\"sorted\\\", \\\"staticmethod\\\", \\\"str\\\", \\\"sum\\\", \\\"super\\\", \\\"tuple\\\",\\n                        \\\"type\\\", \\\"vars\\\", \\\"zip\\\", \\\"__import__\\\", \\\"NotImplemented\\\",\\n                        \\\"Ellipsis\\\", \\\"__debug__\\\"];\\n  CodeMirror.registerHelper(\\\"hintWords\\\", \\\"python\\\", commonKeywords.concat(commonBuiltins).concat([\\\"exec\\\", \\\"print\\\"]));\\n\\n  function top(state) {\\n    return state.scopes[state.scopes.length - 1];\\n  }\\n\\n  CodeMirror.defineMode(\\\"python\\\", function(conf, parserConf) {\\n    var ERRORCLASS = \\\"error\\\";\\n\\n    var delimiters = parserConf.delimiters || parserConf.singleDelimiters || /^[\\\\(\\\\)\\\\[\\\\]\\\\{\\\\}@,:`=;\\\\.\\\\\\\\]/;\\n    //               (Backwards-compatibility with old, cumbersome config system)\\n    var operators = [parserConf.singleOperators, parserConf.doubleOperators, parserConf.doubleDelimiters, parserConf.tripleDelimiters,\\n                     parserConf.operators || /^([-+*/%\\\\/&|^]=?|[\u003C>=]+|\\\\/\\\\/=?|\\\\*\\\\*=?|!=|[~!@]|\\\\.\\\\.\\\\.)/]\\n    for (var i = 0; i \u003C operators.length; i++) if (!operators[i]) operators.splice(i--, 1)\\n\\n    var hangingIndent = parserConf.hangingIndent || conf.indentUnit;\\n\\n    var myKeywords = commonKeywords, myBuiltins = commonBuiltins;\\n    if (parserConf.extra_keywords != undefined)\\n      myKeywords = myKeywords.concat(parserConf.extra_keywords);\\n\\n    if (parserConf.extra_builtins != undefined)\\n      myBuiltins = myBuiltins.concat(parserConf.extra_builtins);\\n\\n    var py3 = !(parserConf.version && Number(parserConf.version) \u003C 3)\\n    if (py3) {\\n      // since http://legacy.python.org/dev/peps/pep-0465/ @ is also an operator\\n      var identifiers = parserConf.identifiers|| /^[_A-Za-z\\\\u00A1-\\\\uFFFF][_A-Za-z0-9\\\\u00A1-\\\\uFFFF]*/;\\n      myKeywords = myKeywords.concat([\\\"nonlocal\\\", \\\"None\\\", \\\"aiter\\\", \\\"anext\\\", \\\"async\\\", \\\"await\\\", \\\"breakpoint\\\", \\\"match\\\", \\\"case\\\"]);\\n      myBuiltins = myBuiltins.concat([\\\"ascii\\\", \\\"bytes\\\", \\\"exec\\\", \\\"print\\\"]);\\n      var stringPrefixes = new RegExp(\\\"^(([rbuf]|(br)|(rb)|(fr)|(rf))?('{3}|\\\\\\\"{3}|['\\\\\\\"]))\\\", \\\"i\\\");\\n    } else {\\n      var identifiers = parserConf.identifiers|| /^[_A-Za-z][_A-Za-z0-9]*/;\\n      myKeywords = myKeywords.concat([\\\"exec\\\", \\\"print\\\"]);\\n      myBuiltins = myBuiltins.concat([\\\"apply\\\", \\\"basestring\\\", \\\"buffer\\\", \\\"cmp\\\", \\\"coerce\\\", \\\"execfile\\\",\\n                                      \\\"file\\\", \\\"intern\\\", \\\"long\\\", \\\"raw_input\\\", \\\"reduce\\\", \\\"reload\\\",\\n                                      \\\"unichr\\\", \\\"unicode\\\", \\\"xrange\\\", \\\"None\\\"]);\\n      var stringPrefixes = new RegExp(\\\"^(([rubf]|(ur)|(br))?('{3}|\\\\\\\"{3}|['\\\\\\\"]))\\\", \\\"i\\\");\\n    }\\n    var keywords = wordRegexp(myKeywords);\\n    var builtins = wordRegexp(myBuiltins);\\n\\n    // tokenizers\\n    function tokenBase(stream, state) {\\n      var sol = stream.sol() && state.lastToken != \\\"\\\\\\\\\\\"\\n      if (sol) state.indent = stream.indentation()\\n      // Handle scope changes\\n      if (sol && top(state).type == \\\"py\\\") {\\n        var scopeOffset = top(state).offset;\\n        if (stream.eatSpace()) {\\n          var lineOffset = stream.indentation();\\n          if (lineOffset > scopeOffset)\\n            pushPyScope(state);\\n          else if (lineOffset \u003C scopeOffset && dedent(stream, state) && stream.peek() != \\\"#\\\")\\n            state.errorToken = true;\\n          return null;\\n        } else {\\n          var style = tokenBaseInner(stream, state);\\n          if (scopeOffset > 0 && dedent(stream, state))\\n            style += \\\" \\\" + ERRORCLASS;\\n          return style;\\n        }\\n      }\\n      return tokenBaseInner(stream, state);\\n    }\\n\\n    function tokenBaseInner(stream, state, inFormat) {\\n      if (stream.eatSpace()) return null;\\n\\n      // Handle Comments\\n      if (!inFormat && stream.match(/^#.*/)) return \\\"comment\\\";\\n\\n      // Handle Number Literals\\n      if (stream.match(/^[0-9\\\\.]/, false)) {\\n        var floatLiteral = false;\\n        // Floats\\n        if (stream.match(/^[\\\\d_]*\\\\.\\\\d+(e[\\\\+\\\\-]?\\\\d+)?/i)) { floatLiteral = true; }\\n        if (stream.match(/^[\\\\d_]+\\\\.\\\\d*/)) { floatLiteral = true; }\\n        if (stream.match(/^\\\\.\\\\d+/)) { floatLiteral = true; }\\n        if (floatLiteral) {\\n          // Float literals may be \\\"imaginary\\\"\\n          stream.eat(/J/i);\\n          return \\\"number\\\";\\n        }\\n        // Integers\\n        var intLiteral = false;\\n        // Hex\\n        if (stream.match(/^0x[0-9a-f_]+/i)) intLiteral = true;\\n        // Binary\\n        if (stream.match(/^0b[01_]+/i)) intLiteral = true;\\n        // Octal\\n        if (stream.match(/^0o[0-7_]+/i)) intLiteral = true;\\n        // Decimal\\n        if (stream.match(/^[1-9][\\\\d_]*(e[\\\\+\\\\-]?[\\\\d_]+)?/)) {\\n          // Decimal literals may be \\\"imaginary\\\"\\n          stream.eat(/J/i);\\n          // TODO - Can you have imaginary longs?\\n          intLiteral = true;\\n        }\\n        // Zero by itself with no other piece of number.\\n        if (stream.match(/^0(?![\\\\dx])/i)) intLiteral = true;\\n        if (intLiteral) {\\n          // Integer literals may be \\\"long\\\"\\n          stream.eat(/L/i);\\n          return \\\"number\\\";\\n        }\\n      }\\n\\n      // Handle Strings\\n      if (stream.match(stringPrefixes)) {\\n        var isFmtString = stream.current().toLowerCase().indexOf('f') !== -1;\\n        if (!isFmtString) {\\n          state.tokenize = tokenStringFactory(stream.current(), state.tokenize);\\n          return state.tokenize(stream, state);\\n        } else {\\n          state.tokenize = formatStringFactory(stream.current(), state.tokenize);\\n          return state.tokenize(stream, state);\\n        }\\n      }\\n\\n      for (var i = 0; i \u003C operators.length; i++)\\n        if (stream.match(operators[i])) return \\\"operator\\\"\\n\\n      if (stream.match(delimiters)) return \\\"punctuation\\\";\\n\\n      if (state.lastToken == \\\".\\\" && stream.match(identifiers))\\n        return \\\"property\\\";\\n\\n      if (stream.match(keywords) || stream.match(wordOperators))\\n        return \\\"keyword\\\";\\n\\n      if (stream.match(builtins))\\n        return \\\"builtin\\\";\\n\\n      if (stream.match(/^(self|cls)\\\\b/))\\n        return \\\"variable-2\\\";\\n\\n      if (stream.match(identifiers)) {\\n        if (state.lastToken == \\\"def\\\" || state.lastToken == \\\"class\\\")\\n          return \\\"def\\\";\\n        return \\\"variable\\\";\\n      }\\n\\n      // Handle non-detected items\\n      stream.next();\\n      return inFormat ? null :ERRORCLASS;\\n    }\\n\\n    function formatStringFactory(delimiter, tokenOuter) {\\n      while (\\\"rubf\\\".indexOf(delimiter.charAt(0).toLowerCase()) >= 0)\\n        delimiter = delimiter.substr(1);\\n\\n      var singleline = delimiter.length == 1;\\n      var OUTCLASS = \\\"string\\\";\\n\\n      function tokenNestedExpr(depth) {\\n        return function(stream, state) {\\n          var inner = tokenBaseInner(stream, state, true)\\n          if (inner == \\\"punctuation\\\") {\\n            if (stream.current() == \\\"{\\\") {\\n              state.tokenize = tokenNestedExpr(depth + 1)\\n            } else if (stream.current() == \\\"}\\\") {\\n              if (depth > 1) state.tokenize = tokenNestedExpr(depth - 1)\\n              else state.tokenize = tokenString\\n            }\\n          }\\n          return inner\\n        }\\n      }\\n\\n      function tokenString(stream, state) {\\n        while (!stream.eol()) {\\n          stream.eatWhile(/[^'\\\"\\\\{\\\\}\\\\\\\\]/);\\n          if (stream.eat(\\\"\\\\\\\\\\\")) {\\n            stream.next();\\n            if (singleline && stream.eol())\\n              return OUTCLASS;\\n          } else if (stream.match(delimiter)) {\\n            state.tokenize = tokenOuter;\\n            return OUTCLASS;\\n          } else if (stream.match('{{')) {\\n            // ignore {{ in f-str\\n            return OUTCLASS;\\n          } else if (stream.match('{', false)) {\\n            // switch to nested mode\\n            state.tokenize = tokenNestedExpr(0)\\n            if (stream.current()) return OUTCLASS;\\n            else return state.tokenize(stream, state)\\n          } else if (stream.match('}}')) {\\n            return OUTCLASS;\\n          } else if (stream.match('}')) {\\n            // single } in f-string is an error\\n            return ERRORCLASS;\\n          } else {\\n            stream.eat(/['\\\"]/);\\n          }\\n        }\\n        if (singleline) {\\n          if (parserConf.singleLineStringErrors)\\n            return ERRORCLASS;\\n          else\\n            state.tokenize = tokenOuter;\\n        }\\n        return OUTCLASS;\\n      }\\n      tokenString.isString = true;\\n      return tokenString;\\n    }\\n\\n    function tokenStringFactory(delimiter, tokenOuter) {\\n      while (\\\"rubf\\\".indexOf(delimiter.charAt(0).toLowerCase()) >= 0)\\n        delimiter = delimiter.substr(1);\\n\\n      var singleline = delimiter.length == 1;\\n      var OUTCLASS = \\\"string\\\";\\n\\n      function tokenString(stream, state) {\\n        while (!stream.eol()) {\\n          stream.eatWhile(/[^'\\\"\\\\\\\\]/);\\n          if (stream.eat(\\\"\\\\\\\\\\\")) {\\n            stream.next();\\n            if (singleline && stream.eol())\\n              return OUTCLASS;\\n          } else if (stream.match(delimiter)) {\\n            state.tokenize = tokenOuter;\\n            return OUTCLASS;\\n          } else {\\n            stream.eat(/['\\\"]/);\\n          }\\n        }\\n        if (singleline) {\\n          if (parserConf.singleLineStringErrors)\\n            return ERRORCLASS;\\n          else\\n            state.tokenize = tokenOuter;\\n        }\\n        return OUTCLASS;\\n      }\\n      tokenString.isString = true;\\n      return tokenString;\\n    }\\n\\n    function pushPyScope(state) {\\n      while (top(state).type != \\\"py\\\") state.scopes.pop()\\n      state.scopes.push({offset: top(state).offset + conf.indentUnit,\\n                         type: \\\"py\\\",\\n                         align: null})\\n    }\\n\\n    function pushBracketScope(stream, state, type) {\\n      var align = stream.match(/^[\\\\s\\\\[\\\\{\\\\(]*(?:#|$)/, false) ? null : stream.column() + 1\\n      state.scopes.push({offset: state.indent + hangingIndent,\\n                         type: type,\\n                         align: align})\\n    }\\n\\n    function dedent(stream, state) {\\n      var indented = stream.indentation();\\n      while (state.scopes.length > 1 && top(state).offset > indented) {\\n        if (top(state).type != \\\"py\\\") return true;\\n        state.scopes.pop();\\n      }\\n      return top(state).offset != indented;\\n    }\\n\\n    function tokenLexer(stream, state) {\\n      if (stream.sol()) {\\n        state.beginningOfLine = true;\\n        state.dedent = false;\\n      }\\n\\n      var style = state.tokenize(stream, state);\\n      var current = stream.current();\\n\\n      // Handle decorators\\n      if (state.beginningOfLine && current == \\\"@\\\")\\n        return stream.match(identifiers, false) ? \\\"meta\\\" : py3 ? \\\"operator\\\" : ERRORCLASS;\\n\\n      if (/\\\\S/.test(current)) state.beginningOfLine = false;\\n\\n      if ((style == \\\"variable\\\" || style == \\\"builtin\\\")\\n          && state.lastToken == \\\"meta\\\")\\n        style = \\\"meta\\\";\\n\\n      // Handle scope changes.\\n      if (current == \\\"pass\\\" || current == \\\"return\\\")\\n        state.dedent = true;\\n\\n      if (current == \\\"lambda\\\") state.lambda = true;\\n      if (current == \\\":\\\" && !state.lambda && top(state).type == \\\"py\\\" && stream.match(/^\\\\s*(?:#|$)/, false))\\n        pushPyScope(state);\\n\\n      if (current.length == 1 && !/string|comment/.test(style)) {\\n        var delimiter_index = \\\"[({\\\".indexOf(current);\\n        if (delimiter_index != -1)\\n          pushBracketScope(stream, state, \\\"])}\\\".slice(delimiter_index, delimiter_index+1));\\n\\n        delimiter_index = \\\"])}\\\".indexOf(current);\\n        if (delimiter_index != -1) {\\n          if (top(state).type == current) state.indent = state.scopes.pop().offset - hangingIndent\\n          else return ERRORCLASS;\\n        }\\n      }\\n      if (state.dedent && stream.eol() && top(state).type == \\\"py\\\" && state.scopes.length > 1)\\n        state.scopes.pop();\\n\\n      return style;\\n    }\\n\\n    var external = {\\n      startState: function(basecolumn) {\\n        return {\\n          tokenize: tokenBase,\\n          scopes: [{offset: basecolumn || 0, type: \\\"py\\\", align: null}],\\n          indent: basecolumn || 0,\\n          lastToken: null,\\n          lambda: false,\\n          dedent: 0\\n codesandbox-playground/editor\":{\"text\":\"\\\\define temp() $:/temp/codesandbox-playground/$(dataTiddler)$\\n\\n\\\\define dataTiddler() $(storyTiddler)$\\n\\n\\\\function .value()\\n  [\u003Ctemp>get\u003Cfield>else[{}]]\\n\\\\end\\n\\n\\\\function .set(field) \\n  [jsonset:object[files],\u003Cfield>jsonset:object[files],\u003Cfield>,[content]jsonset[files],\u003Cfield>,[content],\u003C.value>]\\n\\\\end\\n\\n\\\\function get.current-file()\\n  [\u003Ctemp>get[current-file]]\\n\\\\end\\n\\n\\\\function get.files()\\n  [\u003Ctemp>get[files]]\\n\\\\end\\n\\n\\\\function get.lz-string()\\n  [\u003CdataTiddler>get[lz-string]]\\n\\\\end\\n\\n\\\\function json.from.lz-string()\\n    [get.lz-string[]lzdecode[base64]]\\n\\\\end\\n\\n\\\\function files.from.lz-string()\\n    [\u003Cjson.from.lz-string>jsonindexes[files]format:titlelist[]]\\n\\\\end\\n\\n\\\\function file.content.from.lz-string()\\n  [\u003Cjson.from.lz-string>jsonget[files],\u003Cfield>jsonget[content]]\\n\\\\end\\n\\n\\\\procedure set-temp-fields()\\n\u003C$action-setmultiplefields \\n  $tiddler=\u003C\u003Ctemp>>\\n  $fields=`${ [files.from.lz-string[]join[ ]] }$ files`\\n  $values=\\\"=[files.from.lz-string[]]:map[\u003Cjson.from.lz-string>jsonget[files],{!!title}] =[files.from.lz-string[]join[ ]]\\\"\\n/>\\n\\\\end\\n\\n\\\\function lz-string.from.temp()\\n    [\u003Ctemp>get[files]enlist-input[]]\\n    :reduce[\u003Caccumulator>!is[blank]else[{\\\"files\\\": {}}]function[.set],{!!title}]\\n    +[lzencode[base64]]\\n\\\\end\\n\\n\\\\procedure set-data-fields()\\n    \u003C$action-setfield $tiddler=\u003C\u003CdataTiddler>> $field=\\\"lz-string\\\" $value=\u003C\u003Clz-string.from.temp>> />\\n\\\\end\\n\\n\\\\procedure delete-file-actions()\\n  \u003C$action-deletefield $tiddler=\u003C\u003Ctemp>> $field=\u003C\u003CfullPath>>/>\\n  \u003C$action-listops $tiddler=\u003C\u003Ctemp>> $field=\\\"files\\\" $subfilter=\\\"-[\u003CfullPath>]\\\"/>\\n  \u003C\u003Cset-data-fields>>\\n\\\\end\\n\\n\\\\procedure delete-file()\\n\u003C$button tooltip=`Delete $(fullPath)$` class=\\\"tc-btn-invisible file-delete-btn\\\" actions=\u003C\u003Cdelete-file-actions>> >\\n{{$:/core/images/delete-button}}\\n\u003C/$button>\\n\\\\end\\n\\n\\\\function get.new-file()\\n  [\u003Ctemp>get[new-file]]\\n\\\\end\\n\\n\\\\procedure add-file-actions()\\n\u003C%if [get.new-file[]is[empty]then[yes]else[no]] %>\\n\u003C$action-listops $tiddler=\u003C\u003Ctemp>> $field=\\\"files\\\" $subfilter=\u003C\u003Cget.new-file>>/>\\n\u003C$action-setfield $tiddler=\u003C\u003Ctemp>> $field=\\\"new-file\\\"/>\\n\u003C\u003Cset-data-fields>>\\n\u003C%endif%>\\n\\\\end\\n\\n\\\\procedure add-file()\\n\u003C$keyboard actions=\u003C\u003Cadd-file-actions>> key=\\\"enter\\\" class=\\\"file-controls\\\" tag=\\\"div\\\">\\n\u003C$edit class=\\\"tc-edit-texteditor\\\" tiddler=\u003C\u003Ctemp>> field=\\\"new-file\\\" placeholder=\\\"folder/file.js\\\"/>\\n\u003C/$keyboard>\\n\u003C$button \\ntooltip=`Add $(get.new-file)$`\\nclass=\\\"tc-btn-invisible\\\"\\nactions=\u003C\u003Cadd-file-actions>>\\ndisabled={{{ [get.new-file[]minlength[1]then[no]else[yes]]  }}}\\n>\\n{{$:/core/images/new-button}}\\n\u003C/$button>\\n\\\\end\\n\\n\\\\procedure update-editor()\\n\u003C$button tooltip=`Update editor` class=\\\"tc-btn-invisible\\\" actions=\u003C\u003Cset-temp-fields>> >\\n{{$:/core/images/refresh-button}}\\n\u003C/$button>\\n\\\\end\\n\\n\\n\\\\procedure toggle-sidenav-actions()\\n\u003C$action-listops $tiddler=\u003C\u003Ctemp>> $field=\\\"toggle-sidenav\\\" $subfilter=\\\"+[toggle[folded]]\\\" />\\n\\\\end\\n\\n\\\\procedure toggle-sidenav()\\n\u003C$button tooltip=`Toggle sidenav` class=\\\"tc-btn-invisible toggle-sidenav\\\" actions=\u003C\u003Ctoggle-sidenav-actions>> >\\n\u003C%if [\u003Ctemp>get[toggle-sidenav]match[folded]] %>\\n{{$:/core/images/right-arrow}}\\n\u003C%else%>\\n{{$:/core/images/left-arrow}}\\n\u003C%endif%>\\n\u003C/$button>\\n\\\\end\\n\\n\\\\procedure close-file-actions()\\n\u003C$action-s nesis>\\n    \u003C/$let>\\n\u003C/$list>\\n\u003C/ul>\\n\\\\end\\n\\n\\\\define mimetypes-dic()\\n{\\n  \\\"js\\\": \\\"application/javascript\\\",\\n  \\\"css\\\": \\\"text/css\\\",\\n  \\\"html\\\": \\\"text/html\\\",\\n  \\\"json\\\": \\\"application/json\\\",\\n  \\\"ts\\\": \\\"application/typescript\\\",\\n  \\\"py\\\": \\\"text/x-python\\\",\\n  \\\"md\\\": \\\"text/x-markdown\\\"\\n}\\n\\\\end\\n\\n\u003Csection class=\\\"ide-container\\\">\\n\u003Cnav class=\\\"ide-sidebar\\\">\\n\u003Cheader class=\\\"sidebar-header\\\">\\n\u003C%if [\u003Ctemp>get[toggle-sidenav]match[folded]] %>\\n\u003C%else%>\\n\u003C\u003Cadd-file>>\\n\u003C\u003Cupdate-editor>>\\n\u003C%endif%>\\n\u003C\u003Ctoggle-sidenav>>\\n\u003C/header>\\n\u003C%if [\u003Ctemp>get[toggle-sidenav]match[folded]] %>\\n\u003C%else%>\\n\u003Cdiv class=\\\"file-tree\\\">\\n\u003C\u003Crender-tree>>\\n\u003C/div>\\n\u003C%endif%>\\n\u003C/nav>\\n\u003Csection class=\\\"ide-editor-area\\\">\\n\u003C$let file=\u003C\u003Cget.current-file>> >\\n\u003C%if [\u003Cfile>!is[blank]]%>\\n\u003Cheader class=\\\"editor-header\\\">\\n\u003Ch2 class=\\\"current-file-name\\\">\u003C\u003Cfile>> \u003C\u003Cclose-file>>\u003C/h2>\\n\u003C/header>\\n\u003Cdiv class=\\\"editor-content\\\">\\n\u003C$edit \\ntiddler=\u003C\u003Ctemp>>\\nfield=\u003C\u003Cfile>>\\ntag=\\\"textarea\\\"\\nclass=\\\"tc-edit-texteditor\\\"\\ninputActions=\u003C\u003Cset-data-fields>>\\ntype={{{ [\u003Cfile>split[.]last[]]:map[\u003Cmimetypes-dic>jsonget{!!title}] }}}\\n/>\\n\u003C/div>\\n\u003C%else%>\\n\u003Cdiv class=\\\"empty-state\\\">\\n\u003C\u003Cembed-options>>\\n\u003C/div>\\n\u003C%endif%>\\n\u003C/$let>\\n\u003C/section>\\n\u003C/section>\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/codesandbox-playground/editor/style\":{\"text\":\".ide-container {\\n  display: flex;\\n  border: 1px solid #d0d7de;\\n  border-radius: 6px;\\n  overflow: hidden;\\n  font-family: -apple-system, BlinkMacSystemFont, \\\"Segoe UI\\\", Helvetica, Arial, sans-serif;\\n\\n  .ide-sidebar {\\n    width: fit-content;\\n    display: flex;\\n    flex-direction: column;\\n    background-color: #f6f8fa;\\n    border-right: 1px solid #d0d7de;\\n\\n    .sidebar-header {\\n      border-bottom: 1px solid #e1e4e8;\\n\\n      .file-controls {\\n        display: inline-flex;\\n        gap: 6px;\\n        align-items: center;\\n\\n        input {\\n          flex: 1;\\n          padding: 6px 8px;\\n          border: 1px solid #d0d7de;\\n          border-radius: 4px;\\n          font-size: 13px;\\n          outline: none;\\n          transition: border-color 0.2s;\\n\\n          &:focus {\\n            border-color: #0969da;\\n          }\\n        }\\n\\n        button {\\n          background: #ffffff;\\n          border: 1px solid #d0d7de;\\n          padding: 6px;\\n          border-radius: 4px;\\n          cursor: pointer;\\n          display: flex;\\n          align-items: center;\\n          justify-content: center;\\n          transition: background-color 0.2s;\\n\\n          &:hover {\\n            background: #f3f4f6;\\n          }\\n\\n          svg {\\n            width: 14px;\\n            height: 14px;\\n            fill: #57606a;\\n          }\\n        }\\n      }\\n    }\\n\\n    .file-tree {\\n      flex: 1;\\n      overflow-y: auto;\\n      padding: 8px 0;\\n\\n      ul {\\n        list-style: none;\\n        padding: 0;\\n        margin: 0;\\n\\n        li {\\n          display: flex;\\n          align-items: center;\\n          margin: 2px 8px;\\n\\n          &[active=\\\"true\\\"] > button.open-file-btn {\\n            background-color: #e9ecef;\\n            font-weight: 600;\\n            color: #0969da;\\n          }\\n\\n          details {\\n            width: 100%;\\n            &[data-item-type=\\\"folder\\\"] {\\n              padding-left: 14px;\\n            }\\n          }\\n          \\n          /* The file/folder labels */\\n          button, summary {\\n            text-align: left;\\n            background: none;\\n            border: none;\\n            padding: 6px 8px;\\n            border-radius: 4px;\\n            font-size: 13px;\\n            color: #24292f;\\n            display: flex;\\n            align-items: center;\\n            gap: 8px;\\n            cursor: pointer;\\n            transition: background-color 0.2s;\\n\\n            &:hover {\\n              background-color: #eaeef2;\\n            }\\n\\n            svg {\\n              width: 16px;\\n              height: 16px;\\n              fill: #57606a;\\n            }\\n          }\\n\\n          .file-delete-btn {\\n            opacity: 0;\\n            padding: 4px;\\n            margin-left: auto;\\n            svg { width: 14px; height: 14px; fill: #cf222e; }\\n          }\\n\\n          &:hover .file-delete-btn {\\n            opacity: 1;\\n          }\\n\\n          .open-file-btn {\\n            flex: 1;\\n          }\\n        }\\n      }\\n    }\\n  }\\n\\n  .ide-editor-area {\\n    flex: 1;\\n    display: flex;\\n    flex-direction: column;\\n    background-color: #ffffff;\\n    min-width: 0;\\n\\n    .editor-header {\\n      display: flex;\\n      align-items: flex-end; /* Align the tab to the bottom */\\n      border-bottom: 1px solid #d0d7de;\\n      background-color: #f6f8fa;\\n      padding-left: 8px;\\n\\n      .current-file-name {\\n        display: flex;\\n        align-items: center;\\n        gap: 8px;\\n        padding: 0 12px;\\n        font-size: 13px;\\n        font-family: ui-monospace, SFMono-Regular, \\\"SF Mono\\\", Menlo, Consolas, \\\"Liberation Mono\\\", monospace;\\n        font-weight: 500;\\n        margin: 0;\\n        background-color: #ffffff;\\n        border: 1px solid #d0d7de;\\n        border-bottom: none;\\n        border-radius: 6px 6px 0 0;\\n        color: #24292f;\\n\\n        button {\\n           background: none;\\n           border: none;\\n           cursor: pointer;\\n           padding: 2px;\\n           display: flex;\\n           align-items: center;\\n           border-radius: 3px;\\n           &:hover { background-color: #f0f0f0; }\\n           svg { width: 12px; height: 12px; fill: #57606a; }\\n        }\\n      }\\n    }\\n\\n    .empty-state {\\n      padding-inline: 1rem;\\n      height: 100%;\\n      color: #57606a;\\n      font-size: 14px;\\n    }\\n\\n    .editor-content {\\n      flex: 1;\\n      display: flex;\\n      min-height: 10lh;\\n\\t\\t\\tmax-height: 30lh;\\n\\t\\t\\toverflow: scroll;\\n      \\n      textarea.tc-edit-texteditor {\\n        width: 100%;\\n        height: 100% !important;\\n        border: none;\\n        margin: 0;\\n        padding: 16px;\\n        font-size: 14px;\\n        font-family: ui-monospace, SFMono-Regular, \\\"SF Mono\\\", Menlo, Consolas, \\\"Liberation Mono\\\", monospace;\\n        line-height: 1.6;\\n        color: #24292f;\\n        resize: none;\\n        outline: none;\\n      }\\n    }\\n  }\\n}\",\"type\":\"text/css\",\"tags\":\"$:/tags/Stylesheet\"},\"$:/plugins/theophile.dev/codesandbox-playground/readme\":{\"text\":\"This plugin integrates a ''CodeSandbox editor and playground'' directly into your TiddlyWiki.\\n\\n!!! How it works\\n\\nThe project files and configurations are stored as a JSON object, encoded in the `lz-string` format, and saved within the `lz-string` field of the current tiddler. \\n\\n> ''⚠️ Important Note on Saving:'' \\n> Any changes made directly inside the rendered CodeSandbox iframe will ''NOT'' be saved to your wiki. To permanently save your code, create a fork on codesandbox, or use the [[codesandbox editor|$:/plugins/theophile.dev/codesandbox-playground/editor]] to update the lz-string used to render the CodeSandbox. If you manually edit the lz-string, use the update button in the editor to reflect the new state.\",\"lz-string\":\"N4IgZglgNgpgziAXKAxgewLYAc0Dsa4AucA9AIJZYB0AVgsiOkQYUiBNmgE6EAEAEjACGAExhdeYLpl4ByKiUGjxsgNwAdXJrABXXCkIQ8vClgAUASl7BNvXlxiEdXXLzO27vADwA-D5-8lMQkSP1cA7wwhCFwwiM8vLB8AFQBPLAgUISheIUpeOEIuHQNnGC8SJP8EkiiYuJqGiw1cAF9NTRgADxweXjEwIR0oPlNVEFaAGkZMHHwiUiDxWnpUPEIWNl19Q2MlrktrDwcnFzdqrwALYWCGgKuARh8AUS6hbFgTSgrLp4uSa7KLhNTTtLT4HrcPgDIYjAQ3cTjKbsXBiLorJBrZhENgcXp8ABKwgMkmkGDkDiEBjUmjxUOsvBQlI2BLQaD4rVJMlklIMAFoRJgSCgoBAWDTwXS-qYueT5MLZngWKRTBLNExCvY2XwALyM5kwVns9zhQUoHQYFhUACOOnEqQAyjBYAZuGZZABiaTs2QWTTNDq4b2EKgOVHiMxeGWhZoTaZYKkAayEAHMYCs8JiZtjWIgQDZwuoQGIsAQxPoxXAi4gjuE7EXeYRq7wiw8AJxUABMVAeRcm1QbxMIAswzdbHe7vZA_brLZAjb5cCZECwxDHIAAegBWKgABj3RY8Uw8RbqWiQc5IMTRKz7J-LMAAbgARGCl8MV-DN4Bg1pxkBYDoABGoooFe4bopchAYFAWZMBsOJ5l4ACEz4APIAMLJAAmgACs8vBQTBYRXNBORQEIuApjqRYEEWDRXDcdyRI4QiMpcQhcHAjg0SAACqyQAGJ8gAHPRFyWoQbG4O8MC8Y-YoAO74kWjLrCwvGKRAIiEJcOpiApKAwHyWk6Zcky8DEECGNki5ZLAOoPAeIDMV4hiELAPjPmg5qWkQFTuZ5Hg_ExwVAWgIipK5IgQI-lkiLxwb0RUMWPgxJDhZFJEAmRPj_oUqSwHAVAoHAqzZghuYgJlqS1nYYDrHygwYNAqQ1nAqSFDAGB8joEAtGCmi_HVkiNXAEAAF4wDWTlbg4GADRMrStEAA\",\"playground-view\":\"split\",\"playground-title\":\"Hello world\",\"playground-module\":\"\",\"edit-codesandbox\":\"true\"},\"$:/plugins/theophile.dev/codesandbox-playground/roadmap\":{\"text\":\"!! Phase 1: Stabilization & Quality of Life (v0.1.x)\\n//Focus: Polishing the current feature set, improving stability, and ensuring a smooth user experience.//\\n\\n* ''File Management Safety:'' Add a confirmation prompt before deleting files to prevent accidental data loss in the `delete-file-actions` procedure.\\n* ''File Renaming:'' Implement the ability to rename existing files and folders without having to create a new one and copy the contents over.\\n* ''Error Handling:'' Add fallback UI or error messages for corrupted or invalid `lz-string` data so the plugin doesn't break silently.\\n* ''Folder State Persistence:'' Remember which folders in the file tree are expanded/collapsed when the editor updates.\\n\\n!! Phase 2: Enhanced Editor Experience (v0.2.x)\\n//Focus: Upgrading the TiddlyWiki-side IDE to feel more like a native code editor.//\\n\\n* [ x ] ''Syntax Highlighting:'' Integrate with TiddlyWiki's existing CodeMirror plugins. Transition the current basic `\u003Ctextarea>` into a CodeMirror instance based on the file extension (e.g., `.js`, `.css`, `.html`).\\n* ''Drag and Drop:'' Allow users to drag and drop text files from their computer directly into the plugin's file tree to automatically add them to the `lz-string` payload.\\n\\n!! Phase 3: Templates & Advanced Integration (v0.3.x - v1.0.x)\\n//Focus: Expanding the plugin's capabilities for power users and educators.//\\n\\n* ''Project Templates (Boilerplates):'' Add a dropdown menu to instantly initialize new playgrounds with standard setups (e.g., React, Vue, Vanilla JS, Svelte). This would inject pre-configured `lz-strings`.\\n* ''Export Capabilities:'' Create a button to download the current state of the playground as a standard `.zip` file.\\n* ''Explore Sandpack Native Integration:'' Currently, the plugin use the CodeSandbox define API with an `iframe`, which has some limitation (the url can't be over 2048 chars). Investigate building a native TiddlyWiki widget wrapping `@codesandbox/sandpack-client` for improved two-way data binding, potentially eliminating the need for users to manually update the `lz-string` when they change code.\"},\"$:/plugins/theophile.dev/codesandbox-playground/viewer\":{\"text\":\"\\\\procedure embed-options()\\n\\n\u003Cp>\\n\\n\u003C!-- Used in $:/plugins/theophile.dev/codesandbox-playground/editor -->\\n\\n!!! [[Embed options|https://codesandbox.io/docs/learn/legacy-sandboxes/embedding#embed-options]]\\n\\n* Use codemirror: \u003C$checkbox field=\\\"playground-codemirror\\\" checked=\\\"0\\\" unchecked=\\\"1\\\"/>\\n* Use eslint: \u003C$checkbox field=\\\"playground-eslint\\\" checked=\\\"0\\\" unchecked=\\\"1\\\"/>\\n* view: \u003C$select field=\\\"playground-view\\\">\\n\u003C$list filter=\\\"editor split preview\\\">\u003Coption>{{!!title}}\u003C/option>\u003C/$list>\\n\u003C/$select>\\n* previewwindow: \u003C$select field=\\\"playground-previewwindow\\\">\\n\u003C$list filter=\\\"console tests browser\\\">\u003Coption>{{!!title}}\u003C/option>\u003C/$list>\\n\u003C/$select>\\n* module(s) to open by default: \u003Cul>\\n\u003C$list filter=\\\"[{!!lz-string}lzdecode[base64]jsonindexes[files]format:titlelist[]]\\\" variable=\\\"file\\\">\\n\u003Cli>\u003C$checkbox listField=\\\"playground-module\\\" checked=\u003C\u003Cfile>>> \u003C\u003Cfile>>\u003C/$checkbox>\u003C/li>\\n\u003C/$list>\\n\u003C/ul>\\n* lz-string: \u003C$edit-text tag=\\\"input\\\" field=\\\"lz-string\\\" class=\\\"tc-edit-texteditor\\\" />\\n\\n\u003C$parameters\\nlz-string={{!!lz-string}}\\nview=\\\"split\\\"\\nmodule={{!!playground-module}}\\npreviewwindow=\\\"browser\\\"\\n>\\n\\n* \u003Ca href=\u003C\u003Ccs.srcembed>> >embed link\u003C/a>\\n\\n\u003C/$parameters>\\n\\n\u003C/p>\\n\\n\\\\end\\n\\n\\\\function cs.src()\\n=\\\"$(apiURL)$?parameters=$(cs.parameter)$&query=\\\"\\n=[[file=/index.js&utm_medium=sandpack]encodeuricomponent[]]\\n=\\\"&environment=create-react-app&view=\\\"\\n=[\u003Cview>encodeuricomponent[]]\\n=\\\"&hidenavigation=1\\\"\\n+[join[]substitute[]]\\n\\\\end\\n\\n\\\\function cs.srcembed()\\n=\\\"$(apiURL)$?parameters=$(cs.parameter)$=&query=$(cs.query)$&embed=1\\\"\\n+[substitute[]]\\n\\\\end\\n\\n\\\\function cs.parameter()\\n[\u003Clz-string>split[?parameters=]last[]split[&]first[]]~[\u003Clz-string>]\\n\\\\end\\n\\n\\\\function cs.module()\\n[\u003Clz-string>lzdecode[base64]jsonindexes[files]]\\n:filter[\u003Cmodule>is[blank]]\\n:else[enlist\u003Cmodule>]\\n+[addprefix[/]join[,]addsuffix[,]]\\n\\\\end\\n\\n\\\\function cs.initialpath()\\n[\u003Ccs.module>split[,]first[]]\\n\\\\end\\n\\n\\n\\\\function cs.codemirror()\\n[{!!playground-codemirror}match[1]else[0]]\\n\\\\end\\n\\n\\\\function cs.eslint()\\n[{!!playground-eslint}match[1]else[0]]\\n\\\\end\\n\\n\\\\function cs.query()\\n='view=$(view)$'\\n='codemirror=$(cs.codemirror)$'\\n='eslint=$(cs.eslint)$'\\n='module=$(cs.module)$'\\n='moduleview=0'\\n-'hidenavigation=1'\\n='previewwindow=$(previewwindow)$'\\n='eslint=$(cs.eslint)$'\\n='theme=dark'\\n='fontsize=12'\\n+[substitute[]join[&]encodeuricomponent[]]\\n\\\\end\\n\\n\\\\define apiURL() https://codesandbox.io/api/v1/sandboxes/define\\n\\n\u003C$parameters\\nlz-string={{!!lz-string}}\\nview=\\\"split\\\"\\nmodule={{!!playground-module}}\\npreviewwindow=\\\"browser\\\"\\n>\\n\u003C!--\\nto use tiddlywiki color scheme:\\n[{$:/palette}get[color-scheme]]\\n-->\\n\u003Csection class=\\\"playground\\\">\\n\u003Ciframe src=\u003C\u003Ccs.srcembed>> sandbox=\\\"allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts\\\" style=\\\"border:0;width:100%;aspect-ratio:16/9;\\\"/>\\n\u003C/section>\\n\u003C/$parameters>\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/codesandbox-playground/viewer+editor\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/codesandbox-playground/viewer]] [[$:/plugins/theophile.dev/codesandbox-playground/editor]]\\n\\n\\\\procedure btn-edit-playground-actions()\\n    \u003C\u003Cset-temp-fields>>\\n    \u003C$action-listops $field=\\\"edit-codesandbox\\\" $subfilter=\\\"+[toggle[true]]\\\" />\\n\\\\end\\n\\n\\\\procedure btn-edit-playground()\\n\u003C$button actions=\u003C\u003Cbtn-edit-playground-actions>> tooltip=\\\"Edit codesandbox embed\\\" class=\\\"tc-btn-invisible\\\">\\n    {{$:/core/images/options-button}}\\n\u003C/$button>\\n\\\\end\\n\\n\\\\procedure btn-open-in-new-window-actions()\\n\u003C$parameters\\nlz-string={{!!lz-string}}\\nview=\\\"split\\\"\\nmodule=\\\"\\\"\\npreviewwindow=\\\"browser\\\"\\n>\\n\u003C$action-sendmessage $message=\\\"tm-open-external-window\\\" $param=\u003C\u003Ccs.src>> windowName={{!!title}} windowFeatures=\\\"height=500, width=900\\\"/>\\n\u003C/$parameters>\\n\\\\end\\n\\n\\\\procedure btn-open-in-new-window()\\n\u003C$button actions=\u003C\u003Cbtn-open-in-new-window-actions>> tooltip=\\\"Open in codesandbox.io\\\" class=\\\"tc-btn-invisible\\\">\\n    {{$:/images/codesandbox}}\\n\u003C/$button>\\n\\\\end\\n\\n\\\\function edit.codesandbox() [{!!edit-codesandbox}match[true]]\\n\\n\\\\define storyTiddler() $(currentTiddler)$\\n\\n\u003Csection class=\\\"codesandbox-playground\\\">\\n    \u003Cmenu>\\n        \u003C\u003Cbtn-open-in-new-window>>\\n        \u003C\u003Cbtn-edit-playground>>\\n    \u003C/menu>\\n    \u003C%if [edit.codesandbox[]] %>\\n        \u003C$transclude $tiddler=\\\"$:/plugins/theophile.dev/codesandbox-playground/editor\\\"/>\\n    \u003C%else%>\\n        \u003C$transclude \\n        $tiddler=\\\"$:/plugins/theophile.dev/codesandbox-playground/viewer\\\"\\n        lz-string={{!!lz-string}}\\n        title={{!!playground-title}}\\n        view={{!!playground-view}}\\n        module={{!!playground-module}}\\n        previewwindow={{!!playground-previewwindow}}\\n        />\\n    \u003C%endif%>\\n\u003C/section>\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/codesandbox-playground/viewer+editor/style\":{\"text\":\".codesandbox-playground {\\n\\tposition: relative;\\n\\tmenu {\\n\\t\\tdisplay: flex;\\n\\t\\tflex-direction: column;\\n\\t\\tleft: 100%;\\n\\t\\tmargin: 0;\\n\\t\\tpadding: 0;\\n\\t\\tpadding-inline-start:5px;\\n\\t\\tposition: absolute;\\n\\t\\ttop: 0;\\n\\t\\twidth: max-content;\\n\\t}\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.8","description":"Tools to create and edit codesandbox playground from tiddlywiki","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","dependents":"$:/plugins/theophile.dev/lz-string","title":"$:/plugins/theophile.dev/codesandbox-playground"},
{"created":"20230424221125460","creator":"theophile.dev","text":"\\define link-to-controlpanel-tab-actions()\n\n\u003C$action-setfield $tiddler=\"$:/state/tab-1749438307\" text=\u003C\u003Cmain-tab>> />\n\u003C$action-setfield $tiddler=\"$:/state/tab--1963855381\" text=\u003C\u003Csub-tab>> />\n\u003C$action-navigate $to=\u003C\u003CnavigateTo>>/>\n\n\\end\n\n\\define link-to-controlpanel-tab-separator()\u003C$list filter=\"[\u003Cdepth-last>!match[yes]]\">\u003C$text text=\u003C\u003C__separator__>>/>\u003C/$list>\n\n\\define link-to-controlpanel-tab-template(separator) \u003C$tiddler tiddler=\u003C\u003CnavigateTo>> >\u003C$button tag=\"a\" actions=\u003C\u003Clink-to-controlpanel-tab-actions>> class=\"tc-tiddlylink tc-tiddlylink-shadow\">\u003C$transclude field=\"caption\">\u003C$transclude field=\"title\"/>\u003C/$transclude>\u003C/$button>\u003C/$tiddler>\u003C\u003Clink-to-controlpanel-tab-separator>>\n\n\\define link-to-controlpanel-tab(caption:\"\"\"\u003Ccode>\u003C$list filter=\"$:/ControlPanel [\u003Cmain-tab>] [\u003Csub-tab>]\" counter=\"depth\" variable=\"navigateTo\">\u003C\u003Clink-to-controlpanel-tab-template \" > \">>\u003C/$list>\u003C/code>\"\"\",prefix,sub-tab)\n\u003C$let\nprefix={{{ [\u003C__prefix__>!is[blank]]:else[{!!title}split[/]first[4]join[/]] }}} \nsub-tab={{{ [\u003C__sub-tab__>!is[blank]]:else[all[tiddlers+shadows]prefix\u003Cprefix>search:tags[$:/tags/ControlPanel]] }}}\nmain-tab={{{ [\u003Csub-tab>tags[]prefix[$:/tags/ControlPanel/]trim[$:/tags/]] :map[[$:/tags/ControlPanel]tagging[]search{!!title}] }}}\ntv-wikilinks=\"no\"\n>\u003C\u003C__caption__>>\u003C/$let>\n\\end","tags":"$:/tags/Macro","title":"$:/plugins/theophile.dev/Commons/macros/openControlPanelTab","modified":"20250124152443973","code-body":"yes","modifier":"theophile.dev"},

{"text":"{\"tiddlers\":{\"$:/macros/editor\":{\"text\":\"\\\\define editor(field:\\\"text\\\",placeholder,tiddler,tag:\\\"input\\\",class)\\n\\\\define editor-buttons(filter,style)\\n\u003Cdiv style=\u003C\u003C__style__>> class=\\\"editor-buttons\\\">\\n\u003C$list filter=\\\"\\n[[$:/tags/EditorToolbar]tagging[]!is[draft]]\\n:filter[\u003Cconfig-visibility-title>get[text]else[]!match[hide]]\\n:filter[$filter$]\\\">\\n\u003Cdiv style=\\\"position:absolute;top:0;left:0;visibility:hidden\\\">\u003C$transclude tiddler=\\\"$:/core/ui/EditTemplate/body/toolbar/button\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/div>\\n\\\\end editor-buttons\\n\u003C$tiddler tiddler={{{ [\u003C__tiddler__>!is[blank]else\u003CcurrentTiddler>] }}}>\\n@@position:relative;\\n\u003C$edit\\nclass=\\\"tc-edit-texteditor tc-edit-texteditor-body $class$\\\"\\ntabindex={{$:/config/EditTabIndex}}\\nfocus={{{ [{$:/config/AutoFocus}match[text]then[yes]] }}}\\ncancelPopups=\\\"yes\\\"\\nfield=\u003C\u003C__field__>>\\ntag=\u003C\u003C__tag__>>\\nplaceholder=\u003C\u003C__placeholder__>>\\n>\\n\u003C\u003Ceditor-buttons \\\"has[dropdown]\\\" \\\"position:absolute;left:0;top:0;\\\">> \u003C\u003Ceditor-buttons \\\"!has[dropdown]\\\" \\\"display:none\\\">>\\n\u003C/$edit>\\n\u003Cstyle>\\n.editor-buttons .tc-drop-down.tc-popup-keep{visibility: initial}\\niframe.tc-edit-texteditor.tc-edit-texteditor-body.editor.full-width{width:100%;}\\n\u003C/style>\\n@@\\n\u003C/$tiddler>\\n\\\\end editor\",\"tags\":\"$:/tags/Global\",\"code-body\":\"yes\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Macro to create a textarea with keyboard support","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/editor"},

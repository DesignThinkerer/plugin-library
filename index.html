{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/player/macros/yt\":{\"text\":\"\\\\procedure yt(https,inline-style,class,index,start:\\\"0\\\",end,autoplay:\\\"1\\\",cc_lang_pref,cc_lang_pref,cc_load_policy,color,controls,disablekb,fs,hl,iv_load_policy:\\\"3\\\",modestbranding:\\\"1\\\")\\n\u003C$let\\nlist={{{ [\u003Chttps>split[list=]nth[2]] ~[\u003Chttps>search[,]] }}}\\nvideoId={{{ [\u003Chttps>split[/]split[v=]last[]split[?]split[&]first[]] }}}\\nthumbnailId={{{ [\u003CvideoId>split[,]first[]] }}}\\nparams=`${[\u003Clist>is[blank]then[]else[&]]}$index=$(index)$&start=$(start)$&end=$(end)$&autoplay=$(autoplay)$&cc_lang_pref=$(cc_lang_pref)$&cc_load_policy=$(cc_load_policy)$&color=$(color)$&controls=$(controls)$&disablekb=$(disablekb)$&fs=$(fs)$&hl=$(hl)$&iv_load_policy=$(iv_load_policy)$&modestbranding=$(modestbranding)$`\\nembedUrl=`https://www.youtube-nocookie.com/embed/${\\n[\u003Clist>search[,]addprefix[?playlist=]]\\n[\u003Clist>!is[blank]addprefix[?list=]]\\n:else[\u003CvideoId>addsuffix[?]]\\n}$$(params)$`\\n>\\n\u003Ciframe\\ntitle='YouTube video player'\\nstyle='width:100%;aspect-ratio:16/9;border:0;max-height:100vh;$(inline-style)$;'\\nclass='video $(class)$'\\nsrc='$(embedUrl)$'\\nallowfullscreen\\nallow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture, web-share'\\nloading='lazy'\\nsrcdoc=```\\n\u003Cstyle>\\nimg{width:100%;}\\nimg,span{position:fixed;inset:0;margin:auto;}\\nspan{\\nheight:1lh;\\ntext-align:center;\\nfont:48px/1.5 sans-serif;\\ncolor:white;\\ntext-shadow:0 0 0.5em black\\n}\\n\u003C/style>\\n\u003Ca href='$(embedUrl)$'>\\n\u003Cimg\\nsrc='https://i.ytimg.com/vi_webp/$(thumbnailId)$/default.webp'\\nsrcset='\\nhttps://i.ytimg.com/vi_webp/$(thumbnailId)$/default.webp 500w,\\nhttps://i.ytimg.com/vi_webp/$(thumbnailId)$/maxresdefault.webp 1000w'\\nalt=\\\"Video\\\"\\n>\\n\u003Cspan>▶\u003C/span>\\n\u003C/a>\\n```/>\\n\u003C!-- Doc : https://developers.google.com/youtube/player_parameters -->\\n\\\\end yt\",\"tags\":\"$:/tags/Macro\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/player/readme\":{\"text\":\"Usage:\\n\\n\\n```\\n\u003C\u003Cyt https://www.youtube.com/shorts/Ekhs5kwdI0c>>\\n\\nequivalent to\\n\\n\u003C\u003Cyt Ekhs5kwdI0c>>\\n```\\n\\nOutput:\\n\\n\u003C\u003Cyt Ekhs5kwdI0c>>\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.1","description":"Macro to display a youtube player","plugin-type":"plugin","stability":"STABILITY_2_STABLE","title":"$:/plugins/theophile.dev/player"},
{"text":"{\"tiddlers\":{\"$:/config/flibbles/relink/PluginLibrary\":{\"caption\":\"//Relink// Library\",\"url\":\"https://flibbles.github.io/tw5-relink/library/index.html\",\"tags\":\"$:/tags/PluginLibrary\",\"text\":\"The //Relink// library contains //Relink// as well as its supplemental plugins. It is maintained by Flibbles. See the [[github page|https://github.com/flibbles/tw5-relink]] for more information.\\n\"},\"$:/config/KookmaPluginLibrary\":{\"caption\":\"Kookma Plugin Library\",\"revision\":\"0\",\"tags\":\"$:/tags/PluginLibrary\",\"type\":\"text/vnd.tiddlywiki\",\"url\":\"https://kookma.github.io/TW-PluginLibrary/library/index.html\",\"text\":\"Kookma plugin library is a set of plugins, themes, and scripts, to extend functionality and add new features to Tiddlywiki. For detail information visit the library at [[GitHub|https://github.com/kookma]]. It is recommended to backup your data before installing any plugin, theme, or script. \\n\\nTo use in other wikis, drag and drop this link to those wikis: [[Kookma Plugin Library|$:/config/KookmaPluginLibrary]]\"},\"$:/config/OfficialPluginLibrary\":{\"tags\":\"$:/tags/PluginLibrary\",\"url\":\"https://tiddlywiki.com/library/v5.5.0/index.html\",\"caption\":\"{{$:/language/OfficialPluginLibrary}}\",\"text\":\"{{$:/language/OfficialPluginLibrary/Hint}}\\n\"},\"$:/config/wikilabs/PluginLibraryWL/latest\":{\"caption\":\"Wikilabs Library (latest)\",\"tags\":\"$:/tags/PluginLibrary\",\"type\":\"text/vnd.tiddlywiki\",\"url\":\"https://wikilabs.github.io/editions/pluginlibraryWL/library/latest/index.html\",\"text\":\"~WikiLabs plugin library latest version!\\n\"},\"$:/plugins/Gk0Wk/CPL-Repo/views/system/library-ui\":{\"caption\":\"CPL\",\"tags\":\"$:/tags/PluginLibrary $:/tags/PluginLibrary/CPL\",\"enabled\":\"no\",\"text\":\"{{$:/plugins/Gk0Wk/CPL-Repo/layout/panel}}\\n\"},\"$:/plugins/theophile.dev/tiddlyhostpluginlibrary/readme\":{\"text\":\"{{$:/plugins/theophile.dev/tiddlyhostpluginlibrary/faq/installing}}\\n\\n{{||$:/plugins/theophile.dev/Commons/templates/readme}}\",\"tags\":\"$:/tags/PluginLibrary $:/plugins/theophile.dev/tiddlyhostpluginlibrary\",\"url\":\"https://plugin-library.tiddlyhost.com/\",\"caption\":\"Tiddlyhost Plugin Library\",\"filter\":\"[plugin-type[plugin]] -$:/core\"},\"SQPL\":{\"text\":\"!!Saq's Plugin library.\\n\\n{{Installation}}\\n\",\"bag\":\"default\",\"revision\":\"0\",\"url\":\"https://saqimtiaz.github.io/SQPL/library/index.html\",\"type\":\"text/vnd.tiddlywiki\",\"tags\":\"$:/tags/PluginLibrary\",\"caption\":\"SQ Plugin Library\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.2","description":"Pack of plugin libraries","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/plugin-libraries"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/plugin-library/assetList\":{\"text\":\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\n\\n[ℹ️[Hide deprecated plugins]]\\n-[stability[STABILITY_0_DEPRECATED]]\",\"tags\":\"\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/plugin-library/faq\":{\"text\":\"\",\"tags\":\"$:/plugins/theophile.dev/plugin-library\",\"list\":\"$:/plugins/theophile.dev/plugin-library/faq/installing $:/plugins/theophile.dev/plugin-library/faq/library $:/plugins/theophile.dev/plugin-library/faq/plugin $:/plugins/theophile.dev/plugin-library/faq/pack $:/plugins/theophile.dev/plugin-library/faq/how\"},\"$:/plugins/theophile.dev/plugin-library/faq/how\":{\"text\":\"# A [[startup JavaScript module|$:/plugins/theophile.dev/plugin-library/libraryserver.js]] (`module-type: startup`) initializes automatically when the wiki boots, setting up a secure `window.postMessage` listener. \\n# When you open the plugin library, your wiki loads the library inside a hidden `iframe` and sends a `GET` request using `window.postMessage`.\\n# The startup script intercepts the message, evaluates the filter defined in the [[assetList|$:/plugins/theophile.dev/plugin-library/assetList]] tiddler at runtime, compiles the metadata, icons, and readmes, and replies with a clean JSON array.\\n# When you select a plugin to install, TiddlyWiki requests that specific plugin title via `postMessage`.\\n# The library instantly fetches the tiddler directly from the local in-memory store using `$tw.wiki.getTiddler()`, serializes its fields, and returns it to your wiki.\",\"tags\":\"$:/plugins/theophile.dev/plugin-library/faq $:/plugins/theophile.dev/plugin-library\",\"caption\":\"How does this work?\"},\"$:/plugins/theophile.dev/plugin-library/faq/installing\":{\"text\":\"\u003C$tiddler tiddler=\\\"$:/plugins/theophile.dev/plugin-library/readme\\\">\\nSimply drag and drop \u003C$link>this link\u003C/$link> into your TiddlyWiki.\\n\u003C/$tiddler>\",\"tags\":\"$:/plugins/theophile.dev/plugin-library/faq $:/plugins/theophile.dev/plugin-library\",\"caption\":\"How do I install the plugin library in my wiki?\"},\"$:/plugins/theophile.dev/plugin-library/faq/library\":{\"text\":\"Drag and drop the [[plugin-library plugin|$:/plugins/theophile.dev/plugin-library]] into your existing wiki hosted on github page. \",\"tags\":\"$:/plugins/theophile.dev/plugin-library/faq $:/plugins/theophile.dev/plugin-library\",\"caption\":\"How can I create my own plugin library ?\"},\"$:/plugins/theophile.dev/plugin-library/faq/pack\":{\"text\":\"If you frequently install the same set of plugins, you can bundle them. There are two approaches:\\n\\n# ''Dependency Method (Recommended)'': Create a plugin that will list other plugins as dependencies. This keeps your library lightweight. \u003Cem>Note: The dependent plugins must be installed in the same plugin library.\u003C/em>\\n# ''Monolith Method'': Create a single plugin containing the code of all other plugins. \u003Cem>This is not recommended as it duplicates code and increases file size.\u003C/em>\\n\\n\\n> See $:/plugins/theophile.dev/starterpack for a reference implementation of the //Dependency Method//.\",\"tags\":\"$:/plugins/theophile.dev/plugin-library $:/plugins/theophile.dev/plugin-library/faq\",\"caption\":\"How to create a pack of plugins ?\"},\"$:/plugins/theophile.dev/plugin-library/faq/plugin\":{\"text\":\"!! Method 1: Using the [ext[plugin-maker|https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker]] (Recommended)\\n\\n# Open the ''[[plugin-maker|$:/plugins/theophile.dev/plugin-maker]]''.\\n# Fill in the required form fields.\\n# Click on the button to ''package'' or ''update'' the plugin\\n\\n//Note: If you require more advanced features, consider using [ext[Gatha|https://kookma.github.io/TW-Gatha]].//\\n\\n!! Method 2: Creating a Plugin Manually\\n\\n\u003Col>\\n\u003Cli>\\n\\nCreate the tiddlers to be added to your plugin. A good practice is to use the same prefix (or namespace) for each tiddlers if possible, to avoid accidentally overriding another tiddler. For example: $:/plugins/theophile.dev/plugin-library\\n\\n\u003C/li>\\n\u003Cli>\\n\\nDrag and drop these tiddlers in a wiki open in a another tab (e.g., [ext[https://tiddlywiki.com/empty|https://tiddlywiki.com/empty]]).\\n\\n\u003C/li>\\n\u003Cli>This will open the `$:/Import` tiddler. \u003Cem>Do not click \u003Ckbd>Import\u003C/kbd>\u003C/em>. Instead, edit the tiddler:\\n\u003Cul>\\n\u003Cli>\\nChange the title to your chosen plugin prefix.\\n\u003C/li>\\n\u003Cli>\\nSet the `plugin-type` field to `plugin`\\n\u003C/li>\\n\u003Cli>\\nRemove the field `status`\\n\u003C/li>\\n\u003Cli>\\nAdd a `list` field containing the names of the tiddlers to be listed in the tabbed view for the plugin (e.g., listing `$:/plugins/theophile.dev/plugin-library/readme` will add a \\\"readme\\\" tab in the plugin view).\\n\u003C/li>\\n\u003Cli>\\nAdd a `version` field. You can follow the rules defined at https://semver.org\\n\u003C/li>\\n\u003C/ul>\\n\u003C/li>\\n\u003Cli>\\nSave your changes, then drag and drop the resulting plugin back into your plugin library wiki.\\n\u003C/li>\\n\u003C/ol>\",\"tags\":\"$:/plugins/theophile.dev/plugin-library/faq $:/plugins/theophile.dev/plugin-library\",\"caption\":\"How to create a plugin ?\"},\"$:/plugins/theophile.dev/plugin-library/faq/why\":{\"text\":\"Creating a plugin library centralizes your tools and content. You can:\\n\\n* Apply and automatically update custom tweaks across multiple wikis.\\n* Distribute your original plugins, books, blogs .. from a single source.\\n* Host an easily accessible collection of your favorite plugins.\\n* Collaborate with other people to push content to a single wiki.\\n* If you are a teacher, deliver lessons and assignments as plugins so students can safely update their materials without overwriting personal notes.\",\"tags\":\"$:/plugins/theophile.dev/plugin-library/faq $:/plugins/theophile.dev/plugin-library\",\"caption\":\"Why would I need my own plugin library?\"},\"$:/plugins/theophile.dev/plugin-library/icon\":{\"text\":\"{{$:/core/images/plugin-generic-theme}}\"},\"$:/plugins/theophile.dev/plugin-library/libraryserver.js\":{\"text\":\"/*\\\\ \\ntitle: $:/plugins/theophile.dev/plugin-library/libraryserver.js \\ntype: application/javascript \\nmodule-type: startup\\n\\nA lightning-fast HTTP-over-window.postMessage implementation. \\nFully optimized using native TiddlyWiki core utility methods.\\n\\\\*/\\n(function () {\\n  \\\"use strict\\\";\\n\\n  exports.name = \\\"plugin-library-server\\\";\\n  exports.platforms = [\\\"browser\\\"];\\n  exports.after = [\\\"startup\\\"];\\n  exports.synchronous = true;\\n\\n  exports.startup = function() {\\n    \\n    window.addEventListener(\\\"message\\\", function listener(event) {\\n      if (!event.data || typeof event.data !== \\\"object\\\" || event.data.verb !== \\\"GET\\\") {\\n        return; \\n      }\\n      handleGetRequest(event);\\n    }, false);\\n\\n    function sendResponse(event, status, type, body) {\\n      if (!event.source) return;\\n\\n      event.source.postMessage({\\n        verb: \\\"GET-RESPONSE\\\",\\n        status: status.toString(),\\n        cookies: event.data.cookies,\\n        url: event.data.url,\\n        type: type,\\n        body: body\\n      }, \\\"*\\\");\\n    }\\n\\n    function handleGetRequest(event) {\\n      var url = event.data.url || \\\"\\\";\\n\\n      // --- Route A: Main Asset List ---\\n      if (url === \\\"recipes/library/tiddlers.json\\\") {\\n        try {\\n          var filterTiddler = $tw.wiki.getTiddler(\\\"$:/plugins/theophile.dev/plugin-library/assetList\\\");\\n          var filter = filterTiddler && filterTiddler.fields.text ? filterTiddler.fields.text : \\\"[plugin-type[plugin]]\\\";\\n\\n          var pluginTitles = $tw.wiki.filterTiddlers(filter);\\n          var assetList = [];\\n\\n          $tw.utils.each(pluginTitles, function(title) {\\n            var tiddler = $tw.wiki.getTiddler(title);\\n            if (tiddler) {\\n              \\n              var asset = tiddler.getFieldStrings();\\n              delete asset.text; \\n\\n              var readmeText = $tw.wiki.getTiddlerText(title + \\\"/readme\\\");\\n              if (readmeText) asset.readme = readmeText;\\n\\n              var iconTiddler = $tw.wiki.getTiddler(title + \\\"/icon\\\");\\n              // Using $tw.utils.hop for safe property lookup\\n              if (iconTiddler && $tw.utils.hop(iconTiddler.fields, \\\"text\\\")) {\\n                var iconType = iconTiddler.fields.type || \\\"text/vnd.tiddlywiki\\\";\\n                \\n                if (iconTiddler.fields._canonical_uri) {\\n                  asset.icon = iconTiddler.fields._canonical_uri;\\n                } else if (iconType === \\\"image/svg+xml\\\" || iconType === \\\"text/vnd.tiddlywiki\\\" || !iconTiddler.fields.type) {\\n                  \\n                  var renderedIcon = $tw.wiki.renderText(\\\"text/html\\\", \\\"text/vnd.tiddlywiki\\\", iconTiddler.fields.text, {\\n                    parseAsInline: true\\n                  }).trim();\\n                  \\n                  if (/\u003Csvg\\\\b/i.test(renderedIcon) && !/\\\\bxmlns\\\\s*=/i.test(renderedIcon)) {\\n                    renderedIcon = renderedIcon.replace(/\u003Csvg\\\\b/i, '\u003Csvg xmlns=\\\"http://www.w3.org/2000/svg\\\" ');\\n                  }\\n\\n                  asset.icon = \\\"data:image/svg+xml;charset=utf-8,\\\" + encodeURIComponent(renderedIcon);\\n                } else {\\n                  asset.icon = \\\"data:\\\" + iconType + \\\";base64,\\\" + iconTiddler.fields.text;\\n                }\\n              }\\n\\n              assetList.push(asset);\\n            }\\n          });\\n\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(assetList, null, 4));\\n\\n        } catch (e) {\\n          console.error(\\\"Plugin Library: Failed to generate asset list\\\", e);\\n          sendResponse(event, 500, \\\"text/plain\\\", \\\"Internal Server Error\\\");\\n        }\\n      } \\n      // --- Route B: Specific Plugin Request ---\\n      else if ($tw.utils.startsWith(url, \\\"recipes/library/tiddlers/\\\")) {\\n        var pluginTitle = url.substring(\\\"recipes/library/tiddlers/\\\".length);\\n\\n        if (pluginTitle.endsWith(\\\".json\\\")) {\\n          pluginTitle = pluginTitle.slice(0, -5);\\n        }\\n        \\n        try {\\n          pluginTitle = decodeURIComponent(pluginTitle);\\n        } catch (e) {\\n          return sendResponse(event, 400, \\\"text/plain\\\", \\\"Bad Request: Malformed URI\\\");\\n        }\\n\\n        var tiddler = $tw.wiki.getTiddler(pluginTitle);\\n\\n        if (tiddler) {\\n          var formattedFields = tiddler.getFieldStrings();\\n          sendResponse(event, 200, \\\"application/json\\\", JSON.stringify(formattedFields, null, 4));\\n        } else {\\n          sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n        }\\n      } \\n      // --- Route C: Unknown ---\\n      else {\\n        sendResponse(event, 404, \\\"text/plain\\\", \\\"Not found\\\");\\n      }\\n    }\\n  };\\n})();\",\"tags\":\"$:/plugins/theophile.dev/plugin-library\",\"code-body\":\"yes\",\"type\":\"application/javascript\",\"module-type\":\"startup\"},\"$:/plugins/theophile.dev/plugin-library/packager\":{\"text\":\"{{$:/plugins/theophile.dev/plugin-maker/packager}}\"},\"$:/plugins/theophile.dev/plugin-library/PluginsIncluded\":{\"text\":\"\u003C$let qualified-state=\u003C\u003Cqualify \\\"$:/state/plugin-info\\\">> >\\n\u003C$list filter={{$:/plugins/theophile.dev/plugin-library/assetList}} emptyMessage=\u003C\u003Clingo \\\"Empty/Hint\\\">>  template=\\\"$:/core/ui/Components/plugin-info\\\"/>\\n\u003C/$let>\",\"tags\":\"$:/plugins/theophile.dev/plugin-library\"},\"$:/plugins/theophile.dev/plugin-library/readme\":{\"text\":\"{{$:/plugins/theophile.dev/plugin-library/faq/installing}}\\n\\n{{||$:/plugins/theophile.dev/Commons/templates/readme}}\",\"tags\":\"$:/tags/PluginLibrary $:/plugins/theophile.dev/plugin-library\",\"url\":\"file:///home/theophile/Downloads/index(1)(1)(1)(1).html\",\"caption\":\"Github Plugin Library\",\"filter\":\"[plugin-type[plugin]] -$:/core\"},\"$:/plugins/theophile.dev/plugin-library/reset\":{\"text\":\"\\\\procedure action-reset-library()\\n\u003C$action-deletetiddler $filter=\\\"\\n[has[plugin-type]!author[JeremyRuston]]\\n-$:/plugins/theophile.dev/plugin-library\\n-$:/plugins/theophile.dev/plugin-maker\\n\\\"/>\\n\u003C$action-setfield $tiddler=\\\"$:/plugins/theophile.dev/plugin-library/assetList\\\" $field=\\\"filter\\\" $value=\\\"[ℹ️[Base filter to list plugins created by the author of this wiki]]\\n[has[plugin-type]author{$:/status/UserName}]\\\"/>\\n\\\\end\\n\\n\u003C$button actions=\u003C\u003Caction-reset-library>>>reset the library\u003C/$button>\",\"tags\":\"\"},\"$:/plugins/theophile.dev/plugin-library/settings\":{\"text\":\"Library name: \u003C$edit tag=\\\"input\\\" tiddler=\\\"$:/plugins/theophile.dev/plugin-library/readme\\\" field=\\\"caption\\\"/>\\n\\n\\n[[Filter expression|https://tiddlywiki.com/static/Filters.html]] for listing the plugins to be included:\\n\u003C$edit tag=\\\"textarea\\\" tiddler=\\\"$:/plugins/theophile.dev/plugin-library/assetList\\\" class=\\\"tc-edit-texteditor tc-edit-texteditor-body\\\"/>\\n\\n{{$:/plugins/theophile.dev/plugin-library/PluginsIncluded}}\",\"tags\":\"$:/plugins/theophile.dev/plugin-library\"},\"$:/plugins/theophile.dev/plugin-library/updatelibrary\":{\"text\":\"\u003C!--\\nThis tiddler update the url of the library tiddler to keep it in sync with the current url of the wiki.\\n-->\\n\u003C$action-setfield \\n$tiddler=\\\"$:/plugins/theophile.dev/plugin-library/readme\\\" \\nurl={{$:/info/url/full}}\\n/>\",\"tags\":\"$:/tags/StartupAction $:/plugins/theophile.dev/plugin-library\",\"code-body\":\"yes\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme settings packager","version":"0.1.12","description":"Plugin Library","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","dependents":"$:/plugins/theophile.dev/plugin-maker","title":"$:/plugins/theophile.dev/plugin-library"},
{"text":"{\"tiddlers\":{\"$:/plugins/theophile.dev/plugin-maker/history\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/${[set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]]}$` >\\n\\n\u003Cp style=\\\"position:relative\\\">\u003C\u003CsetVersionFieldButtons>>\u003C/p>\\n\\n\u003C\u003CversionHistory>>\"},\"$:/plugins/theophile.dev/plugin-maker/license\":{\"text\":\"\u003Cp xmlns:cc=\\\"http://creativecommons.org/ns#\\\" xmlns:dct=\\\"http://purl.org/dc/terms/\\\">\u003Ca property=\\\"dct:title\\\" rel=\\\"cc:attributionURL\\\" href=\\\"https://plugin-library.tiddlyhost.com/#%24%3A%2Fplugins%2Ftheophile.dev%2Fplugin-maker\\\">plugin-maker\u003C/a> by \u003Ca rel=\\\"cc:attributionURL dct:creator\\\" property=\\\"cc:attributionName\\\" href=\\\"https://theophile.dev\\\">Théophile Desmedt\u003C/a> is marked with \u003Ca href=\\\"https://creativecommons.org/publicdomain/zero/1.0/?ref=chooser-v1\\\" target=\\\"_blank\\\" rel=\\\"license noopener noreferrer\\\" style=\\\"display:inline-block;\\\">CC0 1.0\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/cc.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003Cimg style=\\\"height:22px!important;margin-left:3px;vertical-align:text-bottom;\\\" src=\\\"https://mirrors.creativecommons.org/presskit/icons/zero.svg?ref=chooser-v1\\\" alt=\\\"\\\">\u003C/a>\u003C/p>  \"},\"$:/plugins/theophile.dev/plugin-maker/macros\":{\"text\":\"\\\\procedure json-tiddler() \\\"{{!!title}}\\\":\u003C$jsontiddler tiddler={{!!title}} exclude=`created creator modified modifier title`/>\\n\\n\\\\procedure json-plugin() {\\\"tiddlers\\\":{\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>]\\\" join=\\\",\\\">\u003C\u003Cjson-tiddler>>\u003C/$list>}}\\n\\n\\\\procedure package-plugin-action()\\n\u003C$wikify name=\\\"json\\\" text=\u003C\u003Cjson-plugin>> >\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cplugin-title>>/>\\n\u003C$genesis \\n  $type=\\\"$action-createtiddler\\\"\\n  $names=\\\"\\n  =[[$overwrite]]\\n  =[[$timestamp]]\\n  =[[text]]\\n  =[[core-version]]\\n  =[[type]]\\n  =[\u003Cplugin-title>!is[blank]then[$basetitle]]\\n  =[\u003Cplugin-author>!is[blank]then[author]]\\n  =[\u003Cplugin-list>!is[blank]then[list]]\\n  =[\u003Cplugin-version>!is[blank]then[version]]\\n  =[\u003Cplugin-description>!is[blank]then[description]]\\n  =[\u003Cplugin-type>!is[blank]then[plugin-type]]\\n  =[\u003Cplugin-stability>!is[blank]then[stability]]\\n  =[\u003Cplugin-parent>!is[blank]then[parent-plugin]]\\n  =[\u003Cplugin-dependents>!is[blank]then[dependents]]\\n  \\\"\\n$values=\\\"\\n  =[[yes]]\\n  =[[no]]\\n  =[\u003Cjson>]\\n  =[\u003Cversion>]\\n  =[[application/json]]\\n  =[\u003Cplugin-title>!is[blank]]\\n  =[\u003Cplugin-author>!is[blank]]\\n  =[\u003Cplugin-list>!is[blank]]\\n  =[\u003Cplugin-version>!is[blank]]\\n  =[\u003Cplugin-description>!is[blank]]\\n  =[\u003Cplugin-type>!is[blank]]\\n  =[\u003Cplugin-stability>!is[blank]]\\n  =[\u003Cplugin-parent>!is[blank]]\\n  =[\u003Cplugin-dependents>!is[blank]]\\n\\\"/>\\n\u003C$action-deletetiddler $filter=\\\"[subfilter\u003Cplugin-filter>]\\\"/>\\n\u003C/$wikify>\\n\\\\end\\n\\n\\\\procedure export-plugin-action()\\n\u003C$let exporterTemplate=\\\"$:/core/templates/exporters/JsonFile\\\">\\n\u003C$tiddler tiddler=\u003C\u003CexporterTemplate>> >\\n\u003C$action-sendmessage $message=\\\"tm-download-file\\\" $param=\u003C\u003CexporterTemplate>> exportFilter=\u003C\u003Cplugin-title>> filename={{{\\n=[\u003Cplugin-title>]\\n=[\u003Cplugin-version>]\\n+[join[_]]\\n=[\u003CexporterTemplate>get[extension]]\\n+[join[]]\\n}}} type={{{ [\u003CexporterTemplate>get[file-type]] }}} />\\n\u003C/$tiddler>\\n\u003C/$let>\\n\\\\end\\n\\n\\\\procedure create-plugin-tiddler()\\n\u003C$action-createtiddler  $basetitle=`$(plugin-title)$/NewTiddler`>\\n\\t\u003C$action-navigate $to=\u003C\u003CcreateTiddler-title>>/>\\n\\t\u003C$action-sendmessage $message=\\\"tm-edit-tiddler\\\" $param=\u003C\u003CcreateTiddler-title>>/>\\n\u003C/$action-createtiddler>\\n\\\\end\\n\\n\\\\procedure edit-info(info,placeholder,options,default,tag:input,hint,hint-link)\\n\u003C$parameters tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003Clabel>\\n\u003Cspan>\\n\u003C$genesis $type={{{ [\u003Chint-link>!is[blank]then[a]else[i]]:filter[\u003Chint>!is[blank]] }}} href=\u003C\u003Chint-link>> title=\u003C\u003Chint>> class=\\\"hint\\\"/>\\n\u003C%if [\u003Cinfo>match[name]]:filter[all[tiddlers+shadows]has[plugin-type]] %>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\\n\u003C$select field=\\\"set-plugin-name\\\" default={{!!set-plugin-name}} >\\n\u003Coption disabled value={{!!set-plugin-name}} style=\\\"display:none\\\">Name\u003C/option>\\n\u003Coptgroup label='Plugins'>\\n\u003C$list filter=\\\"[has[plugin-type]author{$:/status/UserName}]:map[trim[$:/plugins/]trim[$:/themes/]trim[$:/languages/]split[/]last[]]\\\" variable=\\\"name\\\">\\n\u003C$genesis $type=\\\"option\\\" value={{{ [\u003Cname>match{!!set-plugin-name}then[]else\u003Cname>] }}} $names=\\\"[\u003Cname>match{!!set-plugin-name}then[disabled title]enlist-input[]]\\\" $values=\\\"=true =[[Plugin selected]]\\\">\\n\u003C\u003Cname>>\\n\u003C/$genesis>\\n\u003C/$list>\\n\u003C/optgroup>\\n\u003C/$select>\\n\u003C/$tiddler>\\n\u003C%else%>\\n\u003C$text text={{{ [\u003Cinfo>sentencecase[]] }}}/>\\n\u003C%endif%>\\n\u003C/span>\\n\u003C%if [\u003Coptions>!is[blank]] %>\\n\u003C$select tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` default=\u003C\u003Cdefault>> >\u003C$list filter=\u003C\u003Coptions>> >\u003Coption value={{{ [{!!title}split[:]first[]] }}}>{{{ [{!!title}split[:]last[]] }}}\u003C/option>\u003C/$list>\u003C/$select>\\n\u003C%elseif  [\u003Cinfo>match[version]] %>\\n\u003Cspan>\\n\u003C$tiddler tiddler=\u003C\u003Ctiddler>> >\u003C\u003CsetVersionFieldButtons>>\u003C/$tiddler>\\n\u003C/span>\\n\u003C%else%>\\n\u003C$edit tiddler=\u003C\u003Ctiddler>> field=`set-plugin-$(info)$` placeholder=\u003C\u003Cplaceholder>> default=\u003C\u003Cdefault>> tag=\u003C\u003Ctag>> />\\n\u003C%endif%>\\n\u003C/label>\\n\u003C/$parameters>\\n\\\\end\\n\\n\\\\function set.value(value,default:\\\"\\\") [\u003Cvalue>!is[blank]]:else[\u003Cdefault>] :filter[!is[blank]]\\n\\n\\\\procedure setVersionField()\\n\u003C$let increment={{{ [\u003Cmodifier>match[ctrl]then[-1]else[1]] }}} >\\n\u003C$action-setfield set-plugin-version={{{ [\u003Cdom-data-version>split[.]] :map[\u003Cdom-data-nth>subtract[1]match\u003Cindex>then\u003Cincrement>else[0]add{!!title}compare:number:gteq[0]else[0]]+[join[.]] }}}/>\\n\u003C/$let>\\n\\\\end setVersionField\\n\\n\\\\procedure setVersionFieldButton()\\n\u003C$genesis \\n$type=\\\"button\\\" \\ntype=\\\"button\\\"\\ndata-version=\u003C\u003Cversion>>\\ndata-nth=\u003C\u003Cnth>>\\ntitle={{{ \\\"Breaking changes\\\" \\\"Backward compatible changes\\\" \\\"Bug fixes\\\" +[nth\u003Cnth>] }}}\\n>\u003C\u003CversionPart>>\u003C/$genesis>\\n\\\\end setVersionFieldButton\\n\\n\\\\procedure setVersionFieldButtons()\\n\u003C$let version={{{ [{!!set-plugin-version}!is[blank]else[0.0.0]] }}} >\\n\u003C$eventcatcher selector=\\\"button\\\" $click=\u003C\u003CsetVersionField>> tag=\\\"div\\\">\\n\u003C$list filter=\\\"[\u003Cversion>split[.]]\\\" variable=\\\"versionPart\\\" counter=\\\"nth\\\">\u003C\u003CsetVersionFieldButton>>\u003C/$list>\\n\u003C/$eventcatcher>\\n\u003C$edit class=\\\"tc-edit-texteditor\\\" tag=\\\"textarea\\\" field=`set-plugin-version-$(version)$` placeholder=`$(version)$ release notes`/>\\n\u003C/$let>\\n\\\\end setVersionFieldButtons\\n\\n\\\\procedure editVersionFieldButton(field)\\n\\\\procedure editVersionField()\\n\u003C%if [\u003Cmodifier>match[ctrl]] %>\\n\u003C$action-deletefield $field=\u003C\u003Cfield>> />\\n\u003C%else%>\\n\u003C$action-setfield set-plugin-version=\u003C\u003Cversion>> />\\n\u003C%endif%>\\n\\\\end editVersionField\\n\u003C$let version={{{ [\u003Cfield>removeprefix[set-plugin-version-]] }}} >\\n\u003C$button tag=\\\"span\\\" tooltip=\\\"click to edit, ctrl+click to delete\\\" actions=\u003C\u003CeditVersionField>> >\u003Cem>\u003C\u003Cversion>>\u003C/em> - \u003C$text text={{{ [{!!title}get\u003Cfield>] }}}/> \u003C/$button>\\n\u003C/$let>\\n\\\\end editVersionFieldButton\\n\\n\\\\procedure versionHistory()\\n\u003Cul>\\n\u003C$list filter=\\\"[{!!title}fields[]prefix[set-plugin-version-]reverse[]]\\\" variable=\\\"field\\\">\u003Cli>\u003C$transclude $variable=\\\"editVersionFieldButton\\\" field=\u003C\u003Cfield>> />\u003C/li>\u003C/$list>\\n\u003C/ul>\\n\\\\end\\n\\n\\\\function get.destField(subTiddler,field) [\u003CsubTiddler>get\u003Cfield>]\\n\\n\\\\function get.sourceField(subTiddler,field) [\u003CsubTiddler>shadowsource[]get[text]jsonget[tiddlers],\u003CsubTiddler>,\u003Cfield>]\\n\\n\\\\function get.sourceFields(subTiddler) [\u003CsubTiddler>shadowsource[]]:map:flat[\u003CsubTiddler>subtiddlerfields{!!title}]\\n\\n\\\\function has.diff(subTiddler,field) [get.destField\u003CsubTiddler>,\u003Cfield>else[]]:filter[get.sourceField\u003CsubTiddler>,\u003Cfield>else[]!match{!!title}]\\n\\n\\\\function diff.fields(subTiddler) [get.sourceFields\u003CsubTiddler>] [\u003CsubTiddler>fields:exclude[created creator modified modifier title]] :filter[has.diff\u003CsubTiddler>,{!!title}]\\n\\n\\\\procedure subTiddler-list-item()\\n\\\\procedure subTiddler-link()\\n\u003C$link to=\u003C\u003CsubTiddler>> >\\n\u003C%if [\u003CsubTiddler>prefix\u003Cplugin-title>]%>\\n\u003Cspan class=\\\"tc-system-title-prefix\\\">../\u003C/span>\u003C$text text={{{ [\u003CsubTiddler>removeprefix\u003Cplugin-title>trim[/]] }}}/>\\n\u003C%else%>\\n\u003C$text text=\u003C\u003CsubTiddler>> />\\n\u003C%endif%>\\n\u003C/$link>\\n\\\\end subTiddler-link\\n\u003C$let state=`$:/state/peek-tiddler/open/$(subTiddler)$$(qualify)$`>\\n\u003Cli>\\n\u003C\u003CsubTiddler-link>>\\n\u003C%if [diff.fields\u003CsubTiddler>] %>\\n\u003C$checkbox tiddler=\u003C\u003Cstate>> field=\\\"text\\\" checked=\\\"show\\\" class=\\\"tc-btn-invisible\\\">\\n\u003C%if [\u003Cstate>get[text]]%>{{$:/core/images/cancel-button}}\u003C%else%>{{$:/core/images/info-button}}\u003C%endif%>\\n\u003C/$checkbox>\\n\u003C%endif%>\\n\u003C%if [\u003Cstate>get[text]]%>\\n\u003C$list filter=\\\"[diff.fields\u003CsubTiddler>]\\\" variable=field>\\n\u003C$diff-text source={{{ [get.sourceField\u003CsubTiddler>,\u003Cfield>] }}} dest={{{ [get.destField\u003CsubTiddler>,\u003Cfield>] }}} >\\n\u003Ccode>\u003C\u003Cfield>>\u003C/code>: \u003C\u003Cdiff-count>> difference\u003C%if [\u003Cdiff-count>!match[1]]%>s\u003C%endif%>\\n\u003C/$diff-text>\\n\u003C/$list>\\n\u003C%endif%>\\n\u003C/li>\\n\u003C/$let>\\n\\\\end subTiddler-list-item\",\"code-body\":\"yes\"},\"$:/plugins/theophile.dev/plugin-maker/packager\":{\"text\":\"\\\\import [[$:/plugins/theophile.dev/plugin-maker/macros]]\\n\\n\u003Cform class=\\\"edit-info\\\">\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"name\\\" tiddler=\\\"$:/state/plugin-maker/infos\\\" placeholder=\\\"Plugin name\\\" hint=\\\"Brief name for the plugin. Select a plugin installed to edit it or write the name of the new plugin to create it\\\"/>\\n\u003C$let plugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}} >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"author\\\" placeholder=\\\"Author\\\" default={{$:/status/UserName}} hint=\\\"(optional) Author of plugin\\\"/>\\n\u003C$let plugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}} plugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$` >\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"description\\\" placeholder=\\\"Plugin description\\\" hint=\\\"Description of plugin\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"version\\\" placeholder=\\\"0.0.1\\\" hint=\\\"(optional) Version string (should conform to SemanticVersioning convention)\\\" hint-link=\\\"https://semver.org/\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"stability\\\" default=\\\"STABILITY_1_EXPERIMENTAL\\\" options=\\\"[[STABILITY_0_DEPRECATED:deprecated]] [[STABILITY_1_EXPERIMENTAL:experimental]] [[STABILITY_2_STABLE:stable]] [[STABILITY_3_LEGACY:legacy]]\\\" hint=\\\"Communicates the state of development of the plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"type\\\" options=\\\"plugin theme language\\\" default=\\\"plugin\\\" hint=\\\"Determines how the plugin is treated\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Types\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"list\\\" default=\\\"readme\\\" placeholder=\\\"Plugin list\\\" hint=\\\"Names of exposed plugin information tiddlers\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"parent\\\" placeholder=\\\"Plugin parent\\\" hint=\\\"Sub-plugins are displayed in the control panel plugin chooser within the expandable area of their parent plugin\\\" hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"dependents\\\" placeholder=\\\"Plugin dependents\\\" hint=\\\"List the titles of any other plugins that should also be installed\\\"  hint-link=\\\"https://tiddlywiki.com/#Plugin%20Dependencies\\\" tag=\\\"textarea\\\"/>\\n\u003C$transclude $variable=\\\"edit-info\\\" info=\\\"filter\\\" default=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" placeholder=\\\"[\u003Cplugin-title>plugintiddlers[]] [prefix\u003Cplugin-title>!\u003Cplugin-title>]\\\" tag=\\\"textarea\\\"  hint=\\\"Filter the tiddlers to package in the plugin. The name of the plugin is stored in the \u003Cplugin-title> variable.\\\"/>\\n\u003C/$let>\\n\u003C/$let>\\n\u003C/form>\\n\\n\u003C$let \\nplugin-name={{{ [set.value{$:/state/plugin-maker/infos!!set-plugin-name},[Plugin name]] }}}>\\n\u003C$tiddler tiddler=`$:/state/plugin-maker/infos/$(plugin-name)$`>\\n\u003C$let\\nplugin-author={{{ [set.value{!!set-plugin-author},{$:/status/UserName}] }}}\\nplugin-title=`$:/plugins/$(plugin-author)$/$(plugin-name)$`\\nplugin-type={{{ [set.value{!!set-plugin-type},[plugin]] }}}\\nplugin-version={{{ [set.value{!!set-plugin-version},[0.0.1]] }}}\\nplugin-list={{{ [set.value{!!set-plugin-list},[readme]] }}}\\nplugin-description={{{ [set.value{!!set-plugin-description},[Plugin packaged with plugin-maker]] }}}\\nplugin-parent={{{ [set.value{!!set-plugin-parent}] }}}\\nplugin-dependents={{{ [set.value{!!set-plugin-dependents}] }}}\\nplugin-stability={{{ [set.value{!!set-plugin-stability},[STABILITY_1_EXPERIMENTAL]] }}}\\nplugin-filter=`[\u003Cplugin-title>plugintiddlers[]] [all[tiddlers+shadows]prefix\u003Cplugin-title>!\u003Cplugin-title>] ${[set.value{!!set-plugin-filter}]}$ +[sort[title]]`\\nplugin-tiddler-list-pages-max=\\\"20\\\"\\nplugin-tiddler-list-pages={{{ [subfilter\u003Cplugin-filter>is[tiddler]count[]divide\u003Cplugin-tiddler-list-pages-max>add[.5]round[]] }}}\\n>\\n\\n\u003Cp>\u003C$link to=\u003C\u003Cplugin-title>>/>\u003C/p>\\n\\n\u003Cp>\\n//Modified/New tiddlers to be packaged://\\n\u003C/p>\\n\\n\u003C$let skip={{{ [\u003CthisTiddler>get[page]else[0]multiply\u003Cplugin-tiddler-list-pages-max>] }}}>\\n\u003Cul>\\n\u003C$list filter=\\\"[subfilter\u003Cplugin-filter>is[tiddler]butfirst\u003Cskip>limit\u003Cplugin-tiddler-list-pages-max>]\\\" variable=\\\"subTiddler\\\" counter=\\\"counter\\\">\\n\u003Cdiv style=\\\"display:flex;gap:2ch;\\\">\u003C$text text={{{ [{!!page}multiply\u003Cplugin-tiddler-list-pages-max>add\u003Ccounter>] }}} />\u003C$transclude $variable=\\\"subTiddler-list-item\\\"/>\u003C/div>\\n\u003C/$list>\\n\u003C/ul>\\n\u003C/$let>\\n\\n\u003C%if [\u003Cplugin-tiddler-list-pages>compare:number:gt[1]] %>\\n\u003Cspan>\\n\u003C$button disabled={{{  [{!!page}compare:number:gt[0]then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[-1]compare:number:gt[0]else[0]] }}}>{{$:/core/images/left-arrow}}\u003C/$button>\\n\u003Cspan>\u003C$text text={{{ [{!!page}add[1]] }}} /> / \u003C\u003Cplugin-tiddler-list-pages>>\u003C/span>\\n\u003C$button disabled={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>then[no]else[yes]] }}} set=\\\"!!page\\\" setTo={{{ [{!!page}add[1]compare:number:lt\u003Cplugin-tiddler-list-pages>else{!!page}] }}}>{{$:/core/images/right-arrow}}\u003C/$button>\\n\u003C/span>\\n\u003C%endif%>\\n\\n\u003C$button actions=\u003C\u003Ccreate-plugin-tiddler>> >\\n{{$:/core/images/new-button}} \u003C$text text={{$:/language/Buttons/NewTiddler/Caption}}/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cpackage-plugin-action>> >\\n{{$:/core/images/stamp}} \u003C$text text=`${[\u003Cplugin-title>get[title]then[Update]else[Package]]}$ $(plugin-name)$`/>\\n\u003C/$button>\\n\\n\u003C$button actions=\u003C\u003Cexport-plugin-action>> >\\n{{$:/core/images/input-button}} \u003C$text text=`Export $(plugin-name)$ v$(plugin-version)$`/>\\n\u003C/$button>\\n\\n\u003C/$let>\\n\u003C/$tiddler>\\n\u003C/$let>\",\"code-body\":\"\"},\"$:/plugins/theophile.dev/plugin-maker/readme\":{\"text\":\"! Minimal Plugin Creator for TiddlyWiki\\n\\nA lightweight tool designed to simplify the process of creating [[TiddlyWiki plugins|https://tiddlywiki.com/#PluginMechanism]]. The goal is to keep it as small and efficient as possible.\\n\\n\\n\u003C\u003C\u003CNote\\nThis plugin is currently in beta. Significant changes are expected before the first official release, and the content may change without prior notice. While it is functional for creating standard plugins, support for themes or language packs has not been tested yet.\\n\u003C\u003C\u003C\\n\\n\\n!! How to Provide Feedback\\n\\nYour feedback is invaluable! If you have suggestions or encounter any issues, please join the discussion on the [[TiddlyWiki Talk forum|https://talk.tiddlywiki.org/t/how-to-create-a-plugin-library-with-one-click-tiddlyhost/11245/3]].\"},\"$:/plugins/theophile.dev/plugin-maker/style\":{\"text\":\".tc-btn-invisible {\\n  input {\\n    appearance: none;\\n  }\\n\\n  .tc-image-button {\\n    height: 1em;\\n    width: 1em;\\n  }\\n}\\n\\n.edit-info {\\n  --_border: solid 1px;\\n  display: grid;\\n  grid-template-columns: min-content 1fr;\\n  border: var(--_border);\\n\\n  label {\\n    grid-column: 1/-1;\\n    display: grid;\\n    grid-template-columns: subgrid;\\n    position: relative;\\n\\n    &:not(:last-child) {\\n      border-bottom: var(--_border);\\n    }\\n\\n    >span {\\n      gap: .5ch;\\n      padding: 2px;\\n      border-right: var(--_border);\\n      align-content: center;\\n\\n      &:first-of-type {\\n        display: inline-flex;\\n        flex-direction: row-reverse;\\n      }\\n    }\\n\\n    input,\\n    textarea {\\n      resize: vertical;\\n\\n      &.tc-edit-texteditor {\\n        margin: 0;\\n      }\\n    }\\n  }\\n\\n  .hint {\\n    font-style: normal;\\n    text-decoration: none;\\n\\n    &:after {\\n      content: \\\"ⓘ\\\";\\n    }\\n  }\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"}}}","core-version":"5.5.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme packager history license","version":"2.0.17","description":"lightweight plugin packager","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/plugin-maker"},
{"text":"{\"tiddlers\":{\"$:/images/debug\":{\"text\":\"\\\\parameters (size:\\\"22pt\\\")\\n\u003Csvg width=\u003C\u003Csize>> height=\u003C\u003Csize>> class=\\\"tc-image-debug tc-image-button\\\" viewBox=\\\"1.83 2 28.37 26.73\\\">\u003Cpath fill-rule=\\\"evenodd\\\"  d=\\\"M23 13H17V25.92A7 7 0 0023 19Zm-.29-2A7 7 0 009.29 11ZM15 13H9v6a7 7 0 006 6.92Zm10 6.18a8.9 8.9 0 01-.83 3.57l4.54 4.54-1.42 1.42-4.19-4.2a9 9 0 01-14.2 0l-4.19 4.2-1.42-1.42 4.53-4.54A8.9 8.9 0 017 19.18L2.16 20l-.32-2L7 17.15V12.77L2 11.41l.46-1.93 4.83 1.34A9 9 0 0112 5V2h2V4.23a8.8 8.8 0 014 0V2h2V5a9 9 0 014.72 5.77l4.83-1.29.51 1.93L25 12.77v4.38l5.17.85-.34 2Z\\\">\u003C/path>\u003C/svg>\",\"tags\":\"$:/tags/Image\"},\"$:/plugins/theophile.dev/pyscript/playground\":{\"text\":\"\\\\define temp() $:/temp/pyscript\\n\\n\u003C!-- 1. Added data-tiddler attribute for dynamic targeting -->\\n\u003Cdiv class=\\\"tiddler-ide-container\\\" data-tiddler=\u003C\u003Ctemp>>>\\n  \u003C$edit type=\\\"text/x-python\\\" tiddler=\u003C\u003Ctemp>> tag=\\\"textarea\\\" class=\\\"local-editor tc-edit-texteditor\\\" placeholder=\\\"print('Hello from TiddlyWiki!')\\\" />\\n\\n  \u003Cdiv class=\\\"tiddler-ide-btns\\\" >\\n    \u003Cbutton class=\\\"run-btn\\\">\\n      ▶  \u003Cspan>Run\u003C/span>\\n    \u003C/button>\\n    \u003Cbutton class=\\\"clear-btn\\\">\\n      {{$:/core/images/cancel-button}} \u003Cspan>Clear\u003C/span>\\n    \u003C/button>\\n    \u003Ca class=\\\"open-tutor-btn\\\" title=\\\"Open in pythontutor\\\" href=`https://pythontutor.com/iframe-embed.html#code=${[\u003Ctemp>get[text]encodeuricomponent[]]}$&origin=opt-frontend.js&py=311`>\\n      \u003C$transclude $tiddler=\\\"$:/images/debug\\\" size=\\\"11pt\\\" />\\n      \u003Cspan>Pythontutor\u003C/span>\\n    \u003C/a>\\n  \u003C/div>\\n\\n  \u003Cdiv class=\\\"console-output\\\">\\n    \u003Clabel>CONSOLE OUTPUT:\u003C/label>\\n    \u003Cpre class=\\\"local-console\\\">\u003C/pre>\\n  \u003C/div>\\n\u003C/div>\\n\\n\u003C$pyscript code=```\\nimport io\\nimport js\\nfrom contextlib import redirect_stdout\\nfrom pyscript import when\\n\\ndef get_tw():\\n    \\\"\\\"\\\"Concise hunt for the TiddlyWiki context across window boundaries.\\\"\\\"\\\"\\n    return getattr(js.window, \\\"$tw\\\", None) or getattr(getattr(js.window, \\\"opener\\\", None), \\\"$tw\\\", None)\\n\\n@when(\\\"click\\\", \\\".run-btn\\\")\\ndef run_python_ide(event):\\n    container = event.target.closest(\\\".tiddler-ide-container\\\")\\n    output_element = container.querySelector(\\\".local-console\\\")\\n    \\n    # 2. Dynamically fetch the target tiddler\\n    target_tiddler = container.getAttribute(\\\"data-tiddler\\\")\\n    \\n    tw = get_tw()\\n    \\n    if not tw:\\n        output_element.innerText = \\\"❌ Error: Could not find TiddlyWiki context ($tw).\\\"\\n        return\\n        \\n    user_code = tw.wiki.getTiddlerText(target_tiddler) or \\\"\\\"\\n    buffer = io.StringIO()\\n    \\n    try:\\n        # 3. Use context manager for safe stdout redirection\\n        with redirect_stdout(buffer):\\n            # 4. Execute in an isolated dictionary scope\\n            exec(user_code, {})\\n        output_element.innerText = buffer.getvalue()\\n    except Exception as e:\\n        output_element.innerText = f\\\"❌ Error:\\\\n{str(e)}\\\"\\n\\n@when(\\\"click\\\", \\\".clear-btn\\\")\\ndef clear_console(event):\\n    # Condense clear logic to a single line\\n    event.target.closest(\\\".tiddler-ide-container\\\").querySelector(\\\".local-console\\\").innerText = \\\"\\\"\\n``` />\",\"tags\":\"$:/tags/SideBar\",\"caption\":\"Playground\"},\"$:/plugins/theophile.dev/pyscript/playground/style\":{\"text\":\"/* IDE Container */\\n.tiddler-ide-container {\\n\\n  &:where(.tc-single-tiddler-window &){\\n    position:fixed;\\n    inset:0;\\n    display: flex;\\n    flex-direction: column;\\n    margin:1ch;\\n    overflow-y: scroll;\\n  }\\n\\t\\n\\t\\n\\t/* Base editor constraints */\\n  .CodeMirror,\\n  .local-editor {\\n    cursor: text;\\n    min-width: 100%;\\n    min-height: 10lh;\\n    height: 100%;\\n    overflow-y: scroll;\\n  }\\n\\n\\n  .local-editor{\\n    flex: 1;\\n    width: 100%;\\n    box-sizing: border-box;\\n    height: 200px;\\n    font-family: monospace;\\n    border: 1px solid #aaa;\\n    border-radius: 4px;\\n    font-size: 14px;\\n    resize: vertical;\\n  }\\n\\n  .tiddler-ide-btns {\\n    margin-top: 10px;\\n    display: flex;\\n    flex-wrap: wrap;\\n    align-items: center;\\n    gap: 10px;\\n\\n    [class*=\\\"-btn\\\"] {\\n      display: inline-flex;\\n      align-items: center;\\n      justify-content: center;\\n      gap: 6px;\\n      padding: 8px 20px;\\n      border-radius: 4px;\\n      cursor: pointer;\\n      font-size: 14px;\\n      text-decoration: none;\\n      transition: background-color 0.2s ease;\\n      /* Smooth hover effect */\\n    }\\n\\n    .run-btn {\\n      background-color: #3776ab;\\n      color: white;\\n      border: none;\\n      font-weight: bold;\\n\\n      &:hover {\\n        background-color: #2a5d88;\\n        /* Darken on hover */\\n      }\\n    }\\n\\n    .clear-btn,\\n    .open-tutor-btn {\\n      background-color: #eee;\\n      color: #333;\\n      border: 1px solid #ccc;\\n      fill: currentColor;\\n      line-height: 18px;\\n\\n      &:hover {\\n        background-color: #ddd;\\n        /* Darken on hover */\\n      }\\n    }\\n  }\\n\\n  .console-output {\\n    margin-top: 15px;\\n\\n    >label {\\n      display: block;\\n      font-size: 0.8em;\\n      font-weight: bold;\\n      color: #555;\\n      margin-bottom: 6px;\\n      letter-spacing: 0.5px;\\n    }\\n\\n    .local-console {\\n      width: 100%;\\n      box-sizing: border-box;\\n      min-height: 100px;\\n      background: #222;\\n      color: #00ff00;\\n      padding: 12px;\\n      border-radius: 4px;\\n      overflow-x: auto;\\n      white-space: pre-wrap;\\n      margin: 0;\\n      text-shadow: none;\\n      font-family: monospace;\\n    }\\n  }\\n}\",\"tags\":\"$:/tags/Stylesheet\",\"type\":\"text/css\"},\"$:/plugins/theophile.dev/pyscript/readme\":{\"text\":\"Experimental plugin to add support for pyscript within tiddlywiki\"},\"$:/plugins/theophile.dev/pyscript/widget.js\":{\"text\":\"/*\\\\\\ntitle: $:/plugins/pyscript/widget.js\\ntype: application/javascript\\nmodule-type: widget\\n\\nA widget to dynamically load and execute PyScript.\\n\\\\*/\\n(function(){\\n\\\"use strict\\\";\\n\\nvar Widget = require(\\\"$:/core/modules/widgets/widget.js\\\").widget;\\n\\nclass PyScriptWidget extends Widget {\\n    render(parent, nextSibling) {\\n        this.parentDomNode = parent;\\n        this.computeAttributes();\\n        this.execute();\\n\\n        var container = this.document.createElement(\\\"div\\\");\\n        parent.insertBefore(container, nextSibling);\\n        this.domNodes.push(container);\\n\\n        var isColdStart = !this.document.getElementById(\\\"pyscript-core-script\\\");\\n\\n        if (isColdStart) {\\n            // COLD START: Attach loading message\\n            var loadingDiv = this.document.createElement(\\\"div\\\");\\n            loadingDiv.innerHTML = \\\"⏳ \u003Cem>Booting Python Engine (this only happens once)...\u003C/em>\\\";\\n            loadingDiv.style.color = \\\"#888\\\";\\n            loadingDiv.style.padding = \\\"10px 0\\\";\\n            container.appendChild(loadingDiv);\\n\\n            this.mountPyScript(container);\\n\\n            requestAnimationFrame(() => {\\n                requestAnimationFrame(() => {\\n                    var css = this.document.createElement(\\\"link\\\");\\n                    css.rel = \\\"stylesheet\\\";\\n                    css.href = \\\"https://pyscript.net/releases/2026.3.1/core.css\\\";\\n                    this.document.head.appendChild(css);\\n\\n                    var script = this.document.createElement(\\\"script\\\");\\n                    script.id = \\\"pyscript-core-script\\\";\\n                    script.type = \\\"module\\\";\\n                    script.src = \\\"https://pyscript.net/releases/2026.3.1/core.js\\\";\\n                    \\n                    script.onload = () => {\\n                        loadingDiv.style.display = \\\"none\\\";\\n                    };\\n\\n                    this.document.head.appendChild(script);\\n                });\\n            });\\n\\n        } else {\\n            // WARM START\\n            this.mountPyScript(container);\\n        }\\n    }\\n\\n    mountPyScript(container) {\\n        if (!this.pyscriptCode) return;\\n\\n        var pyScript = this.document.createElement(\\\"script\\\");\\n        pyScript.setAttribute(\\\"type\\\", \\\"py\\\");\\n        \\n        if (this.pyscriptConfig) {\\n            pyScript.setAttribute(\\\"config\\\", this.pyscriptConfig);\\n        }\\n        \\n        var packagesAttr = this.getAttribute(\\\"packages\\\");\\n        \\n        // COMMON INJECTION: Make get_tw() globally available everywhere\\n        var globalInjection = `\\nimport js\\nimport builtins\\n\\n# Define the cross-window TiddlyWiki hunter\\ndef _global_get_tw():\\n    return getattr(js.window, \\\"$tw\\\", None) or getattr(getattr(js.window, \\\"opener\\\", None), \\\"$tw\\\", None)\\n\\n# Inject it into Python's builtins so it is available EVERYWHERE instantly\\nbuiltins.get_tw = _global_get_tw\\n`;\\n        \\n        if (packagesAttr) {\\n            // 1. Format the packages string into a JSON array for Python\\n            var pkgs = JSON.stringify(packagesAttr.split(',').map(p => p.trim()));\\n            \\n            // 2. Base64 encode the user's code to prevent quote/escaping conflicts\\n            var encodedCode = btoa(unescape(encodeURIComponent(this.pyscriptCode)));\\n            \\n            // 3. Generate the hidden bootloader script (prepend globalInjection)\\n            pyScript.textContent = globalInjection + `\\nimport asyncio\\nimport base64\\n\\nasync def __tiddlywiki_boot_env():\\n    import pyodide_js\\n    await pyodide_js.loadPackage(\\\"micropip\\\")\\n    import micropip\\n    await micropip.install(${pkgs})\\n    \\n    # Decode and execute the user's original Python code\\n    encoded_code = \\\"${encodedCode}\\\"\\n    decoded_code = base64.b64decode(encoded_code).decode('utf-8')\\n    exec(decoded_code, globals())\\n\\nasyncio.ensure_future(__tiddlywiki_boot_env())\\n`;\\n        } else {\\n            // If no packages are needed, prepend the globalInjection directly to the user's code\\n            pyScript.textContent = globalInjection + \\\"\\\\n\\\" + this.pyscriptCode;\\n        }\\n        \\n        container.appendChild(pyScript);\\n    }\\n\\n    execute() {\\n        this.pyscriptConfig = this.getAttribute(\\\"config\\\");\\n        var srcTiddler = this.getAttribute(\\\"tiddler\\\");\\n        var inlineCode = this.getAttribute(\\\"code\\\");\\n\\n        if (inlineCode) {\\n            this.pyscriptCode = inlineCode;\\n        } else if (srcTiddler) {\\n            this.pyscriptCode = $tw.wiki.getTiddlerText(srcTiddler) || \\\"\\\";\\n        } else {\\n            this.pyscriptCode = \\\"\\\";\\n        }\\n    }\\n\\n    refresh(changedTiddlers) {\\n        var changedAttributes = this.computeAttributes();\\n        if(changedAttributes.tiddler || changedAttributes.config || changedAttributes.packages || changedAttributes.code || (this.getAttribute(\\\"tiddler\\\") && changedTiddlers[this.getAttribute(\\\"tiddler\\\")])) {\\n            this.refreshSelf();\\n            return true;\\n        }\\n        return false;\\n    }\\n}\\n\\nexports.pyscript = PyScriptWidget;\\n})();\",\"type\":\"application/javascript\",\"module-type\":\"widget\"}}}","core-version":"5.4.0-prerelease","type":"application/json","author":"theophile.dev","list":"readme","version":"0.0.7","description":"Python in the browser","plugin-type":"plugin","stability":"STABILITY_1_EXPERIMENTAL","title":"$:/plugins/theophile.dev/pyscript"},
{"created":"20260606155400694","creator":"theophile.dev","text":"/* IDE Container */\n.tiddler-ide-container {\n  padding-inline-end: 1rem;\n\n  &:where(.tc-single-tiddler-window &){\n    position:fixed;\n    inset:0;\n    display: flex;\n    flex-direction: column;\n    margin:1ch;\n    overflow-y: scroll;\n  }\n\t\n\t\n\t/* Base editor constraints */\n  .CodeMirror,\n  .local-editor {\n    cursor: text;\n    min-width: 100%;\n    min-height: 10lh;\n    height: 100%;\n    overflow-y: scroll;\n  }\n\n\n  .local-editor{\n    flex: 1;\n    width: 100%;\n    box-sizing: border-box;\n    height: 200px;\n    font-family: monospace;\n    border: 1px solid #aaa;\n    border-radius: 4px;\n    font-size: 14px;\n    resize: vertical;\n  }\n\n  .tiddler-ide-btns {\n    margin-top: 10px;\n    display: flex;\n    flex-wrap: wrap;\n    align-items: center;\n    gap: 10px;\n\n    [class*=\"-btn\"] {\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 6px;\n      padding: 8px 20px;\n      border-radius: 4px;\n      cursor: pointer;\n      font-size: 14px;\n      text-decoration: none;\n      transition: background-color 0.2s ease;\n      /* Smooth hover effect */\n    }\n\n    .run-btn {\n      background-color: #3776ab;\n      color: white;\n      border: none;\n      font-weight: bold;\n\n      &:hover {\n        background-color: #2a5d88;\n        /* Darken on hover */\n      }\n    }\n\n    .clear-btn,\n    .open-tutor-btn {\n      background-color: #eee;\n      color: #333;\n      border: 1px solid #ccc;\n      fill: currentColor;\n      line-height: 18px;\n\n      &:hover {\n        background-color: #ddd;\n        /* Darken on hover */\n      }\n    }\n  }\n\n  .console-output {\n    margin-top: 15px;\n\n    >label {\n      display: block;\n      font-size: 0.8em;\n      font-weight: bold;\n      color: #555;\n      margin-bottom: 6px;\n      letter-spacing: 0.5px;\n    }\n\n    .local-console {\n      width: 100%;\n      box-sizing: border-box;\n      min-height: 100px;\n      background: #222;\n      color: #00ff00;\n      padding: 12px;\n      border-radius: 4px;\n      overflow-x: auto;\n      white-space: pre-wrap;\n      margin: 0;\n      text-shadow: none;\n      font-family: monospace;\n    }\n  }\n}","tags":"$:/tags/Stylesheet","type":"text/css","title":"$:/plugins/theophile.dev/pyscript/playground/style","modified":"20260606155409365","modifier":"theophile.dev"},

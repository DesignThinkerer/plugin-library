elink/ui/components/button-delete}}\u003C/td>\\n\u003C/$reveal>\\n\u003C/$tiddler>\\n\u003C/$vars>\\n\u003C/$list>\\n\u003C/$vars>\\n\u003C/$list>\\n\\\\end\\n\\n\\\\define tables(category, list-row-macro, header-list)\\n\\\\whitespace trim\\n\u003C$vars\\n\\tcolumn-count={{{[enlist\u003C__header-list__>] [[DeleteColumn]] +[count[]]}}}>\\n\u003Ctable class=\\\"tc-relink-whitelist\\\">\u003Ctbody>\\n\u003Ctr>\\n\u003C$list variable=\\\"header\\\" filter=\\\"[enlist\u003C__header-list__>butlast[]]\\\">\u003Cth>\u003C\u003Cheader>>\u003C/th>\u003C/$list>\\n\u003C!-- We have the last column extend into the delete/link column, which is unlabeled. -->\\n\u003Cth colspan=2>\u003C$text text={{{ [enlist\u003C__header-list__>last[]] }}} />\u003C/th>\\n\u003C/tr>\\n\u003C\u003C.make-table Custom \\\"\\\" yes>>\\n\\n\u003C$list\\n\\tfilter=\\\"[plugin-type[plugin]![$:/core]![$:/plugins/flibbles/relink]]\\\">\\n\u003C$set name=\\\"subtitle\\\"\\n\\tfilter=\\\"[all[current]has[description]]\\\"\\n\\tvalue=\\\"''{{!!name}}'':&#32;\u003C$text text={{!!description}}/>\\\"\\n\\temptyValue=\\\"''{{!!name}}''\\\" >\\n\u003C$macrocall $name=\\\".make-table\\\" title=\u003C\u003Csubtitle>> plugin=\u003C\u003CcurrentTiddler>> />\\n\u003C/$set>\\n\u003C/$list>\\n\u003C\u003C.make-table Core \\\"$:/plugins/flibbles/relink\\\">>\\n\\n\u003C/tbody>\u003C/table>\\n\u003C/$vars>\\n\\\\end\\n\"},\"$:/plugins/flibbles/relink/ui/configuration/Attributes\":{\"title\":\"$:/plugins/flibbles/relink/ui/configuration/Attributes\",\"caption\":\"{{$:/plugins/flibbles/relink/language/ui/Attributes/Caption}}\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"text\":\"\\\\import $:/plugins/flibbles/relink/ui/components/tables\\n\\\\define prefix-attr() $:/config/flibbles/relink/attributes/\\n\\\\define lingo-base() $:/plugins/flibbles/relink/language/Buttons/\\n\\\\define element-name-tiddler() $:/state/flibbles/relink/element-name\\n\\\\define attribute-name-tiddler() $:/state/flibbles/relink/attribute-name\\n\\n\\\\define row()\\n\\\\whitespace trim\\n\u003C$set name='element'\\n      value={{{[\u003Ckey>splitbefore[/]removesuffix[/]]}}}>\\n\u003C$set name=\\\"attribute\\\"\\n      value={{{[\u003Ckey>removeprefix\u003Celement>removeprefix[/]]}}}>\\n\u003Ctd>\u003C$text text=\u003C\u003Celement>> />\u003C/td>\\n\u003Ctd>\u003C$text text=\u003C\u003Cattribute>> />\u003C/td>\\n\u003C/$set>\u003C/$set>\\n\\\\end\\n\\\\define body()\\n\\\\whitespace trim\\n\\n\u003Cem class=\\\"tc-edit\\\">Add a new attribute:\u003C/em>\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Celement-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"widget/element\\\" />\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Cattribute-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"attribute\\\" />\\n&#32;\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Celement-name-tiddler>> >\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Cattribute-name-tiddler>> >\\n\u003C$relinkmangler>\\n\u003C$button\\n\\ttooltip={{$(lingo-base)$NewAttribute/Hint}}\\n\\taria-label={{$(lingo-base)$NewAttribute/Caption}}>\\n\u003C$action-sendmessage\\n\\t$message=\\\"relink-add-attribute\\\"\\n\\telement={{$(element-name-tiddler)$}}\\n\\tattribute={{$(attribute-name-tiddler)$}} />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cattribute-name-tiddler>> />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Celement-name-tiddler>> />\\n\u003C$text text={{$(lingo-base)$NewAttribute/Caption}}/>\\n\u003C/$button>\\n\u003C/$relinkmangler>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Cattribute-name-tiddler>> >\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewAttribute/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Celement-name-tiddler>> >\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewAttribute/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\\n@@.tc-control-panel\\n\u003C$macrocall\\n\\t$name=tables\\n\\tcategory=\\\"attributes\\\"\\n\\theader-list=\\\"[[Widget/HTML Element]] Attribute Type\\\"\\n\\tlist-row-macro=\\\"row\\\" />\\n@@\\n\\\\end\\n\\n{{$:/plugins/flibbles/relink/language/Help/Attributes}}\\n\\n\u003C\u003Cbody>>\\n\"},\"$:/plugins/flibbles/relink/ui/configuration/Fields\":{\"title\":\"$:/plugins/flibbles/relink/ui/configuration/Fields\",\"caption\":\"{{$:/plugins/flibbles/relink/language/ui/Fields/Caption}}\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"text\":\"\\\\import $:/plugins/flibbles/relink/ui/components/tables\\n\\\\define lingo-base() $:/plugins/flibbles/relink/language/Buttons/\\n\\\\define field-name-tiddler() $:/state/flibbles/relink/field-name\\n\\n\\\\define row()\\n\u003Ctd>\u003C$text text=\u003C\u003Ckey>> />\u003C/td>\\n\\\\end\\n\\n\\\\define body()\\n\\\\whitespace trim\\n\\n\u003Cem class='tc-edit'>Add a new field:\u003C/em>\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Cfield-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"field name\\\" />\\n&#32;\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Cfield-name-tiddler>> >\\n\u003C$relinkmangler>\\n\u003C$button\\n\\ttooltip={{$(lingo-base)$NewField/Hint}}\\n\\taria-label={{$(lingo-base)$NewField/Caption}}>\\n\u003C$action-sendmessage\\n\\t$message=\\\"relink-add-field\\\"\\n\\tfield={{$(field-name-tiddler)$}} />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cfield-name-tiddler>> />\\n\u003C$text text={{$(lingo-base)$NewField/Caption}}/>\\n\u003C/$button>\\n\u003C/$relinkmangler>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Cfield-name-tiddler>> >\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewField/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\\n@@.tc-control-panel\\n\u003C$macrocall\\n\\t$name=tables\\n\\tcategory=\\\"fields\\\"\\n\\theader-list=\\\"[[Field Name]] [[Field Type]]\\\"\\n\\tlist-row-macro=\\\"row\\\" />\\n@@\\n\\\\end\\n\\n{{$:/plugins/flibbles/relink/language/Help/Fields}}\\n\\n\u003C\u003Cbody>>\\n\"},\"$:/plugins/flibbles/relink/ui/configuration/Macros\":{\"title\":\"$:/plugins/flibbles/relink/ui/configuration/Macros\",\"caption\":\"{{$:/plugins/flibbles/relink/language/ui/Macros/Caption}}\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"text\":\"\\\\import $:/plugins/flibbles/relink/ui/components/tables\\n\\\\define prefix-macro() $:/config/flibbles/relink/macros/\\n\\\\define lingo-base() $:/plugins/flibbles/relink/language/Buttons/\\n\\\\define macro-name-tiddler() $:/state/flibbles/relink/macro-name\\n\\\\define parameter-name-tiddler() $:/state/flibbles/relink/parameter-name\\n\\n\\\\define row()\\n\\\\whitespace trim\\n\u003C$set name=\\\"parameter\\\"\\n      value={{{[\u003Ckey>relink:splitafter[/]]}}}>\\n\u003C$set name='macro'\\n      value={{{[\u003Ckey>removesuffix\u003Cparameter>removesuffix[/]]}}}>\\n\u003Ctd>\u003C$text text=\u003C\u003Cmacro>> />\u003C/td>\\n\u003Ctd>\u003C$text text=\u003C\u003Cparameter>> />\u003C/td>\\n\u003C/$set>\u003C/$set>\\n\\\\end\\n\\n\\\\define body()\\n\\\\whitespace trim\\n\\n\u003Cem class=\\\"tc-edit\\\">Add a new macro parameter:\u003C/em>\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Cmacro-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"macro\\\" />\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Cparameter-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"parameter\\\" />\\n&#32;\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Cmacro-name-tiddler>> >\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Cparameter-name-tiddler>> >\\n\u003C$relinkmangler>\\n\u003C$button\\n\\ttooltip={{$(lingo-base)$NewParameter/Hint}}\\n\\taria-label={{$(lingo-base)$NewParameter/Caption}}>\\n\u003C$action-sendmessage\\n\\t$message=\\\"relink-add-parameter\\\"\\n\\tmacro={{$(macro-name-tiddler)$}}\\n\\tparameter={{$(parameter-name-tiddler)$}} />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cparameter-name-tiddler>> />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Cmacro-name-tiddler>> />\\n\u003C$text text={{$(lingo-base)$NewParameter/Caption}}/>\\n\u003C/$button>\\n\u003C/$relinkmangler>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Cparameter-name-tiddler>> >\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewParameter/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Cmacro-name-tiddler>> >\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewParameter/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\\n@@.tc-control-panel\\n\u003C$macrocall\\n\\t$name=tables\\n\\tcategory=\\\"macros\\\"\\n\\theader-list=\\\"Macro Parameter Type\\\"\\n\\tlist-row-macro=\\\"row\\\" />\\n@@\\n\\\\end\\n\\n{{$:/plugins/flibbles/relink/language/Help/Macros}}\\n\\n\u003C\u003Cbody>>\\n\"},\"$:/plugins/flibbles/relink/ui/configuration/Operators\":{\"title\":\"$:/plugins/flibbles/relink/ui/configuration/Operators\",\"caption\":\"{{$:/plugins/flibbles/relink/language/ui/Operators/Caption}}\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"text\":\"\\\\import $:/plugins/flibbles/relink/ui/components/tables\\n\\\\define lingo-base() $:/plugins/flibbles/relink/language/Buttons/\\n\\\\define operator-name-tiddler() $:/state/flibbles/relink/operator-name\\n\\n\\\\define row()\\n\u003Ctd>\u003C$text text=\u003C\u003Ckey>> />\u003C/td>\\n\\\\end\\n\\n\\\\define body()\\n\\\\whitespace trim\\n\\n\u003Cem class='tc-edit'>Add a new filter operator:\u003C/em>\\n&#32;\\n\u003C$edit-text\\n\\ttiddler=\u003C\u003Coperator-name-tiddler>>\\n\\ttag=\\\"input\\\"\\n\\tdefault=\\\"\\\"\\n\\tplaceholder=\\\"operator name\\\" />\\n&#32;\\n\u003C$reveal type=\\\"nomatch\\\" text=\\\"\\\" state=\u003C\u003Coperator-name-tiddler>>>\\n\u003C$relinkmangler>\\n\u003C$button\\n\\ttooltip={{$(lingo-base)$NewOperator/Hint}}\\n\\taria-label={{$(lingo-base)$NewOperator/Caption}}>\\n\u003C$action-sendmessage\\n\\t$message=\\\"relink-add-operator\\\"\\n\\toperator={{$(operator-name-tiddler)$}} />\\n\u003C$action-deletetiddler $tiddler=\u003C\u003Coperator-name-tiddler>> />\\n\u003C$text text={{$(lingo-base)$NewOperator/Caption}}/>\\n\u003C/$button>\\n\u003C/$relinkmangler>\\n\u003C/$reveal>\\n\u003C$reveal type=\\\"match\\\" text=\\\"\\\" state=\u003C\u003Coperator-name-tiddler>>>\\n\u003C$button>\\n\u003C$text text={{$(lingo-base)$NewOperator/Caption}}/>\\n\u003C/$button>\\n\u003C/$reveal>\\n\\n@@.tc-control-panel\\n\u003C$macrocall\\n\\t$name=tables\\n\\tcategory=\\\"operators\\\"\\n\\theader-list=\\\"[[Filter Operator]] [[Operand Type]]\\\"\\n\\tlist-row-macro=\\\"row\\\" />\\n@@\\n\\\\end\\n\\n{{$:/plugins/flibbles/relink/language/Help/Operators}}\\n\\n\u003C\u003Cbody>>\\n\"},\"$:/plugins/flibbles/relink/ui/stylesheet.css\":{\"title\":\"$:/plugins/flibbles/relink/ui/stylesheet.css\",\"tags\":\"$:/tags/Stylesheet\",\"text\":\".tc-relink-references {\\n}\\n\\n.tc-relink-references-table {\\n\\twidth: 100%;\\n\\tborder: none;\\n}\\n\\n.tc-relink-references-table td {\\n\\tborder-left: none;\\n}\\n\\n.tc-relink-references-table tr:first-child td {\\n\\tborder-top: none;\\n}\\n\\n.tc-relink-references-title {\\n\\ttext-align: left;\\n\\tvertical-align: top;\\n\\tpadding-top: 3px;\\n\\tpadding-bottom: 3px;\\n}\\n\\n.tc-relink-references-occurrence {\\n\\tfont-style: italic;\\n\\ttext-align: left;\\n\\tfont-weight: 200;\\n\\tpadding-left: 25px;\\n\\tvertical-align: top;\\n}\\n\\n.tc-relink-header-plugin {\\n\\ttext-align: left;\\n}\\n\\n.tc-relink-header-plugin button {\\n\\twidth: 100%\\n}\\n\\n.tc-relink-column-type {\\n\\twidth: 8em;\\n}\\n\\n.tc-relink-column-type select {\\n\\twidth: 100%;\\n}\\n\\n.tc-relink-column-delete {\\n\\tborder-left: none;\\n\\ttext-align: left;\\n}\\n\\n.tc-relink-column-delete button {\\n\\tpadding-left: 1em;\\n}\\n\\n.tc-relink-impossible a.tc-tiddlylink {\\n\\tcolor: \u003C\u003Ccolour relink-impossible>>;\\n}\\n\\n.tc-relink-menu-missing-blurb {\\n\\tmargin-left: 30pt;\\n}\\n\"}}}"},
{"name":"Relink Field Names","title":"$:/plugins/flibbles/relink-fieldnames","description":"Renames field names with titles matching Relinked tiddlers","author":"Flibbles","version":"2.6.0","core-version":"^5.2.1","stability":"STABILITY_2_STABLE","parent-plugin":"$:/plugins/flibbles/relink","source":"https://github.com/flibbles/tw5-relink","demo":"http://flibbles.github.io/tw5-relink/","list":"readme reference","dependents":"","plugin-type":"plugin","type":"application/json","text":"{\"tiddlers\":{\"$:/config/flibbles/relink/attributes/$action-deletefield/$field\":{\"title\":\"$:/config/flibbles/relink/attributes/$action-deletefield/$field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$action-listops/$field\":{\"title\":\"$:/config/flibbles/relink/attributes/$action-listops/$field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$action-setfield/$field\":{\"title\":\"$:/config/flibbles/relink/attributes/$action-setfield/$field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$button/setField\":{\"title\":\"$:/config/flibbles/relink/attributes/$button/setField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$checkbox/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$checkbox/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$edit-text/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$edit-text/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$edit/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$edit/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$fields/exclude\":{\"title\":\"$:/config/flibbles/relink/attributes/$fields/exclude\",\"text\":\"fieldnamelist\"},\"$:/config/flibbles/relink/attributes/$fields/include\":{\"title\":\"$:/config/flibbles/relink/attributes/$fields/include\",\"text\":\"fieldnamelist\"},\"$:/config/flibbles/relink/attributes/$jsontiddler/exclude\":{\"title\":\"$:/config/flibbles/relink/attributes/$jsontiddler/exclude\",\"text\":\"fieldnamelist\"},\"$:/config/flibbles/relink/attributes/$radio/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$radio/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$range/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$range/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$reveal/stateField\":{\"title\":\"$:/config/flibbles/relink/attributes/$reveal/stateField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$select/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$select/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$setvariable/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$setvariable/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$set/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$set/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$transclude/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$transclude/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$transclude/$field\":{\"title\":\"$:/config/flibbles/relink/attributes/$transclude/$field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/attributes/$view/field\":{\"title\":\"$:/config/flibbles/relink/attributes/$view/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/fieldnames/blacklist\":{\"title\":\"$:/config/flibbles/relink/fieldnames/blacklist\",\"filter\":\"[all[shadows+tiddlers]removeprefix[$:/language/Docs/Fields/]]\",\"text\":\"This tiddler specifies what fields //Relink-fieldname// should refuse to change. Edit its `filter` field if you'd like to change that list.\\n\"},\"$:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldname.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldname.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldname.js\\nmodule-type: relinkfieldtype\\ntype: application/javascript\\n\\nThis field type behaves exactly like the \\\"title\\\" field type, except that\\nit ignores any titles that appear on the field name blacklist.\\n\\n\\\\*/\\n\\nexports.name = 'fieldname';\\n\\nvar utils = require(\\\"../utils.js\\\");\\n\\nexports.report = function(value, callback, options) {\\n\\tif (!utils.isReserved(value, options)) {\\n\\t\\tcallback(value, undefined, {soft: true});\\n\\t}\\n};\\n\\nexports.relink = function(value, fromTitle, toTitle, options) {\\n\\tif (value === fromTitle\\n\\t&& !utils.isReserved(fromTitle, options)) {\\n\\t\\tif (utils.isReserved(toTitle, options)\\n\\t\\t|| !utils.isValidFieldName(toTitle)) {\\n\\t\\t\\treturn {impossible: true};\\n\\t\\t} else {\\n\\t\\t\\treturn {output: toTitle};\\n\\t\\t}\\n\\t}\\n\\treturn undefined;\\n};\\n\",\"module-type\":\"relinkfieldtype\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldnamelist.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldnamelist.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/fieldtypes/fieldnamelist.js\\nmodule-type: relinkfieldtype\\ntype: application/javascript\\n\\nThis field type behaves exactly like the \\\"title\\\" field type, except that\\nit ignores any titles that appear on the field name blacklist.\\n\\n\\\\*/\\n\\nexports.name = 'fieldnamelist';\\n\\nvar utils = require(\\\"../utils.js\\\");\\nvar listModule = require(\\\"$:/plugins/flibbles/relink/js/fieldtypes/list.js\\\");\\n\\nexports.report = function(value, callback, options) {\\n\\tvar list = $tw.utils.parseStringArray(value);\\n\\tfor (var i = 0; i \u003C list.length; i++) {\\n\\t\\tif (!utils.isReserved(list[i], options)) {\\n\\t\\t\\tcallback(list[i], undefined, {soft: true});\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(value, fromTitle, toTitle, options) {\\n\\tvar entry;\\n\\tif (!utils.isReserved(fromTitle, options)) {\\n\\t\\tentry = listModule.relink(value, fromTitle, toTitle, options);\\n\\t\\tif (entry && entry.output && utils.isReserved(toTitle, options)) {\\n\\t\\t\\t// The list updated, but we can't actaully update to this new title\\n\\t\\t\\treturn {impossible: true};\\n\\t\\t}\\n\\t}\\n\\treturn entry;\\n};\\n\",\"module-type\":\"relinkfieldtype\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/filters/field.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/filters/field.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/filters/field.js\\nmodule-type: relinkfilter\\ntype: application/javascript\\n\\nHandles reporting/relinking of shorthand [[field:{field}[]] operators.\\n\\n\\\\*/\\n\\nvar utils = require(\\\"../utils.js\\\");\\n\\nexports.name = \\\"field\\\";\\n\\nexports.after = ['operators'];\\n\\nexports.report = function(filterParseTree, callback, options) {\\n\\tvar operators = options.wiki.getFilterOperators();\\n\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\tvar run = filterParseTree[i];\\n\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\tif (!operators[operator.operator]\\n\\t\\t\\t&& !utils.isReserved(operator.operator, options)) {\\n\\t\\t\\t\\tcallback(operator.operator, \\\"[field:\\\" + utils.blurbOperands(operator) + \\\"]\\\", {soft: true});\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(filterParseTree, fromTitle, toTitle, options) {\\n\\tvar output = {};\\n\\tif (!utils.isReserved(fromTitle, options)) {\\n\\t\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\t\\tvar run = filterParseTree[i];\\n\\t\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\t\\tif (operator.operator === fromTitle\\n\\t\\t\\t\\t&& !options.wiki.getFilterOperators()[fromTitle]) {\\n\\t\\t\\t\\t\\tif (toTitle.search(/[\\\\[\\\\{\u003C\\\\/]/) >= 0\\n\\t\\t\\t\\t\\t|| utils.isReserved(toTitle, options)) {\\n\\t\\t\\t\\t\\t\\t// can't be an operator or a suffix. we must fail.\\n\\t\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\tif (options.wiki.getFilterOperators()[toTitle]\\n\\t\\t\\t\\t\\t\\t|| toTitle.indexOf(':') >= 0) {\\n\\t\\t\\t\\t\\t\\t\\t// It can't use the shorthand without causing problems\\n\\t\\t\\t\\t\\t\\t\\t// we use longhand field operator\\n\\t\\t\\t\\t\\t\\t\\toperator.operator = \\\"field\\\";\\n\\t\\t\\t\\t\\t\\t\\toperator.suffix = toTitle;\\n\\t\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\t\\toperator.operator = toTitle;\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\toutput.changed = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn output;\\n};\\n\",\"module-type\":\"relinkfilter\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/filters/search.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/filters/search.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/filters/search.js\\nmodule-type: relinkfilter\\ntype: application/javascript\\n\\nHandles reporting/relinking of the search operator, which is very complicated\\n\\n\\\\*/\\n\\nvar utils = require(\\\"../utils.js\\\");\\n\\nexports.name = \\\"search\\\";\\n\\nexports.report = function(filterParseTree, callback, options) {\\n\\tvar inverted = false;\\n\\teachSuffix(filterParseTree, function(title, rawEntry, operator, index) {\\n\\t\\tif (index === 0 && rawEntry[0] === '-') {\\n\\t\\t\\tinverted = true;\\n\\t\\t}\\n\\t\\tif (!utils.isReserved(title, options)) {\\n\\t\\t\\tvar blurb = inverted? \\\"[search:-\\\": \\\"[search:\\\";\\n\\t\\t\\tif (operator.suffixes[1]) {\\n\\t\\t\\t\\tblurb += ':' + operator.suffixes[1].join(',');\\n\\t\\t\\t}\\n\\t\\t\\tcallback(title, blurb + utils.blurbOperands(operator) + \\\"]\\\", {soft: true});\\n\\t\\t}\\n\\t});\\n};\\n\\nexports.relink = function(filterParseTree, fromTitle, toTitle, options) {\\n\\tvar output = {};\\n\\tif (!utils.isReserved(fromTitle, options)) {\\n\\t\\teachSuffix(filterParseTree, function(title, rawEntry, operator, index) {\\n\\t\\t\\tif (title === fromTitle) {\\n\\t\\t\\t\\tif (utils.isReserved(toTitle, options)\\n\\t\\t\\t\\t|| toTitle.search(/[\\\\[\\\\{\u003C\\\\/,:]/) >= 0\\n\\t\\t\\t\\t|| (index == 0\\n\\t\\t\\t\\t\\t&& rawEntry[0] !== '-'\\n\\t\\t\\t\\t\\t&& (toTitle[0] === '-' || toTitle === '*'))) {\\n\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\toutput.changed = true;\\n\\t\\t\\t\\t\\treturn toTitle;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t});\\n\\t}\\n\\treturn output;\\n};\\n\\nfunction eachSuffix(filterParseTree, callback) {\\n\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\tvar run = filterParseTree[i];\\n\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\tvar opChanged = false;\\n\\t\\t\\tif (operator.operator === 'search' && operator.suffix) {\\n\\t\\t\\t\\tvar list = operator.suffixes[0];\\n\\t\\t\\t\\tfor (var index = 0; index \u003C list.length; index++) {\\n\\t\\t\\t\\t\\tvar title = list[index];\\n\\t\\t\\t\\t\\tvar raw = title;\\n\\t\\t\\t\\t\\tif (index === 0) {\\n\\t\\t\\t\\t\\t\\tif (title[0] === '-') {\\n\\t\\t\\t\\t\\t\\t\\ttitle = title.substr(1);\\n\\t\\t\\t\\t\\t\\t} else if (title === '*') {\\n\\t\\t\\t\\t\\t\\t\\tcontinue;\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tvar newValue = callback(title, raw, operator, index);\\n\\t\\t\\t\\t\\tif (newValue) {\\n\\t\\t\\t\\t\\t\\tlist[index] = (index === 0 && raw[0] === '-') ?\\n\\t\\t\\t\\t\\t\\t\\t'-' + newValue:\\n\\t\\t\\t\\t\\t\\t\\tnewValue;\\n\\t\\t\\t\\t\\t\\topChanged = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t\\tif (opChanged) {\\n\\t\\t\\t\\t// There was a change. reassemble the suffix\\n\\t\\t\\t\\toperator.suffix = operator.suffixes.map(function(part) {\\n\\t\\t\\t\\t\\treturn part.join(',');\\n\\t\\t\\t\\t}).join(':');\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkfilter\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/filters/suffixes.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/filters/suffixes.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/filters/suffixes.js\\nmodule-type: relinkfilter\\ntype: application/javascript\\n\\nHandles reporting/relinking of filter operator suffixes using a hidden whitelist.\\n\\n\\\\*/\\n\\nvar utils = require(\\\"../utils.js\\\");\\n\\nexports.name = \\\"suffixes\\\";\\n\\nexports.report = function(filterParseTree, callback, options) {\\n\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\tvar run = filterParseTree[i];\\n\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\tvar settings = options.settings.getConfig('suffixes')[operator.operator];\\n\\t\\t\\tif (settings) {\\n\\t\\t\\t\\tsettings[1].report(operator.suffix, function(title, blurb, style) {\\n\\t\\t\\t\\t\\tcallback(title, '[' + operator.operator + ':' + (blurb || '') + utils.blurbOperands(operator) + ']', style);\\n\\t\\t\\t\\t}, options);\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(filterParseTree, fromTitle, toTitle, options) {\\n\\tvar output = {};\\n\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\tvar run = filterParseTree[i];\\n\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\tvar settings = options.settings.getConfig('suffixes')[operator.operator];\\n\\t\\t\\tvar operatorChanged = false;\\n\\t\\t\\tif (settings) {\\n\\t\\t\\t\\tvar handler = settings[1];\\n\\t\\t\\t\\tif (handler) {\\n\\t\\t\\t\\t\\tvar entry = handler.relink(operator.suffix, fromTitle, toTitle, options);\\n\\t\\t\\t\\t\\tif (entry) {\\n\\t\\t\\t\\t\\t\\tif (entry.output) {\\n\\t\\t\\t\\t\\t\\t\\tif (entry.output.search(/[\\\\[\\\\{\u003C\\\\/]/) \u003C 0) {\\n\\t\\t\\t\\t\\t\\t\\t\\toutput.changed = true;\\n\\t\\t\\t\\t\\t\\t\\t\\toperatorChanged = true;\\n\\t\\t\\t\\t\\t\\t\\t\\toperator.suffix = entry.output;\\n\\t\\t\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t\\tif (entry.impossible) {\\n\\t\\t\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn output;\\n};\\n\",\"module-type\":\"relinkfilter\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/htmlFields.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/htmlFields.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/htmlFields.js\\nmodule-type: relinkhtml\\ntype: application/javascript\\n\\nThis updates html attribute names which correspond to fields.\\n\\ne.g.\\n\\n\u003C$action-createtiddler myfield=\\\"...\\\" />\\n\\n\\\\*/\\n\\nvar utils = require(\\\"./utils.js\\\");\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\n\\nexports.name = \\\"fieldnames\\\";\\n\\nexports.report = function(element, parser, callback, options) {\\n\\tvar regexp = parser.context.getConfig(\\\"fieldattributes\\\")[element.tag];\\n\\tif (regexp) {\\n\\t\\tfor (var attributeName in element.attributes) {\\n\\t\\t\\tvar results = regexp.exec(attributeName);\\n\\t\\t\\tif (results\\n\\t\\t\\t&& results[0] === attributeName\\n\\t\\t\\t&& !utils.isReserved(results[1], options)) {\\n\\t\\t\\t\\tvar attr = element.attributes[attributeName];\\n\\t\\t\\t\\tvar blurb;\\n\\t\\t\\t\\tvar handler = attrTypeOperators[attr.type];\\n\\t\\t\\t\\tif (handler) {\\n\\t\\t\\t\\t\\tvar raw = handler.rawString(attr);\\n\\t\\t\\t\\t\\tvar innerString = utils.abridgeString(raw, 33);\\n\\t\\t\\t\\t\\tblurb = handler.wrap(attr, innerString);\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tcallback(results[1], element.tag + ' =' + blurb, {soft: true});\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(element, parser, fromTitle, toTitle, options) {\\n\\tvar entry = {};\\n\\tif (!utils.isReserved(fromTitle, options)) {\\n\\t\\tvar regexp = parser.context.getConfig(\\\"fieldattributes\\\")[element.tag];\\n\\t\\tif (regexp) {\\n\\t\\t\\tfor (var attributeName in element.attributes) {\\n\\t\\t\\t\\tvar results = regexp.exec(attributeName);\\n\\t\\t\\t\\tif (results\\n\\t\\t\\t\\t&& results[0] === attributeName\\n\\t\\t\\t\\t&& results[1] === fromTitle) {\\n\\t\\t\\t\\t\\tvar newName = alterAttributeName(attributeName, fromTitle, toTitle, regexp, options);\\n\\t\\t\\t\\t\\tif (newName === undefined) {\\n\\t\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\telement.attributes[attributeName].name = newName;\\n\\t\\t\\t\\t\\t\\tentry.output = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn entry;\\n};\\n\\n// Returns undefined if it doesn't work out.\\nfunction alterAttributeName(attributeName, fromTitle, toTitle, regexp, options) {\\n\\tif (!utils.isReserved(toTitle, options)) {\\n\\t\\tvar newName = attributeName.replace(fromTitle, toTitle);\\n\\t\\tvar match = regexp.exec(newName);\\n\\t\\tif (match && match[0] === newName && match[1] === toTitle) {\\n\\t\\t\\t// Taken from parseutils.js\\n\\t\\t\\tvar reAttributeName = /([^\\\\/\\\\s>\\\"'=]+)/;\\n\\t\\t\\tmatch = reAttributeName.exec(newName);\\n\\t\\t\\tif (match && match[0] === newName) {\\n\\t\\t\\t\\treturn newName;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn undefined;\\n};\\n\",\"module-type\":\"relinkhtml\",\"type\":\"application/javascript\"},\"$:/config/flibbles/relink/macros/keyboard-driven-input/firstSearchFilterField\":{\"title\":\"$:/config/flibbles/relink/macros/keyboard-driven-input/firstSearchFilterField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/macros/keyboard-driven-input/secondSearchFilterField\":{\"title\":\"$:/config/flibbles/relink/macros/keyboard-driven-input/secondSearchFilterField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/macros/list-links-draggable/field\":{\"title\":\"$:/config/flibbles/relink/macros/list-links-draggable/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/macros/tag-picker/tagField\":{\"title\":\"$:/config/flibbles/relink/macros/tag-picker/tagField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/macros/timeline/dateField\":{\"title\":\"$:/config/flibbles/relink/macros/timeline/dateField\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/each\":{\"title\":\"$:/config/flibbles/relink/operators/each\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/eachday\":{\"title\":\"$:/config/flibbles/relink/operators/eachday\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/fields\":{\"title\":\"$:/config/flibbles/relink/operators/fields\",\"text\":\"fieldnamelist\"},\"$:/config/flibbles/relink/operators/get\":{\"title\":\"$:/config/flibbles/relink/operators/get\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/has\":{\"title\":\"$:/config/flibbles/relink/operators/has\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/listed\":{\"title\":\"$:/config/flibbles/relink/operators/listed\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/nsort\":{\"title\":\"$:/config/flibbles/relink/operators/nsort\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/nsortcs\":{\"title\":\"$:/config/flibbles/relink/operators/nsortcs\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/sort\":{\"title\":\"$:/config/flibbles/relink/operators/sort\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/sortan\":{\"title\":\"$:/config/flibbles/relink/operators/sortan\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/sortcs\":{\"title\":\"$:/config/flibbles/relink/operators/sortcs\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/operators/has:field\":{\"title\":\"$:/config/flibbles/relink/operators/has:field\",\"text\":\"fieldname\"},\"$:/plugins/flibbles/relink-fieldnames/readme\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/readme\",\"text\":\"\\\\whitespace trim\\n\\nEnables Relink to relink field names associated with renamed tiddlers. The following fields cannot be interacted with in this way:\\n\\n\u003C\u003C\u003C\\n\u003C$set name=blacklisted filter={{$:/config/flibbles/relink-fieldnames/blacklist!!filter}}>\\n''\u003C$list counter=counter filter=\\\"[enlist\u003Cblacklisted>sort[]]\\\">\\n\u003C\u003CcurrentTiddler>>\u003Cbr>\\n\u003C/$list>''\\n\u003C/$set>\\n\u003C\u003C\u003C\\n\\nSee&#32;\u003Ca href={{$:/plugins/flibbles/relink-fieldnames!!source}} class=\\\"tc-tiddlylink-external\\\">the tw5-relink website\u003C/a>&#32;for more details and examples.\\n\"},\"$:/plugins/flibbles/relink-fieldnames/reference.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/reference.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/reference.js\\nmodule-type: relinkreference\\ntype: application/javascript\\n\\nTakes care of renaming \\n\\\\*/\\n\\nvar utils = require(\\\"./utils.js\\\");\\n\\nexports.name = 'fieldname';\\n\\nexports.report = function(reference, callback, options) {\\n\\tif (reference.field\\n\\t&& !utils.isReserved(reference.field, options)) {\\n\\t\\tcallback(reference.field, (reference.title || '') + \\\"!!\\\", {soft: true});\\n\\t}\\n};\\n\\nexports.relink = function(reference, fromTitle, toTitle, options) {\\n\\tif (reference.field === fromTitle\\n\\t&& !utils.isReserved(fromTitle, options)) {\\n\\t\\tif (utils.isReserved(toTitle, options)) {\\n\\t\\t\\treturn {impossible: true};\\n\\t\\t} else {\\n\\t\\t\\treference.field = toTitle;\\n\\t\\t\\treturn {output: reference};\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkreference\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/reference\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/reference\",\"caption\":\"Field Names\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"list-after\":\"\",\"text\":\"\\\\define label(arrow, setTo) \u003C$reveal type=\\\"nomatch\\\" state=\u003C\u003Ctable-state>> text=\\\"$setTo$\\\" default=\\\"no\\\">\u003C$button class=\\\"tc-btn-invisible tc-btn-dropdown\\\" set=\u003C\u003Ctable-state>> setTo=\\\"$setTo$\\\">{{$arrow$}} ''\u003C$link to=\u003C\u003Cfield>>/>''\u003C/$button> \u003Cspan class=\\\"tc-relink-fieldnames-count\\\">(\u003C$text text={{{ [has\u003Cfield>count[]] }}} />)\u003C/span>\u003C/$reveal>\\n\\n\\\\define entry(field)\\n\u003C$set name=\\\"table-state\\\" value=\u003C\u003Cqualify \\\"\\\"\\\"$:/state/flibbles/relink-fieldnames/table/$field$\\\"\\\"\\\">>>\\n\u003Ctr class=\\\"tc-relink-fieldnames-field\\\">\\n\u003Ctd colspan=\\\"3\\\">\\n\u003C\u003Clabel $:/core/images/right-arrow yes>>\\n\u003C\u003Clabel $:/core/images/down-arrow no>>\\n\u003C/td>\\n\u003C/tr>\\n\u003C$list filter=\\\"[has\u003Cfield>]\\\" >\\n\u003C$reveal tag=\\\"tr\\\" type=\\\"match\\\" state=\u003C\u003Ctable-state>> text=\\\"yes\\\" default=\\\"no\\\" class=\\\"tc-relink-fieldnames-entry\\\">\\n\u003Ctd class=\\\"tc-relink-fieldnames-margin\\\">\u003C/td>\\n\u003Ctd class=\\\"tc-relink-fieldnames-title\\\">\u003C$link to=\u003C\u003CcurrentTiddler>> />\u003C/td>\u003Ctd>\u003C$text text={{{ [all[current]get\u003Cfield>] }}} />\u003C/td>\\n\u003C/$reveal>\\n\u003C/$list>\\n\u003C/$set>\\n\\\\end\\n\\\\whitespace trim\\n\\nThe following is a table of all tiddlers currently being used as field names.\\n\\n\u003C$set name=blacklisted filter={{$:/config/flibbles/relink-fieldnames/blacklist!!filter}} >\\n\u003Ctable class=\\\"tc-relink-fieldnames-table\\\">\\n\u003Ctbody>\\n\u003C$list variable=\\\"field\\\" filter=\\\"[fields[]is[tiddler]] -[enlist\u003Cblacklisted>]\\\">\\n\u003C$macrocall $name=\\\"entry\\\" field=\u003C\u003Cfield>> />\\n\u003C/$list>\\n\u003C/tbody>\\n\u003C/table>\\n\u003C/$set>\\n\"},\"$:/plugins/flibbles/relink-fieldnames/relinkoperator.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/relinkoperator.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/relinkoperator.js\\nmodule-type: relinkoperator\\ntype: application/javascript\\n\\nUpdates the field names if they correspond to the renamed tiddler.\\n\\n\\\\*/\\n\\n/*jslint node: false, browser: true */\\n/*global $tw: false */\\n\\\"use strict\\\";\\n\\nexports.name = 'field-names';\\n\\nexports.after = ['fields'];\\n\\nvar utils = require(\\\"./utils.js\\\");\\n\\nexports.report = function(tiddler, callback, options) {\\n\\tvar fields = tiddler.fields;\\n\\tfor (var field in fields) {\\n\\t\\tif (!utils.isReserved(field, options)) {\\n\\t\\t\\tcallback(field, ': ' + utils.abridgeString(fields[field], 33), {soft: true});\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(tiddler, fromTitle, toTitle, changes, options) {\\n\\tif ($tw.utils.hop(tiddler.fields, fromTitle)\\n\\t&& !utils.isReserved(fromTitle, options)) {\\n\\t\\tif ($tw.utils.hop(tiddler.fields, toTitle)\\n\\t\\t|| utils.isReserved(toTitle, options)\\n\\t\\t|| !utils.isValidFieldName(toTitle)) {\\n\\t\\t\\t// There is already a [toTitle] field, and we won't clobber it.\\n\\t\\t\\t// Or this is an illegal field name\\n\\t\\t\\tchanges[fromTitle] = {impossible: true};\\n\\t\\t} else if ($tw.utils.hop(changes, fromTitle)) {\\n\\t\\t\\t// If the value changed, we need the changed value, assuming there\\n\\t\\t\\t// is one.\\n\\t\\t\\tchanges[toTitle] = {\\n\\t\\t\\t\\toutput: changes[fromTitle].output || tiddler.fields[fromTitle]\\n\\t\\t\\t};\\n\\t\\t\\t// But we leave the original change in place in case it described\\n\\t\\t\\t// an impossible relink or something.\\n\\t\\t\\tchanges[fromTitle].output = null;\\n\\t\\t} else {\\n\\t\\t\\tchanges[toTitle] = {output: tiddler.fields[fromTitle]};\\n\\t\\t\\tchanges[fromTitle] = {output: null};\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkoperator\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/relinkprefix.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/relinkprefix.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/relinkprefix.js\\nmodule-type: relinkprefix\\ntype: application/javascript\\n\\nUpdates the whitelist entries for fields that are being renamed.\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nvar utils = require(\\\"./utils.js\\\");\\n\\nexports.prefix = \\\"$:/config/flibbles/relink/fields/\\\";\\n\\nexports.report = function(tiddler, callback, options) {\\n\\t// If this is a whitelist entry, report it.\\n\\tvar title = tiddler.fields.title.substr(exports.prefix.length);\\n\\tcallback(title, \\\"#relink \\\" + tiddler.fields.text, {soft: true});\\n};\\n\\nexports.relink = function(tiddler, fromTitle, toTitle, changes, options) {\\n\\t// If this is a whitelist entry for the fromTitle field, update it.\\n\\tif (tiddler.fields.title.substr(exports.prefix.length) === fromTitle) {\\n\\t\\tvar newTitle = exports.prefix + toTitle;\\n\\t\\t// Make sure we wouldn't be deleting an existing whitelist entry.\\n\\t\\tchanges.title = (!options.wiki.tiddlerExists(newTitle)) ?\\n\\t\\t\\t{ output: newTitle }:\\n\\t\\t\\t{ impossible: true };\\n\\t}\\n};\\n\",\"module-type\":\"relinkprefix\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/setting/fieldnames.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/setting/fieldnames.js\",\"text\":\"/*\\\\\\n\\ntitle: $:/plugins/flibbles/relink-fieldnames/setting/fieldnames.js\\nmodule-type: relinksetting\\ntype: application/javascript\\n\\nThe setting module interfaces with the relink settings to store\\na configuration for the blacklist.\\n\\\\*/\\n\\nexports.name = \\\"fieldnames\\\";\\n\\nexports.generate = function(settings, tiddler, key, wiki) {\\n\\tif (key === \\\"blacklist\\\") {\\n\\t\\tvar tiddlers = wiki.filterTiddlers(tiddler.fields.filter);\\n\\t\\tvar fieldMap = Object.create(null);\\n\\t\\tfor (var i = 0; i \u003C tiddlers.length; i++) {\\n\\t\\t\\tfieldMap[tiddlers[i]] = true;\\n\\t\\t}\\n\\t\\tsettings.blacklist = function(field) {\\n\\t\\t\\treturn fieldMap[field] || false;\\n\\t\\t};\\n\\t}\\n\\t// else { I don't know what else there could be... }\\n};\\n\",\"module-type\":\"relinksetting\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/setting/suffixes.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/setting/suffixes.js\",\"text\":\"/*\\\\\\n\\ntitle: $:/plugins/flibbles/relink-fieldnames/setting/suffixes.js\\nmodule-type: relinksetting\\ntype: application/javascript\\n\\nThe setting module interfaces with the relink settings to store\\nthe whitelist for all the operator suffixes\\n\\\\*/\\n\\nvar utils = require('$:/plugins/flibbles/relink/js/utils');\\n\\nexports.name = \\\"suffixes\\\";\\n\\nexports.generate = function(suffixes, tiddler, key) {\\n\\tvar data = utils.getType(tiddler.fields.text.trim());\\n\\tif (data) {\\n\\t\\tdata.source = tiddler.fields.title;\\n\\t\\t// Secret feature. You can access a config tiddler's\\n\\t\\t// fields from inside the fieldtype handler. Cool\\n\\t\\t// tricks can be done with this.\\n\\t\\tdata.fields = tiddler.fields;\\n\\t\\tvar pair = key.split('/');\\n\\t\\tvar name = pair[0];\\n\\t\\tdata.key = key;\\n\\t\\tsuffixes[name] = suffixes[name] || Object.create(null);\\n\\t\\tsuffixes[name][pair[1] || 1] = data;\\n\\t}\\n};\\n\",\"module-type\":\"relinksetting\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-fieldnames/style\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/style\",\"tags\":\"$:/tags/Stylesheet\",\"text\":\".tc-relink-fieldnames-table {\\n\\twidth: 100%;\\n\\tborder: 0px;\\n}\\n\\n.tc-relink-fieldnames-field a {\\n\\tfont-weight: bold;\\n}\\n\\n.tc-relink-fieldnames-field td {\\n\\tborder: 0px;\\n}\\n\\n.tc-relink-fieldnames-count {\\n\\tcolor: lightgray;\\n}\\n\\n.tc-relink-fieldnames-title {\\n\\tmargin-left: 3pt;\\n\\tmin-width: 30%;\\n}\\n\\n.tc-relink-fieldnames-entry td {\\n\\tborder: 0px;\\n\\tborder-bottom: 1px solid \u003C\u003Ccolour table-border>>;\\n}\\n\\n.tc-relink-fieldnames-margin {\\n\\twidth: 25pt;\\n}\\n\"},\"$:/config/flibbles/relink/suffixes/contains\":{\"title\":\"$:/config/flibbles/relink/suffixes/contains\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/suffixes/days\":{\"title\":\"$:/config/flibbles/relink/suffixes/days\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/suffixes/field\":{\"title\":\"$:/config/flibbles/relink/suffixes/field\",\"text\":\"fieldname\"},\"$:/config/flibbles/relink/suffixes/regexp\":{\"title\":\"$:/config/flibbles/relink/suffixes/regexp\",\"text\":\"fieldname\"},\"$:/plugins/flibbles/relink-fieldnames/utils.js\":{\"title\":\"$:/plugins/flibbles/relink-fieldnames/utils.js\",\"text\":\"/*\\\\\\ntitle: $:/plugins/flibbles/relink-fieldnames/utils.js\\nmodule-type: library\\ntype: application/javascript\\n\\n\\\\*/\\n\\nvar blacklistTiddler = \\\"$:/config/flibbles/relink/fieldnames/blacklist\\\";\\nvar docPrefix = \\\"$:/language/Docs/Fields/\\\";\\n\\nvar whitelist = require('$:/plugins/flibbles/relink/js/utils.js').getContext('whitelist');\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nexports = module.exports = Object.create(utils);\\n\\nwhitelist.hotDirectories.push(docPrefix);\\n\\nexports.isReserved = function(field, options) {\\n\\tvar method = options.settings.getConfig(\\\"fieldnames\\\").blacklist || function() { return true; };\\n\\treturn method(field);\\n};\\n\\n// Pre v5.2.0, this will be false. But we can't rely on utils.isValidFieldName\\n// entirely, because it is forgiving about capitalization when we can't be.\\nvar capitalizationAllowed = $tw.utils.isValidFieldName(\\\"A:\\\");\\n\\nexports.isValidFieldName = function(field) {\\n\\treturn $tw.utils.isValidFieldName(field)\\n\\t\\t&& (capitalizationAllowed || !/[A-Z]/.test(field));\\n};\\n\\nexports.blurbOperands = function(operator) {\\n\\tvar string = ''\\n\\tfor (var index = 0; index \u003C operator.operands.length; index++) {\\n\\t\\tif (index > 0) {\\n\\t\\t\\tstring += ',';\\n\\t\\t}\\n\\t\\tvar operand = operator.operands[index];\\n\\t\\tif (operand.indirect) {\\n\\t\\t\\tstring += '{' + exports.abridgeString(operand.text, 33) + '}';\\n\\t\\t} else if (operand.variable) {\\n\\t\\t\\tstring += '\u003C' + exports.abridgeString(operand.text, 33) + '>';\\n\\t\\t} else {\\n\\t\\t\\tstring += '[' + exports.abridgeString(operand.text, 33) + ']';\\n\\t\\t}\\n\\t}\\n\\treturn string;\\n};\\n\",\"module-type\":\"library\",\"type\":\"application/javascript\"}}}"},
{"name":"Relink Titles","title":"$:/plugins/flibbles/relink-titles","description":"Renames tiddlers with titles derived from Relinked tiddler","author":"Flibbles","version":"2.6.0","core-version":"^5.2.1","stability":"STABILITY_2_STABLE","parent-plugin":"$:/plugins/flibbles/relink","source":"https://github.com/flibbles/tw5-relink","demo":"http://flibbles.github.io/tw5-relink/","list":"readme configuration","dependents":"","plugin-type":"plugin","type":"application/json","text":"{\"tiddlers\":{\"$:/plugins/flibbles/relink-titles/configuration\":{\"title\":\"$:/plugins/flibbles/relink-titles/configuration\",\"caption\":\"{{$:/plugins/flibbles/relink-titles/language/Caption}}\",\"tags\":\"$:/tags/flibbles/relink/Configuration\",\"list-after\":\"\",\"text\":\"\\\\define lingo-base() $:/plugins/flibbles/relink-titles/language/\\n\\\\define prefix() $:/config/flibbles/relink-titles/relink/\\n\\\\whitespace trim\\n\\n\u003Cdiv class=\\\"tc-control-panel\\\">\\n\\n\u003C\u003Clingo Help>>\\n\\n\u003Ctable>\\n\u003Ctbody>\\n\u003C$list filter=\\\"[[relinktitlesrule]modules[]]\\\">\\n\u003Ctr>\\n\u003Ctd>\\n\u003C$checkbox\\n\\ttiddler={{{ [all[current]addprefix\u003Cprefix>] }}}\\n\\tfield=\\\"text\\\"\\n\\tchecked=\\\"enabled\\\"\\n\\tunchecked=\\\"disabled\\\"\\n\\tdefault=\\\"enabled\\\">\\n&#32;\\n''{{!!caption}}''\\n\u003C/$checkbox>\u003C/td>\u003Ctd>\\n\\n\u003C$transclude field='description' />\\n\\n\u003C/td>\u003C/tr>\u003C/$list>\\n\u003C/tbody>\u003C/table>\u003C/div>\\n\"},\"$:/plugins/flibbles/relink-titles/language/Caption\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Caption\",\"text\":\"Titles\"},\"$:/plugins/flibbles/relink-titles/language/Directory/Caption\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Directory/Caption\",\"text\":\"Rename subdirectories\"},\"$:/plugins/flibbles/relink-titles/language/Directory/Description\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Directory/Description\",\"text\":\"For wikis set up hierarchically using `/`, like a filesystem. This option will update all tiddlers nested inside the target tiddler. i.e. `fromTiddler/path/file` becomes `toTiddler/path/file`.\"},\"$:/plugins/flibbles/relink-titles/language/Lookup/Caption\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Lookup/Caption\",\"text\":\"Lookup tiddlers\"},\"$:/plugins/flibbles/relink-titles/language/Help\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Help\",\"text\":\"See the \u003Ca href={{{ [{$:/plugins/flibbles/relink-titles!!demo}addsuffix[#Plugins/Titles]] }}} class=\\\"tc-tiddlylink-external\\\">//Relink-titles// documentation page\u003C/a> for details.\"},\"$:/plugins/flibbles/relink-titles/readme\":{\"title\":\"$:/plugins/flibbles/relink-titles/readme\",\"text\":\"Highly customizable relinking of tiddler titles //related// to the renamed tiddler.\\n\\n* Rename a hierarchy of subtiddlers when renaming a root tiddler.\\n* Make custom filter rules to rename other tiddlers the way you want when Relinking.\\n* Integrates with other plugins for plugin-specific rules.\\n\\nSee \u003Ca href={{$:/plugins/flibbles/relink-titles!!source}} class=\\\"tc-tiddlylink-external\\\">the tw5-relink website\u003C/a> for more details and examples.\\n\\n{{$:/core/images/warning}} ''Warning:'' You must use //Relink// v1.10.2 or greater with this, or this plugin may delete some tiddler bodies while trying to relink titles.\\n\"},\"$:/plugins/flibbles/relink-titles/relinkoperations/title.js\":{\"title\":\"$:/plugins/flibbles/relink-titles/relinkoperations/title.js\",\"text\":\"/*\\\\\\nmodule-type: relinkoperator\\ntitle: $:/plugins/flibbles/relink-titles/relinkoperations/title.js\\ntype: application/javascript\\n\\nRenames tiddlers which have titles derived from fromTitle. Then it makes\\nsure that those tiddlers are properly relinked too.\\n\\n\\\\*/\\n\\n/*jslint node: false, browser: true */\\n/*global $tw: false */\\n\\\"use strict\\\";\\n\\nvar configPrefix = \\\"$:/config/flibbles/relink-titles/relink/\\\";\\nvar utils = require('$:/plugins/flibbles/relink/js/utils.js');\\n// This is using hotDirectories, which is a deprecated feature. It should be\\n// using the $:/config/flibbles/relink/{cateogory} directory which would be\\n// automatically maintained and regenerated.\\n// Maybe in time I'll get around to migrating this, but no need to complicate\\n// things now with changes that would require migration, and that would\\n// have no outward effect.\\nutils.getContext('whitelist').hotDirectories.push(configPrefix);\\n\\nvar titleRules = Object.create(null);\\n$tw.modules.forEachModuleOfType('relinktitlesrule', function(title, module) {\\n\\ttitleRules[title] = module;\\n});\\n\\nexports.name = 'title';\\n\\nexports.report = function(tiddler, callback, options) {\\n\\tvar cache = getCache(options),\\n\\t\\trules = cache.rules;\\n\\tfor (var i = 0; i \u003C rules.length; i++) {\\n\\t\\trules[i].report(tiddler.fields.title, function(title, blurb, style) {\\n\\t\\t\\tcallback(title, blurb ? ('title: ' + blurb) : 'title', style);\\n\\t\\t}, options);\\n\\t}\\n};\\n\\nexports.relink = function(tiddler, fromTitle, toTitle, changes, options) {\\n\\tvar cache = getCache(options),\\n\\t\\ttitle = tiddler.fields.title;\\n\\tif (!cache.touched[title]) {\\n\\t\\tvar rules = cache.rules;\\n\\t\\tfor (var i = 0; i \u003C rules.length; i++) {\\n\\t\\t\\tvar rule = rules[i];\\n\\t\\t\\tvar entry = rule.relink(title, fromTitle, toTitle, options);\\n\\t\\t\\tif (entry) {\\n\\t\\t\\t\\tvar result = entry.output;\\n\\t\\t\\t\\tif (result && (result !== title)) {\\n\\t\\t\\t\\t\\tif (options.wiki.getTiddler(result) || cache.touched[result]) {\\n\\t\\t\\t\\t\\t\\t// There's already a tiddler there. We won't clobber it.\\n\\t\\t\\t\\t\\t\\tentry.impossible = true;\\n\\t\\t\\t\\t\\t\\tentry.output = undefined;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t\\tcache.touched[result] = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\t// Record that we've touched this one, so we only touch it once.\\n\\t\\t\\t\\t// Both its prior and latter. Neither should be touched again.\\n\\t\\t\\t\\tcache.touched[title] = true;\\n\\t\\t\\t\\tchanges.title = entry;\\n\\t\\t\\t\\tbreak;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nfunction getCache(options) {\\n\\treturn utils.getCacheForRun(options, 'titles', function() {\\n\\t\\treturn {\\n\\t\\t\\trules: getRules(options.wiki),\\n\\t\\t\\ttouched: Object.create(null)\\n\\t\\t};\\n\\t});\\n};\\n\\nfunction getRules(wiki) {\\n\\tvar activeRules = [];\\n\\tfor (var rule in titleRules) {\\n\\t\\tvar configTiddler = wiki.getTiddler(configPrefix + rule);\\n\\t\\tif (!configTiddler || configTiddler.fields.text !== \\\"disabled\\\") {\\n\\t\\t\\tactiveRules.push(titleRules[rule]);\\n\\t\\t}\\n\\t}\\n\\treturn activeRules;\\n};\\n\",\"module-type\":\"relinkoperator\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-titles/rules/directory\":{\"title\":\"$:/plugins/flibbles/relink-titles/rules/directory\",\"text\":\"/*\\\\\\ncaption: {{$:/plugins/flibbles/relink-titles/language/Directory/Caption}}\\ndescription: {{$:/plugins/flibbles/relink-titles/language/Directory/Description}}\\nmodule-type: relinktitlesrule\\ntitle: $:/plugins/flibbles/relink-titles/rules/directory\\ntype: application/javascript\\n\\nHandles subdirectory renaming.\\n\\n\\\\*/\\n\\n/*jslint node: false, browser: true */\\n/*global $tw: false */\\n\\\"use strict\\\";\\n\\nexports.name = 'directory';\\n\\n/**The report returns all parent directories of a given title which exist.\\n */\\nexports.report = function(title, callback, options) {\\n\\tvar index = -1;\\n\\twhile ((index = title.indexOf('/', index+1)) >= 0) {\\n\\t\\tvar dir = title.substr(0, index);\\n\\t\\tcallback(dir, '.' + title.substr(index), {soft: true});\\n\\t}\\n};\\n\\n/**The relink returns the new title (if any) derived from title for a given\\n * rename of fromTitle to toTitle.\\n */\\nexports.relink = function(title, fromTitle, toTitle, options) {\\n\\tvar length = fromTitle.length;\\n\\tif (title.charAt(length) === '/' && title.substr(0, length) === fromTitle) {\\n\\t\\treturn {output: toTitle + title.substr(length)};\\n\\t}\\n\\treturn undefined;\\n};\\n\",\"caption\":\"{{$:/plugins/flibbles/relink-titles/language/Directory/Caption}}\",\"description\":\"{{$:/plugins/flibbles/relink-titles/language/Directory/Description}}\",\"module-type\":\"relinktitlesrule\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-titles/language/Lookup/Description\":{\"title\":\"$:/plugins/flibbles/relink-titles/language/Lookup/Description\",\"text\":\"This option updates all configuration tiddlers which relate to target tiddlers either through fixed prefixes or suffixes, i.e. `$:/config/Buttons/Visibility/fromFile` becomes `$:/config/Buttons/Visibility/toFile` when \\\"fromFile\\\" is renamed.\\n\\nEach line corresponds to a pattern, where `$(currentTiddler)$` would be the name of the tiddler being renamed, and `$(*)$` matches with anything.\\n\\n\u003C$edit-text\\n\\ttiddler=\\\"$:/config/flibbles/relink-titles/lookup/patterns\\\"\\n\\ttag=\\\"textarea\\\"\\n/>\\n\"},\"$:/config/flibbles/relink-titles/lookup/patterns\":{\"title\":\"$:/config/flibbles/relink-titles/lookup/patterns\",\"text\":\"$:/config/$(*)$/Visibility/$(currentTiddler)$\\n\"},\"$:/plugins/flibbles/relink-titles/rules/lookup\":{\"title\":\"$:/plugins/flibbles/relink-titles/rules/lookup\",\"text\":\"/*\\\\\\ncaption: {{$:/plugins/flibbles/relink-titles/language/Lookup/Caption}}\\ndescription: {{$:/plugins/flibbles/relink-titles/language/Lookup/Description}}\\nmodule-type: relinktitlesrule\\ntitle: $:/plugins/flibbles/relink-titles/rules/lookup\\ntype: application/javascript\\n\\nHandles setting tiddlers which are derived from other tiddlers, like how\\n\\n```\\n$:/config/PageControlButtons/Visibility/$(currentTiddler)$\\n```\\n\\nset the visibility for $(currentTiddler)$\\n\\n\\\\*/\\n\\n\\\"use strict\\\";\\n\\nexports.name = 'lookup';\\n\\nvar patternTiddler = \\\"$:/config/flibbles/relink-titles/lookup/patterns\\\";\\nvar anyMatcher = /\\\\$\\\\((?:\\\\*|currentTiddler)\\\\)\\\\$/g;\\n\\nexports.report = function(targetTitle, callback, options) {\\n\\tvar patterns = getPatterns(options.wiki);\\n\\tfor (var i = 0; i \u003C patterns.length; i++) {\\n\\t\\tvar pattern = patterns[i];\\n\\t\\tvar index = 0;\\n\\t\\tvar results = match(pattern, targetTitle);\\n\\t\\tif (results) {\\n\\t\\t\\tvar blurb = pattern.string.replace(anyMatcher, function(match) {\\n\\t\\t\\t\\tindex++;\\n\\t\\t\\t\\tif (match === \\\"$(*)$\\\") {\\n\\t\\t\\t\\t\\treturn results[index];\\n\\t\\t\\t\\t} else { // must be \\\"$(currentTiddler)$\\\"\\n\\t\\t\\t\\t\\treturn \\\"...\\\";\\n\\t\\t\\t\\t}\\n\\t\\t\\t});\\n\\t\\t\\tcallback(results.title, blurb);\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(targetTitle, fromTitle, toTitle, options) {\\n\\tvar patterns = getPatterns(options.wiki);\\n\\tfor (var i = 0; i \u003C patterns.length; i++) {\\n\\t\\tvar pattern = patterns[i];\\n\\t\\tvar results = match(pattern, targetTitle, fromTitle);\\n\\t\\tif (results) {\\n\\t\\t\\tvar groupIndex = 0;\\n\\t\\t\\t// Make all the correct substitutions to create the new title\\n\\t\\t\\tvar output = pattern.string.replace(anyMatcher, function(match) {\\n\\t\\t\\t\\tgroupIndex++;\\n\\t\\t\\t\\tif (match === \\\"$(*)$\\\") {\\n\\t\\t\\t\\t\\treturn results[groupIndex];\\n\\t\\t\\t\\t} else { // must be \\\"$(currentTiddler)$\\\"\\n\\t\\t\\t\\t\\treturn toTitle;\\n\\t\\t\\t\\t}\\n\\t\\t\\t});\\n\\t\\t\\treturn {output: output};\\n\\t\\t}\\n\\t}\\n\\treturn undefined;\\n};\\n\\nfunction match(pattern, string, matchTitle) {\\n\\tvar results = pattern.matcher.exec(string);\\n\\tif (results) {\\n\\t\\t// It superficially matches, but we need to make sure all the right\\n\\t\\t// groups match too.\\n\\t\\tfor (var j = 0; j \u003C pattern.groups.length; j++) {\\n\\t\\t\\tvar index = pattern.groups[j];\\n\\t\\t\\tif (matchTitle === undefined) {\\n\\t\\t\\t\\t// It doesn't matter what matchTitle is, as long as all\\n\\t\\t\\t\\t// groups match the same thing.\\n\\t\\t\\t\\tmatchTitle = results[index];\\n\\t\\t\\t} else if (results[index] !== matchTitle) {\\n\\t\\t\\t\\treturn null;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\tresults.title = matchTitle;\\n\\t}\\n\\treturn results;\\n};\\n\\nfunction getPatterns(wiki) {\\n\\treturn wiki.getCacheForTiddler(patternTiddler, \\\"relink-titles\\\", function() {\\n\\t\\tvar text = wiki.getTiddlerText(patternTiddler);\\n\\t\\tvar matchers = []\\n\\t\\tif (text) {\\n\\t\\t\\tvar array = text.split('\\\\n');\\n\\t\\t\\tfor (var i = 0; i \u003C array.length; i++) {\\n\\t\\t\\t\\tvar pattern = formPatternFromString(array[i]);\\n\\t\\t\\t\\tif (pattern) {\\n\\t\\t\\t\\t\\tmatchers.push(pattern);\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t\\treturn matchers;\\n\\t});\\n};\\n\\nfunction formPatternFromString(string) {\\n\\tvar groupIndex = 1;\\n\\tvar matchingGroups = [];\\n\\tstring = $tw.utils.trim(string);\\n\\tvar parts = string.split(\\\"$(currentTiddler)$\\\");\\n\\tif (parts.length \u003C= 1) {\\n\\t\\t// $(currentTiddler)$ must not have been there\\n\\t\\treturn null;\\n\\t}\\n\\tfor (var j = 0; j \u003C parts.length; j++) {\\n\\t\\t// Split it up by the wildcards\\n\\t\\tvar sections = parts[j].split(\\\"$(*)$\\\");\\n\\t\\tfor (var k = 0; k \u003C sections.length; k++) {\\n\\t\\t\\tsections[k] = $tw.utils.escapeRegExp(sections[k]);\\n\\t\\t}\\n\\t\\tparts[j] = sections.join(\\\"(.*)\\\");\\n\\t\\t// If there are 3 sections, then there is 2 $(*)$, so the index\\n\\t\\t// must skip them. etc...\\n\\t\\tgroupIndex += sections.length-1;\\n\\t\\tif (j \u003C parts.length-1) {\\n\\t\\t\\t// If there are 3 parts, that means 2 $(currentTiddler)$, and\\n\\t\\t\\t// so we skip the last part\\n\\t\\t\\tmatchingGroups.push(groupIndex);\\n\\t\\t\\tgroupIndex++;\\n\\t\\t}\\n\\t}\\n\\treturn {\\n\\t\\tstring: string,\\n\\t\\tgroups: matchingGroups,\\n\\t\\tmatcher: new RegExp(\\\"^\\\" + parts.join(\\\"(.*)\\\") + \\\"$\\\")\\n\\t};\\n};\\n\",\"caption\":\"{{$:/plugins/flibbles/relink-titles/language/Lookup/Caption}}\",\"description\":\"{{$:/plugins/flibbles/relink-titles/language/Lookup/Description}}\",\"module-type\":\"relinktitlesrule\",\"type\":\"application/javascript\"}}}"},
{"name":"Relink Variables","title":"$:/plugins/flibbles/relink-variables","description":"Reports and renames variables such as `\\procedure` or `\\function`","author":"Flibbles","version":"2.6.0","core-version":"^5.2.1","stability":"STABILITY_2_STABLE","parent-plugin":"$:/plugins/flibbles/relink","source":"https://github.com/flibbles/tw5-relink","demo":"http://flibbles.github.io/tw5-relink/","list":"readme","dependents":"","plugin-type":"plugin","type":"application/json","text":"{\"tiddlers\":{\"$:/plugins/flibbles/relink-variables/TiddlerInfo/References\":{\"title\":\"$:/plugins/flibbles/relink-variables/TiddlerInfo/References\",\"caption\":\"{{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Caption}}\",\"list-after\":\"$:/plugins/flibbles/relink/ui/TiddlerInfo/References\",\"tags\":\"$:/tags/TiddlerInfo\",\"text\":\"\\\\whitespace trim\\n\\n\u003Ctable class=\\\"tc-relink-references-table\\\">\\n\u003C$vars\\n\\t.relink-variables-containingTiddler=\u003C\u003CcurrentTiddler>>\\n\\t.relink-variables-filter=\\\"[all[current]relink:backreferences[]!prefix[$:/temp/]sort[title]]\\\"\\n\\t.relink-variables-filter-to=\\\"[all[current]get[text]!match[]!search:title:literal[ ]!search:title[(]else\u003C.relink-variables-variable>addprefix\u003C.relink-variables-prefix>]\\\"\\n\\t.relink-variables-default={{{ [all[current]relink:variables[]nth[6]then[hide]else[show]] }}}\\n\\t.relink-variables-prefix={{{ [[$:/temp/flibbles/relink-variables/]addsuffix\u003CcurrentTiddler>addsuffix[ ]] }}}>\\n\u003C$list\\n\\tvariable=.relink-variables-variable\\n\\tfilter=\\\"[all[current]relink:variables[]]\\\"\\n\\temptyMessage={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Empty}}>\\n\u003Ctbody>\\n\u003C$tiddler tiddler={{{ [\u003C.relink-variables-prefix>addsuffix\u003C.relink-variables-variable>] }}}>\\n\u003C$qualify title={{{ [\u003CcurrentTiddler>addprefix[$:/state/flibbles/relink-variables/info/]] }}} name=\\\".relink-variables-state\\\">\\n\u003C$vars\\n\\t.relink-variables-count={{{ [subfilter\u003C.relink-variables-filter>relink:report\u003CcurrentTiddler>count[]]  }}}>\\n\u003Ctr>\\n\u003Cth colspan=2 class=\\\"tc-relink-variables\\\">\\n\u003C$button class=\\\"tc-btn-invisible tc-btn-dropdown\\\" set=\u003C\u003C.relink-variables-state>> setTo={{{ [\u003C.relink-variables-state>get[text]else\u003C.relink-variables-default>match[show]then[hide]else[show]] }}} >\\n\u003C$reveal type=nomatch state=\u003C\u003C.relink-variables-state>> text=show default=\u003C\u003C.relink-variables-default>>>\\n{{$:/core/images/right-arrow}}\\n\u003C/$reveal>\\n\u003C$reveal type=match state=\u003C\u003C.relink-variables-state>> text=show default=\u003C\u003C.relink-variables-default>>>\\n{{$:/core/images/down-arrow}}\\n\u003C/$reveal>\\n&#32;\\n\u003C$list filter=\\\"[all[current]is[tiddler]]\\\" emptyMessage=\\\"\\\"\\\"\\\\whitespace trim\\n\\t''\u003C$text text=\u003C\u003C.relink-variables-variable>> />''\\n\\t&#32;\\n\\t\u003Cspan class=tc-relink-variables-count>(\u003C$text text=\u003C\u003C.relink-variables-count>> />)\u003C/span>\\n\\t\u003C$list variable=.relink-editable filter=\\\"[\u003C.relink-variables-containingTiddler>is[tiddler]!type[application/javascript]]\\\">\\n\\t&#32;\\n\\t\u003C$button\\n\\t\\ttooltip={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Hint}}\\n\\t\\taria-label={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Caption}}\\n\\t\\tclass=\u003C\u003Ctv-config-toolbar-class>>>\\n\\t\u003C$action-createtiddler $basetitle=\u003C\u003CcurrentTiddler>> text=\u003C\u003C.relink-variables-variable>> />\\n\\t{{$:/core/images/edit-button}}\\n\\t\u003C/$button>\\n\\t\u003C/$list>\\n\\\"\\\"\\\" >\\n\\t\u003C$vars\\n\\t\\tdone-actions=\\\"\\\"\\\"\\\\whitespace trim\\n\\t\\t\\t\u003C$action-sendmessage\\n\\t\\t\\t\\t$message=tm-relink-tiddler\\n\\t\\t\\t\\tfrom=\u003C\u003CcurrentTiddler>>\\n\\t\\t\\t\\tto={{{ [all[current]removesuffix\u003C.relink-variables-variable>addsuffix{!!text}] }}} />\\n\\t\\t\u003C$action-deletetiddler $tiddler=\u003C\u003CcurrentTiddler>> />\\n\\t\\\"\\\"\\\">\\n\\t\u003C$keyboard actions=\u003C\u003Cdone-actions>> key=enter>\\n\\t\u003C$keyboard actions=\\\"\u003C$action-deletetiddler $tiddler=\u003C\u003CcurrentTiddler>> />\\\" key=escape>\\n\\t\u003C$button class=\\\"tc-btn-invisible tc-btn-dropdown\\\" message=tm-focus-selector>\\n\\t\\t\u003C$edit-text tiddler=\u003C\u003CcurrentTiddler>> tag=input focus=yes/>\\n\\t\u003C/$button>\\n\\t&#32;\\n\\t\u003C$button\\n\\t\\ttooltip={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Hint}}\\n\\t\\taria-label={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Caption}}\\n\\t\\tclass=\u003C\u003Ctv-config-toolbar-class>>>\\n\\t\u003C$action-deletetiddler $tiddler=\u003C\u003CcurrentTiddler>> />\\n\\t{{$:/core/images/cancel-button}}\\n\\t\u003C/$button>\\n\\t&#32;\\n\\t\u003C$button\\n\\t\\tactions=\u003C\u003Cdone-actions>>\\n\\t\\ttooltip={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Hint}}\\n\\t\\taria-label={{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Caption}}\\n\\t\\tclass=\u003C\u003Ctv-config-toolbar-class>>\\n\\t\\tdisabled={{{ [{!!text}!match[]!match\u003C.relink-variables-variable>!search:title:literal[ ]!search:title:literal[(]then[no]else[yes]] }}} >\\n\\t{{$:/core/images/done-button}}\\n\\t\u003C/$button>\\n\\t\u003C/$keyboard>\\n\\t\u003C/$keyboard>\\n\\t\u003C/$vars>\\n\\t&#32;\\n\\t\u003C$list variable=existing filter=\\\"[variables[]match{!!text}!match[]] -[\u003C.relink-variables-variable>]\\\">\\n\\t\\t{{$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Exists/Prompt}}:\\n\\t\\t\u003C$list filter=\\\"[all[tiddlers+shadows]] :filter[relink:variables[]match\u003Cexisting>]\\\">\\n\\t\\t\\t&#32;\\n\\t\\t\\t\u003C$link />\\n\\t\\t\u003C/$list>\\n\\t\u003C/$list>\\n\\t\u003C$vars toTitle={{{ [subfilter\u003C.relink-variables-filter-to>] }}}>\\n\\t\\t\u003C$list variable=changedTiddler filter=\\\"[relink:impossible\u003CtoTitle>first[]]\\\">\\n\\t\\t\\t{{$:/language/EditTemplate/Title/Impossibles/Prompt}}\\n\\t\\t\u003C/$list>\\n\\t\u003C/$vars>\\n\u003C/$list>\\n\u003C/$button>\\n\u003C/th>\\n\u003C/tr>\\n\\n\u003C$list variable=\\\".relink-variables-show\\\" filter=\\\"[\u003C.relink-variables-state>get[text]else\u003C.relink-variables-default>match[show]]\\\">\\n\u003C$vars toTitle={{{ [subfilter\u003C.relink-variables-filter-to>] }}}>\\n\u003C$list\\n\\tfilter=\\\"[all[current]relink:backreferences[]!prefix[$:/temp/]sort[title]]\\\"\\n\\tvariable=\\\"listItem\\\"\\n\\ttemplate=\\\"$:/plugins/flibbles/relink/ui/TiddlerInfo/ReferencesTemplate\\\">\\n\u003C/$vars>\\n\"},\"$:/config/flibbles/relink/attributes/$macrocall/$name\":{\"title\":\"$:/config/flibbles/relink/attributes/$macrocall/$name\",\"text\":\"variable\"},\"$:/config/flibbles/relink/attributes/$transclude/$variable\":{\"title\":\"$:/config/flibbles/relink/attributes/$transclude/$variable\",\"text\":\"variable\"},\"$:/plugins/flibbles/relink-variables/def.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/def.js\",\"text\":\"/*\\\\\\nmodule-type: relinkdef\\ntitle: $:/plugins/flibbles/relink-variables/def.js\\ntype: application/javascript\\n\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\n\\n\\nexports.name = 'variables';\\n\\nexports.report = function() {\\n\\t// While we'll relink definition names, we don't actually\\n\\t// report on them since that would be redundant.\\n\\t// The user is looking at the definition to see what's referencing it.\\n};\\n\\nexports.relink = function(definition, fromTitle, toTitle, options) {\\n\\t// We skip the immediate context, because that's THIS definition\\n\\tvar tiddler = options.settings.parent.getFocus().title;\\n\\tif (tiddler) {\\n\\t\\tvar entry = varRelinker.relinkForTitle(definition.name, fromTitle, toTitle, tiddler);\\n\\t\\tif (entry && entry.output) {\\n\\t\\t\\tdefinition.name = entry.output;\\n\\t\\t\\tentry.output = true;\\n\\t\\t}\\n\\t\\treturn entry;\\n\\t}\\n};\\n\",\"module-type\":\"relinkdef\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/fieldtype.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/fieldtype.js\",\"text\":\"/*\\\\\\nmodule-type: relinkfieldtype\\ntitle: $:/plugins/flibbles/relink-variables/fieldtype.js\\ntype: application/javascript\\n\\nThis manages the variable type, which is like list, wikitext, markdown, etc...\\nExcept that this type points to a variable, not a tiddler.\\n\\n\\\\*/\\n\\nvar systemPrefix = \\\"$:/temp/flibbles/relink-variables/\\\";\\n\\nexports.name = 'variable';\\n\\nexports.report = function(value, callback, options) {\\n\\tvar def = options.settings.getMacroDefinition(value);\\n\\tif (def && def.tiddler) {\\n\\t\\t// variable reports are soft, because the made-up tiddlers that act as\\n\\t\\t// directives for the variable shouldn't flood the \\\"Missing\\\" panel.\\n\\t\\tcallback(systemPrefix + def.tiddler + ' ' + value, undefined, {soft: true});\\n\\t}\\n};\\n\\nexports.reportForTitle = function(value, callback, defTitle) {\\n\\tcallback(systemPrefix + defTitle + ' ' + value, undefined, {soft: true});\\n};\\n\\nexports.relink = function(value, fromTitle, toTitle, options) {\\n\\tvar def = options.settings.getMacroDefinition(value);\\n\\tif (def) {\\n\\t\\treturn this.relinkForTitle(value, fromTitle, toTitle, def.tiddler);\\n\\t}\\n};\\n\\nexports.relinkForTitle = function(value, fromTitle, toTitle, defTitle) {\\n\\tvar prefix = systemPrefix + defTitle + ' ';\\n\\tif (fromTitle === prefix + value) {\\n\\t\\tif (toTitle.substr(0, prefix.length) !== prefix\\n\\t\\t|| toTitle.indexOf(' ', prefix.length) >= 0\\n\\t\\t|| toTitle.indexOf('(', prefix.length) >= 0) {\\n\\t\\t\\treturn {impossible: true};\\n\\t\\t} else {\\n\\t\\t\\treturn {output: toTitle.substr(prefix.length)};\\n\\t\\t}\\n\\t}\\n};\\n\",\"module-type\":\"relinkfieldtype\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/filter.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/filter.js\",\"text\":\"/*\\\\\\nmodule-type: relinkfilter\\ntitle: $:/plugins/flibbles/relink-variables/filter.js\\ntype: application/javascript\\n\\nTakes care of relinking functions used in filters (i.e. [my.func[]])\\n\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\n\\nexports.name = \\\"variables\\\";\\n\\nexports.report = function(filterParseTree, callback, options) {\\n\\tforEachFunctionOperator(filterParseTree, options, function(operator, def) {\\n\\t\\tvarRelinker.reportForTitle(operator.operator, function(title, blurb, style) {\\n\\t\\t\\tblurb = formBlurb(operator, 33);\\n\\t\\t\\tif (blurb.length > 50) {\\n\\t\\t\\t\\tblurb = formBlurb(operator, 18);\\n\\t\\t\\t}\\n\\t\\t\\tif (blurb.length > 50) {\\n\\t\\t\\t\\tblurb = formBlurb(operator);\\n\\t\\t\\t}\\n\\t\\t\\tcallback(title, blurb, style);\\n\\t\\t}, def.tiddler);\\n\\t});\\n};\\n\\nexports.relink = function(filterParseTree, fromTitle, toTitle, options) {\\n\\tvar output = {};\\n\\tforEachFunctionOperator(filterParseTree, options, function(operator, def) {\\n\\t\\tvar entry = varRelinker.relinkForTitle(operator.operator, fromTitle, toTitle, def.tiddler);\\n\\t\\tif (entry) {\\n\\t\\t\\tif (entry.output) {\\n\\t\\t\\t\\tif (entry.output.indexOf('.') \u003C 0\\n\\t\\t\\t\\t|| entry.output.search(/[\\\\[\\\\{\u003C\\\\/]/) >= 0) {\\n\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\toperator.operator = entry.output;\\n\\t\\t\\t\\t\\toutput.changed = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t\\tif (entry.impossible) {\\n\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t}\\n\\t\\t}\\n\\t});\\n\\treturn output;\\n};\\n\\nfunction forEachFunctionOperator(filterParseTree, options, method) {\\n\\tfor (var i = 0; i \u003C filterParseTree.length; i++) {\\n\\t\\tvar run = filterParseTree[i];\\n\\t\\tfor (var j = 0; j \u003C run.operators.length; j++) {\\n\\t\\t\\tvar operator = run.operators[j];\\n\\t\\t\\tif (operator.operator.indexOf('.') >= 0) {\\n\\t\\t\\t\\tvar def = options.settings.getMacroDefinition(operator.operator);\\n\\t\\t\\t\\tif (def && def.isFunctionDefinition) {\\n\\t\\t\\t\\t\\tmethod(operator, def);\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n};\\n\\nfunction formBlurb(operator, maxLength) {\\n\\tvar blurb = [];\\n\\tfor (var i = 0; i \u003C operator.operands.length; i++) {\\n\\t\\tvar operand = operator.operands[i];\\n\\t\\tif (operand.indirect) {\\n\\t\\t\\tblurb.push('{' + operand.text + '}');\\n\\t\\t} else if (operand.variable) {\\n\\t\\t\\tblurb.push('\u003C' + utils.abridgeString(operand.text, maxLength) + '>');\\n\\t\\t} else if (operand.text) {\\n\\t\\t\\tblurb.push('[' + utils.abridgeString(operand.text, maxLength) + ']');\\n\\t\\t} else {\\n\\t\\t\\tblurb.push('');\\n\\t\\t}\\n\\t}\\n\\treturn '[' + blurb.join(',') + ']';\\n};\\n\",\"module-type\":\"relinkfilter\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/html.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/html.js\",\"text\":\"/*\\\\\\nmodule-type: relinkhtml\\ntitle: $:/plugins/flibbles/relink-variables/html.js\\ntype: application/javascript\\n\\nRelinks \\\\widgets in their html element form. (i.e. \u003C$my.widget />)\\n\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\n\\nexports.name = 'variables';\\n\\nexports.report = function(element, parser, callback, options) {\\n\\tif (element.tag.indexOf('.') >= 0 && element.tag[0] === '$') {\\n\\t\\tvar def = options.settings.getMacroDefinition(element.tag);\\n\\t\\tif (def && def.isWidgetDefinition) {\\n\\t\\t\\tvarRelinker.reportForTitle(element.tag, function(title, blurb, style) {\\n\\t\\t\\t\\tblurb = formBlurb(element, 33);\\n\\t\\t\\t\\tif (blurb.length > 60) {\\n\\t\\t\\t\\t\\tblurb = formBlurb(element, 18);\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (blurb.length > 60) {\\n\\t\\t\\t\\t\\tblurb = formBlurb(element);\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tcallback(title, blurb, style);\\n\\t\\t\\t}, def.tiddler);\\n\\t\\t}\\n\\t}\\n};\\n\\nexports.relink = function(element, parser, fromTitle, toTitle, options) {\\n\\tvar output;\\n\\tif (element.tag.indexOf('.') >= 0 && element.tag[0] === '$') {\\n\\t\\tvar def = options.settings.getMacroDefinition(element.tag);\\n\\t\\tif (def && def.isWidgetDefinition) {\\n\\t\\t\\tvar entry = varRelinker.relinkForTitle(element.tag, fromTitle, toTitle, def.tiddler);\\n\\t\\t\\tif (entry) {\\n\\t\\t\\t\\toutput = output || {};\\n\\t\\t\\t\\tif (entry.output) {\\n\\t\\t\\t\\t\\tif (entry.output[0] !== '$'\\n\\t\\t\\t\\t\\t|| entry.output.indexOf('.') \u003C 0\\n\\t\\t\\t\\t\\t|| entry.output.search(/[^a-zA-Z\\\\-\\\\$\\\\.]/) >= 0) {\\n\\t\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t\\t} else {\\n\\t\\t\\t\\t\\t\\telement.tag = entry.output;\\n\\t\\t\\t\\t\\t\\toutput.output = true;\\n\\t\\t\\t\\t\\t}\\n\\t\\t\\t\\t}\\n\\t\\t\\t\\tif (entry.impossible) {\\n\\t\\t\\t\\t\\toutput.impossible = true;\\n\\t\\t\\t\\t}\\n\\t\\t\\t}\\n\\t\\t}\\n\\t}\\n\\treturn output;\\n};\\n\\nfunction formBlurb(element, maxLength) {\\n\\tvar blurb = '';\\n\\tvar attrs = element.orderedAttributes;\\n\\tfor (var i = 0; i \u003C attrs.length; i++) {\\n\\t\\tvar attr = attrs[i];\\n\\t\\tvar handler = attrTypeOperators[attr.type];\\n\\t\\tblurb += ' ' + attr.name + '=';\\n\\t\\tif (handler) {\\n\\t\\t\\tvar raw = handler.rawString(attr);\\n\\t\\t\\tvar innerString = utils.abridgeString(raw, maxLength);\\n\\t\\t\\tblurb += handler.wrap(attr, innerString);\\n\\t\\t}\\n\\t}\\n\\treturn blurb;\\n};\\n\",\"module-type\":\"relinkhtml\",\"type\":\"application/javascript\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Caption\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Caption\",\"text\":\"//Relink// Variables\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Description\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Description\",\"text\":\"The following are variables any the tiddlers that contain invocations of them:\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Exists/Prompt\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Exists/Prompt\",\"text\":\"''Warning:'' This variable appears to already exist\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Empty\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Empty\",\"text\":\"This tiddler does not contain any importable variables\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Caption\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Caption\",\"text\":\"cancel\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Hint\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Cancel/Hint\",\"text\":\"Cancel rename to this variable\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Caption\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Caption\",\"text\":\"edit\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Hint\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Edit/Hint\",\"text\":\"Edit this variable\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Caption\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Caption\",\"text\":\"ok\"},\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Hint\":{\"title\":\"$:/plugins/flibbles/relink-variables/language/TiddlerInfo/Save/Hint\",\"text\":\"Confirm update to this variable name\"},\"$:/plugins/flibbles/relink-variables/macrocall.js\":{\"title\":\"$:/plugins/flibbles/relink-variables/macrocall.js\",\"text\":\"/*\\\\\\nmodule-type: relinkmacrocall\\ntitle: $:/plugins/flibbles/relink-variables/macrocall.js\\ntype: application/javascript\\n\\nHandles relinking of variables in \u003C\u003Cmacrocall>> format.\\n\\n\\\\*/\\n\\nvar utils = require(\\\"$:/plugins/flibbles/relink/js/utils.js\\\");\\nvar varRelinker = utils.getType('variable');\\nvar attrTypeOperators = $tw.modules.getModulesByTypeAsHashmap('relinkattributetype');\\n\\nexports.name = 'variables';\\n\\nexports.report = function(context, macro, callback, options) {\\n\\tvarRelinker.report(macro.name, function(title, blurb, style) {\\n\\t\\tvar blurb = formBlurb(macro, 33);\\n\\t\\tif (blurb.length > 50) {\\n\\t\\t\\tblurb = formBlurb(macro, 18);\\n\\t\\t}\\n\\t\\tif (blurb.length > 50) {\\n\\t\\t\\tblurb = formBlurb(macro, 23, 0);\\n\\t\\t}\\n\\t\\tcallback(title, blurb, style);\\n\\t}, options);\\n};\\n\\nexports.relink = function(context, macro, text, fromTitle, toTitle, options) {\\n\\tvar entry = varRelinker.relink(macro.name, fromTitle, toTitle, options);\\n\\tif (entry && entry.output) {\\n\\t\\tif (entry.output.search(/[>\\\"'=]/) >= 0) {\\n\\t\\t\\treturn {impossible: true};\\n\\t\\t}\\n\\t\\tif (!macro.attributes) {\\n\\t\\t\\tmacro.attributes = {\\\"$variable\\\": {}};\\n\\t\\t}\\n\\t\\tmacro.attributes['$variable'].value = entry.output;\\n\\t\\tentry.output = macro;\\n\\t}\\n\\treturn entry;\\n};\\n\\nfunction formBlurb(macro, maxLength, truncLength) {\\n\\tvar blurb = '';\\n\\tfor (var i = 0; i \u003C macro.params.length; i++) {\\n\\t\\tvar param = macro.params[i];\\n\\t\\tif (param.name !== \\\"$variable\\\") {\\n\\t\\t\\tvar handler = attrTypeOperators[param.type];\\n\\t\\t\\tif (handler) {\\n\\t\\t\\t\\tvar raw = handler.rawString(param);\\n\\t\\t\\t\\tvar innerString = utils.abridgeString(raw, maxLength, truncLength);\\n\\t\\t\\t\\tvar value = handler.wrap(param, innerString);\\n\\t\\t\\t\\tblurb += ' ';\\n\\t\\t\\
